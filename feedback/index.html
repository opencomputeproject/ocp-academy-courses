<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCP Academy Feedback Survey</title>
<style>
/* OCP Academy palette: indigo from the Academy logo, OCP green and gray from the OCP brand guidelines. */
:root{--indigo:#262673;--deep:#19194D;--green:#8DC63F;--gray:#5F6062;
  --bg:#F3F4F5;--card:#FFFFFF;--ink:#19194D;--body:#3F4042;--muted:#5F6062;--line:#DADCDF;--soft:#E9EAF4;
  --accent:#262673;--on-accent:#FFFFFF;--err:#B3261E;--ok:#3E7D10;
  --band:#262673;--band-2:#19194D;
  --f-display:"Franklin Gothic Medium","Franklin Gothic","ITC Franklin Gothic","Libre Franklin","Arial Narrow",Arial,sans-serif;
  --f-body:"Franklin Gothic Book","ITC Franklin Gothic","Libre Franklin","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0F2E;--card:#16163F;--ink:#FFFFFF;--body:#DADBE6;--muted:#A6A7BE;--line:#2C2D63;--soft:#23245A;--accent:#A9ACF0;--on-accent:#0F0F2E;--err:#F2847A;--ok:#A6D96A;--band:#1C1C55;--band-2:#0A0A24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0F2E;--card:#16163F;--ink:#FFFFFF;--body:#DADBE6;--muted:#A6A7BE;--line:#2C2D63;--soft:#23245A;--accent:#A9ACF0;--on-accent:#0F0F2E;--err:#F2847A;--ok:#A6D96A;--band:#1C1C55;--band-2:#0A0A24;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.55 var(--f-body)}
.wrap{max-width:780px;margin:0 auto}
header{background:linear-gradient(135deg,var(--band) 0%,var(--band-2) 100%);color:#FFFFFF;padding:28px 16px 30px;border-bottom:6px solid var(--green)}
.logo{display:block;width:150px;height:auto;margin:0 0 18px}
.kicker{margin:0;font:600 12px/1.4 var(--f-display);letter-spacing:3px;text-transform:uppercase;color:var(--green)}
h1{margin:6px 0 0;font:500 clamp(26px,5vw,38px)/1.15 var(--f-display);letter-spacing:.5px;color:#FFFFFF}
header p.intro{margin:12px 0 0;color:#DADBF0;max-width:640px}
header p.deadline{margin:8px 0 0;color:#DADBF0}
main{padding:24px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:8px 28px 28px}
.section{margin:30px 0 16px}
.section h2{margin:0;font:500 20px/1.25 var(--f-display);letter-spacing:.5px;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--line);position:relative}
.section h2::after{content:"";position:absolute;left:0;bottom:-2px;width:56px;height:2px;background:var(--green)}
.section p{margin:10px 0 0;color:var(--muted)}
.section a{color:var(--accent);font-weight:600}
.field{margin:0 0 22px;border:0;padding:0;min-width:0}
.field>label,.field>legend{display:block;font-weight:600;color:var(--ink);margin:0 0 8px;padding:0}
.req{color:var(--err)}
.help{color:var(--muted);font-size:14px;margin:-2px 0 8px}
input[type=text],input[type=email],input[type=url],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Pick-one lists */
.opts.list{display:grid;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-weight:400;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}
.choice input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
/* 1–10 scales and rating rows: radio buttons drawn as pills */
.pill{position:relative;display:flex;align-items:center;justify-content:center;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;text-align:center;line-height:1.2;cursor:pointer;user-select:none}
.pill input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.pill:hover{border-color:var(--accent)}
.pill:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opts.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.ends{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--muted);font-size:13px}
.field.row{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.field.row.last{margin-bottom:22px}
.field.row>legend{float:left;width:44%;margin:0;padding:8px 16px 0 0;font-weight:500}
.field.row .opts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.count{color:var(--muted);font-size:13px;text-align:right;margin-top:4px}
.invalid input[type=text],.invalid input[type=email],.invalid select,.invalid textarea,.invalid .pill,.invalid .choice{border-color:var(--err)}
.ferr{clear:both;color:var(--err);font-size:14px;padding-top:6px}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.actions{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
button{font:600 14px/1 var(--f-display);letter-spacing:1.5px;text-transform:uppercase;background:var(--green);color:var(--deep);border:0;border-radius:4px;padding:15px 26px;cursor:pointer}
button:hover{filter:brightness(.95)}
button[disabled]{opacity:.6;cursor:wait}
.msg{margin:14px 0 0;color:var(--err)}
.note{color:var(--muted);font-size:14px}
.note a{color:var(--accent)}
.banner{border-left:4px solid var(--green);padding:10px 14px;margin:20px 0;background:var(--soft)}
.done{padding:24px 0 8px}
.done h2{margin:0 0 8px;font:500 26px/1.2 var(--f-display);color:var(--ink)}
.done .cta{display:inline-block;margin-top:12px;background:var(--green);color:var(--deep);font:600 14px/1 var(--f-display);letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;padding:15px 22px;border-radius:4px}
#loading,#closed,#fatal{padding-top:20px}
footer{padding:0 16px 40px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:inherit}
@media (max-width:640px){
  .card{padding:4px 16px 22px}
  .field.row>legend{float:none;width:auto;padding:0 0 8px}
  .opts.scale{gap:4px}
  .opts.scale .pill{min-height:38px;padding:4px 0;font-size:13px}
  .field.row .pill{font-size:13px;padding:6px 4px}
}
</style>
</head>

<script>
/* Hosting this page somewhere other than Apps Script (GitHub Pages, a website)? Paste the web app's
   /exec URL here. Leave it '' when Apps Script serves the page itself (HTML file named "Form"). */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycby3pq8O4f8SOF7H9Px65Onh5Oim55D3A_nzp9teXc8oP6G7uS2TkBbYE51vxGvhCoDj/exec';

(function () {
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, text) => { const e = document.createElement(tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const run = window.google && google.script && google.script.run;   // present when Apps Script serves the page
  let CFG = null, EDIT = null;

  function call(kind, payload) {
    if (run) return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok)
      .withFailureHandler(() => fail(new Error('The connection to the server failed.')))[kind === 'get' ? 'apiGet' : 'apiPost'](payload));
    if (!ENDPOINT) return Promise.reject(new Error('This page is not connected to its backend yet (ENDPOINT is empty).'));
    const req = kind === 'get'
      ? fetch(ENDPOINT + '?' + new URLSearchParams(payload))
      // text/plain keeps this a "simple" request, so the browser does not send a CORS preflight Apps Script can't answer.
      : fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return req.then(r => r.json());
  }

  const closed = () => !!CFG.closes && new Date() > new Date(CFG.closes);

  function section(s) {
    const box = el('div', { class: 'section' });
    box.append(el('h2', null, s.title));
    if (s.text || s.link) {
      const p = el('p', null, s.text || '');
      // Only https links from the settings are shown.
      if (s.link && /^https:\/\//i.test(s.link.url)) { p.append(' '); p.append(el('a', { href: s.link.url, target: '_blank', rel: 'noopener' }, s.link.text || s.link.url)); p.append('.'); }
      box.append(p);
    }
    return box;
  }

  function render() {
    document.title = CFG.title;
    $('title').textContent = CFG.title;
    $('intro').textContent = CFG.intro || '';
    if (CFG.closesLabel) $('deadline').textContent = 'The survey closes ' + CFG.closesLabel + '.';
    if (CFG.privacyUrl) { const p = $('privacy'); p.append('How we handle your information: '); p.append(el('a', { href: CFG.privacyUrl, target: '_blank', rel: 'noopener' }, 'OCP privacy policy')); p.hidden = false; }
    const box = $('fields');
    CFG.fields.forEach((f, idx) => {
      if (f.section) box.append(section(f.section));
      const id = 'f_' + f.id, helpId = id + '_help', group = f.type === 'radio' || f.type === 'checkboxes';
      const next = CFG.fields[idx + 1];
      const cls = 'field' + (f.layout === 'row' ? ' row' + (!next || next.layout !== 'row' || next.section ? ' last' : '') : '');
      const wrap = el(group ? 'fieldset' : 'div', { class: cls, 'data-id': f.id });
      const star = () => el('span', { class: 'req', 'aria-hidden': 'true' }, ' *');
      if (f.type === 'checkbox') {
        const lab = el('label', { class: 'choice' }); const i = el('input', { type: 'checkbox', id, name: f.id });
        lab.append(i, el('span', null, f.label)); if (f.required) lab.append(star()); wrap.append(lab);
      } else {
        const head = el(group ? 'legend' : 'label', group ? {} : { for: id }, f.label); if (f.required) head.append(star()); wrap.append(head);
        if (f.help) wrap.append(el('p', { class: 'help', id: helpId }, f.help));
        if (group) {
          const pills = f.layout === 'scale' || f.layout === 'row';
          const opts = el('div', { class: 'opts ' + (f.layout === 'scale' ? 'scale' : f.layout === 'row' ? 'rowopts' : 'list') });
          f.options.forEach((o, n) => {
            const lab = el('label', { class: pills ? 'pill' : 'choice' });
            const input = el('input', { type: f.type === 'radio' ? 'radio' : 'checkbox', name: f.id, value: o, id: id + '_' + n });
            if (f.layout === 'scale' && f.ends) input.setAttribute('aria-label', o + (n === 0 ? ' (' + f.ends[0] + ')' : n === f.options.length - 1 ? ' (' + f.ends[1] + ')' : ''));
            lab.append(input, el('span', null, o)); opts.append(lab);
          });
          wrap.append(opts);
          if (f.layout === 'scale' && f.ends) { const e = el('div', { class: 'ends', 'aria-hidden': 'true' }); e.append(el('span', null, '1 = ' + f.ends[0]), el('span', null, f.options.length + ' = ' + f.ends[1])); wrap.append(e); }
        } else {
          let input;
          if (f.type === 'select') { input = el('select', { id, name: f.id }); input.append(el('option', { value: '' }, 'Choose…')); f.options.forEach(o => input.append(el('option', { value: o }, o))); }
          else if (f.type === 'textarea') input = el('textarea', { id, name: f.id, maxlength: f.max });
          else input = el('input', { type: f.type, id, name: f.id, maxlength: f.max, autocomplete: f.type === 'email' ? 'email' : f.id === 'firstName' ? 'given-name' : f.id === 'lastName' ? 'family-name' : 'on' });
          if (f.placeholder) input.setAttribute('placeholder', f.placeholder);
          if (f.help) input.setAttribute('aria-describedby', helpId);
          if (f.required) input.setAttribute('aria-required', 'true');
          wrap.append(input);
          if (f.type === 'textarea') { const c = el('div', { class: 'count' }); const upd = () => c.textContent = input.value.length + ' / ' + f.max; input.addEventListener('input', upd); upd(); wrap.append(c); }
        }
      }
      box.append(wrap);
    });
  }

  function read() {
    const d = {};
    CFG.fields.forEach(f => {
      if (f.type === 'checkbox') d[f.id] = $('f_' + f.id).checked;
      else if (f.type === 'checkboxes') d[f.id] = [...document.querySelectorAll(`input[name="${f.id}"]:checked`)].map(i => i.value);
      else if (f.type === 'radio') { const c = document.querySelector(`input[name="${f.id}"]:checked`); d[f.id] = c ? c.value : ''; }
      else d[f.id] = $('f_' + f.id).value.trim();
    });
    return d;
  }
  function fill(data) {
    CFG.fields.forEach(f => {
      const v = data[f.id];
      if (f.type === 'checkbox') $('f_' + f.id).checked = !!v;
      else if (f.type === 'checkboxes' || f.type === 'radio') document.querySelectorAll(`input[name="${f.id}"]`).forEach(i => { i.checked = f.type === 'radio' ? i.value === v : (v || []).indexOf(i.value) >= 0; });
      else { const i = $('f_' + f.id); i.value = v == null ? '' : v; i.dispatchEvent(new Event('input')); }
    });
  }
  function validate(d) {
    let first = null;
    document.querySelectorAll('.field').forEach(w => { w.classList.remove('invalid'); const e = w.querySelector('.ferr'); if (e) e.remove(); });
    CFG.fields.forEach(f => {
      const v = d[f.id]; let msg = '';
      const empty = f.type === 'checkbox' ? !v : f.type === 'checkboxes' ? !v.length : !v;
      if (f.required && empty) msg = f.type === 'checkbox' ? 'Please tick this box.' : f.type === 'radio' ? 'Please choose an answer.' : 'This is required.';
      else if (!empty && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Enter a valid email address.';
      else if (!empty && f.type === 'url' && !/^https?:\/\/\S+$/i.test(v)) msg = 'Start the address with http:// or https://.';
      else if (typeof v === 'string' && v.length > f.max) msg = `Keep this under ${f.max} characters.`;
      if (msg) { const w = document.querySelector(`.field[data-id="${f.id}"]`); w.classList.add('invalid'); w.append(el('div', { class: 'ferr' }, msg)); first = first || w; }
    });
    if (first) { const i = first.querySelector('input,select,textarea'); if (i) i.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center' }); }
    return !first;
  }

  async function submit(ev) {
    ev.preventDefault();
    if (closed()) return showClosed();
    const d = read();
    if (!validate(d)) { $('sendErr').textContent = 'Please answer the questions marked in red.'; return; }
    d.website = $('website').value;
    if (EDIT) { d.editRef = EDIT.ref; d.editToken = EDIT.t; }
    const b = $('submit'); b.disabled = true; b.textContent = 'Sending…'; $('sendErr').textContent = '';
    try {
      const j = await call('post', d);
      if (!j.ok) { const e = new Error(j.error || 'The server did not accept the submission.'); e.limited = !!j.limited; e.field = j.field; throw e; }
      $('form').hidden = true;
      $('doneTitle').textContent = EDIT ? 'Your feedback was updated' : 'Thank you for your feedback!';
      $('doneText').textContent = `Your reference is ${j.ref}.` + (CFG.sendReceipt ? ` A copy of your answers is on its way to ${d.email}.` : '');
      $('done').hidden = false; $('done').scrollIntoView({ block: 'start' });
    } catch (err) {
      $('sendErr').textContent = 'Your feedback was not sent: ' + err.message + (err.limited ? '' : ' Please try again in a minute.');
    } finally { b.disabled = false; b.textContent = EDIT ? 'Save my changes' : 'Submit feedback'; }
  }

  function showClosed() {
    $('form').hidden = true; $('loading').hidden = true;
    $('closedText').textContent = CFG.closesLabel ? 'The deadline was ' + CFG.closesLabel + '.' : '';
    $('closed').hidden = false;
  }
  function fatal(msg) { $('loading').hidden = true; $('fatal').textContent = msg; $('fatal').hidden = false; }

  async function start() {
    const boot = window.__BOOT__ || null;
    const q = new URLSearchParams(location.search);
    const edit = boot ? boot.edit : q.get('edit'), t = boot ? boot.t : q.get('t');
    try {
      CFG = boot && boot.config ? boot.config : (await call('get', { action: 'config' })).config;
      if (!CFG) throw new Error('The form settings could not be loaded.');
    } catch (err) { return fatal('The form could not be loaded: ' + err.message); }
    render();
    if (closed()) return showClosed();
    if (edit && t) {
      try {
        const j = await call('get', { action: 'load', ref: edit, t });
        if (!j.ok) return fatal(j.error);
        EDIT = { ref: edit, t }; fill(j.data);
        $('editBanner').textContent = `Editing response ${edit}. Change what you need, then save.`; $('editBanner').hidden = false;
        $('submit').textContent = 'Save my changes';
      } catch (err) { return fatal('This response could not be loaded: ' + err.message); }
    }
    $('loading').hidden = true; $('form').hidden = false;
    $('form').addEventListener('submit', submit);
    const clear = e => {
      const w = e.target.closest && e.target.closest('.invalid');
      if (w) { w.classList.remove('invalid'); const m = w.querySelector('.ferr'); if (m) m.remove(); }
      if (!document.querySelector('.field.invalid') && $('sendErr').textContent.startsWith('Please answer')) $('sendErr').textContent = '';
    };
    document.addEventListener('input', clear); document.addEventListener('change', clear);
  }
  // Apps Script appends its settings after this script, so start once the whole page has been read.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
