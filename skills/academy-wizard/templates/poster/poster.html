<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><title>{{TITLE}}</title>
<style>
@font-face{font-family:AcademyLato;src:url('{{LATO}}') format('woff');font-weight:700;font-style:normal;font-display:block}
{{LOCALE_FONT}}
*{box-sizing:border-box}html,body{margin:0;width:800px;height:400px}body{font-family:AcademyLato,AcademyLocale,sans-serif;font-weight:700;font-synthesis:none;color:#fff}
.poster{position:relative;width:800px;height:400px;overflow:hidden;background:url('{{BACKGROUND}}') center/800px 400px no-repeat}
.logo{position:absolute;left:42px;top:26px;width:145px;height:71.08px;object-fit:contain}
.badge{position:absolute;left:42px;top:118px;min-width:100px;height:28px;padding:0 14px;border-radius:14px;display:flex;align-items:center;background:#8dc63f;color:#1d2258;font-size:13px;line-height:18px;letter-spacing:1.4px;white-space:nowrap}
.title{position:absolute;left:42px;top:163px;width:458px;height:144px;margin:0;font-size:40px;line-height:1.1;letter-spacing:0;text-transform:uppercase}
.title-line{display:block;white-space:nowrap}.title sup{font-size:.38em;vertical-align:super;line-height:0}
.divider{position:absolute;left:42px;top:318px;width:60px;height:4px;border-radius:2px;background:#8dc63f}
.support{position:absolute;left:42px;top:337px;width:458px;margin:0;font-size:18px;line-height:23px}.support span{display:block;white-space:nowrap}
.emblem{position:absolute;left:528px;top:78px;width:244px;height:244px;border:3px solid transparent;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mark{width:176px;height:176px;object-fit:contain}
</style></head><body><main class="poster" aria-label="{{TITLE}}">
<img class="logo" src="{{LOGO}}" alt="OCP Academy">
<div class="badge">{{BADGE}}</div><h1 class="title">{{TITLE_LINES}}</h1>
<div class="divider"></div><p class="support">{{SUPPORT}}</p>
<div class="emblem"><img class="mark" src="{{MARK}}" alt="{{MARK_ALT}}"></div>
</main></body></html>
