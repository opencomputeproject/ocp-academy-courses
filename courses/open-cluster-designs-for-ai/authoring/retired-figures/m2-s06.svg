<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>A topology label alone is insufficient to compare hardware quantities.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="80" y="110" width="420" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="102" y="153" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Example</text><rect x="500" y="110" width="510" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="522" y="153" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Clos wiring</text><rect x="1010" y="110" width="510" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="1032" y="153" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Rail wiring</text><rect x="80" y="176" width="420" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="214" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">January OPG-128</text><rect x="500" y="176" width="510" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="522" y="214" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">2 × 51T-class leaves</text><rect x="1010" y="176" width="510" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="1032" y="214" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">4 × 26T-class leaves</text><rect x="80" y="311" width="420" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="349" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">April same-platform</text><text x="102" y="385" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">comparison</text><rect x="500" y="311" width="510" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="522" y="349" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Same selected hardware</text><rect x="1010" y="311" width="510" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="1032" y="349" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Same selected hardware</text><rect x="80" y="446" width="420" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="484" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">What changes</text><rect x="500" y="446" width="510" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="522" y="484" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Server NICs attach to a leaf</text><rect x="1010" y="446" width="510" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="1032" y="484" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">NICs attach by rail affinity</text><rect x="80" y="581" width="420" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="619" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">What must stay explicit</text><rect x="500" y="581" width="510" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="522" y="619" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Revision and port budget</text><rect x="1010" y="581" width="510" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="1032" y="619" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Revision and port budget</text><text x="800" y="795.0" font-size="32" fill="#343895" text-anchor="middle" font-weight="700">Do not mix quantities from different configuration examples.</text></g></svg>