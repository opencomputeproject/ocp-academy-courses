<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Compare actual port rates. Two planes do not automatically double aggregate capacity.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="80" y="130" width="550" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="102" y="173" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Per-NIC provisioning</text><rect x="630" y="130" width="435" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="652" y="173" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Nominal aggregate rate</text><rect x="1065" y="130" width="455" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="1087" y="173" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">One plane unavailable</text><rect x="80" y="196" width="550" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="234" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">1 × 400 Gb/s on one plane</text><rect x="630" y="196" width="435" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="652" y="234" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">400 Gb/s</text><rect x="1065" y="196" width="455" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="1087" y="234" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">No second plane in this</text><text x="1087" y="270" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">example</text><rect x="80" y="331" width="550" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="369" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">2 × 200 Gb/s across two planes</text><rect x="630" y="331" width="435" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="652" y="369" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">400 Gb/s</text><rect x="1065" y="331" width="455" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="1087" y="369" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">200 Gb/s remains</text><rect x="80" y="466" width="550" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="504" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">2 × 400 Gb/s across two planes</text><rect x="630" y="466" width="435" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="652" y="504" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">800 Gb/s</text><rect x="1065" y="466" width="455" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="1087" y="504" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">400 Gb/s remains</text><text x="800" y="720" font-size="31" fill="#343895" text-anchor="middle" font-weight="400">Provisioned port arithmetic is not application throughput.</text><text x="800" y="775" font-size="31" fill="#343895" text-anchor="middle" font-weight="400">Continuity depends on the supported end-to-end configuration.</text></g></svg>