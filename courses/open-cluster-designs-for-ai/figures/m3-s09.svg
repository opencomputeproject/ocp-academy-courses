<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Choose from workload dependencies and operating requirements; then define acceptance evidence.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="100" y="120" width="650" height="475" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="425.0" y="172" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Service A</text><text x="425.0" y="226.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Complete model on one host</text><text x="425.0" y="266.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Independent request handling</text><text x="425.0" y="307.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">External requests through a gateway</text><text x="425.0" y="347.79999999999995" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">No cross-host critical dependency</text><rect x="850" y="120" width="650" height="475" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1175.0" y="172" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Service B</text><text x="1175.0" y="226.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Model split across hosts</text><text x="1175.0" y="266.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Intermediate results cross the network</text><text x="1175.0" y="307.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Gateway and front-end still required</text><text x="1175.0" y="347.79999999999995" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Cross-host latency and failure concerns</text><text x="800" y="720" font-size="35" fill="#343895" text-anchor="middle" font-weight="700">Which profile fits each service?</text><text x="800" y="780" font-size="35" fill="#343895" text-anchor="middle" font-weight="700">What evidence would you request before acceptance?</text></g></svg>