<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Choose a candidate from the workload, its boundaries and its operating requirements.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><text x="800" y="100.0" font-size="42" fill="#343895" text-anchor="middle" font-weight="700">Workload requirements</text><rect x="65" y="180" width="270" height="170" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="200.0" y="232" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Use case</text><text x="200.0" y="286.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Training or serving</text><rect x="365" y="180" width="270" height="170" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="500.0" y="232" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Form factor</text><text x="500.0" y="286.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Compute domain</text><rect x="665" y="180" width="270" height="170" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="800.0" y="232" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Traffic</text><text x="800.0" y="286.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Volume and paths</text><rect x="965" y="180" width="270" height="170" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1100.0" y="232" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Policy</text><text x="1100.0" y="286.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Tenant boundaries</text><rect x="1265" y="180" width="270" height="170" rx="18" fill="#F4F6FA" stroke="#34389