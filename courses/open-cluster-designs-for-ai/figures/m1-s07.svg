<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Apply the parts of a reference that still match, then qualify the changed interfaces.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="100" y="130" width="620" height="440" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="410.0" y="182" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Published server baseline</text><text x="410.0" y="236.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Eight accelerators per server</text><text x="410.0" y="276.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Scale-up inside the enclosure</text><text x="410.0" y="317.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Selected NIC and fabric assumptions</text><text x="410.0" y="357.79999999999995" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Specified physical and recovery paths</text><rect x="880" y="130" width="620" height="440" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1190.0" y="182" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Proposed rack-scale compute</text><text x="1190.0" y="236.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Recheck compute-domain boundaries</text><text x="1190.0" y="276.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Recheck NIC placement and attachment</text><text x="1190.0" y="317.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Recheck power, cooling and routes</text><text x="1190.0" y="357.79999999999995" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Recheck service and recovery access</text><path d="M745 350L840 350" fill="none" stroke="#343895" stroke-width="5" marker-end="url(#arr)"/><text x="800" y="690" font-size="39" fill="#343895" text-anchor="middle" font-weight="700">Which assumptions transfer?</text><text x="800" y="755" font-size="39" fill="#343895" text-anchor="middle" font-weight="700">Which changed interfaces need evidence?</text></g></svg>