<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Different shared resources reach their limits at different points.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="80" y="115" width="475" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="102" y="158" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Expansion demand</text><rect x="555" y="115" width="965" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="577" y="158" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Review before ordering</text><rect x="80" y="181" width="475" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="219" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">New leaf uplinks</text><rect x="555" y="181" width="965" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="577" y="219" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Shared ports, bandwidth and map changes</text><rect x="80" y="316" width="475" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="354" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">More compute and traffic</text><rect x="555" y="316" width="965" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="577" y="354" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Storage, scheduling and client-service capacity</text><rect x="80" y="451" width="475" height="135" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="489" font-size="28" fill="#42464F" text-anchor="start" font-weight