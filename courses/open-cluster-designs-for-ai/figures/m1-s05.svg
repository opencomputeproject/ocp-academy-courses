<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Network roles remain distinct even when a selected implementation converges some traffic.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="80" y="60" width="365" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="102" y="103" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Function</text><rect x="445" y="60" width="485" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="467" y="103" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">What it connects</text><rect x="930" y="60" width="590" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="952" y="103" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Read the configuration</text><rect x="80" y="126.0" width="365" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="164.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Scale-up</text><rect x="445" y="126.0" width="485" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="164.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Within a compute domain</text><rect x="930" y="126.0" width="590" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="164.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Server, rack or other domain shape</text><rect x="80" y="243.33333333333331" width="365" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="281.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Scale-out</text><rect x="445" y="243.33333333333331" width="485" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="281.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Between compute domains</text><rect x="930" y="243.33333333333331" width="590" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="281.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Back-end paths and bandwidth</text><rect x="80" y="360.66666666666663" width="365" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="398.66666666666663" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">SO-C / front-end</text><rect x="445" y="360.66666666666663" width="485" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="398.66666666666663" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">CPU-facing services</text><rect x="930" y="360.66666666666663" width="590" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="398.66666666666663" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Separate or converged with storage</text><rect x="80" y="478.0" width="365" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="516.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Storage</text><rect x="445" y="478.0" width="485" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="516.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Data and metadata services</text><rect x="930" y="478.0" width="590" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="516.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Capacity and traffic policy</text><rect x="80" y="595.3333333333333" width="365" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="633.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">In-band management</text><rect x="445" y="595.3333333333333" width="485" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="633.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Hosts and cluster services</text><rect x="930" y="595.3333333333333" width="590" height="117.33333333333333" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="633.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Provisioning, telemetry and</text><text x="952" y="669.3333333333333" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">updates</text><rect x="80" y="712.6666666666666" width="365" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="750.6666666666666" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Out-of-band</text><text x="102" y="786.6666666666666" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">management</text><rect x="445" y="712.6666666666666" width="485" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="467" y="750.6666666666666" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Hardware management</text><text x="467" y="786.6666666666666" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">controllers</text><rect x="930" y="712.6666666666666" width="590" height="117.33333333333333" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="952" y="750.666666666