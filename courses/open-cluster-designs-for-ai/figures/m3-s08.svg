<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Review tenant isolation, gateway state and supplemental security controls as part of the selected implementation.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="80" y="150" width="240" height="100" rx="18" fill="#FFFFFF" stroke="#343895" stroke-width="3"/><text x="200.0" y="211.0" font-size="31" fill="#343895" text-anchor="middle" font-weight="700">Clients</text><path d="M345 200L415 200" fill="none" stroke="#343895" stroke-width="5" marker-end="url(#arr)"/><rect x="455" y="150" width="340" height="100" rx="18" fill="#FFFFFF" stroke="#343895" stroke-width="3"/><text x="625.0" y="211.0" font-size="31" fill="#343895" text-anchor="middle" font-weight="700">Upstream access</text><path d="M820 200L890 200" fill="none" stroke="#343895" stroke-width="5" marker-end="url(#arr)"/><rect x="930" y="150" width="540" height="100" rx="18" fill="#FFFFFF" stroke="#343895" stroke-width="3"/><text x="1200.0" y="211.0" font-size="31" fill="#343895" text-anchor="middle" font-weight="700">Gateway / NAT</text><path d="M1200 275L1200 360" fill="none" stroke="#343895" stroke-width="5" marker-end="url(#arr)"/><rect x="850" y="405" width="650" height="290" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1175.0" y="457" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Tenant routing contexts</text><text x="1175.0" y="511.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Tenant A    |    Tenant B</text><text x="1175.0" y="551.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Explicitly controlled sharing</text><text x="1175.0" y="592.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Measure ingress, egress and gateway load</text><rect x="90" y="440" width="610" height="230" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="395.0" y="492" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Required security policy</text><text x="395.0" y="546.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Address translation is not a full policy.</text><text x="395.0" y="586.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Add the needed firewall / ACL controls.</text><text x="800" y="810" font-size="32" fill="#343895" text-anchor="middle" font-weight="700">Gateway capacity follows service traffic, not xPU count alone.</text></g></svg>