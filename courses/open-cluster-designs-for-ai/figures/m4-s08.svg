<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Published baselines and the Summit preview carry different maturity and qualification claims.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="70" y="125" width="460" height="450" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="300.0" y="177" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Published January</text><text x="300.0" y="231.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">400G air-cooled example</text><text x="300.0" y="271.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">OPG-M and XOC-N hardware</text><text x="300.0" y="312.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Source and configuration matter</text><rect x="570" y="125" width="460" height="450" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="800.0" y="177" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Published April</text><text x="800.0" y="231.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Training and inference fabrics</text><text x="800.0" y="271.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Eight-xPU-server form factor</text><text x="800.0" y="312.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Contributed operating stack</text><rect x="1070" y="125" width="460" height="450" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1300.0" y="177" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Current work</text><text x="1300.0" y="231.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Liquid-cooled pod groups</text><text x="1300.0" y="271.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">800G / 1.6T scale-out</text><text x="1300.0" y="312.2" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">OPG-576 drawing is illustrative</text><text x="800" y="715" font-size="31" fill="#343895" text-anchor="middle" font-weight="400">Recheck the official contribution collection before a new design review.</text><text x="800" y="770" font-size="31" fill="#343895" text-anchor="middle" font-weight="400">Summit previews supply context, not a published procurement kit.</text></g></svg>