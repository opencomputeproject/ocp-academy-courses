<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Keep unmet acceptance items open with owners and planned checks.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="100" y="100" width="1400" height="175" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="800.0" y="152" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Proposal under review</text><text x="800.0" y="206.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Model now spans hosts; equipment and map disagree; only virtual tests exist.</text><rect x="80" y="330" width="460" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="102" y="373" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Open acceptance item</text><rect x="540" y="330" width="980" height="66" rx="0" fill="#343895" stroke="#343895" stroke-width="3"/><text x="562" y="373" font-size="29" fill="#FFFFFF" text-anchor="start" font-weight="700">Evidence to close it</text><rect x="80" y="396.0" width="460" height="108.5" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="434.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">New cross-host dependency</text><rect x="540" y="396.0" width="980" height="108.5" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="562" y="434.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Selected back-end configuration and end-to-end</text><text x="562" y="470.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">requirements</text><rect x="80" y="504.5" width="460" height="108.5" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="542.5" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Equipment and map mismatch</text><rect x="540" y="504.5" width="980" height="108.5" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="562" y="542.5" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Reconciled endpoint and procurement records</text><rect x="80" y="613.0" width="460" height="108.5" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="651.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Physical deployment</text><rect x="540" y="613.0" width="980" height="108.5" rx="0" fill="#F4F6FA" stroke="#D9DDE6" stroke-width="3"/><text x="562" y="651.0" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Site support, installation and recovery checks</text><rect x="80" y="721.5" width="460" height="108.5" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="759.5" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Acceptance claims</text><rect x="540" y="721.5" width="980" height="108.5" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="562" y="759.5" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Representative workload, isolation and failure results</text></g></svg>