<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Record every relevant variant assumption before comparing its behavior or quantities.</title><defs><marker id="arr" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="0" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#343895"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="95" y="100" width="650" height="210" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="420.0" y="152" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Compute form factor</text><text x="420.0" y="206.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">8 xPUs per server</text><text x="420.0" y="246.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Scale-up inside the enclosure</text><rect x="855" y="100" width="650" height="210" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1180.0" y="152" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Network interfaces</text><text x="1180.0" y="206.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">NIC count and affinity</text><text x="1180.0" y="246.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Port speed and breakout</text><rect x="95" y="490" width="650" height="210" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="420.0" y="542" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Fabric configuration</text><text x="420.0" y="596.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Wiring pattern and plane count</text><text x="420.0" y="636.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Switch platform and port budget</text><rect x="855" y="490" width="650" height="210" rx="18" fill="#F4F6FA" stroke="#343895" stroke-width="3"/><text x="1180.0" y="542" font-size="34" fill="#343895" text-anchor="middle" font-weight="700">Physical deployment</text><text x="1180.0" y="596.0" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Rack density and cable reach</text><text x="1180.0" y="636.6" font-size="29" fill="#42464F" text-anchor="middle" font-weight="400">Power, cooling and recovery</text><text x="800" y="395.0" font-size="35" fill="#343895" text-anchor="middle" font-weight="700">Logical reuse still requires physical verification.</text></g></svg>