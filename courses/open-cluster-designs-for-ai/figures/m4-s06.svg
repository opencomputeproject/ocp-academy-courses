00">targets</text><rect x="80" y="561" width="380" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="102" y="599" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Observed SLI → agreed</text><text x="102" y="635" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">SLO</text><rect x="460" y="561" width="530" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="482" y="599" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Measured indicator → target</text><rect x="990" y="561" width="530" height="135" rx="0" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="3"/><text x="1012" y="599" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">Conditions, result, owner and</text><text x="1012" y="635" font-size="28" fill="#42464F" text-anchor="start" font-weight="400">limitations</text></g></svg>