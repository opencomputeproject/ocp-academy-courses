<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Scale-Across distributes capacity across regions</title>
  <desc id="desc">Three regions have different available compute, power, and workload conditions, connected through a resource and policy layer.</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <rect x="72" y="76" width="1056" height="112" rx="24" fill="#343895"/>
  <text x="600" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Resource discovery + topology + placement policy</text>
  <text x="600" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e9eaf8">Select useful capacity, not merely available devices</text>
  <line x1="600" y1="188" x2="600" y2="252" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="252" x2="980" y2="252" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="252" x2="220" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="252" x2="600" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="980" y1="252" x2="980" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">Region A</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#fff0ef"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#d56a62"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#8d3029">Power constrained</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef0fb"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#777cb8"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">High demand</text>
    </g>
    <g transform="translate(452 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#8dc63f" stroke-width="5"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">Region B</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#eef7df"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#8dc63f"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#4d761c">Capacity available</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef7df"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#8dc63f"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#4d761c">Energy favorable</text>
    </g>
    <g transform="translate(832 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">Region C</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#fff5d6"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#d2a92d"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#775c12">Data governed here</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef0fb"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#777cb8"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">Moderate demand</text>
    </g>
    <g stroke="#9ea1bd" stroke-width="3" stroke-dasharray="7 7">
      <line x1="220" y1="550" x2="220" y2="578"/>
      <line x1="600" y1="550" x2="600" y2="578"/>
      <line x1="980" y1="550" x2="980" y2="578"/>
    </g>
    <g transform="translate(72 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#dfe0f4">PLACEMENT RESPONSE</text>
      <text x="148" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Redirect new work</text>
    </g>
    <g transform="translate(452 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#dfe0f4">PLACEMENT RESPONSE</text>
      <text x="148" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Place workload</text>
    </g>
    <g transform="translate(832 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#dfe0f4">PLACEMENT RESPONSE</text>
      <text x="148" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Keep protected data</text>
    </g>
  </g>
</svg>
