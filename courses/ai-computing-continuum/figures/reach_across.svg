<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Reach-Across connects governed local data to remote accelerator capacity</title>
  <desc id="desc">A research park and remote accelerator service are linked through trust, connectivity, and service-objective checks while protected data remains locally governed.</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <g font-family="Arial, sans-serif">
    <rect x="66" y="112" width="364" height="452" rx="28" fill="#ffffff" stroke="#343895" stroke-width="4"/>
    <text x="248" y="168" text-anchor="middle" font-size="32" font-weight="700" fill="#343895">Research park</text>
    <g transform="translate(0 37)">
      <path d="M126 304v-92l122-62 122 62v92z" fill="#eef0fb" stroke="#686bb2" stroke-width="4"/>
      <rect x="170" y="240" width="58" height="64" fill="#ffffff" stroke="#686bb2" stroke-width="3"/>
      <rect x="262" y="240" width="58" height="64" fill="#ffffff" stroke="#686bb2" stroke-width="3"/>
    </g>
    <rect x="106" y="354" width="284" height="72" rx="16" fill="#fff5d6"/>
    <text x="248" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#775c12">Protected research data</text>
    <text x="248" y="413" text-anchor="middle" font-size="18" fill="#775c12">Local governance and policy</text>
    <rect x="106" y="450" width="284" height="68" rx="16" fill="#eef7df"/>
    <text x="248" y="492" text-anchor="middle" font-size="22" font-weight="700" fill="#4d761c">Local fallback service</text>
    <rect x="770" y="112" width="364" height="452" rx="28" fill="#ffffff" stroke="#8dc63f" stroke-width="4"/>
    <text x="952" y="168" text-anchor="middle" font-size="32" font-weight="700" fill="#343895">Remote AI capacity</text>
    <g transform="translate(830 210)">
      <rect width="244" height="136" rx="18" fill="#eef7df" stroke="#6fa030" stroke-width="4"/>
      <rect x="28" y="28" width="54" height="34" rx="5" fill="#343895"/>
      <rect x="95" y="28" width="54" height="34" rx="5" fill="#343895"/>
      <rect x="162" y="28" width="54" height="34" rx="5" fill="#343895"/>
      <rect x="28" y="76" width="54" height="34" rx="5" fill="#343895"/>
      <rect x="95" y="76" width="54" height="34" rx="5" fill="#343895"/>
      <rect x="162" y="76" width="54" height="34" rx="5" fill="#343895"/>
    </g>
    <rect x="812" y="376" width="280" height="62" rx="16" fill="#eef0fb"/>
    <text x="952" y="414" text-anchor="middle" font-size="21" font-weight="700" fill="#343895">Available + compatible</text>
    <rect x="812" y="456" width="280" height="62" rx="16" fill="#eef7df"/>
    <text x="952" y="494" text-anchor="middle" font-size="21" font-weight="700" fill="#4d761c">Attested environment</text>
    <line x1="430" y1="338" x2="770" y2="338" stroke="#8dc63f" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 18"/>
    <circle cx="506" cy="338" r="18" fill="#343895"/>
    <circle cx="600" cy="338" r="18" fill="#8dc63f"/>
    <circle cx="694" cy="338" r="18" fill="#343895"/>
    <rect x="458" y="210" width="284" height="92" rx="20" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
    <text x="600" y="246" text-anchor="middle" font-size="21" font-weight="700" fill="#343895">Trust + connectivity</text>
    <text x="600" y="276" text-anchor="middle" font-size="18" fill="#5f6062">Bandwidth • latency • isolation</text>
    <rect x="458" y="374" width="284" height="108" rx="20" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
    <text x="600" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#343895">Service objective</text>
    <text x="600" y="442" text-anchor="middle" font-size="18" fill="#5f6062">Usable from the point</text>
    <text x="600" y="468" text-anchor="middle" font-size="18" fill="#5f6062">where it is consumed</text>
  </g>
</svg>
