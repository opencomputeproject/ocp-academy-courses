<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Scale and connectivity are complementary</title>
  <desc id="desc">A coordinate field shows available compute capacity increasing from limited to expanded and connectivity increasing from isolated to connected. A sequence of nodes moves toward a useful continuum where remote capacity remains reachable within the service objective.</desc>

  <rect width="1200" height="720" fill="#ffffff"/>

  <rect x="650" y="156" width="356" height="254" rx="26" fill="#eef7df" stroke="#8dc63f" stroke-width="4"/>
  <text x="828" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#343895">Useful continuum</text>
  <text x="828" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#303235">
    <tspan x="828" dy="0">Capacity remains reachable</tspan>
    <tspan x="828" dy="31">within the service objective</tspan>
  </text>

  <line x1="212" y1="548" x2="1002" y2="548" stroke="#5f6062" stroke-width="6" stroke-linecap="round"/>
  <line x1="212" y1="548" x2="212" y2="152" stroke="#5f6062" stroke-width="6" stroke-linecap="round"/>

  <text x="607" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#343895">Available compute capacity</text>
  <text x="48" y="350" text-anchor="middle" transform="rotate(-90 48 350)" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#343895">Connectivity and reachability</text>

  <text x="212" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#5f6062">Limited</text>
  <text x="1002" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#5f6062">Expanded</text>
  <text x="180" y="554" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#5f6062">Isolated</text>
  <text x="180" y="158" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#5f6062">Connected</text>

  <path d="M340 476 C424 449 468 418 522 397 S626 373 705 370 S825 360 910 360"
        fill="none" stroke="#8dc63f" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>

  <circle cx="340" cy="476" r="27" fill="#343895"/>
  <circle cx="522" cy="397" r="31" fill="#686bb2"/>
  <circle cx="705" cy="370" r="34" fill="#8dc63f"/>
  <circle cx="910" cy="360" r="38" fill="#6fa030"/>
</svg>
