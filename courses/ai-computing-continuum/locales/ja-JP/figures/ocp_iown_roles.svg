<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OCPとIOWNが仕様とユースケースをつなぐ</title>
  <desc id="desc">OCPのハードウェアエコシステム活動とIOWNの通信／ユースケース活動が、共有アーキテクチャ、リファレンスデザイン、PoC、検証を通じて接続する。</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <g font-family="Arial, sans-serif">
    <image href="ocp_foundation_logo.png" x="135" y="14" width="204" height="83" preserveAspectRatio="xMidYMid meet"/>
    <image href="iown_global_forum_logo.svg" x="856" y="24" width="214" height="68" preserveAspectRatio="xMidYMid meet"/>
    <rect x="54" y="116" width="366" height="504" rx="28" fill="#eef0fb" stroke="#343895" stroke-width="4"/>
    <text x="237" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#5f6062">オープンハードウェア</text>
    <rect x="96" y="218" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="237" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#303235">仕様</text>
    <rect x="96" y="302" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="237" y="342" text-anchor="middle" font-size="19" font-weight="700" fill="#303235">設計コントリビューション</text>
    <rect x="96" y="386" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="237" y="426" text-anchor="middle" font-size="21" font-weight="700" fill="#303235">サプライヤー参画</text>
    <rect x="96" y="470" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="237" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#303235">製品実装</text>
    <rect x="780" y="116" width="366" height="504" rx="28" fill="#f1f2f2" stroke="#8c9194" stroke-width="4"/>
    <text x="963" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#55595c">通信 ＋ ユースケース</text>
    <rect x="822" y="218" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="963" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#303235">業界別要件</text>
    <rect x="822" y="302" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="963" y="342" text-anchor="middle" font-size="21" font-weight="700" fill="#303235">リファレンスデザイン</text>
    <rect x="822" y="386" width="282" height="64" rx="16" fill="#ffffff"/>
    <text x="963" y="426" text-anchor="middle" font-size="22" font-weight="700" fill="#303235">PoC</text>
    <rect x="822" y="460" width="282" height="84" rx="16" fill="#ffffff"/>
    <text x="963" y="494" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">テクノエコノミック</text>
    <text x="963" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">分析</text>
    <rect x="454" y="176" width="292" height="360" rx="34" fill="#ffffff" stroke="#d7dad7" stroke-width="4"/>
    <text x="600" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#343895">共同領域</text>
    <circle cx="600" cy="290" r="34" fill="#8dc63f"/>
    <text x="600" y="299" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
    <text x="600" y="350" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">ビジョン ＋ アーキテクチャ</text>
    <circle cx="600" cy="402" r="34" fill="#343895"/>
    <text x="600" y="411" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
    <text x="600" y="462" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">検証 ＋ エビデンス</text>
    <line x1="420" y1="356" x2="454" y2="356" stroke="#686bb2" stroke-width="10" stroke-linecap="round"/>
    <line x1="746" y1="356" x2="780" y2="356" stroke="#8c9194" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
