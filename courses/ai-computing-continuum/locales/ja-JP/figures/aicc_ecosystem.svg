<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AICCが隣接するOCP活動をつなぐ</title>
  <desc id="desc">関連活動の6つの例として、オープンクラスター設計、ハードウェア–ソフトウェア・コデザイン、テレメトリ、サステナビリティ、リライアビリティ、オープンチップレットシステムがAICCを囲む。</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <g font-family="Arial, sans-serif">
    <rect x="438" y="20" width="324" height="46" rx="12" fill="#eef0fb" stroke="#c9cbe8" stroke-width="2"/>
    <text x="600" y="50" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="0.5" fill="#343895">関連活動の6つの例</text>
    <circle cx="600" cy="360" r="142" fill="#eef7df" stroke="#8dc63f" stroke-width="6"/>
    <text x="600" y="336" text-anchor="middle" font-size="44" font-weight="700" fill="#343895">AICC</text>
    <text x="600" y="376" text-anchor="middle" font-size="22" fill="#303235">要件とハンドオフで</text>
    <text x="600" y="408" text-anchor="middle" font-size="22" fill="#303235">環境をまたいで接続</text>
    <g fill="none" stroke="#8dc63f" stroke-width="7" stroke-linecap="round">
      <line x1="514" y1="246" x2="348" y2="154"/>
      <line x1="686" y1="246" x2="852" y2="154"/>
      <line x1="458" y1="360" x2="270" y2="360"/>
      <line x1="742" y1="360" x2="930" y2="360"/>
      <line x1="514" y1="474" x2="348" y2="566"/>
      <line x1="686" y1="474" x2="852" y2="566"/>
    </g>
    <g>
      <rect x="88" y="86" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="243" y="136" text-anchor="middle" font-size="24" font-weight="700" fill="#343895">Open Cluster Designs</text>
      <text x="243" y="172" text-anchor="middle" font-size="17" fill="#5f6062">ポッド、クラスター、ファブリック</text>
      <text x="243" y="200" text-anchor="middle" font-size="19" fill="#5f6062">電力、冷却</text>
      <rect x="802" y="86" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="957" y="136" text-anchor="middle" font-size="24" font-weight="700" fill="#343895">HW–SW Co-Design</text>
      <text x="957" y="172" text-anchor="middle" font-size="19" fill="#5f6062">ディスカバリー、トポロジー</text>
      <text x="957" y="200" text-anchor="middle" font-size="19" fill="#5f6062">コンポーザビリティ</text>
      <rect x="54" y="292" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="209" y="342" text-anchor="middle" font-size="24" font-weight="700" fill="#343895">テレメトリ</text>
      <text x="209" y="378" text-anchor="middle" font-size="19" fill="#5f6062">ヘルス、電力、冷却</text>
      <text x="209" y="406" text-anchor="middle" font-size="19" fill="#5f6062">サービス挙動</text>
      <rect x="836" y="292" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="991" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#343895">サステナビリティ</text>
      <text x="991" y="378" text-anchor="middle" font-size="19" fill="#5f6062">効率、ライフサイクル</text>
      <text x="991" y="406" text-anchor="middle" font-size="19" fill="#5f6062">サーキュラリティ</text>
      <rect x="88" y="498" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="243" y="548" text-anchor="middle" font-size="24" font-weight="700" fill="#343895">Accelerator RAS</text>
      <text x="243" y="584" text-anchor="middle" font-size="19" fill="#5f6062">エラー、リカバリー</text>
      <text x="243" y="612" text-anchor="middle" font-size="19" fill="#5f6062">Silent Data Corruption</text>
      <rect x="802" y="498" width="310" height="136" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="957" y="548" text-anchor="middle" font-size="24" font-weight="700" fill="#343895">Open Chiplet Systems</text>
      <text x="957" y="584" text-anchor="middle" font-size="19" fill="#5f6062">特化とパッケージ</text>
      <text x="957" y="612" text-anchor="middle" font-size="19" fill="#5f6062">コンポーザビリティ</text>
