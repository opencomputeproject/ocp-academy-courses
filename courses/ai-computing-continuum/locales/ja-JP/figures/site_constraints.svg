<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">サイトごとに制約は異なる</title>
  <desc id="desc">リージョナルコロケーション、エンタープライズのレトロフィット、通信PoP、産業／遠隔環境を4枚のカードで比較する。</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <text x="600" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#343895">共通インターフェース、異なる運用条件</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(54 112)">
      <rect width="252" height="500" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <rect width="252" height="78" rx="24" fill="#343895"/>
      <rect y="54" width="252" height="24" fill="#343895"/>
      <text x="126" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">リージョナルコロ</text>
      <rect x="40" y="112" width="172" height="106" rx="12" fill="#eef0fb" stroke="#686bb2" stroke-width="3"/>
      <path d="M62 134h128v62H62z M82 150h20v12H82z M116 150h20v12h-20z M150 150h20v12h-20z M82 174h88" fill="none" stroke="#343895" stroke-width="5"/>
      <text x="126" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">高密度ラック</text>
      <text x="126" y="308" text-anchor="middle" font-size="18" fill="#5f6062">管理された施設</text>
      <text x="126" y="342" text-anchor="middle" font-size="18" fill="#5f6062">専任スタッフ</text>
      <text x="126" y="376" text-anchor="middle" font-size="18" fill="#5f6062">ラック追加が可能</text>
      <rect x="16" y="416" width="220" height="46" rx="23" fill="#eef7df"/>
      <text x="126" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#4d761c">空冷／液冷</text>
    </g>
    <g transform="translate(334 112)">
      <rect width="252" height="500" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <rect width="252" height="78" rx="24" fill="#343895"/>
      <rect y="54" width="252" height="24" fill="#343895"/>
      <text x="126" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">エンタープライズ</text>
      <path d="M52 210V132l74-42 74 42v78z M76 210v-54h32v54 M142 150h30v28h-30" fill="#eef0fb" stroke="#686bb2" stroke-width="4"/>
      <text x="126" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">レトロフィット制約</text>
      <text x="126" y="308" text-anchor="middle" font-size="18" fill="#5f6062">固定された床荷重</text>
      <text x="126" y="342" text-anchor="middle" font-size="18" fill="#5f6062">給水経路に制約</text>
      <text x="126" y="376" text-anchor="middle" font-size="18" fill="#5f6062">既存運用との共存</text>
      <rect x="16" y="416" width="220" height="46" rx="23" fill="#fff5d6"/>
      <text x="126" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#775c12">既存枠内で拡張</text>
    </g>
    <g transform="translate(614 112)">
      <rect width="252" height="500" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <rect width="252" height="78" rx="24" fill="#343895"/>
      <rect y="54" width="252" height="24" fill="#343895"/>
      <text x="126" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">通信PoP</text>
      <path d="M126 102v108 M84 210h84 M98 180h56 M108 150h36" fill="none" stroke="#343895" stroke-width="8" stroke-linecap="round"/>
      <path d="M92 122c-24 18-24 48 0 66 M160 122c24 18 24 48 0 66 M72 102c-42 30-42 76 0 106 M180 102c42 30 42 76 0 106" fill="none" stroke="#8dc63f" stroke-width="6" stroke-linecap="round"/>
      <text x="126" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">コンパクト／遠隔</text>
      <text x="126" y="308" text-anchor="middle" font-size="18" fill="#5f6062">前面から保守</text>
      <text x="126" y="342" text-anchor="middle" font-size="18" fill="#5f6062">リモート管理</text>
      <text x="126" y="376" text-anchor="middle" font-size="18" fill="#5f6062">厳しいフットプリント</text>
      <rect x="16" y="416" width="220" height="46" rx="23" fill="#eef7df"/>
      <text x="126" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#4d761c">ネットワーク近接</text>
    </g>
    <g transform="translate(894 112)">
      <rect width="252" height="500" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <rect width="252" height="78" rx="24" fill="#343895"/>
      <rect y="54" width="252" height="24" fill="#343895"/>
      <text x="126" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">産業／遠隔</text>
      <path d="M48 208v-74l48 24v-38l48 24v-34h60v98z" fill="#eef0fb" stroke="#686bb2" stroke-width="4"/>
      <circle cx="184" cy="112" r="22" fill="#8dc63f"/>
      <text x="126" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#303235">過酷な環境</text>
      <text x="126" y="308" text-anchor="middle" font-size="18" fill="#5f6062">粉塵／振動</text>
      <text x="126" y="342" text-anchor="middle" font-size="18" fill="#5f6062">温度変動</text>
      <text x="126" y="376" text-anchor="middle" font-size="18" fill="#5f6062">保守頻度が低い</text>
      <rect x="16" y="416" width="220" height="46" rx="23" fill="#fff0ef"/>
      <text x="126" y="446" text-anchor="middle" font-size="18" font-weight="700" fill="#9e342c">ローカルで縮退運転</text>
    </g>
  </g>
</svg>
