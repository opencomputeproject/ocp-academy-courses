<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Scale-Acrossはリージョンをまたいでキャパシティを分散する</title>
  <desc id="desc">利用可能なコンピュート、電力、ワークロード条件が異なる3つのリージョンを、リソース／ポリシーレイヤーで接続する。</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f8f7"/>
  <rect x="72" y="76" width="1056" height="112" rx="24" fill="#343895"/>
  <text x="600" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">リソースディスカバリー ＋ トポロジー ＋ 配置ポリシー</text>
  <text x="600" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#e9eaf8">空きデバイスではなく、実用的なキャパシティを選ぶ</text>
  <line x1="600" y1="188" x2="600" y2="252" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="252" x2="980" y2="252" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="252" x2="220" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="252" x2="600" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <line x1="980" y1="252" x2="980" y2="302" stroke="#8dc63f" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">リージョン A</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#fff0ef"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#d56a62"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#8d3029">電力に制約</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef0fb"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#777cb8"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">需要が高い</text>
    </g>
    <g transform="translate(452 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#8dc63f" stroke-width="5"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">リージョン B</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#eef7df"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#8dc63f"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#4d761c">キャパシティあり</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef7df"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#8dc63f"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#4d761c">エネルギー条件良好</text>
    </g>
    <g transform="translate(832 302)">
      <rect width="296" height="248" rx="24" fill="#ffffff" stroke="#d7dad7" stroke-width="3"/>
      <text x="148" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#343895">リージョン C</text>
      <rect x="32" y="76" width="232" height="68" rx="10" fill="#fff5d6"/>
      <rect x="32" y="76" width="7" height="68" rx="3.5" fill="#d2a92d"/>
      <text x="148" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#775c12">データはここで管理</text>
      <rect x="32" y="160" width="232" height="68" rx="10" fill="#eef0fb"/>
      <rect x="32" y="160" width="7" height="68" rx="3.5" fill="#777cb8"/>
      <text x="148" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">需要は中程度</text>
    </g>
    <g stroke="#9ea1bd" stroke-width="3" stroke-dasharray="7 7">
      <line x1="220" y1="550" x2="220" y2="578"/>
      <line x1="600" y1="550" x2="600" y2="578"/>
      <line x1="980" y1="550" x2="980" y2="578"/>
    </g>
    <g transform="translate(72 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.0" fill="#dfe0f4">配置アクション</text>
      <text x="148" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">新規処理を転送</text>
    </g>
    <g transform="translate(452 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.0" fill="#dfe0f4">配置アクション</text>
      <text x="148" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">ワークロードを配置</text>
    </g>
    <g transform="translate(832 578)">
      <rect width="296" height="88" rx="12" fill="#343895"/>
      <rect x="18" y="18" width="6" height="52" rx="3" fill="#8dc63f"/>
      <text x="148" y="32" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.0" fill="#dfe0f4">配置アクション</text>
      <text x="148" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">保護データを保持</text>
    </g>
  </g>
</svg>
