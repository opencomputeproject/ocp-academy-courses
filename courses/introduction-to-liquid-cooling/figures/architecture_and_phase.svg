<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" style="background:#fff"><style>text{font-family:"Open Sans",Arial,sans-serif}</style><text x="380" y="42" text-anchor="middle" font-size="27" font-weight="650" fill="#72a92d"><tspan x="380" dy="0">Single-phase</tspan></text><text x="800" y="42" text-anchor="middle" font-size="27" font-weight="650" fill="#397597"><tspan x="800" dy="0">Two-phase</tspan></text><text x="90" y="165" text-anchor="middle" font-size="25" font-weight="650" fill="#263c42"><tspan x="90" dy="0">Cold</tspan><tspan x="90" dy="33.75">plates</tspan></text><text x="90" y="365" text-anchor="middle" font-size="25" font-weight="650" fill="#263c42"><tspan x="90" dy="0">Immersion</tspan></text><rect id="box-1" x="200" y="80" width="360" height="155" rx="14" fill="#f1f5f3" stroke="#72a92d" stroke-width="2"/><text x="380.0" y="148.98000000000002" text-anchor="middle" font-size="24" font-weight="600" fill="#263c42" data-container="box-1"><tspan x="380.0" dy="0">Contained liquid</tspan><tspan x="380.0" dy="32.400000000000006">stays liquid</tspan></text><rect id="box-2" x="620" y="80" width="360" height="155" rx="14" fill="#f1f5f3" stroke="#397597" stroke-width="2"/><text x="800.0" y="148.98000000000002" text-anchor="middle" font-size="24" font-weight="600" fill="#263c42" data-container="box-2"><tspan x="800.0" dy="0">Contained fluid</tspan><tspan x="800.0" dy="32.400000000000006">boils and condenses</tspan></text><rect id="box-3" x="200" y="280" width="360" height="155" rx="14" fill="#f1f5f3" stroke="#72a92d" stroke-width="2"/><text x="380.0" y="348.98" text-anchor="middle" font-size="24" font-weight="600" fill="#263c42" data-container="box-3"><tspan x="380.0" dy="0">Equipment in a bath</tspan><tspan x="380.0" dy="32.400000000000006">that stays liquid</tspan></text><rect id="box-4" x="620" y="280" width="360" height="155" rx="14" fill="#f1f5f3" stroke="#397597" stroke-width="2"/><text x="800.0" y="348.98" text-anchor="middle" font-size="24" font-weight="600" fill="#263c42" data-container="box-4"><tspan x="800.0" dy="0">Equipment in a bath</tspan><tspan x="800.0" dy="32.400000000000006">with phase change</tspan></text><text x="550" y="480" text-anchor="middle" font-size="22" font-weight="500" fill="#64767a"><tspan x="550" dy="0">Architecture identifies the arrangement; phase identifies fluid behavior.</tspan></text></svg>