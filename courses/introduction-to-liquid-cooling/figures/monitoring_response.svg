<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" style="background:#fff"><style>text{font-family:"Open Sans",Arial,sans-serif}</style><rect id="box-1" x="80" y="20" width="540" height="75" rx="14" fill="#f1f5f3" stroke="#397597" stroke-width="2"/><text x="350.0" y="65.5" text-anchor="middle" font-size="25" font-weight="600" fill="#263c42" data-container="box-1"><tspan x="350.0" dy="0">Observe a change</tspan></text><polyline points="350,95 350.0,119.0" fill="none" stroke="#64767a" stroke-width="4" stroke-linejoin="round"/><polygon class="arrowhead" points="350,130 344.2,119.0 355.8,119.0" fill="#64767a"/><rect id="box-2" x="80" y="130" width="540" height="75" rx="14" fill="#f1f5f3" stroke="#64767a" stroke-width="2"/><text x="350.0" y="175.5" text-anchor="middle" font-size="25" font-weight="600" fill="#263c42" data-container="box-2"><tspan x="350.0" dy="0">Compare with the baseline</tspan></text><polyline points="350,205 350.0,229.0" fill="none" stroke="#64767a" stroke-width="4" stroke-linejoin="round"/><polygon class="arrowhead" points="350,240 344.2,229.0 355.8,229.0" fill="#64767a"/><rect id="box-3" x="80" y="240" width="540" height="75" rx="14" fill="#f1f5f3" stroke="#b87335" stroke-width="2"/><text x="350.0" y="285.5" text-anchor="middle" font-size="25" font-weight="600" fill="#263c42" data-container="box-3"><tspan x="350.0" dy="0">Escalate to the owner</tspan></text><polyline points="350,315 350.0,339.0" fill="none" stroke="#64767a" stroke-width="4" stroke-linejoin="round"/><polygon class="arrowhead" points="350,350 344.2,339.0 355.8,339.0" fill="#64767a"/><rect id="box-4" x="80" y="350" width="540" height="75" rx="14" fill="#f1f5f3" stroke="#72a92d" stroke-width="2"/><text x="350.0" y="395.5" text-anchor="middle" font-size="25" font-weight="600" fill="#263c42" data-container="box-4"><tspan x="350.0" dy="0">Verify approved recovery</tspan></text></svg>