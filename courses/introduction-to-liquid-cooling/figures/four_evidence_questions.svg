<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" style="background:#fff"><style>text{font-family:"Open Sans",Arial,sans-serif}</style><rect id="box-1" x="35" y="25" width="485" height="175" rx="14" fill="#f1f5f3" stroke="#72a92d" stroke-width="2"/><text x="277.5" y="72" text-anchor="middle" font-size="26" font-weight="650" fill="#263c42" data-container="box-1"><tspan x="277.5" dy="0">Complete heat path</tspan></text><text x="277.5" y="176" text-anchor="middle" font-size="17" font-weight="500" fill="#64767a" data-container="box-1"><tspan x="277.5" dy="0">Supported under the required conditions</tspan></text><rect id="box-2" x="580" y="25" width="485" height="175" rx="14" fill="#f1f5f3" stroke="#397597" stroke-width="2"/><text x="822.5" y="72" text-anchor="middle" font-size="26" font-weight="650" fill="#263c42" data-container="box-2"><tspan x="822.5" dy="0">Qualified interfaces</tspan></text><text x="822.5" y="176" text-anchor="middle" font-size="17" font-weight="500" fill="#64767a" data-container="box-2"><tspan x="822.5" dy="0">Actual parts, materials and fluid</tspan></text><rect id="box-3" x="35" y="245" width="485" height="175" rx="14" fill="#f1f5f3" stroke="#b87335" stroke-width="2"/><text x="277.5" y="292" text-anchor="middle" font-size="26" font-weight="650" fill="#263c42" data-container="box-3"><tspan x="277.5" dy="0">Operating ownership</tspan></text><text x="277.5" y="396" text-anchor="middle" font-size="17" font-weight="500" fill="#64767a" data-container="box-3"><tspan x="277.5" dy="0">Handoffs, fault response and recovery</tspan></text><rect id="box-4" x="580" y="245" width="485" height="175" rx="14" fill="#f1f5f3" stroke="#64767a" stroke-width="2"/><text x="822.5" y="292" text-anchor="middle" font-size="26" font-weight="650" fill="#263c42" data-container="box-4"><tspan x="822.5" dy="0">Measured value</tspan></text><text x="822.5" y="396" text-anchor="middle" font-size="17" font-weight="500" fill="#64767a"