<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" style="width:100%;max-width:980px;height:auto;display:block;" role="img" aria-label="Pool boiling cold plate with wick, fins, vapor bubbles, and liquid return">
  <defs>
    <marker id="arrowPoolBlue" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#343895"/></marker>
    <marker id="arrowPoolGreen" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#8DC63F"/></marker>
    <style>.title{font:700 18px Open Sans,Arial,sans-serif;fill:#343895}.small{font:600 13px Open Sans,Arial,sans-serif;fill:#5F6062}.sideTitle{font:700 18px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:start}.sideSmall{font:600 13px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:start}.chip{fill:#343895}.plate{fill:#f3f5ff;stroke:#343895;stroke-width:3}.fluid{fill:#eef8e8;stroke:#8DC63F;stroke-width:3}.wick{fill:#ffffff;stroke:#8DC63F;stroke-width:2}.bubble{fill:#ffffff;stroke:#8DC63F;stroke-width:2}.arrow{stroke:#343895;stroke-width:4;fill:none;marker-end:url(#arrowPoolBlue)}.liquidArrow{stroke:#8DC63F;stroke-width:4;fill:none;marker-end:url(#arrowPoolGreen)}.vaporArrow{stroke:#343895;stroke-width:4;fill:none;marker-end:url(#arrowPoolBlue)}</style>
  </defs>
  <rect x="165" y="86" width="650" height="220" rx="18" class="fluid"/>
  <rect x="240" y="126" width="500" height="38" rx="8" class="wick"/>
  <g fill="#8DC63F" opacity="0.9">
    <rect x="299" y="164" width="18" height="92" rx="4"/><rect x="351" y="164" width="18" height="92" rx="4"/><rect x="403" y="164" width="18" height="92" rx="4"/><rect x="455" y="164" width="18" height="92" rx="4"/><rect x="507" y="164" width="18" height="92" rx="4"/><rect x="559" y="164" width="18" height="92" rx="4"/><rect x="611" y="164" width="18" height="92" rx="4"/><rect x="663" y="164" width="18" height="92" rx="4"/>
  </g>
  <rect x="230" y="278" width="520" height="34" rx="7" class="plate"/>
  <rect x="410" y="318" width="160" height="48" rx="8" class="chip"/>
  <text x="490" y="349" text-anchor="middle" fill="#fff" font-family="Open Sans,Arial,sans-serif" font-size="18" font-weight="700">hot chip</text>
  <circle cx="304" cy="118" r="12" class="bubble"/><circle cx="381" cy="105" r="8" class="bubble"/><circle cx="483" cy="112" r="14" class="bubble"/><circle cx="578" cy="102" r="9" class="bubble"/><circle cx="665" cy="116" r="12" class="bubble"/>
  <g transform="translate(28 188)"><text x="0" y="0" class="sideTitle">liquid returns</text><text x="0" y="22" class="sideSmall">wets fins and wick</text><path d="M0 50h125" class="liquidArrow"/></g>
  <g transform="translate(858 188)"><text x="0" y="0" class="sideTitle">vapor leaves</text><text x="0" y="22" class="sideSmall">to condenser</text><path d="M0 50h96" class="vaporArrow"/></g>
  <path d="M490 318v-50" class="arrow"/><text x="490" y="394" text-anchor="middle" class="small">heat flux drives boiling at wetted structures</text>
  <text x="490" y="60" text-anchor="middle" class="title">Boiling occurs where heat, liquid, and nucleation structures meet</text>
</svg>
