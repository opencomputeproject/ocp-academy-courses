<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" style="width:100%;max-width:980px;height:auto;display:block;" role="img" aria-label="Nested heat transfer loops from silicon to facility heat rejection">
  <defs>
    <marker id="arrowNestedSmall" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L12,4 z" fill="#343895"/>
    </marker>
    <style>.loopbox{fill:#f8fbf5;stroke:#8DC63F;stroke-width:3;rx:12}.label{font:700 18px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:middle}.small{font:600 13px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:middle}.sideLabel{font:800 14px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:start}.sideSmall{font:600 12px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:start}.arrow{stroke:#343895;stroke-width:3.2;fill:none;marker-end:url(#arrowNestedSmall);stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8DC63F;stroke-width:3;fill:none;stroke-dasharray:10 10;stroke-linecap:round}</style>
  </defs>
  <path d="M84 178h812" class="dash"/>
  <text x="108" y="158" class="sideLabel">Above boundary: technology and rack side</text>
  <text x="108" y="202" class="sideLabel">Below boundary: facility water and heat rejection</text>
  <rect x="70" y="50" width="150" height="92" class="loopbox"/><text x="145" y="86" class="label"><tspan x="145">Silicon</tspan><tspan x="145" dy="24">heat</tspan></text><text x="145" y="126" class="small">highest flux</text>
  <rect x="255" y="50" width="150" height="92" class="loopbox"/><text x="330" y="86" class="label"><tspan x="330">Two-phase</tspan><tspan x="330" dy="24">cold plate</tspan></text><text x="330" y="126" class="small">boil near die</text>
  <rect x="440" y="50" width="150" height="92" class="loopbox"/><text x="515" y="86" class="label"><tspan x="515">TCS</tspan><tspan x="515" dy="24">loop</tspan></text><text x="515" y="126" class="small">liquid and vapor</text>
  <rect x="625" y="50" width="150" height="92" class="loopbox"/><text x="700" y="86" class="label"><tspan x="700">CDU</tspan><tspan x="700" dy="24">boundary</tspan></text><text x="700" y="126" class="small">condense heat</text>
  <rect x="800" y="132" width="150" height="92" class="loopbox"/><text x="875" y="168" class="label"><tspan x="875">FWS</tspan><tspan x="875" dy="24">loop</tspan></text><text x="875" y="208" class="small">facility water</text>
  <rect x="360" y="270" width="260" height="92" class="loopbox"/><text x="490" y="304" class="label"><tspan x="490">Heat rejection</tspan><tspan x="490" dy="24">or reuse path</tspan></text><text x="490" y="344" class="small">dry cooler, chiller, tower, reuse</text>
  <path d="M220 96H243" class="arrow"/><path d="M405 96H428" class="arrow"/><path d="M590 96H613" class="arrow"/>
  <path d="M775 96H875V120" class="arrow"/>
  <path d="M875 224v36c0 31-25 56-56 56H632" class="arrow"/>
</svg>
