<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" style="width:100%;max-width:980px;height:auto;display:block;" role="img" aria-label="Filling and purging non-condensable gases in a two-phase loop">
  <defs>
    <marker id="arrowPurgeBlue" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#343895"/></marker>
    <marker id="arrowPurgeGreen" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#8DC63F"/></marker>
    <marker id="arrowPurgeOrange" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#f59e0b"/></marker>
    <style>.box{fill:#f8fbf5;stroke:#8DC63F;stroke-width:3;rx:12}.blue{fill:#f3f5ff;stroke:#343895}.label{font:700 18px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:middle}.small{font:600 13px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:middle}.arrow{stroke:#343895;stroke-width:5;fill:none;marker-end:url(#arrowPurgeBlue)}.green{stroke:#8DC63F;marker-end:url(#arrowPurgeGreen)}.purgeArrow{stroke:#f59e0b;stroke-width:5;fill:none;marker-end:url(#arrowPurgeOrange)}.warn{fill:#fff6e9;stroke:#f59e0b;stroke-width:3;rx:12}</style>
  </defs>
  <rect x="80" y="164" width="174" height="86" class="box"/><text x="167" y="198" class="label"><tspan x="167">Fill and</tspan><tspan x="167" dy="24">degas</tspan></text><text x="167" y="238" class="small">clean, sealed fluid</text>
  <rect x="370" y="164" width="190" height="86" class="box blue"/><text x="465" y="198" class="label"><tspan x="465">Servers</tspan><tspan x="465" dy="24">added</tspan></text><text x="465" y="238" class="small">air can enter</text>
  <rect x="708" y="164" width="190" height="86" class="warn"/><text x="803" y="198" class="label"><tspan x="803">Buffer and</tspan><tspan x="803" dy="24">purge port</tspan></text><text x="803" y="238" class="small">remove trapped gas</text>
  <path d="M254 207H358" class="arrow green"/><path d="M560 207H696" class="arrow"/><path d="M803 164V98H167v54" class="arrow"/>
  <circle cx="654" cy="182" r="11" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="625" cy="219" r="8" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="596" cy="190" r="6" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <text x="490" y="76" class="small">non-condensable gas collects and reduces condenser effectiveness</text>
  <path d="M803 250v70" class="purgeArrow"/><text x="803" y="354" class="small">purge when pressure behavior says it is needed</text>
</svg>
