<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" style="width:100%;max-width:980px;height:auto;display:block;" role="img" aria-label="Two complementary qualification paths for dielectric fluid systems">
  <defs>
    <style>.lane{font:700 16px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:middle}.box{fill:#f8fbf5;stroke:#8DC63F;stroke-width:3;rx:10}.boxBlue{fill:#f3f5ff;stroke:#343895;stroke-width:3;rx:10}.label{font:700 15px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:middle}.small{font:600 11.5px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:middle}.shaft{stroke:#343895;stroke-width:3;fill:none;stroke-linecap:round}.arrowhead{fill:#343895}</style>
  </defs>
  <text x="490" y="28" class="lane">Base Specification compliance</text>
  <rect x="50" y="48" width="180" height="118" class="box"/><text x="140" y="88" class="label">ASTM D471</text><text x="140" y="116" class="small"><tspan x="140">metals, polymers,</tspan><tspan x="140" dy="18">and elastomers</tspan></text>
  <rect x="270" y="48" width="180" height="118" class="boxBlue"/><text x="360" y="82" class="label">Life testing</text><text x="360" y="108" class="small"><tspan x="360">1,000 h at 60 C</tspan><tspan x="360" dy="18">then GC-MS</tspan></text>
  <rect x="490" y="48" width="180" height="118" class="box"/><text x="580" y="82" class="label">Environment</text><text x="580" y="108" class="small"><tspan x="580">oxidation and</tspan><tspan x="580" dy="18">flammability</tspan></text>
  <rect x="710" y="48" width="180" height="118" class="boxBlue"/><text x="800" y="88" class="label">Fluid purity</text><text x="800" y="116" class="small"><tspan x="800">AHRI Standard</tspan><tspan x="800" dy="18">700-2024</tspan></text>
  <path d="M234 107H258" class="shaft"/><polygon points="258,101 258,113 270,107" class="arrowhead"/><path d="M454 107H478" class="shaft"/><polygon points="478,101 478,113 490,107" class="arrowhead"/><path d="M674 107H698" class="shaft"/><polygon points="698,101 698,113 710,107" class="arrowhead"/>
  <line x1="80" y1="208" x2="900" y2="208" stroke="#8DC63F" stroke-width="3" stroke-dasharray="10 9"/>
  <text x="490" y="246" class="lane">Detailed fluid-use guideline</text>
  <rect x="50" y="266" width="180" height="118" class="boxBlue"/><text x="140" y="306" class="label">72 h Soxhlet</text><text x="140" y="334" class="small"><tspan x="140">screen seals and</tspan><tspan x="140" dy="18">material changes</tspan></text>
  <rect x="270" y="266" width="180" height="118" class="box"/><text x="360" y="306" class="label">Components</text><text x="360" y="334" class="small"><tspan x="360">pumps, QDs,</tspan><tspan x="360" dy="18">and cold plates</tspan></text>
  <rect x="490" y="266" width="180" height="118" class="boxBlue"/><text x="580" y="306" class="label">System proof</text><text x="580" y="334" class="small"><tspan x="580">two-month</tspan><tspan x="580" dy="18">monitored test</tspan></text>
  <rect x="710" y="266" width="180" height="118" class="box"/><text x="800" y="306" class="label">Records</text><text x="800" y="334" class="small"><tspan x="800">retest when the</tspan><tspan x="800" dy="18">material set changes</tspan></text>
  <path d="M234 325H258" class="shaft"/><polygon points="258,319 258,331 270,325" class="arrowhead"/><path d="M454 325H478" class="shaft"/><polygon points="478,319 478,331 490,325" class="arrowhead"/><path d="M674 325H698" class="shaft"/><polygon points="698,319 698,331 710,325" class="arrowhead"/>
</svg>
