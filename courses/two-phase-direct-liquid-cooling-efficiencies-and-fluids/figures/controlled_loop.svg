<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" style="width:100%;max-width:980px;height:auto;display:block;" role="img" aria-label="Controlled two-phase cooling loop from receiver to cold plates to condenser">
  <defs>
    <marker id="arrowLoopGreen" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#8DC63F"/></marker>
    <marker id="arrowLoopBlue" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L12,4 z" fill="#343895"/></marker>
    <style>.box{fill:#f8fbf5;stroke:#8DC63F;stroke-width:3;rx:12}.blue{fill:#f3f5ff;stroke:#343895}.label{font:700 18px Open Sans,Arial,sans-serif;fill:#343895;text-anchor:middle}.small{font:600 13px Open Sans,Arial,sans-serif;fill:#5F6062;text-anchor:middle}.liquid{stroke:#8DC63F;stroke-width:5;fill:none;marker-end:url(#arrowLoopGreen)}.vapor{stroke:#343895;stroke-width:5;fill:none;marker-end:url(#arrowLoopBlue)}.control{stroke:#5F6062;stroke-width:3;fill:none;stroke-dasharray:8 8}</style>
  </defs>
  <rect x="86" y="168" width="160" height="92" class="box"/><text x="166" y="204" class="label"><tspan x="166">Receiver</tspan><tspan x="166" dy="24">and buffer</tspan></text><text x="166" y="246" class="small">liquid inventory</text>
  <rect x="352" y="168" width="190" height="92" class="box blue"/><text x="447" y="204" class="label"><tspan x="447">Cold plates</tspan><tspan x="447" dy="24">evaporate fluid</tspan></text><text x="447" y="246" class="small">near heat source</text>
  <rect x="734" y="168" width="170" height="92" class="box blue"/><text x="819" y="204" class="label"><tspan x="819">Condenser</tspan><tspan x="819" dy="24">in CDU</tspan></text><text x="819" y="246" class="small">heat to FWS or air</text>
  <rect x="354" y="335" width="188" height="64" class="box"/><text x="448" y="361" class="label">Pump or lift</text><text x="448" y="386" class="small">design dependent</text>
  <path d="M246 214H340" class="liquid"/><path d="M542 214H722" class="vapor"/><path d="M819 260v95H554" class="liquid"/><path d="M354 367H166V272" class="liquid"/>
  <path d="M819 168V96H166v72" class="control"/><text x="492" y="76" class="small">pressure control stabilizes boiling temperature</text>
  <text x="300" y="196" class="small">liquid feed</text><text x="638" y="196" class="small">vapor return</text><text x="698" y="346" class="small">condensed liquid</text>
</svg>
