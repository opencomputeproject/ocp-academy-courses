<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 960 540">
    <rect width="960" height="540" fill="#ffffff"/>
    <defs><marker id="arrow-gray" viewBox="0 0 20 18" refX="1" refY="9" markerWidth="20" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L19 9 L1 17 Z" fill="#b9c1cb"/></marker><marker id="arrow-green" viewBox="0 0 20 18" refX="1" refY="9" markerWidth="20" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L19 9 L1 17 Z" fill="#8dc63f"/></marker></defs>
    <path d="M264,253 C320,253 320,170 352,170" fill="none" stroke="#b9c1cb" stroke-width="3"  marker-end="url(#arrow-gray)"/><path d="M590,170 C642,170 642,253 678,253" fill="none" stroke="#b9c1cb" stroke-width="3"  marker-end="url(#arrow-gray)"/><path d="M806,305 C806,382 648,382 608,382" fill="none" stroke="#b9c1cb" stroke-width="3"  marker-end="url(#arrow-gray)"/><path d="M370,382 C310,382 310,275 282,275" fill="none" stroke="#8dc63f" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/><rect x="44" y="201" width="220" height="104" rx="8" fill="#f3f9e9" stroke="#8dc63f" stroke-width="4"/>
      <text x="62" y="233" font-family="Avenir Next, Arial" font-size="21" font-weight="700" fill="#24262b">Orchestrate</text>
      <text x="62" y="261" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">Schedule, allocate, compile,</text><text x="62" y="283" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">and dispatch the job.</text><rect x="370" y="118" width="220" height="104" rx="8" fill="#f3f9e9" stroke="#8dc63f" stroke-width="4"/>
      <text x="388" y="150" font-family="Avenir Next, Arial" font-size="21" font-weight="700" fill="#24262b">Control</text>
      <text x="388" y="178" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">Prepare pulses and coordinate</text><text x="388" y="200" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">real-time classical logic.</text><rect x="696" y="201" width="220" height="104" rx="8" fill="#f3f9e9" stroke="#8dc63f" stroke-width="4"/>
      <text x="714" y="233" font-family="Avenir Next, Arial" font-size="21" font-weight="700" fill="#24262b">Execute</text>
      <text x="714" y="261" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">The QPU performs the</text><text x="714" y="283" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">quantum operation.</text><rect x="370" y="322" width="220" height="104" rx="8" fill="#f3f9e9" stroke="#8dc63f" stroke-width="4"/>
      <text x="388" y="354" font-family="Avenir Next, Arial" font-size="21" font-weight="700" fill="#24262b">Measure + adapt</text>
      <text x="388" y="382" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">Decode results and update</text><text x="388" y="404" font-family="Avenir Next, Arial" font-size="13.5" fill="#5f6062">the next circuit.</text>
    <rect x="382" y="236" width="196" height="66" rx="8" fill="#343895"/>
