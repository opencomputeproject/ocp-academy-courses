<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Trusted OCP Community space</title>
  <desc id="desc">Useful participation and open collaboration sit within the trusted community boundary, while sales-first behavior remains outside.</desc>
  <rect class="bg" width="800" height="600" rx="28" fill="#ffffff"/>
  <rect class="panel" x="42" y="44" width="716" height="428" rx="28" fill="#f7fbf2" stroke="#8DC63F" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="78" y="96" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#6FA030" letter-spacing="2">TRUSTED COMMUNITY SPACE</text>
  <g transform="translate(82 142)">
    <rect x="0" y="0" width="276" height="112" rx="18" fill="#ffffff" stroke="#dfe8d4" stroke-width="3"/>
    <circle cx="54" cy="56" r="28" fill="#8DC63F"/>
    <path d="M42 57l9 9 17-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="48" font-family="Open Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#30313a">Useful</text>
    <text x="100" y="80" font-family="Open Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#30313a">participation</text>
  </g>
  <g transform="translate(442 142)">
    <rect x="0" y="0" width="276" height="112" rx="18" fill="#ffffff" stroke="#dfe8d4" stroke-width="3"/>
    <circle cx="54" cy="56" r="28" fill="#343895"/>
    <path d="M42 57l9 9 17-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="48" font-family="Open Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#30313a">Open</text>
    <text x="100" y="80" font-family="Open Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#30313a">collaboration</text>
  </g>
  <g transform="translate(185 306)">
    <rect x="0" y="0" width="430" height="116" rx="20" fill="#343895"/>
    <path d="M54 28l26 10v23c0 18-12 31-26 38-14-7-26-20-26-38V38z" fill="#8DC63F"/>
    <path d="M42 62l9 9 17-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="50" font-family="Open Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Trust creates room</text>
    <text x="110" y="82" font-family="Open Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">to solve hard problems</text>
  </g>
  <g transform="translate(108 506)">
    <rect x="0" y="0" width="584" height="62" rx="18" fill="#f4f4f5" stroke="#c7c8cc" stroke-width="2"/>
    <circle cx="40" cy="31" r="16" fill="#8a8a8c"/>
    <path d="M32 31h16" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="76" y="40" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b6c70">Sales-first behavior does not belong here</text>
  </g>
</svg>
