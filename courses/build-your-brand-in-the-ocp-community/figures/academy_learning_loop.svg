<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">OCP Academy learning loop</title>
  <desc id="desc">Knowledge from real Community work becomes an Academy course, helps a learner, and returns as stronger participation.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 12,6 0,12" fill="#8DC63F"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="600" rx="28" fill="#ffffff"/>
  <g font-family="Open Sans, Arial, sans-serif">
    <g transform="translate(58 60)">
      <rect x="0" y="0" width="276" height="144" rx="22" fill="#f7fbf2" stroke="#8DC63F" stroke-width="3"/>
      <circle cx="52" cy="52" r="28" fill="#8DC63F"/>
      <path d="M37 54h30M42 43h20M45 65h14" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="34" y="108" font-size="23" font-weight="800" fill="#30313a">Hard-won knowledge</text>
      <text x="34" y="134" font-size="18" fill="#6b6c70">from real OCP work</text>
    </g>
    <line x1="334" y1="132" x2="454" y2="132" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <g transform="translate(466 60)">
      <rect x="0" y="0" width="276" height="144" rx="22" fill="#343895"/>
      <path d="M38 31h58v68H38z" fill="#ffffff"/><path d="M50 49h34M50 64h34M50 79h24" stroke="#343895" stroke-width="4" stroke-linecap="round"/>
      <circle cx="96" cy="98" r="17" fill="#8DC63F"/>
      <text x="116" y="57" font-size="25" font-weight="800" fill="#ffffff">Academy</text>
      <text x="116" y="87" font-size="25" font-weight="800" fill="#ffffff">learning</text>
      <text x="34" y="128" font-size="18" fill="#ffffff" opacity="0.9">durable and on demand</text>
    </g>
    <line x1="604" y1="204" x2="604" y2="326" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <g transform="translate(466 338)">
      <rect x="0" y="0" width="276" height="144" rx="22" fill="#ffffff" stroke="#dfe3e8" stroke-width="3"/>
      <circle cx="62" cy="52" r="28" fill="#343895"/>
      <circle cx="62" cy="44" r="10" fill="#ffffff"/><path d="M43 73q19-20 38 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <text x="112" y="58" font-size="25" font-weight="800" fill="#30313a">Next learner</text>
      <text x="34" y="112" font-size="18" fill="#6b6c70">can act with more context</text>
      <text x="34" y="135" font-size="18" fill="#6b6c70">and confidence</text>
    </g>
    <line x1="466" y1="410" x2="346" y2="410" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <g transform="translate(58 338)">
      <rect x="0" y="0" width="276" height="144" rx="22" fill="#f4f4f5" stroke="#c7c8cc" stroke-width="3"/>
      <circle cx="54" cy="52" r="28" fill="#8DC63F"/>
      <path d="M39 54l10 10 21-27" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="57" font-size="25" font-weight="800" fill="#30313a">Stronger</text>
      <text x="104" y="87" font-size="25" font-weight="800" fill="#30313a">participation</text>
      <text x="34" y="118" font-size="17" fill="#6b6c70">knowledge returns</text>
      <text x="34" y="139" font-size="17" fill="#6b6c70">to the Community</text>
    </g>
    <path d="M196 338 C196 292 196 256 196 216" fill="none" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <text x="400" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#6FA030">Teach once. Help the Community keep learning.</text>
  </g>
</svg>
