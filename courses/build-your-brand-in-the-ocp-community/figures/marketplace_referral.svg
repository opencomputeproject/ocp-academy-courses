<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">OCP Marketplace referral model</title>
  <desc id="desc">A qualified visitor discovers an OCP-aligned offering in the Marketplace and then follows through to the Solution Provider.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 12,6 0,12" fill="#8DC63F"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="480" rx="28" fill="#ffffff"/>
  <g font-family="Open Sans, Arial, sans-serif">
    <g transform="translate(100 18)">
      <rect x="0" y="0" width="600" height="88" rx="20" fill="#ffffff" stroke="#dfe3e8" stroke-width="3"/>
      <circle cx="70" cy="44" r="26" fill="#343895"/>
      <circle cx="70" cy="37" r="9" fill="#ffffff"/><path d="M52 66q18-20 36 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <text x="120" y="39" font-size="26" font-weight="800" fill="#30313a">Qualified visitor</text>
      <text x="120" y="65" font-size="18" fill="#6b6c70">Looking for an OCP-aligned solution</text>
    </g>
    <line x1="400" y1="106" x2="400" y2="132" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <g transform="translate(100 144)">
      <rect x="0" y="0" width="600" height="104" rx="20" fill="#f7fbf2" stroke="#8DC63F" stroke-width="4"/>
      <path d="M42 34h76v44H42z" fill="#8DC63F"/><path d="M52 24h56l10 10H42z" fill="#6FA030"/>
      <circle cx="61" cy="87" r="8" fill="#343895"/><circle cx="99" cy="87" r="8" fill="#343895"/>
      <text x="140" y="45" font-size="27" font-weight="800" fill="#30313a">OCP Marketplace</text>
      <text x="140" y="73" font-size="18" fill="#6b6c70">Multi-vendor discovery and qualified interest</text>
    </g>
    <line x1="400" y1="248" x2="400" y2="276" stroke="#8DC63F" stroke-width="6" marker-end="url(#green-arrow)"/>
    <g transform="translate(100 288)">
      <rect x="0" y="0" width="600" height="112" rx="20" fill="#343895"/>
      <path d="M44 34h74v52H44z" fill="#ffffff" opacity="0.96"/><path d="M56 24h50v18H56z" fill="#8DC63F"/>
      <path d="M61 61h16M61 76h16M87 61h16M87 76h16" stroke="#343895" stroke-width="5" stroke-linecap="round"/>
      <text x="140" y="49" font-size="27" font-weight="800" fill="#ffffff">Solution Provider</text>
      <text x="140" y="77" font-size="17" fill="#ffffff" opacity="0.9">The visitor reaches the provider's site or contact</text>
    </g>
    <text x="400" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#6FA030">OCP refers interest; providers deliver the solution.</text>
  </g>
</svg>
