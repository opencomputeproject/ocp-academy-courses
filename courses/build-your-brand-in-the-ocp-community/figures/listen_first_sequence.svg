<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Listen-first workstream sequence</title>
  <desc id="desc">A five-step sequence from finding relevant work to earning a leadership opportunity.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 12,6 0,12" fill="#8DC63F"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="600" rx="28" fill="#ffffff"/>
  <g font-family="Open Sans, Arial, sans-serif">
    <g transform="translate(108 34)">
      <rect x="0" y="0" width="584" height="82" rx="18" fill="#f7fbf2" stroke="#8DC63F" stroke-width="3"/>
      <circle cx="49" cy="41" r="24" fill="#8DC63F"/><text x="49" y="50" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">1</text>
      <text x="92" y="51" font-size="27" font-weight="700" fill="#30313a">Find the relevant workstream</text>
    </g>
    <line x1="400" y1="116" x2="400" y2="134" stroke="#8DC63F" stroke-width="5" marker-end="url(#green-arrow)"/>
    <g transform="translate(108 146)">
      <rect x="0" y="0" width="584" height="82" rx="18" fill="#ffffff" stroke="#dfe3e8" stroke-width="3"/>
      <circle cx="49" cy="41" r="24" fill="#343895"/><text x="49" y="50" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">2</text>
      <text x="92" y="51" font-size="27" font-weight="700" fill="#30313a">Join and listen</text>
    </g>
    <line x1="400" y1="228" x2="400" y2="246" stroke="#8DC63F" stroke-width="5" marker-end="url(#green-arrow)"/>
    <g transform="translate(108 258)">
      <rect x="0" y="0" width="584" height="82" rx="18" fill="#ffffff" stroke="#dfe3e8" stroke-width="3"/>
      <circle cx="49" cy="41" r="24" fill="#343895"/><text x="49" y="50" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">3</text>
      <text x="92" y="51" font-size="27" font-weight="700" fill="#30313a">Learn priorities and context</text>
    </g>
    <line x1="400" y1="340" x2="400" y2="358" stroke="#8DC63F" stroke-width="5" marker-end="url(#green-arrow)"/>
    <g transform="translate(108 370)">
      <rect x="0" y="0" width="584" height="82" rx="18" fill="#ffffff" stroke="#dfe3e8" stroke-width="3"/>
      <circle cx="49" cy="41" r="24" fill="#343895"/><text x="49" y="50" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">4</text>
      <text x="92" y="51" font-size="27" font-weight="700" fill="#30313a">Offer useful help</text>
    </g>
    <line x1="400" y1="452" x2="400" y2="470" stroke="#8DC63F" stroke-width="5" marker-end="url(#green-arrow)"/>
    <g transform="translate(108 482)">
      <rect x="0" y="0" width="584" height="82" rx="18" fill="#343895"/>
      <circle cx="49" cy="41" r="24" fill="#8DC63F"/><text x="49" y="50" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">5</text>
      <text x="92" y="51" font-size="27" font-weight="700" fill="#ffffff">Lead after trust is established</text>
    </g>
  </g>
</svg>
