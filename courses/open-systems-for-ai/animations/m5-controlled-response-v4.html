</style></head><body data-duration-ms="65697.55102040817" data-poster-ms="61697"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="A controlled response requires fresh observations, defined policy, authorized action and verification. Stale data and failed commands need an escalation path."><rect class="bg" width="1920" height="1080" fill="white"/><rect class="" x="80" y="240" width="270" height="180" rx="12" fill="#fcf8f0" stroke="#9b6c20" stroke-width="3"/><text x="215.0" y="319.92" text-anchor="middle" fill="#9b6c20" font-size="36"><tspan x="215.0" dy="0">Cooling</tspan><tspan x="215.0" dy="44.64">condition</tspan></text><g data-start="0"><rect class="" x="460" y="240" width="270" height="180" rx="12" fill="#f8faf6" stroke="#5F6062" stroke-width="3"/><text x="595.0" y="340.88" text-anchor="middle" fill="#5F6062" font-size="32"><tspan x="595.0" dy="0">Observation</tspan></text><path d="M 350 330 L 444.0 330.0" fill="none" stroke="#5F6062" stroke-width="3" stroke-dasharray=""/><polygon class="arrowhead" points="444.0,337.0 444.0,323.0 460,330" fill="#5F6062"/></g><g data-start="5"><rect class="" x="840" y="240" width="270" height="180" rx="12" fill="#f8faf6" stroke="#5F6062" stroke-width="3"/><text x="975.0" y="321.04" text-anchor="middle" fill="#5F6062" font-size="32"><tspan x="975.0" dy="0">Freshness</tspan><tspan x="975.0" dy="39.68">check</tspan></text><path d="M 730 330 L 824.0 330.0" fill="none" stroke="#5F6062" stroke-width="3" stroke-dasharray=""/><polygon class="arrowhead" points="824.0,337.0 824.0,323.0 840,330" fill="#5F6062"/></g><g data-start="11"><rect class="" x="1220" y="240" width="270" height="180" rx="12" fill="#f8faf6" stroke="#8DC63F" stroke-width="3"/><text x="1355.0" y="340.88" text-anchor="middle" fill="#8DC63F" font-size="32"><tspan x="1355.0" dy="0">Policy</tspan></text><path d="M 1110 330 L 1204.0 330.0" fill="none" stroke="#8DC63F" stroke-width="3" stroke-dasharray=""/><polygon class="arrowhead" points="1204.0,337.0 1204.0,323.0 1220,330" fill="#8DC63F"/></g><g data-start="14"><rect class="" x="1220" y="580" width="300" height="180" rx="12" fill="#f5f9ef" stroke="#8DC63F" stroke-width="3"/><text x="1370.0" y="659.92" text-anchor="middle" fill="#8DC63F" font-size="36"><tspan x="1370.0" dy="0">Authorized</tspan><tspan x="1370.0" dy="44.64">action</tspan></text><path d="M 1355 420 L 1355.0 564.0" fill="none" stroke="#8DC63F" stroke-width="3" stroke-dasharray=""/><polygon class="arrowhead" points="1348.0,564.0 1362.0,564.0 1355,580" fill="#8DC63F"/></g><g data-start="25"><rect class="" x="80" y="580" width="350" height="180" rx="12" fill="#f8faf6" stroke="#5F6062" stroke-width="3"/><text x="255.0" y="659.36" text-anchor="middle" fill="#5F6062" font-size="38"><tspan x="255.0" dy="0">Verify</tspan><tspan x="255.0" dy="47.12">response</tspan></text><path d="M 1220 670 L 446.0 670.0" fill="none" stroke="#5F6062" stroke-width="3" stroke-dasharray=""/><polygon class="arrowhead" points="446.0,663.0 446.0,677.0 430,670" fill="#5F6062"/><text x="825" y="625.0" text-anchor="middle" fill="#5F6062" font-size="30"><tspan x="825" dy="0">Observe the result</tspan></text></g><g data-start="5"><rect class="" x="680" y="890" width="580" height="130" rx="12" fill="#fcf8f0" stroke="#9b6c20" stroke-width="3"/><text x="970.0" y="967.92" text-anchor="middle" fill="#9b6c20" font-size="38"><tspan x="970.0" dy="0">Escalate</tspan></text><path d="M 975 240 L 975 120 L 1770 120 L 1770 955" fill="none" stroke="#9b6c20" stroke-width="3" stroke-dasharray="7 7" stroke-linejoin="round"/><path d="M 1770 955 L 1276.0 955.0" fill="none" stroke="#9b6c20" stroke-width="3" stroke-dasharray="7 7"/><polygon class="arrowhead" points="1276.0,948.0 1276.0,962.0 1260,955" fill="#9b6c20"/><text x="1430" y="95.0" text-anchor="middle" fill="#9b6c20" font-size="28"><tspan x="1430" dy="0">Stale data</tspan></text></g><g data-start="18"><path d="M 1520 670 L 1630 670 L 1630 780 L 1770 780" fill="none" stroke="#9b6c20" stroke-width="3" stroke-dasharray="7 7" stroke-linejoin="round"/><text x="1500" y="850.0" text-anchor="middle" fill="#9b6c20" font-size="28"><tspan x="1500" dy="0">Command failed</tspan></text></g></svg><script>
const SCALE=1.9322809123649463;
const PHRASE_CUES={"0": 0.0, "5": 0.07407407, "11": 0.22222222, "14": 0.46560847, "18": 0.73015873, "25": 0.70899471, "29": 0.77777778};
const timeline=[];
for(const node of document.querySelectorAll('[data-start]')){
 const cue=PHRASE_CUES[node.dataset.start];
 const start=cue===undefined?Number(node.dataset.start)*SCALE*1000:cue*Number(document.body.dataset.durationMs);
 const animation=node.animate([{opacity:0},{opacity:1}],{duration:900,delay:start,fill:'both',iterations:1,easing:'ease-out'});
 timeline.push(animation);
 for(const p of node.querySelectorAll('path:not([stroke-dasharray]),path[stroke-dasharray=""]')){
  const length=p.getTotalLength();p.style.strokeDasharray=String(length);
  timeline.push(p.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:2200,delay:start,fill:'both',iterations:1,easing:'ease-in-out'}));
 }
 for(const head of node.querySelectorAll('.arrowhead'))timeline.push(head.animate([{opacity:0},{opacity:1}],{duration:200,delay:start+2200,fill:'both',iterations:1}));
}
window.setTeachingTime=(ms)=>{timeline.forEach(a=>{a.pause();a.currentTime=ms;});};
window.teachingTimeline={durationMs:Number(document.body.dataset.durationMs),posterMs:Number(document.body.dataset.posterMs),finite:true};
</script></body></html>
