arrowhead" points="1054.0,222.0 1054.0,208.0 1070,215" fill="#5F6062" /><text x="1300" y="225.0" text-anchor="middle" fill="#5F6062" font-size="32"><tspan x="1300" dy="0">Residual air cooling</tspan></text></g></svg><script>
const SCALE=2.44314706835115;
const PHRASE_CUES={"0": 0.0, "4": 0.03804348, "10": 0.26630435, "17": 0.47282609, "23": 0.7173913};
const timeline=[];
for(const node of document.querySelectorAll('[data-start]')){
 const cue=PHRASE_CUES[node.dataset.start];
 const start=cue===undefined?Number(node.dataset.start)*SCALE*1000:cue*Number(document.body.dataset.durationMs);
 const animation=node.animate([{opacity:0},{opacity:1}],{duration:900,delay:start,fill:'both',iterations:1,easing:'ease-out'});
 timeline.push(animation);
 for(const p of node.querySelectorAll('path:not([stroke-dasharray]),path[stroke-dasharray=""]')){
  const length=p.getTotalLength();p.style.strokeDasharray=String(length);
  timeline.push(p.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:2200,delay:start,fill:'both',iterations:1,easing:'ease-in-out'}));
 }
 for(const head of node.querySelectorAll('.arrowhead'))timeline.push(head.animate([{opacity:0},{opacity:1}],{duration:200,delay:start+2200,fill:'both',iterations:1}));
}
window.setTeachingTime=(ms)=>{timeline.forEach(a=>{a.pause();a.currentTime=ms;});};
window.teachingTimeline={durationMs:Number(document.body.dataset.durationMs),posterMs:Number(document.body.dataset.posterMs),finite:true};
</script></body></html>
