<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Fluid mixing decision logic">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="360" fill="#fff"/>
  <text x="500" y="30" text-anchor="middle" class="title">Mixing is an operational event, not a category rule</text>

  <rect x="45" y="65" width="280" height="220" rx="18" class="box warn"/>
  <text x="185" y="110" text-anchor="middle" class="h">Can it be avoided?</text>
  <text x="185" y="165" text-anchor="middle" class="body">flush residue</text>
  <text x="185" y="190" text-anchor="middle" class="body">top-off</text>
  <text x="185" y="215" text-anchor="middle" class="body">operator error</text>

  <path d="M338 175 H357" class="arrowLine"/>
  <polygon points="378,175 357,163 357,187" class="arrowHead"/>

  <rect x="380" y="65" width="280" height="220" rx="18" class="box green"/>
  <text x="520" y="102" text-anchor="middle" class="h">Evaluate fluid</text>
  <text x="520" y="128" text-anchor="middle" class="h">by fluid</text>
  <text x="520" y="170" text-anchor="middle" class="body">storage stability</text>
  <text x="520" y="195" text-anchor="middle" class="body">corrosion testing</text>
  <text x="520" y="220" text-anchor="middle" class="body">supplier guidance</text>

  <path d="M673 175 H692" class="arrowLine"/>
  <polygon points="713,175 692,163 692,187" class="arrowHead"/>

  <rect x="715" y="65" width="240" height="220" rx="18" class="box warn"/>
  <text x="835" y="102" text-anchor="middle" class="h">Reset monitoring</text>
  <text x="835" y="128" text-anchor="middle" class="h">plan</text>
  <text x="835" y="170" text-anchor="middle" class="small">baseline changes</text>
  <text x="835" y="195" text-anchor="middle" class="small">inhibitor targets shift</text>
  <text x="835" y="220" text-anchor="middle" class="small">corrections get harder</text>

  <text x="500" y="330" text-anchor="middle" class="body">PG25 compliance does not make different suppliers' fluids interchangeable.</text>
</svg>
