<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Prevent unintended mixing, verify exact fluids, and monitor changes</title><desc id="desc">Use supplier-approved flush and fill protocols for incoming equipment. Exact formulations require evidence. After changes, sample and document the baseline; PG25 compliance is not interchangeability.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">Incoming equipment / top-off / service event</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">Prevent mixing</text><text x="166" y="178" text-anchor="middle" class="b">Identify residual fluid</text><text x="166" y="217" text-anchor="middle" class="b">Supplier-approved flush</text><text x="166" y="256" text-anchor="middle" class="b">Fill with operating fluid</text><text x="166" y="295" text-anchor="middle" class="s">Before connection</text>
<text x="500" y="128" text-anchor="middle" class="h">Verify exact fluids</text><text x="500" y="178" text-anchor="middle" class="b">Formulation-specific evidence</text><text x="500" y="217" text-anchor="middle" class="b">Materials + conditions</text><text x="500" y="256" text-anchor="middle" class="b">Supplier-approved plan</text><text x="500" y="295" text-anchor="middle" class="s">No family-level assumptions</text>
<text x="834" y="128" text-anchor="middle" class="h">Monitor the change</text><text x="834" y="178" text-anchor="middle" class="b">Event-driven sampling</text><text x="834" y="217" text-anchor="middle" class="b">Review inhibitor baselines</text><text x="834" y="256" text-anchor="middle" class="b">Document every change</text><text x="834" y="295" text-anchor="middle" class="s">Until stability is confirmed</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 compliance does not make different suppliers' fluids interchangeable.</text>
</svg>
