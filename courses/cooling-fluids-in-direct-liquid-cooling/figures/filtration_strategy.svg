<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Main-circuit and sidestream filters serve distinct paths</title><desc id="desc">The inline perforated strainer sees main-circuit flow. A partial-flow branch passes through a sidestream filter and rejoins the return. Select rating, efficiency, flow and additive-compatible media together.</desc>
