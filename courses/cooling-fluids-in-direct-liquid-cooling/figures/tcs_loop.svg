<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Heat crosses the CDU; facility and secondary fluids remain separate</title><desc id="desc">The facility water system is outside the TCS boundary. The closed secondary fluid circulates through the CDU, rack manifold, and cold plates.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="520" fill="#fff"/>

<rect x="274" y="34" width="702" height="430" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2" stroke-dasharray="9 7"/>
<text x="302" y="76" class="h">Technology Cooling System (TCS)</text><text x="302" y="105" class="b">Closed secondary loop</text>
<rect x="26" y="185" width="196" height="180" rx="8" fill="#f1f2fb" stroke="#343895" stroke-width="2"/>
<text x="124" y="232" text-anchor="middle" class="h">Facility water</text><text x="124" y="262" text-anchor="middle" class="b">system (FWS)</text><text x="124" y="325" text-anchor="middle" class="s">Outside this scope</text>
<rect x="302" y="150" width="178" height="266" rx="8" class="box"/>
<text x="391" y="190" text-anchor="middle" class="h">CDU</text>
<rect x="324" y="217" width="134" height="100" rx="4" fill="#fafbfc" stroke="#a5adb6" stroke-width="2"/>
<path d="M222 242 H350 V292 H222" fill="none" stroke="#343895" stroke-width="5"/>
<path d="M480 250 H412 V302 H440 V330 H480" class="flow"/>
<path d="M386 230 V304" stroke="#a5adb6" stroke-width="3"/>
<path d="M368 255 H400 M368 279 H400" stroke="#757577" stroke-width="2"/>
<text x="391" y="355" text-anchor="middle" class="s">Heat exchanger</text><text x="391" y="391" text-anchor="middle" class="s">Pump + filters</text>
<rect x="576" y="160" width="150" height="246" rx="8" class="box"/>
<text x="651" y="201" text-anchor="middle" class="h">Rack</text><text x="651" y="231" text-anchor="middle" class="h">manifold</text>
<text x="651" y="276" text-anchor="middle" class="s">Supply / return</text><text x="651" y="314" text-anchor="middle" class="s">QDs + hoses</text><text x="651" y="352" text-anchor="middle" class="s">Sensors</text>
<rect x="820" y="160" width="132" height="246" rx="8" class="box"/>
