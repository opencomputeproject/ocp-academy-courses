<text x="528" y="226" text-anchor="middle" class="s">Supply</text><text x="773" y="226" text-anchor="middle" class="s">Supply</text>
<text x="528" y="357" text-anchor="middle" class="s">Return</text><text x="773" y="357" text-anchor="middle" class="s">Return</text>
<text x="500" y="498" text-anchor="middle" class="b">Heat crosses the exchanger. The two fluids do not mix.</text>
