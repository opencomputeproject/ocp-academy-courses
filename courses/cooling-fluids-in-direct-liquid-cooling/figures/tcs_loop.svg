<rect x="842" y="225" width="88" height="54" rx="4" fill="#f1f2fb" stroke="#343895" stroke-width="2"/>
<path d="M853 237 H919 M853 249 H919 M853 261 H919" stroke="#8dc63f" stroke-width="3"/>
<rect x="842" y="303" width="88" height="54" rx="4" fill="#f1f2fb" stroke="#343895" stroke-width="2"/>
<path d="M853 315 H919 M853 327 H919 M853 339 H919" stroke="#8dc63f" stroke-width="3"/>
<text x="886" y="386" text-anchor="middle" class="s">Cold plates</text>
