<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="Fluid families in single-phase and two-phase DLC">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 24px Open Sans,Arial;fill:#333}.body{font:600 18px Open Sans,Arial;fill:#5F6062}.card{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.focus{stroke:#8DC63F;stroke-width:6}.defer{stroke:#343895;stroke-width:4;stroke-dasharray:12 10}.drop{fill:#8DC63F}.blue{fill:#343895}</style>
  <text x="500" y="30" text-anchor="middle" class="title">This course focuses on single-phase TCS fluids</text>
  <rect x="70" y="50" width="260" height="230" class="card focus"/>
  <path d="M200 65c25 34 45 60 45 91 0 26-20 46-45 46s-45-20-45-46c0-31 20-57 45-91z" class="drop" opacity="0.88"/>
  <text x="200" y="238" text-anchor="middle" class="h">Treated water</text>
  <text x="200" y="264" text-anchor="middle" class="body">best thermal performance</text>
  <rect x="370" y="50" width="260" height="230" class="card focus"/>
  <path d="M500 65c25 34 45 60 45 91 0 26-20 46-45 46s-45-20-45-46c0-31 20-57 45-91z" fill="#A8D86A"/>
  <text x="500" y="224" text-anchor="middle" class="h">PG25</text>
  <text x="500" y="246" text-anchor="middle" class="body">
    <tspan x="500" dy="0">ready-to-use 25-28%</tspan>
    <tspan x="500" dy="20">by weight</tspan>
  </text>
  <rect x="670" y="50" width="260" height="230" class="card defer"/>
  <path d="M800 65c25 34 45 60 45 91 0 26-20 46-45 46s-45-20-45-46c0-31 20-57 45-91z" class="blue" opacity="0.9"/>
  <text x="800" y="220" text-anchor="middle" class="h">
    <tspan x="800" dy="0">Two-phase</tspan>
    <tspan x="800" dy="20">refrigerants</tspan>
  </text>
  <text x="800" y="274" text-anchor="middle" class="body">defer to separate course</text>
  <text x="500" y="328" text-anchor="middle" class="body">Common governance exists. Actionable fluid guidance diverges quickly.</text>
</svg>
