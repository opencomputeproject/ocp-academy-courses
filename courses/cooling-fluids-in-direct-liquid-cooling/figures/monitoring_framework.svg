<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">A trend can warrant investigation before an action limit is reached</title><desc id="desc">This is an illustrative signal, not measured data or a universal limit. Compare the baseline, calibration, representative samples, system evidence and fluid evidence.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="540" fill="#fff"/>

<text x="54" y="42" class="s">Illustrative trend - not measured data</text>
<text x="48" y="182" text-anchor="middle" transform="rotate(-90 48 182)" class="s">Relative signal</text>
<path d="M90 68 V288 H614" fill="none" stroke="#9ca3af" stroke-width="2"/>
<path d="M90 101 H614" stroke="#343895" stroke-width="2" stroke-dasharray="8 6"/><text x="407" y="87" class="s">Site action limit</text>
<path d="M90 250 H614" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="4 5"/><text x="101" y="277" class="s">Baseline</text>
<path d="M111 246 L183 252 L255 242 L327 234 L399 216 L471 182 L555 146" fill="none" stroke="#74a82d" stroke-width="4" stroke-linejoin="round"/>
<g fill="#fff" stroke="#74a82d" stroke-width="3"><circle cx="111" cy="246" r="5"/><circle cx="183" cy="252" r="5"/><circle cx="255" cy="242" r="5"/><circle cx="327" cy="234" r="5"/><circle cx="399" cy="216" r="5"/><circle cx="471" cy="182" r="5"/><circle cx="555" cy="146" r="5"/></g>
<text x="330" y="318" text-anchor="middle" class="b">Samples over time</text>
<text x="54" y="359" class="h">Confirm the change</text><text x="54" y="391" class="b">Calibration + representative sample + lab comparison</text>
<path d="M660 28 V402" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="701" y="67" class="h">System evidence</text><text x="701" y="102" class="b">Metals + particles</text><text x="701" y="133" class="b">Filter loading + thermal drift</text>
<text x="701" y="215" class="h">Fluid evidence</text><text x="701" y="250" class="b">pH + concentration</text><text x="701" y="281" class="b">Inhibitor levels + azoles</text><text x="701" y="312" class="b">Glycol degradation products</text>
<text x="701" y="361" class="s">Conductivity alone does not</text><text x="701" y="387" class="s">diagnose inhibited PG25.</text>
