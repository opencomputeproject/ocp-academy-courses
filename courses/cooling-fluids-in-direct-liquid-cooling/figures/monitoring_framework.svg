<rect x="532" y="436" width="440" height="78" rx="6" fill="#f5faee"/><text x="752" y="470" text-anchor="middle" class="b">In-use / supplier limits</text><text x="752" y="498" text-anchor="middle" class="s">Operating interpretation</text>
