<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staged debris-flushing example</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
svg{display:block;width:100vw;height:100vh}
text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}
.stage-title{font-size:27px;font-weight:700;fill:#292b30}.stage-note{font-size:21px;fill:#5f6062}
.h{font-size:27px;font-weight:700;fill:#292b30}.b{font-size:23px;fill:#5f6062}.s{font-size:19px;fill:#5f6062}
.pipe{fill:none;stroke:#d9dee3;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
.active{fill:none;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
</style>
</head>
<body data-duration-ms="18000" data-poster-ms="16500">
<svg viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Isolation, debris capture, connected-path flushing, and final-fluid baseline recording</title>
<desc id="desc">This is a staged debris-flushing example, not a complete chemical cleaning or passivation procedure. The closed secondary loop bypasses isolated cold plates, then circulates through three connected parallel plate pathways. After verified cleanliness and chemical removal, final fluid is sampled and a baseline is recorded.</desc>
<defs><clipPath id="vial-clip"><rect x="945" y="488" width="30" height="47" rx="4"/></clipPath></defs>
<rect width="1200" height="675" fill="#fff"/>
<g id="stage-0" data-text-box="true"><rect id="stage-bg-0" x="24" y="24" width="368" height="110" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
<text x="48" y="70" class="stage-title">ISOLATE + FLUSH</text><text x="48" y="108" class="stage-note">Capture construction debris</text></g>
<g id="stage-1" data-text-box="true"><rect id="stage-bg-1" x="416" y="24" width="368" height="110" rx="8" fill="#fafbfc" stroke="#c4c9d0" stroke-width="2"/>
<text x="440" y="70" class="stage-title">CONNECT + REPEAT</text><text x="440" y="108" class="stage-note">Include cold-plate pathways</text></g>
<g id="stage-2" data-text-box="true"><rect id="stage-bg-2" x="808" y="24" width="368" height="110" rx="8" fill="#fafbfc" stroke="#c4c9d0" stroke-width="2"/>
<text x="832" y="70" class="stage-title">FINAL FILL + SAMPLE</text><text x="832" y="108" class="stage-note">Record + retain the baseline</text></g>
<text id="state-label" x="600" y="192" text-anchor="middle" class="h">Cold plates isolated - bypass open</text>
<path d="M158 350 H550 V255 H960 M550 350 V440 M960 440 H110 V398" class="pipe"/>
<g id="plate-pipes" class="pipe">
<path d="M740 255 V308 H720 V336 H760 V362 H720 V390 H740 V440"/>
<path d="M850 255 V308 H830 V336 H870 V362 H830 V390 H850 V440"/>
<path d="M960 255 V308 H940 V336 H980 V362 H940 V390 H960 V440"/>
</g>
<path id="bypass-active" d="M158 350 H550 V440 H110 V398" class="active" stroke="#343895"/>
<path id="plate-feed" d="M158 350 H550 V255 H960" class="active" stroke="#00a0b5" opacity="0"/>
<path id="plate-return" d="M960 440 H110 V398" class="active" stroke="#00a0b5" opacity="0"/>
<g id="plates" opacity="0.32">
<text x="850" y="237" text-anchor="middle" class="h">Cold plates - parallel paths</text>
<g fill="#fff" stroke="#343895" stroke-width="2"><rect x="700" y="290" width="80" height="117" rx="6"/><rect x="810" y="290" width="80" height="117" rx="6"/><rect x="920" y="290" width="80" height="117" rx="6"/></g>
<g id="plate-active" class="active" stroke="#00a0b5">
<path d="M740 255 V308 H720 V336 H760 V362 H720 V390 H740 V440"/>
<path d="M850 255 V308 H830 V336 H870 V362 H830 V390 H850 V440"/>
<path d="M960 255 V308 H940 V336 H980 V362 H940 V390 H960 V440"/>
</g>
</g>
<g id="flow-particles"/>
<circle cx="110" cy="350" r="48" fill="#f1f2fb" stroke="#343895" stroke-width="3"/>
<g id="pump-rotor" fill="#343895"><path d="M110 321 L120 340 L139 350 L120 360 L110 379 L100 360 L81 350 L100 340Z"/></g>
<text x="110" y="272" text-anchor="middle" class="h">CDU / pump</text>
<text x="110" y="515" text-anchor="middle" class="s">Return</text>
<g id="filter">
<rect x="292" y="313" width="116" height="74" fill="#fff" stroke="#5f6062" stroke-width="2"/>
<ellipse cx="292" cy="350" rx="14" ry="37" fill="#fff" stroke="#5f6062" stroke-width="2"/>
<ellipse cx="408" cy="350" rx="14" ry="37" fill="#f5faee" stroke="#5f6062" stroke-width="2"/>
<g fill="#a5adb6"><circle cx="315" cy="332" r="3"/><circle cx="338" cy="332" r="3"/><circle cx="361" cy="332" r="3"/><circle cx="384" cy="332" r="3"/><circle cx="315" cy="368" r="3"/><circle cx="338" cy="368" r="3"/><circle cx="361" cy="368" r="3"/><circle cx="384" cy="368" r="3"/></g>
<g id="captured-debris"/>
</g>
<g id="moving-debris"/>
<text x="350" y="272" text-anchor="middle" class="h">Inline filter</text>
<text id="filter-label" x="350" y="423" text-anchor="middle" class="s">Debris capture</text>
<circle cx="550" cy="350" r="18" fill="#fff" stroke="#5f6062" stroke-width="2"/>
<path id="valve" d="M540 340 L560 360" stroke="#343895" stroke-width="5" stroke-linecap="round"/>
<g id="isolation" transform="translate(620 255)"><circle r="19" fill="#fff" stroke="#343895" stroke-width="3"/><path d="M610 245 L630 265 M630 245 L610 265" transform="translate(-620 -255)" stroke="#343895" stroke-width="3" stroke-linecap="round"/></g>
<text id="path-label" x="550" y="483" text-anchor="middle" class="s">Bypass active</text>
<g id="sample" opacity="0">
<path d="M960 440 V480" stroke="#74a82d" stroke-width="4"/>
<rect x="939" y="480" width="42" height="60" rx="6" fill="#fff" stroke="#5f6062" stroke-width="2"/>
<rect id="sample-fill" x="945" y="535" width="30" height="0" fill="#8dc63f" clip-path="url(#vial-clip)"/>
<text x="960" y="573" text-anchor="middle" class="s">Sample</text>
</g>
<g id="record" opacity="0" data-text-box="true">
<rect x="1016" y="474" width="160" height="98" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/>
<text x="1096" y="513" text-anchor="middle" class="b" style="font-weight:700;fill:#292b30">BASELINE</text>
<text x="1096" y="548" text-anchor="middle" class="s">record + retain</text>
</g>
<path d="M24 602 H1176" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="600" y="639" text-anchor="middle" class="s">Debris flushing only. Chemical cleaning, passivation, and cleaner removal require separate verification.</text>
<path id="route-bypass" d="M158 350 H550 V440 H110 V398" fill="none" stroke="none"/>
<path id="route-0" d="M158 350 H550 V255 H740 V308 H720 V336 H760 V362 H720 V390 H740 V440 H110 V398" fill="none" stroke="none"/>
<path id="route-1" d="M158 350 H550 V255 H850 V308 H830 V336 H870 V362 H830 V390 H850 V440 H110 V398" fill="none" stroke="none"/>
<path id="route-2" d="M158 350 H550 V255 H960 V308 H940 V336 H980 V362 H940 V390 H960 V440 H110 V398" fill="none" stroke="none"/>
</svg>
<script>
const DURATION=18;
const colors=['#343895','#00a0b5','#74a82d'];
const pale=['#eef0fb','#eef8fa','#f5faee'];
const ns='http://www.w3.org/2000/svg';
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const make=(id,n,r,color)=>Array.from({length:n},()=>{const c=document.createElementNS(ns,'circle');c.setAttribute('r',r);c.setAttribute('fill',color);document.getElementById(id).append(c);return c});
const flow=make('flow-particles',18,4,'#343895');
flow.forEach(p=>{p.setAttribute('stroke','#ffffff');p.setAttribute('stroke-width','1.5')});
const debris=make('moving-debris',12,4,'#5f6062');
const captured=make('captured-debris',12,3.5,'#5f6062');
const routes=['route-bypass','route-0','route-1','route-2'].map(id=>document.getElementById(id));
window.renderAt=function(rawTime){
  // Clamp the master timeline so an encoded final frame never restarts the first stage.
  const t=Math.max(0,Math.min(DURATION,rawTime));
  const stage=t<6?0:t<12?1:2;
  for(let i=0;i<3;i++){
    const done=i<stage,active=i===stage;
    document.getElementById('stage-bg-'+i).setAttribute('fill',active?pale[i]:done?'#f5faee':'#fafbfc');
    document.getElementById('stage-bg-'+i).setAttribute('stroke',active?colors[i]:done?'#8dc63f':'#c4c9d0');
    document.getElementById('stage-bg-'+i).setAttribute('stroke-width',active?3:2);
  }
  document.getElementById('state-label').textContent=['Cold plates isolated - bypass open','Connected plate paths - repeat flushing as needed','Verified cleanliness - final fluid, sample, and baseline'][stage];
  document.getElementById('bypass-active').setAttribute('opacity',stage===0?1:0);
  for(const id of ['plate-feed','plate-return','plate-active']){
    document.getElementById(id).setAttribute('opacity',stage===0?0:1);
    document.getElementById(id).setAttribute('stroke',colors[stage]);
  }
  document.getElementById('plates').setAttribute('opacity',stage===0?0.32:1);
  document.getElementById('isolation').setAttribute('opacity',stage===0?1:0);
  document.getElementById('valve').setAttribute('transform',stage===0?'':'rotate(90 550 350)');
  document.getElementById('valve').setAttribute('stroke',colors[stage]);
  document.getElementById('path-label').textContent=stage===0?'Bypass active':'Bypass closed';
  document.getElementById('pump-rotor').setAttribute('transform','rotate('+t*65+' 110 350)');
  flow.forEach((p,i)=>{
    const route=stage===0?routes[0]:routes[1+i%3];
    const travel=((t*0.13-i/flow.length)%1+1)%1;
    const pt=route.getPointAtLength(travel*route.getTotalLength());
    p.setAttribute('cx',pt.x);p.setAttribute('cy',pt.y);p.setAttribute('fill',colors[stage]);
  });
  // Debris travels to the filter once; captured material does not repeatedly disappear.
  debris.forEach((p,i)=>{
    const start=i<8?0.4+i*0.5:6.4+(i-8)*0.65;
    const progress=clamp((t-start)/1.0);
    p.setAttribute('cx',175+progress*112);p.setAttribute('cy',350+(i%3-1)*8);
    p.setAttribute('opacity',t>=start&&progress<1&&stage!==2?1:0);
    captured[i].setAttribute('cx',316+(i%4)*22);captured[i].setAttribute('cy',343+Math.floor(i/4)*9);
    captured[i].setAttribute('opacity',progress===1&&stage!==2?1:0);
  });
  document.getElementById('filter-label').textContent=stage===2?'Replace filters as needed':'Debris capture';
  const fill=stage===2?smooth((t-12.7)/2.5):0;
  document.getElementById('sample').setAttribute('opacity',stage===2?1:0);
  document.getElementById('sample-fill').setAttribute('y',535-43*fill);
  document.getElementById('sample-fill').setAttribute('height',43*fill);
  document.getElementById('record').setAttribute('opacity',stage===2?smooth((t-15.2)/1.2):0);
};
window.renderAt(0);
</script>
</body>
</html>
