<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="400" viewBox="0 0 800 400"
     role="img" aria-labelledby="title desc">
  <title id="title">OCP Academy Cooling Fluids in Direct Liquid Cooling course poster</title>
  <desc id="desc">A branded indigo and OCP green course poster with a coolant droplet mark and single-phase direct liquid cooling course title.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19194d"/>
      <stop offset="1" stop-color="#343895"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dc58"/>
      <stop offset="1" stop-color="#78ad2d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111438" flood-opacity=".32"/>
    </filter>
    <clipPath id="canvas">
      <rect width="800" height="400"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="800" height="400" fill="url(#background)"/>
    <path d="M602 -34L864 -34V434H684Z" fill="url(#sweep)"/>
    <path d="M571 -34H610L692 434H657Z" fill="#4a50aa" opacity=".72"/>

    <g fill="none" stroke="#dce5ff" stroke-width="2" opacity=".24">
      <path d="M520 96C559 67 611 57 660 72"/>
      <path d="M518 304C558 337 615 346 665 328"/>
      <path d="M748 96H776M748 304H776"/>
      <path d="M535 116C514 162 514 239 536 286"/>
      <path d="M729 116C751 163 751 239 728 286"/>
    </g>
    <g fill="#dce5ff" opacity=".30">
      <circle cx="520" cy="96" r="5"/>
      <circle cx="518" cy="304" r="5"/>
      <circle cx="776" cy="96" r="5"/>
      <circle cx="776" cy="304" r="5"/>
      <circle cx="535" cy="116" r="4"/>
      <circle cx="536" cy="286" r="4"/>
      <circle cx="729" cy="116" r="4"/>
      <circle cx="728" cy="286" r="4"/>
    </g>

    <image x="38" y="22" width="148" height="72"
           xlink:href="../../skills/academy-wizard/assets/ocp_academy_white.svg"
           href="../../skills/academy-wizard/assets/ocp_academy_white.svg"
           preserveAspectRatio="xMinYMid meet"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="43" y="111" width="138" height="30" rx="15" fill="#8dc63f"/>
      <text x="112" y="132" text-anchor="middle" font-size="13" font-weight="800"
            letter-spacing="1.5" fill="#171b42">OCP DLC FLUIDS</text>

      <text x="42" y="201" font-size="44" font-weight="900" letter-spacing="1.8" fill="#fff">COOLING FLUIDS</text>
      <text x="43" y="239" font-size="24" font-weight="800" letter-spacing=".8" fill="#fff">IN DIRECT LIQUID COOLING</text>
      <rect x="44" y="265" width="62" height="4" rx="2" fill="#8dc63f"/>
      <text x="43" y="307" font-size="18" font-weight="700" fill="#f5f7ff">Select, commission, monitor</text>
      <text x="43" y="333" font-size="18" font-weight="700" fill="#f5f7ff">and maintain single-phase loops</text>
    </g>

    <g filter="url(#shadow)">
      <circle cx="653" cy="201" r="124" fill="#fff" stroke="#535ab3" stroke-width="4"/>
      <image x="565" y="113" width="176" height="176"
             xlink:href="cooling_fluids_mark.svg"
             href="cooling_fluids_mark.svg"
             preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g fill="#8dc63f" opacity=".95">
      <rect x="552" y="312" width="16" height="4" rx="2"/>
      <rect x="573" y="312" width="16" height="4" rx="2"/>
      <rect x="594" y="312" width="16" height="4" rx="2"/>
      <rect x="615" y="312" width="16" height="4" rx="2"/>
      <rect x="636" y="312" width="16" height="4" rx="2"/>
      <rect x="657" y="312" width="16" height="4" rx="2"/>
      <rect x="678" y="312" width="16" height="4" rx="2"/>
      <rect x="699" y="312" width="16" height="4" rx="2"/>
      <rect x="720" y="312" width="16" height="4" rx="2"/>
    </g>
  </g>
</svg>
