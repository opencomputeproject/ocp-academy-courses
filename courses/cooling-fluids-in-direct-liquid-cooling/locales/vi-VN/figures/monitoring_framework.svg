<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="tình trạng chất lỏng khung giám sát">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">Tách biệt tình trạng hệ thống khỏi tình trạng chất lỏng</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">Tín hiệu sức khỏe hệ thống</text>
  <text x="270" y="220" text-anchor="middle" class="body">Cu, Fe, Zn và các kim loại khác</text>
  <text x="270" y="260" text-anchor="middle" class="body">Ca, Mg, sunfat, silic</text>
  <text x="270" y="300" text-anchor="middle" class="body">độ đục và tải lọc</text>
  <text x="270" y="340" text-anchor="middle" class="body">trôi dạt hiệu suất nhiệt</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">Tín hiệu tình trạng chất lỏng</text>
  <text x="730" y="220" text-anchor="middle" class="body">nồng độ chất ức chế và azole</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH, độ dẫn điện và TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">sản phẩm phân hủy glycol</text>
  <text x="730" y="340" text-anchor="middle" class="body">Nồng độ PG khi áp dụng</text>
  <text x="500" y="470" text-anchor="middle" class="body">Những quyết định đúng đắn đến từ các xu hướng chống lại đường cơ sở rõ ràng, chứ không phải một số liệu riêng lẻ.</text>
</svg>
