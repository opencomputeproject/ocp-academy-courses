<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Một xu hướng có thể đảm bảo việc điều tra trước khi đạt đến giới hạn hành động</title><desc id="desc">Đây là tín hiệu minh họa, không phải dữ liệu được đo lường hoặc giới hạn phổ quát. So sánh đường cơ sở, độ căn chỉnh, mẫu đại diện, bằng chứng hệ thống và bằng chứng chất lỏng.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="540" fill="#fff"/>

<text x="54" y="42" class="s">Xu hướng minh họa - không phải dữ liệu đo</text>
<text x="48" y="182" text-anchor="middle" transform="rotate(-90 48 182)" class="s">Tín hiệu tương đối</text>
<path d="M90 68 V288 H614" fill="none" stroke="#9ca3af" stroke-width="2"/>
<path d="M90 101 H614" stroke="#343895" stroke-width="2" stroke-dasharray="8 6"/><text x="407" y="87" class="s">Ngưỡng hành động tại cơ sở</text>
<path d="M90 250 H614" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="4 5"/><text x="101" y="277" class="s">Mốc ban đầu</text>
<path d="M111 246 L183 252 L255 242 L327 234 L399 216 L471 182 L555 146" fill="none" stroke="#74a82d" stroke-width="4" stroke-linejoin="round"/>
<g fill="#fff" stroke="#74a82d" stroke-width="3"><circle cx="111" cy="246" r="5"/><circle cx="183" cy="252" r="5"/><circle cx="255" cy="242" r="5"/><circle cx="327" cy="234" r="5"/><circle cx="399" cy="216" r="5"/><circle cx="471" cy="182" r="5"/><circle cx="555" cy="146" r="5"/></g>
<text x="330" y="318" text-anchor="middle" class="b">Các mẫu theo thời gian</text>
<text x="54" y="359" class="h">Xác nhận thay đổi</text><text x="54" y="391" class="b">Hiệu chuẩn + mẫu đại diện + đối chiếu phòng thí nghiệm</text>
<path d="M660 28 V402" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="701" y="67" class="h" style="font-size: 23.4391px;">Bằng chứng từ hệ thống</text><text x="701" y="102" class="b">Kim loại + hạt rắn</text><text x="701" y="133" class="b" style="font-size: 17.4996px;">Tải bộ lọc + thay đổi hiệu suất nhiệt</text>
<text x="701" y="215" class="h" style="font-size: 23.001px;">Bằng chứng từ chất lỏng</text><text x="701" y="250" class="b">pH + nồng độ</text><text x="701" y="281" class="b">Hàm lượng chất ức chế + azol</text><text x="701" y="312" class="b">Sản phẩm phân hủy glycol</text>
<text x="701" y="361" class="s">Chỉ độ dẫn điện không đủ để</text><text x="701" y="387" class="s">đánh giá PG25 có chất ức chế.</text>
<rect x="28" y="436" width="440" height="78" rx="6" fill="#f1f2fb"/><text x="248" y="470" text-anchor="middle" class="b">Yêu cầu đối với sản phẩm mới</text><text x="248" y="498" text-anchor="middle" class="s">Nghiệm thu theo tiêu chuẩn cơ sở</text>
<rect x="532" y="436" width="440" height="78" rx="6" fill="#f5faee"/><text x="752" y="470" text-anchor="middle" class="b">Giới hạn vận hành / nhà cung cấp</text><text x="752" y="498" text-anchor="middle" class="s">Diễn giải khi vận hành</text>
</svg>
