<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Logic quyết định trộn chất lỏng">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title" style="font-size: 28.99px;">Trộn là một sự kiện hoạt động, không phải là quy tắc danh mục</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h" style="font-size: 17.33px;">Nó có thể tránh được không?</text>
  <text x="185" y="230" text-anchor="middle" class="body">xả cặn</text>
  <text x="185" y="259" text-anchor="middle" class="body">đầu trang</text>
  <text x="185" y="288" text-anchor="middle" class="body">lỗi vận hành</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">Đánh giá chất lỏng</text>
  <text x="520" y="191" text-anchor="middle" class="h">bằng chất lỏng</text>
  <text x="520" y="238" text-anchor="middle" class="body">ổn định lưu trữ</text>
  <text x="520" y="267" text-anchor="middle" class="body">kiểm tra ăn mòn</text>
  <text x="520" y="296" text-anchor="middle" class="body">hướng dẫn nhà cung cấp</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h">Đặt lại kế hoạch</text>
  <text x="835" y="191" text-anchor="middle" class="h">giám sát</text>
  <text x="835" y="238" text-anchor="middle" class="small">đường cơ sở thay đổi</text>
  <text x="835" y="267" text-anchor="middle" class="small" style="font-size: 11.85px;">sự thay đổi mục tiêu của chất ức chế</text>
  <text x="835" y="296" text-anchor="middle" class="small" style="font-size: 12.02px;">việc sửa chữa trở nên khó khăn hơn</text>

  <text x="500" y="440" text-anchor="middle" class="body">Đừng nói OAT cộng OAT luôn an toàn, hoặc IAT cộng OAT luôn không an toàn.</text>
</svg>
