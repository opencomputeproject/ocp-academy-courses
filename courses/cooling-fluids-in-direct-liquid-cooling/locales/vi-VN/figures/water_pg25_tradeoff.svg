<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">So sánh chất lượng nước và PG25</title><desc id="desc">Không có tỷ lệ hiệu suất số nào được ngụ ý. Công thức chính xác và nhiệt độ xác định các thuộc tính được đo lường. Cơ sở nồng độ khối lượng và thể tích không thể thay thế cho nhau.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:20px;font-weight:700;fill:#292b30}.b{font-size:16px;fill:#5f6062}.s{font-size:15px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="390" fill="#fff"/>

<rect x="235" y="20" width="335" height="270" rx="8" fill="#f5faee"/><rect x="610" y="20" width="365" height="270" rx="8" fill="#f1f2fb"/>
<text x="263" y="54" class="h">Nước đã được xử lý</text><text x="638" y="54" class="h">PG25</text>
<path d="M24 80 H975 M24 132 H975 M24 184 H975 M24 242 H975" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="24" y="109" class="b">nhiệt dung</text><text x="263" y="109" class="b">Cao hơn</text><text x="638" y="109" class="b">Thấp hơn nước</text>
<text x="24" y="161" class="b">độ nhớt</text><text x="263" y="161" class="b">thấp hơn</text><text x="638" y="161" class="b">Cao hơn; nhiệt độ quan trọng</text>
<text x="24" y="221" class="b">Kiểm soát hóa học</text><text x="263" y="209" class="b">Sự ăn mòn +</text><text x="263" y="231" class="b">kiểm soát vi sinh</text><text x="638" y="209" class="b">Độ đậm đặc của glycol +</text><text x="638" y="231" class="b">tổng hợp chất ức chế</text>
<text x="24" y="268" class="b">Cơ sở sản phẩm mới</text><text x="263" y="268" class="b">Chất làm mát nước V1.3</text><text x="638" y="268" class="b">25-28% PG theo trọng lượng</text>
<text x="500" y="317" text-anchor="middle" class="s">Chỉ chất lượng. Thiết kế với dữ liệu thuộc tính của nhà cung cấp ở nhiệt độ hoạt động.</text>
<rect x="70" y="334" width="860" height="44" rx="6" fill="#fafbfc" stroke="#c4c9d0" stroke-width="1.5"/>
<text x="500" y="362" text-anchor="middle" class="b">Ghi lại cơ sở nồng độ: trọng lượng % không phải là thể tích %.</text>
</svg>
