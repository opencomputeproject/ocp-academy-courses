<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Bộ lọc mạch chính và bộ lọc dòng phụ phục vụ các đường dẫn riêng biệt</title><desc id="desc">Bộ lọc căng lỗ thẳng đứng nhìn thấy dòng chảy của mạch chính. Một nhánh dòng chảy phần trăm đi qua bộ lọc dòng phụ và nối lại với dòng trở về. Chọn cùng lúc dung tích, hiệu suất, dòng chảy và chất liệu tương thích với chất bổ sung.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="560" fill="#fff"/>

<text x="345" y="66" text-anchor="middle" class="h">Bộ lọc kéo thẳng</text><text x="345" y="96" text-anchor="middle" class="s">Tất cả dòng chảy của mạch chính</text>
<text x="667" y="141" text-anchor="middle" class="b">Đường dẫn làm mát chính</text>
<path d="M166 190 H281" class="flow" style="stroke-width:6"/>
<path d="M425 190 H774" class="flow" style="stroke-width:6"/><path d="M877 264 V282 H984 V496 H120 V252" class="flow" style="stroke-width:6"/>
<polygon points="790,190 774,182 774,198" class="arrowhead"/>
<circle cx="120" cy="190" r="46" fill="#f1f2fb" stroke="#343895" stroke-width="3"/><path d="M105 162 L145 190 L105 218 Z" fill="#343895"/><text x="120" y="123" text-anchor="middle" class="h">máy bơm</text>
<path d="M120 282 V252" class="flow" style="stroke-width:6"/><polygon points="120,236 112,252 128,252" class="arrowhead"/>
<rect x="294" y="163" width="118" height="54" fill="#eef6e2" stroke="#74a82d" stroke-width="2"/><ellipse cx="294" cy="190" rx="13" ry="27" fill="#fff" stroke="#74a82d" stroke-width="2"/><ellipse cx="412" cy="190" rx="13" ry="27" fill="#e1efcb" stroke="#74a82d" stroke-width="2"/>
<g fill="#5f6062"><circle cx="319" cy="177" r="3"/><circle cx="342" cy="177" r="3"/><circle cx="365" cy="177" r="3"/><circle cx="388" cy="177" r="3"/><circle cx="328" cy="190" r="3"/><circle cx="351" cy="190" r="3"/><circle cx="374" cy="190" r="3"/><circle cx="319" cy="203" r="3"/><circle cx="342" cy="203" r="3"/><circle cx="365" cy="203" r="3"/><circle cx="388" cy="203" r="3"/></g>
<rect x="790" y="131" width="174" height="133" rx="8" class="box"/><text x="877" y="173" text-anchor="middle" class="h">tấm lạnh</text><path d="M815 196 H939 M815 213 H939" stroke="#8dc63f" stroke-width="4"/><text x="877" y="245" text-anchor="middle" class="s" style="font-size: 13.5635px;">Các đoạn văn nhạy cảm</text>
<circle cx="560" cy="190" r="6" fill="#343895"/>
<path d="M560 190 V291 H654 V317" fill="none" stroke="#343895" stroke-width="4" stroke-linejoin="round"/><polygon points="654,333 646,317 662,317" class="arrowhead" style="fill:#343895"/>
<rect x="580" y="333" width="148" height="96" rx="6" fill="#f1f2fb" stroke="#343895" stroke-width="2"/><path d="M606 359 V405 M622 359 V405 M638 359 V405 M654 359 V405 M670 359 V405 M686 359 V405 M702 359 V405" stroke="#9b9fcf" stroke-width="3"/>
<path d="M654 429 V480" fill="none" stroke="#343895" stroke-width="4"/><polygon points="654,496 646,480 662,480" class="arrowhead" style="fill:#343895"/>
<text x="748" y="335" class="h">Dòng phụ</text><text x="748" y="367" class="b" style="font-size: 15.2322px;">Phân nhánh dòng chảy phần trăm</text><text x="748" y="404" class="s" style="font-size: 13px;">Phương tiện được nhà cung cấp xác minh</text><text x="748" y="431" class="s" style="font-size: 13px;">Bảo vệ các chất phụ gia chất chống tạo bọt</text>
<text x="220" y="327" class="h">Chọn cùng nhau</text><text x="220" y="361" class="b">Xếp hạng + hiệu quả thu thập</text><text x="220" y="393" class="b">Chất làm mát + tương thích với môi trường</text><text x="220" y="425" class="b">Dòng chảy + khả năng phục vụ</text>
<text x="500" y="535" text-anchor="middle" class="s">Chỉ sơ đồ. Ví dụ về lọc đầy không phải là yêu cầu dòng phụ phổ quát.</text>
</svg>
