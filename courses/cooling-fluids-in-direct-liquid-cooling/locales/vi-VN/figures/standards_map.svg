<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Tiêu chuẩn và bản đồ nguồn cho hướng dẫn chất lỏng DLC">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.node{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.core{stroke:#8DC63F;stroke-width:6}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="45" text-anchor="middle" class="title">Một pha dẫn hướng chất lỏng được lắp ráp từ nhiều lớp</text>
  <rect x="390" y="185" width="220" height="115" class="node core"/>
  <text x="500" y="234" text-anchor="middle" class="h">Chất lỏng TCS</text>
  <text x="500" y="264" text-anchor="middle" class="body">lựa chọn và vận hành</text>
  <rect x="70" y="95" width="230" height="105" class="node"/><text x="185" y="140" text-anchor="middle" class="h">OCP</text><text x="185" y="170" text-anchor="middle" class="body">hướng dẫn mở</text>
  <rect x="70" y="305" width="230" height="105" class="node"/><text x="185" y="350" text-anchor="middle" class="h">ASHRAE TC 9.9</text><text x="185" y="380" text-anchor="middle" class="body">bối cảnh dữ liệu</text>
  <rect x="700" y="95" width="230" height="105" class="node"/><text x="815" y="140" text-anchor="middle" class="h">ASTM</text><text x="815" y="170" text-anchor="middle" class="body" style="font-size: 16.29px;">phương pháp thử nghiệm</text>
  <rect x="700" y="305" width="230" height="105" class="node"/><text x="815" y="350" text-anchor="middle" class="h" style="font-size: 17.89px;">Kế hoạch nhà cung cấp</text><text x="815" y="380" text-anchor="middle" class="body">Chi tiết xử lý cục bộ</text>
  <path d="M300 150 L390 220" class="line"/><path d="M300 360 L390 270" class="line"/><path d="M700 150 L610 220" class="line"/><path d="M700 360 L610 270" class="line"/>
</svg>
