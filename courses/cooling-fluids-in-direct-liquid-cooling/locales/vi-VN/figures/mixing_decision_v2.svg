<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Ngăn ngừa sự trộn lẫn không mong muốn, xác minh chính xác các chất lỏng và theo dõi các thay đổi</title><desc id="desc">Sử dụng các giao thức xả và đổ đầy được nhà cung cấp phê duyệt cho thiết bị đến. Các công thức chính xác yêu cầu bằng chứng. Sau khi thay đổi, lấy mẫu và ghi lại sự tuân thủ đường cơ sở; PG25 không thể thay thế lẫn nhau.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">Thiết bị đến / nạp đầy / sự kiện dịch vụ</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">Ngăn ngừa trộn lẫn</text><text x="166" y="178" text-anchor="middle" class="b">Xác định chất lỏng còn sót lại</text><text x="166" y="217" text-anchor="middle" class="b" style="font-size: 14.996px;">Đổ đầy được nhà cung cấp phê duyệt</text><text x="166" y="256" text-anchor="middle" class="b" style="font-size: 18.5662px;">Đổ đầy với chất lỏng vận hành</text><text x="166" y="295" text-anchor="middle" class="s">Trước khi kết nối</text>
<text x="500" y="128" text-anchor="middle" class="h" style="font-size: 15.2625px;">Xác minh chính xác các chất lỏng</text><text x="500" y="178" text-anchor="middle" class="b" style="font-size: 17.3387px;">Bằng chứng cụ thể về công thức</text><text x="500" y="217" text-anchor="middle" class="b">Vật liệu + điều kiện</text><text x="500" y="256" text-anchor="middle" class="b" style="font-size: 14.1085px;">Kế hoạch được nhà cung cấp phê duyệt</text><text x="500" y="295" text-anchor="middle" class="s" style="font-size: 15.8573px;">Không có giả định ở cấp độ gia đình</text>
<text x="834" y="128" text-anchor="middle" class="h">Theo dõi sự thay đổi</text><text x="834" y="178" text-anchor="middle" class="b">Việc lấy mẫu theo sự kiện</text><text x="834" y="217" text-anchor="middle" class="b" style="font-size: 16.905px;">Xem xét các mốc giới hạn ức chế</text><text x="834" y="256" text-anchor="middle" class="b">Ghi lại mọi thay đổi</text><text x="834" y="295" text-anchor="middle" class="s" style="font-size: 14.6852px;">Cho đến khi sự ổn định được xác nhận</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 tuân thủ không làm cho các chất lỏng của các nhà cung cấp khác nhau có thể thay thế cho nhau.</text>
</svg>
