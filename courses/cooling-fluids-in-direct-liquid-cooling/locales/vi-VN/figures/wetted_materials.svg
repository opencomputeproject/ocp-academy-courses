<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">Sự tương thích bao gồm mọi bề mặt ẩm ướt</title><desc id="desc">Công thức và điều kiện chính xác phải được xác minh với kim loại, tấm lạnh, cao su đàn hồi, máy bơm, chất lọc, gioăng, phụ kiện và van.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="530" fill="#fff"/>

<path d="M280 155 L370 246 M720 155 L630 246 M500 149 V196 M280 353 L370 303 M720 353 L630 303" fill="none" stroke="#8dc63f" stroke-width="3"/>
<rect x="24" y="64" width="256" height="132" rx="8" class="box"/><text x="152" y="105" text-anchor="middle" class="h">Kim loại + bề mặt</text><text x="152" y="139" text-anchor="middle" class="b">Mác, mạ, hàn vảy cứng,</text><text x="152" y="166" text-anchor="middle" class="b">màng kín gioăng</text>
<rect x="362" y="22" width="276" height="127" rx="8" class="box"/><text x="500" y="63" text-anchor="middle" class="h">tấm lạnh</text><text x="500" y="93" text-anchor="middle" class="h">Máy trao đổi nhiệt</text><text x="500" y="126" text-anchor="middle" class="b" style="font-size: 17.7188px;">Các kênh + tài liệu đã tham gia</text>
<rect x="720" y="64" width="256" height="132" rx="8" class="box"/><text x="848" y="105" text-anchor="middle" class="h">Chất đàn hồi</text><text x="848" y="139" text-anchor="middle" class="b" style="font-size: 17.9286px;">Ống dẫn nước, van, đệm lót</text><text x="848" y="166" text-anchor="middle" class="b" style="font-size: 14.8143px;">Những vấn đề phức tạp chính xác</text>
<rect x="370" y="196" width="260" height="156" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="3"/><text x="500" y="242" text-anchor="middle" class="h">TCS chất lỏng</text><text x="500" y="282" text-anchor="middle" class="b">Công thức chính xác</text><text x="500" y="314" text-anchor="middle" class="b">+ điều kiện vận hành</text>
<rect x="24" y="304" width="256" height="132" rx="8" class="box"/><text x="152" y="345" text-anchor="middle" class="h">Máy bơm + bộ lọc</text><text x="152" y="379" text-anchor="middle" class="b" style="font-size: 18.4098px;">Chất liệu đệm, ốc vít, ổ trục</text><text x="152" y="406" text-anchor="middle" class="b" style="font-size: 15.2662px;">Kiểm tra khả năng giữ lại phụ gia</text>
<rect x="720" y="304" width="256" height="132" rx="8" class="box"/><text x="848" y="345" text-anchor="middle" class="h">QDs + van</text><text x="848" y="379" text-anchor="middle" class="b" style="font-size: 13.1709px;">Các bộ phận lắp ráp, van kín, bể chứa</text><text x="848" y="406" text-anchor="middle" class="b" style="font-size: 14.0048px;">Bao gồm tất cả các bộ phận ẩm ướt</text>
<path d="M70 465 H930" stroke="#d6dbe0" stroke-width="1.5"/><text x="500" y="501" text-anchor="middle" class="b">Xác minh công thức, cấp độ vật liệu, nhiệt độ và thời gian tiếp xúc cùng nhau.</text>
</svg>
