<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-label="vật liệu tiếp xúc với chất lỏng bản đồ tương thích">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 22px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.node{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.core{stroke:#8DC63F;stroke-width:6}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="44" text-anchor="middle" class="title">Khả năng tương thích theo mọi bề mặt mà chất lỏng chạm vào</text>
  <rect x="400" y="210" width="200" height="100" class="node core"/><text x="500" y="246" text-anchor="middle" class="h">Chất lỏng TCS</text><text x="500" y="274" text-anchor="middle" class="body">và điều kiện</text><text x="500" y="298" text-anchor="middle" class="body">vận hành</text>
  <rect x="70" y="95" width="230" height="92" class="node"/><text x="185" y="133" text-anchor="middle" class="h">Kim loại</text><text x="185" y="160" text-anchor="middle" class="body">đồng, thép, đồng thau</text>
  <rect x="70" y="335" width="230" height="92" class="node"/><text x="185" y="373" text-anchor="middle" class="h">Chất đàn hồi</text><text x="185" y="400" text-anchor="middle" class="body">con dấu và ống</text>
  <rect x="385" y="55" width="230" height="92" class="node"/><text x="500" y="93" text-anchor="middle" class="h">Đầu nối</text><text x="500" y="120" text-anchor="middle" class="body">QDs, van, phụ kiện</text>
  <rect x="700" y="95" width="230" height="92" class="node"/><text x="815" y="133" text-anchor="middle" class="h">Tấm lạnh</text><text x="815" y="160" text-anchor="middle" class="body">vi kênh, hàn</text>
  <rect x="700" y="335" width="230" height="92" class="node"/><text x="815" y="373" text-anchor="middle" class="h">Máy bơm và bộ lọc</text><text x="815" y="400" text-anchor="middle" class="body" style="font-size: 9.64px;">vật liệu lọc, phớt, ổ trục</text>
  <path d="M300 150 L400 230" class="line"/><path d="M300 380 L400 285" class="line"/><path d="M500 147 V210" class="line"/><path d="M700 150 L600 230" class="line"/><path d="M700 380 L600 285" class="line"/>
</svg>
