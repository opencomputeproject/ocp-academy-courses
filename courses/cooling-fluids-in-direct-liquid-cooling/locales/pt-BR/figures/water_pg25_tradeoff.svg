<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Comparação qualitativa de água e PG25</title><desc id="desc">Nenhum índice de desempenho numérico está implícito. A formulação exata e a temperatura determinam as propriedades medidas. As bases de concentração de peso e volume não são intercambiáveis.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:20px;font-weight:700;fill:#292b30}.b{font-size:16px;fill:#5f6062}.s{font-size:15px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="390" fill="#fff"/>

<rect x="235" y="20" width="335" height="270" rx="8" fill="#f5faee"/><rect x="610" y="20" width="365" height="270" rx="8" fill="#f1f2fb"/>
<text x="263" y="54" class="h">Água tratada</text><text x="638" y="54" class="h">PG25</text>
<path d="M24 80 H975 M24 132 H975 M24 184 H975 M24 242 H975" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="24" y="109" class="b">Capacidade de calor</text><text x="263" y="109" class="b">Mais alto</text><text x="638" y="109" class="b">Menos que a água</text>
<text x="24" y="161" class="b">viscosidade</text><text x="263" y="161" class="b">inferior</text><text x="638" y="161" class="b">Mais alta; a temperatura importa</text>
<text x="24" y="221" class="b">Controle de química</text><text x="263" y="209" class="b">Corrosão +</text><text x="263" y="231" class="b">controle microbiano</text><text x="638" y="209" class="b">Concentração de glicol +</text><text x="638" y="231" class="b">Equilíbrio de inibidores</text>
<text x="24" y="268" class="b">Base de novo produto</text><text x="263" y="268" class="b">Resfriador de água V1.3</text><text x="638" y="268" class="b">25-28% PG por peso</text>
<text x="500" y="317" text-anchor="middle" class="s">Apenas qualitativo. Projete com dados de propriedades do fornecedor na temperatura de operação.</text>
<rect x="70" y="334" width="860" height="44" rx="6" fill="#fafbfc" stroke="#c4c9d0" stroke-width="1.5"/>
<text x="500" y="362" text-anchor="middle" class="b">Registre a base de concentração: peso % não é volume %.</text>
</svg>
