<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Lógica de decisão de mistura de fluidos">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title" style="font-size: 28.24px;">A mixagem é um evento operacional, não uma regra de categoria</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h">Isso pode ser evitado?</text>
  <text x="185" y="230" text-anchor="middle" class="body">resíduo de descarga</text>
  <text x="185" y="259" text-anchor="middle" class="body">recarga</text>
  <text x="185" y="288" text-anchor="middle" class="body">erro do operador</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">Avaliar fluido</text>
  <text x="520" y="191" text-anchor="middle" class="h">por fluido</text>
  <text x="520" y="238" text-anchor="middle" class="body">estabilidade de armazenamento</text>
  <text x="520" y="267" text-anchor="middle" class="body">testes de corrosão</text>
  <text x="520" y="296" text-anchor="middle" class="body">orientação do fornecedor</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h" style="font-size: 17.62px;">Redefinir o plano</text>
  <text x="835" y="191" text-anchor="middle" class="h">de monitoramento</text>
  <text x="835" y="238" text-anchor="middle" class="small">linha de base alterações</text>
  <text x="835" y="267" text-anchor="middle" class="small">mudança de alvos inibidores</text>
  <text x="835" y="296" text-anchor="middle" class="small" style="font-size: 13.66px;">as correções ficam mais difíceis</text>

  <text x="500" y="440" text-anchor="middle" class="body">Não diga que OAT mais OAT é sempre seguro ou que IAT mais OAT é sempre inseguro.</text>
</svg>
