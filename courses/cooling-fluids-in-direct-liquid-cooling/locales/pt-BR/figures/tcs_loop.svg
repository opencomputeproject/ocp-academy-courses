<text x="528" y="226" text-anchor="middle" class="s">suprimento</text><text x="773" y="226" text-anchor="middle" class="s">suprimento</text>
<text x="528" y="357" text-anchor="middle" class="s">retorno</text><text x="773" y="357" text-anchor="middle" class="s">retorno</text>
<text x="500" y="498" text-anchor="middle" class="b">O calor cruza o intercambiador. Os dois fluidos não se misturam.</text>
