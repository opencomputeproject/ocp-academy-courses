<text x="330" y="318" text-anchor="middle" class="b">Amostras ao longo do tempo</text>
<text x="54" y="359" class="h">Confirmar a mudança</text><text x="54" y="391" class="b">Calibração + amostra representativa + comparação de laboratório</text>
