<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="condição do fluido estrutura de monitoramento">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">Separe a integridade do sistema da condição do fluido</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">Sinais de saúde do sistema</text>
  <text x="270" y="220" text-anchor="middle" class="body">Cu, Fe, Zn e outros metais</text>
  <text x="270" y="260" text-anchor="middle" class="body">Ca, Mg, sulfato, silício</text>
  <text x="270" y="300" text-anchor="middle" class="body">turbidez e carga do filtro</text>
  <text x="270" y="340" text-anchor="middle" class="body">desvio de desempenho térmico</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">Sinais da condição do fluido</text>
  <text x="730" y="220" text-anchor="middle" class="body">níveis de inibidor e azóis</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH, condutividade e TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">produtos de degradação do glicol</text>
  <text x="730" y="340" text-anchor="middle" class="body">Concentração de PG quando aplicável</text>
  <text x="500" y="470" text-anchor="middle" class="body">Boas decisões vêm de tendências contra um linha de base limpo, e não de uma leitura isolada.</text>
</svg>
