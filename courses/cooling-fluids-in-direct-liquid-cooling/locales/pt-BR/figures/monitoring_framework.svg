<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Uma tendência pode justificar uma investigação antes que um limite de ação seja atingido</title><desc id="desc">Este é um sinal ilustrativo, não dados medidos ou um limite universal. Compare o linha de base, calibração, amostras representativas, evidências do sistema e evidências fluidas.</desc>
