<title id="title">Requisitos e orientações informam um plano de sistema aprovado pelo fornecedor</title><desc id="desc">As especificações básicas definem os requisitos do novo fluido; as diretrizes de operação PG25 apoiam as decisões do ciclo de vida. Os métodos de teste e o contexto do sistema apoiam o plano exato do fornecedor.</desc>
