<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Padrões e mapa de origem para orientação de fluidos DLC">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.node{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.core{stroke:#8DC63F;stroke-width:6}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="45" text-anchor="middle" class="title" style="font-size: 27.23px;">Monofásico a orientação de fluido é montada a partir de várias camadas</text>
  <rect x="390" y="185" width="220" height="115" class="node core"/>
  <text x="500" y="234" text-anchor="middle" class="h">Fluido TCS</text>
  <text x="500" y="264" text-anchor="middle" class="body">seleção e operação</text>
  <rect x="70" y="95" width="230" height="105" class="node"/><text x="185" y="140" text-anchor="middle" class="h">OCP</text><text x="185" y="170" text-anchor="middle" class="body">orientação aberta</text>
  <rect x="70" y="305" width="230" height="105" class="node"/><text x="185" y="350" text-anchor="middle" class="h">ASHRAE TC 9.9</text><text x="185" y="380" text-anchor="middle" class="body" style="font-size: 11.85px;">contexto de comunicação de dados</text>
  <rect x="700" y="95" width="230" height="105" class="node"/><text x="815" y="140" text-anchor="middle" class="h">ASTM</text><text x="815" y="170" text-anchor="middle" class="body">métodos de teste</text>
  <rect x="700" y="305" width="230" height="105" class="node"/><text x="815" y="350" text-anchor="middle" class="h" style="font-size: 20.16px;">Plano de Fornecedor</text><text x="815" y="380" text-anchor="middle" class="body" style="font-size: 15.44px;">detalhe do tratamento local</text>
  <path d="M300 150 L390 220" class="line"/><path d="M300 360 L390 270" class="line"/><path d="M700 150 L610 220" class="line"/><path d="M700 360 L610 270" class="line"/>
