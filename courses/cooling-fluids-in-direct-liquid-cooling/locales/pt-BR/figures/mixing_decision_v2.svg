<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Previne a mistura indesejada, verifique os fluidos exatos e monitore as mudanças</title><desc id="desc">Use protocolos de esvaziamento e enchimento aprovados pelo fornecedor para equipamentos entrantes. Formulações exatas exigem evidências. Após as alterações, amostre e documente a conformidade linha de base; PG25 não é intercambiabilidade.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">Equipamento entrante / recarga / evento de serviço</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">Prevenir a mistura</text><text x="166" y="178" text-anchor="middle" class="b">Identificar o fluido residual</text><text x="166" y="217" text-anchor="middle" class="b" style="font-size: 16.3874px;">Despejo aprovado pelo fornecedor</text><text x="166" y="256" text-anchor="middle" class="b" style="font-size: 18.6295px;">Encha com fluido de operação</text><text x="166" y="295" text-anchor="middle" class="s">Antes da conexão</text>
<text x="500" y="128" text-anchor="middle" class="h" style="font-size: 19.2795px;">Verifique os fluidos exatos</text><text x="500" y="178" text-anchor="middle" class="b" style="font-size: 15.998px;">Evidência específica da formulação</text><text x="500" y="217" text-anchor="middle" class="b">Materiais + condições</text><text x="500" y="256" text-anchor="middle" class="b" style="font-size: 17.6657px;">Plano aprovado pelo fornecedor</text><text x="500" y="295" text-anchor="middle" class="s">Sem suposições de nível familiar</text>
<text x="834" y="128" text-anchor="middle" class="h">Monitorar a mudança</text><text x="834" y="178" text-anchor="middle" class="b" style="font-size: 16.5218px;">Amostragem baseada em eventos</text><text x="834" y="217" text-anchor="middle" class="b" style="font-size: 17.1484px;">Revisar as linhas de base de inib</text><text x="834" y="256" text-anchor="middle" class="b" style="font-size: 17.8949px;">Documente todas as mudanças</text><text x="834" y="295" text-anchor="middle" class="s" style="font-size: 14.7736px;">Até que a estabilidade seja confirmada</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 a conformidade não torna os fluidos de diferentes fornecedores intercambiáveis.</text>
</svg>
