<text x="841" y="290" text-anchor="middle" class="b" style="font-size: 16.1172px;">Bloqueio + carregamento do filtro</text><text x="841" y="317" text-anchor="middle" class="b" style="font-size: 16.9598px;">Transferência de calor reduzida</text>
