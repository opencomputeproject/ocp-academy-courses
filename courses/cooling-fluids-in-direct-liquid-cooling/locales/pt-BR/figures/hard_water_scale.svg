<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Iões podem formar depósitos que obstruem os passagens de placas frias</title><desc id="desc">A qualidade da água e a leaching de materiais podem introduzir cálcio e magnésio. Química inadequada pode produzir precipitações, carregar filtros e prejudicar passagens estreitas.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<rect x="24" y="30" width="270" height="328" rx="8" class="box"/><rect x="365" y="30" width="270" height="328" rx="8" class="box"/><rect x="706" y="30" width="270" height="328" rx="8" class="box"/>
<text x="159" y="76" text-anchor="middle" class="h">Ca + Mg</text>
<circle cx="115" cy="167" r="31" fill="#eef0fb" stroke="#343895" stroke-width="2"/><text x="115" y="174" text-anchor="middle" class="h">Ca</text>
<circle cx="204" cy="208" r="31" fill="#e9f5d8" stroke="#74a82d" stroke-width="2"/><text x="204" y="215" text-anchor="middle" class="h">mg</text>
<text x="159" y="290" text-anchor="middle" class="b">Qualidade da água ou</text><text x="159" y="317" text-anchor="middle" class="b">Lixiviação de material</text>
<text x="500" y="76" text-anchor="middle" class="h">Pode precipitar</text>
<g fill="#8dc63f" stroke="#74a82d" stroke-width="2"><circle cx="477" cy="174" r="16"/><circle cx="500" cy="194" r="20"/><circle cx="525" cy="175" r="14"/><circle cx="463" cy="205" r="12"/><circle cx="529" cy="217" r="15"/></g>
<text x="500" y="290" text-anchor="middle" class="b">Interação química</text><text x="500" y="317" text-anchor="middle" class="b" style="font-size: 17.3954px;">Formação de escala / depósito</text>
<text x="841" y="76" text-anchor="middle" class="h">Passagens estreitas</text>
<rect x="750" y="119" width="182" height="128" rx="4" fill="#f1f2fb" stroke="#343895" stroke-width="2"/><path d="M766 141 H916 M766 167 H916 M766 193 H916 M766 219 H916" stroke="#fff" stroke-width="13"/>
