<text x="600" y="639" text-anchor="middle" class="s">異物除去のフラッシング例です。化学洗浄、不動態化、洗浄剤除去は別途確認が必要です。</text>
<path id="route-bypass" d="M158 350 H550 V440 H110 V398" fill="none" stroke="none"></path>

<path id="route-2" d="M158 350 H550 V255 H960 V308 H940 V336 H980 V362 H940 V390 H960 V440 H110 V398" fill="none" stroke="none"></path>

<script>
const DURATION=18;
const colors=['#343895','#00a0b5','#74a82d'];
const pale=['#eef0fb','#eef8fa','#f5faee'];
const ns='http://www.w3.org/2000/svg';
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const make=(id,n,r,color)=>Array.from({length:n},()=>{const c=document.createElementNS(ns,'circle');c.setAttribute('r',r);c.setAttribute('fill',color);document.getElementById(id).append(c);return c});
const flow=make('flow-particles',18,4,'#343895');
flow.forEach(p=>{p.setAttribute('stroke','#ffffff');p.setAttribute('stroke-width','1.5')});
const debris=make('moving-debris',12,4,'#5f6062');
const captured=make('captured-debris',12,3.5,'#5f6062');
const routes=['route-bypass','route-0','route-1','route-2'].map(id=>document.getElementById(id));
window.renderAt=function(rawTime){
  // Clamp the master timeline so an encoded final frame never restarts the first stage.
  const t=Math.max(0,Math.min(DURATION,rawTime));
  const stage=t<6?0:t<12?1:2;
  for(let i=0;i<3;i++){
    const done=i<stage,active=i===stage;
    document.getElementById('stage-bg-'+i).setAttribute('fill',active?pale[i]:done?'#f5faee':'#fafbfc');
    document.getElementById('stage-bg-'+i).setAttribute('stroke',active?colors[i]:done?'#8dc63f':'#c4c9d0');
    document.getElementById('stage-bg-'+i).setAttribute('stroke-width',active?3:2);
  }
  document.getElementById('state-label').textContent=["コールドプレートを隔離 - バイパス開","プレート流路を接続 - 必要に応じてフラッシングを反復","清浄度を確認 - 最終冷却液充填・採取・基準値記録"][stage];
  document.getElementById('bypass-active').setAttribute('opacity',stage===0?1:0);
  for(const id of ['plate-feed','plate-return','plate-active']){
    document.getElementById(id).setAttribute('opacity',stage===0?0:1);
    document.getElementById(id).setAttribute('stroke',colors[stage]);
  }
  document.getElementById('plates').setAttribute('opacity',stage===0?0.32:1);
  document.getElementById('isolation').setAttribute('opacity',stage===0?1:0);
  document.getElementById('valve').setAttribute('transform',stage===0?'':'rotate(90 550 350)');
  document.getElementById('valve').setAttribute('stroke',colors[stage]);
  document.getElementById('path-label').textContent=stage===0?"バイパス使用中":"バイパス閉";
  document.getElementById('pump-rotor').setAttribute('transform','rotate('+t*65+' 110 350)');
  flow.forEach((p,i)=>{
    const route=stage===0?routes[0]:routes[1+i%3];
    const travel=((t*0.13-i/flow.length)%1+1)%1;
    const pt=route.getPointAtLength(travel*route.getTotalLength());
    p.setAttribute('cx',pt.x);p.setAttribute('cy',pt.y);p.setAttribute('fill',colors[stage]);
  });
  // Debris travels to the filter once; captured material does not repeatedly disappear.
  debris.forEach((p,i)=>{
    const start=i<8?0.4+i*0.5:6.4+(i-8)*0.65;
    const progress=clamp((t-start)/1.0);
    p.setAttribute('cx',175+progress*112);p.setAttribute('cy',350+(i%3-1)*8);
    p.setAttribute('opacity',t>=start&&progress<1&&stage!==2?1:0);
    captured[i].setAttribute('cx',316+(i%4)*22);captured[i].setAttribute('cy',343+Math.floor(i/4)*9);
    captured[i].setAttribute('opacity',progress===1&&stage!==2?1:0);
  });
  document.getElementById('filter-label').textContent=stage===2?"必要に応じてフィルターを交換します。":"破片捕捉";
  const fill=stage===2?smooth((t-12.7)/2.5):0;
  document.getElementById('sample').setAttribute('opacity',stage===2?1:0);
  document.getElementById('sample-fill').setAttribute('y',535-43*fill);
  document.getElementById('sample-fill').setAttribute('height',43*fill);
  document.getElementById('record').setAttribute('opacity',stage===2?smooth((t-15.2)/1.2):0);
};
window.setTeachingTime = ms => window.renderAt(ms / 1000);
window.renderAt(0);
</script>
