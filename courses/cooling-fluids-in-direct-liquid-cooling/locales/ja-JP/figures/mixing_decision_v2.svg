<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">意図しない混合を防ぐ、正確な液体を確認し、変化を監視する</title><desc id="desc">受入機器には、サプライヤーが承認したフラッシュとフィルのプロトコルを使用します。正確な配合物は証拠が必要です。変更後、ベースラインをサンプル化し、文書化してください。PG25のコンプライアンスは交換不可です。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">入荷機器/補充/サービスイベント</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">混ざらないようにする</text><text x="166" y="178" text-anchor="middle" class="b">残留液体を特定する</text><text x="166" y="217" text-anchor="middle" class="b" style="font-size: 17.9657px;">サプライヤー承認のフラッシュ</text><text x="166" y="256" text-anchor="middle" class="b">動作用液を入れます。</text><text x="166" y="295" text-anchor="middle" class="s">接続する前に</text>
<text x="500" y="128" text-anchor="middle" class="h">正確な流体を確認する</text><text x="500" y="178" text-anchor="middle" class="b">製剤固有の証拠</text><text x="500" y="217" text-anchor="middle" class="b">材料+条件</text><text x="500" y="256" text-anchor="middle" class="b" style="font-size: 17.9657px;">サプライヤーが承認したプラン</text><text x="500" y="295" text-anchor="middle" class="s">ファミリーレベルの仮定なし</text>
<text x="834" y="128" text-anchor="middle" class="h">変更を監視する</text><text x="834" y="178" text-anchor="middle" class="b">イベント駆動型サンプリング</text><text x="834" y="217" text-anchor="middle" class="b" style="font-size: 16.8959px;">抑制剤のベースラインを確認する</text><text x="834" y="256" text-anchor="middle" class="b">すべての変更を記録する</text><text x="834" y="295" text-anchor="middle" class="s">安定性が確認されるまで</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 コンプライアンスは、異なるサプライヤーの流体を交換可能にするものではありません。</text>
</svg>
