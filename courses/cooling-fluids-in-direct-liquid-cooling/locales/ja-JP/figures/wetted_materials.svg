<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">互換性には、すべての濡れた表面が含まれます。</title><desc id="desc">正確な配合と条件は、金属、コールドプレート、エラストマー、ポンプ、フィルターメディア、シール、配管器具、バルブなどと一緒に検証する必要があります。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="530" fill="#fff"/>

<path d="M280 155 L370 246 M720 155 L630 246 M500 149 V196 M280 353 L370 303 M720 353 L630 303" fill="none" stroke="#8dc63f" stroke-width="3"/>
<rect x="24" y="64" width="256" height="132" rx="8" class="box"/><text x="152" y="105" text-anchor="middle" class="h">金属+表面</text><text x="152" y="139" text-anchor="middle" class="b">等級・めっき・ろう付け</text><text x="152" y="166" text-anchor="middle" class="b">ねじシール剤</text>
<rect x="362" y="22" width="276" height="127" rx="8" class="box"/><text x="500" y="63" text-anchor="middle" class="h">コールドプレート</text><text x="500" y="93" text-anchor="middle" class="h">熱交換器</text><text x="500" y="126" text-anchor="middle" class="b">チャンネル+参加した資料</text>
<rect x="720" y="64" width="256" height="132" rx="8" class="box"/><text x="848" y="105" text-anchor="middle" class="h">エラストマー</text><text x="848" y="139" text-anchor="middle" class="b" style="font-size: 17.493px;">ホース、シール、ガスケット</text><text x="848" y="166" text-anchor="middle" class="b" style="font-size: 18.4687px;">正確な複合物が重要である</text>
<rect x="370" y="196" width="260" height="156" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="3"/><text x="500" y="242" text-anchor="middle" class="h">TCS 液体</text><text x="500" y="282" text-anchor="middle" class="b">正確な配合</text><text x="500" y="314" text-anchor="middle" class="b">+ 運用条件</text>
<rect x="24" y="304" width="256" height="132" rx="8" class="box"/><text x="152" y="345" text-anchor="middle" class="h">ポンプ+フィルター</text><text x="152" y="379" text-anchor="middle" class="b" style="font-size: 18.6469px;">媒体、シール、ベアリング</text><text x="152" y="406" text-anchor="middle" class="b">添加物の保持を確認する</text>
<rect x="720" y="304" width="256" height="132" rx="8" class="box"/><text x="848" y="345" text-anchor="middle" class="h">QDs + バルブ</text><text x="848" y="379" text-anchor="middle" class="b" style="font-size: 18.5886px;">配管、シール、貯水タンク</text><text x="848" y="406" text-anchor="middle" class="b" style="font-size: 17.269px;">すべての濡れた部品を含める</text>
<path d="M70 465 H930" stroke="#d6dbe0" stroke-width="1.5"/><text x="500" y="501" text-anchor="middle" class="b">配合物、材料グレード、温度、および暴露期間を同時に検証します。</text>
</svg>
