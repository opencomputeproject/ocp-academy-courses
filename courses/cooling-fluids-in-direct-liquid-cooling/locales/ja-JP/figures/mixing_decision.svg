<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="流体混合判定ロジック">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title" style="font-size: 25.74px;">ミキシングは操作上のイベントであり、カテゴリーのルールではありません</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h" style="font-size: 17.48px;">それは避けられるでしょうか？</text>
  <text x="185" y="230" text-anchor="middle" class="body">フラッシュ残留物</text>
  <text x="185" y="259" text-anchor="middle" class="body">トップオフ</text>
  <text x="185" y="288" text-anchor="middle" class="body">オペレータエラー</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">流体の評価</text>
  <text x="520" y="191" text-anchor="middle" class="h">流体によって</text>
  <text x="520" y="238" text-anchor="middle" class="body">保存安定性</text>
  <text x="520" y="267" text-anchor="middle" class="body">腐食試験</text>
  <text x="520" y="296" text-anchor="middle" class="body">サプライヤーガイダンス</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h">監視計画を</text>
  <text x="835" y="191" text-anchor="middle" class="h">再設定</text>
  <text x="835" y="238" text-anchor="middle" class="small">ベースライン の変更</text>
  <text x="835" y="267" text-anchor="middle" class="small">阻害剤ターゲットのシフト</text>
  <text x="835" y="296" text-anchor="middle" class="small">修正が難しくなる</text>

  <text x="500" y="440" text-anchor="middle" class="body">OAT と OAT は常に安全であるとか、IAT と OAT は常に安全ではないなどとは言わないでください。</text>
</svg>
