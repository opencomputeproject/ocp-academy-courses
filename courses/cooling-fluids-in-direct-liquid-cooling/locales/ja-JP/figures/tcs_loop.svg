<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">熱は CDU を横断します。施設と二次流体は分離されています。</title><desc id="desc">施設用水システム は TCS の境界外にあります。閉じた二次流体は CDU、ラックマニフェスト、および コールドプレート を通って循環します。</desc>
