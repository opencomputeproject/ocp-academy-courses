<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="流体の健全性 監視フレームワーク">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">システムの健全性を 流体の健全性 から分離する</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">システムの健全性信号</text>
  <text x="270" y="220" text-anchor="middle" class="body">Cu、Fe、Zn、その他の金属</text>
  <text x="270" y="260" text-anchor="middle" class="body">Ca、Mg、硫酸塩、ケイ素</text>
  <text x="270" y="300" text-anchor="middle" class="body">濁度とフィルター負荷</text>
  <text x="270" y="340" text-anchor="middle" class="body">熱性能ドリフト</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">流体の健全性信号</text>
  <text x="730" y="220" text-anchor="middle" class="body">阻害剤レベルとアゾール</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH、導電率およびTDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">グリコール分解生成物</text>
  <text x="730" y="340" text-anchor="middle" class="body">該当する場合は PG 濃度</text>
  <text x="500" y="470" text-anchor="middle" class="body">適切な決定は、単一の読み取り値ではなく、クリーンな ベースライン に対する傾向から得られます。</text>
</svg>
