<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">タイムラインやランキングなしで比較された3つの防食剤ファミリー</title><desc id="desc">IATは無機添加剤を使用し、OATは有機酸防食剤を使用し、HOATはそれらを組み合わせています。正確な配合とシステムが性能を決定します。PG25はケイ酸塩ベースの添加剤を禁止しています。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="450" fill="#fff"/>

<rect x="24" y="26" width="300" height="280" rx="8" class="box"/><rect x="350" y="26" width="300" height="280" rx="8" class="box"/><rect x="676" y="26" width="300" height="280" rx="8" class="box"/>
<text x="174" y="78" text-anchor="middle" class="h">IAT</text><text x="174" y="112" text-anchor="middle" class="s">無機添加剤技術</text>
<g fill="#8dc63f" stroke="#74a82d" stroke-width="2"><circle cx="126" cy="166" r="15"/><circle cx="174" cy="166" r="15"/><circle cx="222" cy="166" r="15"/></g>
<text x="174" y="221" text-anchor="middle" class="b">無機添加物</text><text x="174" y="262" text-anchor="middle" class="s">迅速なフィルム保護</text>
<text x="500" y="78" text-anchor="middle" class="h">OAT</text><text x="500" y="112" text-anchor="middle" class="s">有機酸技術</text>
<g fill="#eef0fb" stroke="#343895" stroke-width="2"><rect x="429" y="152" width="58" height="28" rx="14"/><rect x="513" y="152" width="58" height="28" rx="14"/></g>
<text x="500" y="221" text-anchor="middle" class="b">有機酸防食剤</text><text x="500" y="262" text-anchor="middle" class="s">長寿命アプローチ</text>
<text x="826" y="78" text-anchor="middle" class="h">HOAT</text><text x="826" y="112" text-anchor="middle" class="s">ハイブリッド有機酸技術</text>
<circle cx="779" cy="166" r="15" fill="#8dc63f" stroke="#74a82d" stroke-width="2"/><text x="821" y="174" text-anchor="middle" class="b">+</text><rect x="848" y="152" width="58" height="28" rx="14" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
<text x="826" y="221" text-anchor="middle" class="b">複合アプローチ</text><text x="826" y="262" text-anchor="middle" class="s">有機化学+無機化学</text>
<text x="500" y="350" text-anchor="middle" class="s">保護、互換性、寿命、および監視は、配合物に依存します。</text>
<rect x="146" y="375" width="708" height="54" rx="6" fill="#f5faee" stroke="#8dc63f" stroke-width="1.5"/><text x="500" y="408" text-anchor="middle" class="b" style="font-size: 18.1239px;">OCP-コンプライアンスのPG25：ケイ酸塩ベースの添加物は使用されていません。</text>
</svg>
