<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="流體健康狀況監控框架">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">將系統運作狀況與流體健康狀況分開</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">系統健康訊號</text>
  <text x="270" y="220" text-anchor="middle" class="body">銅、鐵、鋅等金屬</text>
  <text x="270" y="260" text-anchor="middle" class="body">鈣、鎂、硫酸鹽、矽</text>
  <text x="270" y="300" text-anchor="middle" class="body">濁度和過濾器負載</text>
  <text x="270" y="340" text-anchor="middle" class="body">熱性能漂移</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">流體健康狀況訊號</text>
  <text x="730" y="220" text-anchor="middle" class="body">抑制劑水平和唑類</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH、電導率和 TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">乙二醇降解產物</text>
  <text x="730" y="340" text-anchor="middle" class="body">適用時的 PG 濃度</text>
  <text x="500" y="470" text-anchor="middle" class="body">好的決策來自於清晰的基準線趨勢，而不是孤立的閱讀。</text>
</svg>
