<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">防止意外混合，驗證精確的液體，並監控變化</title><desc id="desc">使用供應商批准的沖洗和填充協議對入庫裝置進行。精確的配方需要證據。更改後，請取樣並記錄基準線；PG25合規性不可互換。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">進貨裝置/補貨/服務活動</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">防止混合</text><text x="166" y="178" text-anchor="middle" class="b">識別殘留液體</text><text x="166" y="217" text-anchor="middle" class="b">供應商批准的沖洗</text><text x="166" y="256" text-anchor="middle" class="b">裝滿操作液體</text><text x="166" y="295" text-anchor="middle" class="s">連線前</text>
<text x="500" y="128" text-anchor="middle" class="h">驗證精確的液體</text><text x="500" y="178" text-anchor="middle" class="b">配方特定的證據</text><text x="500" y="217" text-anchor="middle" class="b">材料+條件</text><text x="500" y="256" text-anchor="middle" class="b">供應商批准的計劃</text><text x="500" y="295" text-anchor="middle" class="s">沒有家庭級別的假設</text>
<text x="834" y="128" text-anchor="middle" class="h">監控變化</text><text x="834" y="178" text-anchor="middle" class="b">事件驅動的抽樣</text><text x="834" y="217" text-anchor="middle" class="b">審查緩蝕劑基線</text><text x="834" y="256" text-anchor="middle" class="b">記錄每次更改</text><text x="834" y="295" text-anchor="middle" class="s">直到確認穩定性為止</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25合規性並不意味著不同供應商的液體可以互換。</text>
</svg>
