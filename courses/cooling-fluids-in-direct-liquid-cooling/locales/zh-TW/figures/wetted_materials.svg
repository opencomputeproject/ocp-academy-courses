<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">相容性包括每個溼潤的表面</title><desc id="desc">必須與金屬、冷板、彈性體、泵、過濾介質、密封件、配件和閥門一起驗證確切的配方和條件。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="530" fill="#fff"/>

<path d="M280 155 L370 246 M720 155 L630 246 M500 149 V196 M280 353 L370 303 M720 353 L630 303" fill="none" stroke="#8dc63f" stroke-width="3"/>
<rect x="24" y="64" width="256" height="132" rx="8" class="box"/><text x="152" y="105" text-anchor="middle" class="h">金屬+表面</text><text x="152" y="139" text-anchor="middle" class="b">牌號、鍍層、硬銲、</text><text x="152" y="166" text-anchor="middle" class="b">螺紋密封劑</text>
<rect x="362" y="22" width="276" height="127" rx="8" class="box"/><text x="500" y="63" text-anchor="middle" class="h">冷板</text><text x="500" y="93" text-anchor="middle" class="h">熱交換器</text><text x="500" y="126" text-anchor="middle" class="b">頻道+加入的材料</text>
<rect x="720" y="64" width="256" height="132" rx="8" class="box"/><text x="848" y="105" text-anchor="middle" class="h">彈性體</text><text x="848" y="139" text-anchor="middle" class="b">軟管、密封圈、墊圈</text><text x="848" y="166" text-anchor="middle" class="b">確切的複合因素很重要</text>
<rect x="370" y="196" width="260" height="156" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="3"/><text x="500" y="242" text-anchor="middle" class="h">TCS液體</text><text x="500" y="282" text-anchor="middle" class="b">確切的配方</text><text x="500" y="314" text-anchor="middle" class="b">+運營條件</text>
<rect x="24" y="304" width="256" height="132" rx="8" class="box"/><text x="152" y="345" text-anchor="middle" class="h">泵+過濾器</text><text x="152" y="379" text-anchor="middle" class="b">介質、密封圈、軸承</text><text x="152" y="406" text-anchor="middle" class="b">檢查新增劑保留率</text>
<rect x="720" y="304" width="256" height="132" rx="8" class="box"/><text x="848" y="345" text-anchor="middle" class="h">QDs + 閥門</text><text x="848" y="379" text-anchor="middle" class="b">配件、密封件、水箱</text><text x="848" y="406" text-anchor="middle" class="b">包括所有溼潤的部分</text>
<path d="M70 465 H930" stroke="#d6dbe0" stroke-width="1.5"/><text x="500" y="501" text-anchor="middle" class="b">一起驗證配方、材料等級、溫度和暴露時間。</text>
</svg>
