<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="流體混合決策邏輯">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title">混合是一個操作事件，而不是一個類別規則</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h">可以避免嗎？</text>
  <text x="185" y="230" text-anchor="middle" class="body">沖洗殘留物</text>
  <text x="185" y="259" text-anchor="middle" class="body">頂部關閉</text>
  <text x="185" y="288" text-anchor="middle" class="body">操作員錯誤</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">評估液體</text>
  <text x="520" y="191" text-anchor="middle" class="h">通過流體</text>
  <text x="520" y="238" text-anchor="middle" class="body">儲存穩定性</text>
  <text x="520" y="267" text-anchor="middle" class="body">腐蝕測試</text>
  <text x="520" y="296" text-anchor="middle" class="body">供應商指導</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h">重設監控</text>
  <text x="835" y="191" text-anchor="middle" class="h">計畫</text>
  <text x="835" y="238" text-anchor="middle" class="small">基準線更改</text>
  <text x="835" y="267" text-anchor="middle" class="small">抑制劑標靶轉移</text>
  <text x="835" y="296" text-anchor="middle" class="small">糾正變得更加困難</text>

  <text x="500" y="440" text-anchor="middle" class="body">不要說 OAT 加 OAT 總是安全的，或 IAT 加 OAT 總是不安全。</text>
</svg>
