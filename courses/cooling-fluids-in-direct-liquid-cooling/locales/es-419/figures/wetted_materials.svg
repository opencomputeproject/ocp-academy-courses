<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">La compatibilidad incluye todas las superficies humedecidas</title><desc id="desc">La formulación y las condiciones exactas deben verificarse con metales, placas frías, elastómeros, bombas, medios de filtro, sellos, accesorios y válvulas.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="530" fill="#fff"/>

<path d="M280 155 L370 246 M720 155 L630 246 M500 149 V196 M280 353 L370 303 M720 353 L630 303" fill="none" stroke="#8dc63f" stroke-width="3"/>
<rect x="24" y="64" width="256" height="132" rx="8" class="box"/><text x="152" y="105" text-anchor="middle" class="h" style="font-size: 21.48px;">Metales + superficies</text><text x="152" y="139" text-anchor="middle" class="b" style="font-size: 17.0803px;">Grados, chapados y brasado,</text><text x="152" y="166" text-anchor="middle" class="b">selladores de hilo</text>
<rect x="362" y="22" width="276" height="127" rx="8" class="box"/><text x="500" y="63" text-anchor="middle" class="h">placas frías</text><text x="500" y="93" text-anchor="middle" class="h" style="font-size: 18.9698px;">Intercambiadores de calor</text><text x="500" y="126" text-anchor="middle" class="b">Canales + materiales unidos</text>
<rect x="720" y="64" width="256" height="132" rx="8" class="box"/><text x="848" y="105" text-anchor="middle" class="h">Elastómeros</text><text x="848" y="139" text-anchor="middle" class="b">Mangueras, sellos, juntas</text><text x="848" y="166" text-anchor="middle" class="b" style="font-size: 13.854px;">Importan las combinaciones exactas</text>
<rect x="370" y="196" width="260" height="156" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="3"/><text x="500" y="242" text-anchor="middle" class="h">TCS líquido</text><text x="500" y="282" text-anchor="middle" class="b">Formulación exacta</text><text x="500" y="314" text-anchor="middle" class="b" style="font-size: 15.6252px;">+ condiciones de funcionamiento</text>
<rect x="24" y="304" width="256" height="132" rx="8" class="box"/><text x="152" y="345" text-anchor="middle" class="h">Bombas + filtros</text><text x="152" y="379" text-anchor="middle" class="b" style="font-size: 18.079px;">Medios, sellos, rodamientos</text><text x="152" y="406" text-anchor="middle" class="b" style="font-size: 14.2442px;">Compruebe la retención de aditivos</text>
<rect x="720" y="304" width="256" height="132" rx="8" class="box"/><text x="848" y="345" text-anchor="middle" class="h">QDs + válvulas</text><text x="848" y="379" text-anchor="middle" class="b" style="font-size: 17.4506px;">Accesorios, sellos, depósitos</text><text x="848" y="406" text-anchor="middle" class="b" style="font-size: 15.9351px;">Incluir todas las partes mojadas</text>
<path d="M70 465 H930" stroke="#d6dbe0" stroke-width="1.5"/><text x="500" y="501" text-anchor="middle" class="b">Verifique la formulación, el grado del material, la temperatura y la duración de la exposición juntos.</text>
</svg>
