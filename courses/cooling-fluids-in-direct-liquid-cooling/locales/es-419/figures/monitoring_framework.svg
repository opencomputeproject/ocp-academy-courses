<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Una tendencia puede justificar una investigación antes de que se alcance un límite de acción.</title><desc id="desc">Este es un señal ilustrativo, no datos medidos o un límite universal. Compare el línea de base, la calibración, las muestras representativas, la evidencia del sistema y la evidencia del fluido.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="540" fill="#fff"/>

<text x="54" y="42" class="s">Tendencia ilustrativa - datos no medidos</text>
<text x="48" y="182" text-anchor="middle" transform="rotate(-90 48 182)" class="s">Sinal relativo</text>
