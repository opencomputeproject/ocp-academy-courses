<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="condición del fluido marco de seguimiento">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">Separe el estado del sistema del estado del fluido</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h" style="font-size: 21.75px;">Señales de estado del sistema</text>
  <text x="270" y="220" text-anchor="middle" class="body">Cu, Fe, Zn y otros metales</text>
  <text x="270" y="260" text-anchor="middle" class="body">Ca, Mg, sulfato, silicio</text>
  <text x="270" y="300" text-anchor="middle" class="body">turbidez y carga del filtro</text>
  <text x="270" y="340" text-anchor="middle" class="body">deriva del rendimiento térmico</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">Señales del estado del fluido</text>
  <text x="730" y="220" text-anchor="middle" class="body">niveles de inhibidores y azoles</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH, conductividad y TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">productos de degradación del glicol</text>
  <text x="730" y="340" text-anchor="middle" class="body" style="font-size: 15.45px;">Concentración de PG cuando corresponda</text>
  <text x="500" y="470" text-anchor="middle" class="body">Las buenas decisiones provienen de tendencias en contra de una línea de base limpia, no de una lectura aislada.</text>
</svg>
