<g fill="#fff" stroke="#74a82d" stroke-width="3"><circle cx="111" cy="246" r="5"/><circle cx="183" cy="252" r="5"/><circle cx="255" cy="242" r="5"/><circle cx="327" cy="234" r="5"/><circle cx="399" cy="216" r="5"/><circle cx="471" cy="182" r="5"/><circle cx="555" cy="146" r="5"/></g>
<text x="330" y="318" text-anchor="middle" class="b">Muestras a lo largo del tiempo</text>
<text x="54" y="359" class="h">Confirmar el cambio</text><text x="54" y="391" class="b">Calibración + muestra representativa + comparación de laboratorio</text>
<path d="M660 28 V402" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="701" y="67" class="h">Pruebas del sistema</text><text x="701" y="102" class="b">Metales + partículas</text><text x="701" y="133" class="b">Carga del filtro + deriva térmica</text>
<text x="701" y="215" class="h">Pruebas líquidas</text><text x="701" y="250" class="b">pH + concentración</text><text x="701" y="281" class="b">Niveles de inhibidores + azoles</text><text x="701" y="312" class="b" style="font-size: 17.4069px;">Productos de degradación del glicol</text>
<text x="701" y="361" class="s">La conductividad por sí sola no</text><text x="701" y="387" class="s">diagnosticar inhibido PG25.</text>
