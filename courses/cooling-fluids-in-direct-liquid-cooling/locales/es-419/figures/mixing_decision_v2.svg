<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Evite la mezcla no intencionada, verifique los fluidos exactos y monitoree los cambios.</title><desc id="desc">Utilice los protocolos de limpieza y llenado aprobados por el proveedor para el equipo entrante. Las formulaciones exactas requieren pruebas. Después de los cambios, muestre y documente la conformidad con el línea de base; la PG25 no es intercambiabilidad.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">Equipo entrante / recarga / evento de servicio</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">Evitar la mezcla</text><text x="166" y="178" text-anchor="middle" class="b">Identificar el líquido residual</text><text x="166" y="217" text-anchor="middle" class="b" style="font-size: 15.6504px;">Desagüe aprobado por el proveedor</text><text x="166" y="256" text-anchor="middle" class="b" style="font-size: 14.5564px;">Rellenar con líquido de funcionamiento</text><text x="166" y="295" text-anchor="middle" class="s">Antes de la conexión</text>
<text x="500" y="128" text-anchor="middle" class="h" style="font-size: 21.2318px;">Verificar fluidos exactos</text><text x="500" y="178" text-anchor="middle" class="b" style="font-size: 14.8934px;">Pruebas específicas de la formulación</text><text x="500" y="217" text-anchor="middle" class="b">Materiales + condiciones</text><text x="500" y="256" text-anchor="middle" class="b" style="font-size: 17.8753px;">Plan aprobado por el proveedor</text><text x="500" y="295" text-anchor="middle" class="s">Sin suposiciones a nivel familiar</text>
<text x="834" y="128" text-anchor="middle" class="h">Monitorea el cambio</text><text x="834" y="178" text-anchor="middle" class="b" style="font-size: 17.3469px;">Muestreo impulsado por eventos</text><text x="834" y="217" text-anchor="middle" class="b" style="font-size: 14.7468px;">Revisar las líneas de base de los inhib</text><text x="834" y="256" text-anchor="middle" class="b">Documenta cada cambio</text><text x="834" y="295" text-anchor="middle" class="s" style="font-size: 15.7951px;">Hasta que se confirme la estabilidad</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 La conformidad no hace que los fluidos de diferentes proveedores sean intercambiables.</text>
</svg>
