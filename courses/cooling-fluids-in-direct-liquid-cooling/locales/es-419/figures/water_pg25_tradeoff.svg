<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Comparación cualitativa de agua y PG25</title><desc id="desc">No se implica ninguna relación numérica de rendimiento. La formulación exacta y la temperatura determinan las propiedades medidas. Las bases de concentración por peso y volumen no son intercambiables.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:20px;font-weight:700;fill:#292b30}.b{font-size:16px;fill:#5f6062}.s{font-size:15px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="390" fill="#fff"/>

<rect x="235" y="20" width="335" height="270" rx="8" fill="#f5faee"/><rect x="610" y="20" width="365" height="270" rx="8" fill="#f1f2fb"/>
<text x="263" y="54" class="h">Agua tratada</text><text x="638" y="54" class="h">PG25</text>
<path d="M24 80 H975 M24 132 H975 M24 184 H975 M24 242 H975" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="24" y="109" class="b">Capacidad de calor</text><text x="263" y="109" class="b">superior</text><text x="638" y="109" class="b">Menos que el agua</text>
<text x="24" y="161" class="b">viscosidad</text><text x="263" y="161" class="b">más bajo</text><text x="638" y="161" class="b">Más alta; la temperatura importa</text>
<text x="24" y="221" class="b">Control de química</text><text x="263" y="209" class="b">Corrosión +</text><text x="263" y="231" class="b">control microbiano</text><text x="638" y="209" class="b">Concentración de glicol +</text><text x="638" y="231" class="b">equilibrio inhibitorio</text>
<text x="24" y="268" class="b">Base de producto nuevo</text><text x="263" y="268" class="b">Refrigerante de agua V1.3</text><text x="638" y="268" class="b">25-28% PG por peso</text>
<text x="500" y="317" text-anchor="middle" class="s">Solo cualitativo. Diseñar con los datos de propiedad del proveedor a la temperatura de funcionamiento.</text>
<rect x="70" y="334" width="860" height="44" rx="6" fill="#fafbfc" stroke="#c4c9d0" stroke-width="1.5"/>
<text x="500" y="362" text-anchor="middle" class="b">Registre la base de concentración: el % de peso no es el % de volumen.</text>
</svg>
