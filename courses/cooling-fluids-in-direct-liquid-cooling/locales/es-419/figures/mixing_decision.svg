<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Lógica de decisión de mezcla de fluidos">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title">La mezcla es un evento operativo, no una regla de categoría</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h">¿Se puede evitar?</text>
  <text x="185" y="230" text-anchor="middle" class="body">residuos de lavado</text>
  <text x="185" y="259" text-anchor="middle" class="body">rematar</text>
  <text x="185" y="288" text-anchor="middle" class="body">error del operador</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">Evaluar fluido</text>
  <text x="520" y="191" text-anchor="middle" class="h">por fluido</text>
  <text x="520" y="238" text-anchor="middle" class="body">estabilidad de almacenamiento</text>
  <text x="520" y="267" text-anchor="middle" class="body">prueba de corrosión</text>
  <text x="520" y="296" text-anchor="middle" class="body">orientación del proveedor</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h" style="font-size: 19.33px;">Restablecer el plan</text>
  <text x="835" y="191" text-anchor="middle" class="h">de monitoreo</text>
  <text x="835" y="238" text-anchor="middle" class="small">línea de base cambios</text>
  <text x="835" y="267" text-anchor="middle" class="small" style="font-size: 12.53px;">los objetivos del inhibidor cambian</text>
  <text x="835" y="296" text-anchor="middle" class="small" style="font-size: 10.71px;">las correcciones se vuelven más difíciles</text>

  <text x="500" y="440" text-anchor="middle" class="body">No digas que OAT más OAT es siempre seguro, o que IAT más OAT siempre es inseguro.</text>
</svg>
