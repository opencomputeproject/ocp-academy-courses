<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">호환성은 모든 습한 표면을 포함합니다.</title><desc id="desc">정확한 제형과 조건은 금속, 콜드 플레이트, 탄성체, 펌프, 필터 매체, 밀봉, 어셈블리 및 밸브와 함께 확인되어야 합니다.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="530" fill="#fff"/>

<path d="M280 155 L370 246 M720 155 L630 246 M500 149 V196 M280 353 L370 303 M720 353 L630 303" fill="none" stroke="#8dc63f" stroke-width="3"/>
<rect x="24" y="64" width="256" height="132" rx="8" class="box"/><text x="152" y="105" text-anchor="middle" class="h">금속 + 표면</text><text x="152" y="139" text-anchor="middle" class="b">등급, 도금, 브레이징,</text><text x="152" y="166" text-anchor="middle" class="b">나사 밀봉제</text>
<rect x="362" y="22" width="276" height="127" rx="8" class="box"/><text x="500" y="63" text-anchor="middle" class="h">콜드 플레이트</text><text x="500" y="93" text-anchor="middle" class="h">열교환기</text><text x="500" y="126" text-anchor="middle" class="b">채널 + 가입한 자료들</text>
<rect x="720" y="64" width="256" height="132" rx="8" class="box"/><text x="848" y="105" text-anchor="middle" class="h">엘라스토머</text><text x="848" y="139" text-anchor="middle" class="b">호스, 밀봉, 꽂힘</text><text x="848" y="166" text-anchor="middle" class="b">정확한 복합물이 중요하다</text>
<rect x="370" y="196" width="260" height="156" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="3"/><text x="500" y="242" text-anchor="middle" class="h">TCS 액체</text><text x="500" y="282" text-anchor="middle" class="b">정확한 포뮬레이션</text><text x="500" y="314" text-anchor="middle" class="b">+ 운영 조건</text>
<rect x="24" y="304" width="256" height="132" rx="8" class="box"/><text x="152" y="345" text-anchor="middle" class="h">펌프 + 필터</text><text x="152" y="379" text-anchor="middle" class="b">매체, 밀봉, 베어링</text><text x="152" y="406" text-anchor="middle" class="b" style="font-size: 18.135px;">첨가제 보유 여부를 확인하세요.</text>
<rect x="720" y="304" width="256" height="132" rx="8" class="box"/><text x="848" y="345" text-anchor="middle" class="h">QDs + 밸브들</text><text x="848" y="379" text-anchor="middle" class="b">부속품, 밀봉, 저장 용기</text><text x="848" y="406" text-anchor="middle" class="b" style="font-size: 18.135px;">모든 축축한 부분을 포함합니다.</text>
<path d="M70 465 H930" stroke="#d6dbe0" stroke-width="1.5"/><text x="500" y="501" text-anchor="middle" class="b">제조 방법, 재료 등급, 온도 및 노출 기간을 함께 확인하세요.</text>
</svg>
