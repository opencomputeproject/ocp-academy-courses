<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">질적 물과 PG25 비교</title><desc id="desc">숫자적 성능 비율은 암시되지 않습니다. 정확한 형식과 온도는 측정된 특성을 결정합니다. 무게와 부피 농도 기반은 상호 교환할 수 없습니다.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:20px;font-weight:700;fill:#292b30}.b{font-size:16px;fill:#5f6062}.s{font-size:15px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="390" fill="#fff"/>

<rect x="235" y="20" width="335" height="270" rx="8" fill="#f5faee"/><rect x="610" y="20" width="365" height="270" rx="8" fill="#f1f2fb"/>
<text x="263" y="54" class="h">처리된 물</text><text x="638" y="54" class="h">PG25</text>
<path d="M24 80 H975 M24 132 H975 M24 184 H975 M24 242 H975" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="24" y="109" class="b">열 용량</text><text x="263" y="109" class="b">더 높은</text><text x="638" y="109" class="b">물보다 낮다</text>
<text x="24" y="161" class="b">점성률</text><text x="263" y="161" class="b">낮추다</text><text x="638" y="161" class="b">높음; 온도가 중요하다</text>
<text x="24" y="221" class="b">화학 제어</text><text x="263" y="209" class="b">식물성 침식 +</text><text x="263" y="231" class="b">미생물 제어</text><text x="638" y="209" class="b">글리콜 농도 +</text><text x="638" y="231" class="b">억제제 균형</text>
<text x="24" y="268" class="b">신제품 기준</text><text x="263" y="268" class="b">물 냉각수 V1.3</text><text x="638" y="268" class="b">25-28% 무게당 PG</text>
<text x="500" y="317" text-anchor="middle" class="s">질적만 해당합니다. 작동 온도에서 공급업체 특성 데이터를 사용하여 설계합니다.</text>
<rect x="70" y="334" width="860" height="44" rx="6" fill="#fafbfc" stroke="#c4c9d0" stroke-width="1.5"/>
<text x="500" y="362" text-anchor="middle" class="b">농도 기준을 기록하세요: 무게 %는 부피 %가 아닙니다.</text>
</svg>
