<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="유체 상태 모니터링 프레임워크">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">유체 상태에서 시스템 상태를 분리합니다.</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">시스템 상태 신호</text>
  <text x="270" y="220" text-anchor="middle" class="body">Cu, Fe, Zn 및 기타 금속</text>
  <text x="270" y="260" text-anchor="middle" class="body">Ca, Mg, 황산염, 규소</text>
  <text x="270" y="300" text-anchor="middle" class="body">탁도 및 필터 로딩</text>
  <text x="270" y="340" text-anchor="middle" class="body">열 성능 드리프트</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">유체 상태 신호</text>
  <text x="730" y="220" text-anchor="middle" class="body">억제제 수준 및 아졸</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH, 전도도 및 TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">글리콜 분해 생성물</text>
  <text x="730" y="340" text-anchor="middle" class="body">해당되는 경우 PG 농도</text>
  <text x="500" y="470" text-anchor="middle" class="body">좋은 결정은 단 하나의 판독값이 아니라 깨끗한 기준선에 대한 추세에서 나옵니다.</text>
</svg>
