<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">트렌드는 행동 제한이 도달하기 전에 조사를 정당화할 수 있습니다.</title><desc id="desc">이것은 측정된 데이터나 보편적인 한계가 아닌 설명적 신호입니다. 기준선, 보정, 대표 샘플, 시스템 증거 및 유체 증거를 비교하십시오.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="540" fill="#fff"/>

<text x="54" y="42" class="s">예시적인 추세 - 측정되지 않은 데이터</text>
<text x="48" y="182" text-anchor="middle" transform="rotate(-90 48 182)" class="s">상대적 신호</text>
<path d="M90 68 V288 H614" fill="none" stroke="#9ca3af" stroke-width="2"/>
<path d="M90 101 H614" stroke="#343895" stroke-width="2" stroke-dasharray="8 6"/><text x="407" y="87" class="s">사이트 행동 제한</text>
<path d="M90 250 H614" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="4 5"/><text x="101" y="277" class="s">기준선</text>
<path d="M111 246 L183 252 L255 242 L327 234 L399 216 L471 182 L555 146" fill="none" stroke="#74a82d" stroke-width="4" stroke-linejoin="round"/>
<g fill="#fff" stroke="#74a82d" stroke-width="3"><circle cx="111" cy="246" r="5"/><circle cx="183" cy="252" r="5"/><circle cx="255" cy="242" r="5"/><circle cx="327" cy="234" r="5"/><circle cx="399" cy="216" r="5"/><circle cx="471" cy="182" r="5"/><circle cx="555" cy="146" r="5"/></g>
<text x="330" y="318" text-anchor="middle" class="b">시간에 따른 샘플</text>
<text x="54" y="359" class="h">변경 확인하기</text><text x="54" y="391" class="b">보정 + 대표 샘플 + 실험실 비교</text>
<path d="M660 28 V402" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="701" y="67" class="h">시스템 증거</text><text x="701" y="102" class="b">금속 + 입자</text><text x="701" y="133" class="b">필터 로드 + 열적 편향</text>
<text x="701" y="215" class="h">유체 증거</text><text x="701" y="250" class="b">pH + 집중력</text><text x="701" y="281" class="b">억제제 수준 + 아졸</text><text x="701" y="312" class="b">글리콜 분해 제품들</text>
<text x="701" y="361" class="s">전도성만으로는 그렇지 않다</text><text x="701" y="387" class="s">PG25가 억제된 것으로 진단합니다.</text>
<rect x="28" y="436" width="440" height="78" rx="6" fill="#f1f2fb"/><text x="248" y="470" text-anchor="middle" class="b">신제품 요구 사항</text><text x="248" y="498" text-anchor="middle" class="s">기본 사양 승인</text>
<rect x="532" y="436" width="440" height="78" rx="6" fill="#f5faee"/><text x="752" y="470" text-anchor="middle" class="b">사용 중 / 공급업체 제한</text><text x="752" y="498" text-anchor="middle" class="s">운영 해석</text>
</svg>
