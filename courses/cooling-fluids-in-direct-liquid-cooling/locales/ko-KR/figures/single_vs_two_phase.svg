<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">현열와 잠열 비교</title><desc id="desc">온도계는 단계를 변화하지 않고 액체를 가열하는 것을 나타냅니다. 기체가 있는 액체 방울은 증발로 인한 열 전달을 나타냅니다.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="490" fill="#fff"/>

<rect x="28" y="24" width="444" height="386" rx="8" fill="#fff" stroke="#8dc63f" stroke-width="3"/>
<rect x="528" y="24" width="444" height="386" rx="8" fill="#fff" stroke="#343895" stroke-width="3"/>
<text x="250" y="72" text-anchor="middle" class="h">단상</text><text x="250" y="103" text-anchor="middle" class="b">물 또는 PG25</text>
<rect x="227" y="147" width="46" height="132" rx="23" fill="#fff" stroke="#5f6062" stroke-width="5"/>
<path d="M250 178 V280" stroke="#8dc63f" stroke-width="18" stroke-linecap="round"/>
<circle cx="250" cy="289" r="37" fill="#fff" stroke="#5f6062" stroke-width="5"/><circle cx="250" cy="289" r="24" fill="#8dc63f"/>
<path d="M291 166 H321 M291 203 H309 M291 240 H321" stroke="#5f6062" stroke-width="5" stroke-linecap="round"/>
<text x="250" y="358" text-anchor="middle" class="h">현열</text><text x="250" y="388" text-anchor="middle" class="b">액체는 따뜻해집니다; 액체 상태로 유지됩니다.</text>
<text x="750" y="72" text-anchor="middle" class="h">2상</text><text x="750" y="103" text-anchor="middle" class="b">절연 냉매</text>
<path d="M750 208 C733 236 699 264 699 287 A51 51 0 0 0 801 287 C801 264 767 236 750 208Z" fill="#eef0fb" stroke="#343895" stroke-width="5"/>
<path d="M715 278 C715 302 733 316 750 316" fill="none" stroke="#9b9fcf" stroke-width="4" stroke-linecap="round"/>
<path d="M711 189 C694 174 726 158 709 142 M750 189 C733 174 765 158 748 142 M789 189 C772 174 804 158 787 142" fill="none" stroke="#343895" stroke-width="5" stroke-linecap="round"/>
<text x="750" y="358" text-anchor="middle" class="h">잠열</text><text x="750" y="388" text-anchor="middle" class="b">증발은 열을 옮긴다.</text>
<text x="500" y="456" text-anchor="middle" class="s">냉매 예시: R-515B, R-1233zd(E), R-1336mzz(Z)</text>
</svg>
