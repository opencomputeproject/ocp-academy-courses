<text x="841" y="290" text-anchor="middle" class="b">차단 + 필터 로드</text><text x="841" y="317" text-anchor="middle" class="b">열 전달 감소</text>
<path d="M294 192 H349" class="flow"/><polygon points="365,192 349,184 349,200" class="arrowhead"/><path d="M635 192 H690" class="flow"/><polygon points="706,192 690,184 690,200" class="arrowhead"/>
