<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="새로운 시스템 청소 및 채우기 순서">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 21px Open Sans,Arial;fill:#333}.body{font:600 16px Open Sans,Arial;fill:#5F6062}.step{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:16}.num{fill:#8DC63F}.numt{font:800 20px Open Sans,Arial;fill:#fff}.arrowLine{fill:none;stroke:#8DC63F;stroke-width:7;stroke-linecap:round}.arrowHead{fill:#8DC63F}</style>
  <text x="500" y="42" text-anchor="middle" class="title">새로운 시스템 채우기는 건설 잔해로부터 콜드 플레이트을 보호합니다.</text>
  <g transform="translate(40 120)"><rect width="160" height="210" class="step"/><circle cx="80" cy="42" r="24" class="num"/><text x="80" y="49" text-anchor="middle" class="numt">1</text><text x="80" y="90" text-anchor="middle" class="h">필터링</text><text x="80" y="120" text-anchor="middle" class="body">새로 설치하다</text><text x="80" y="146" text-anchor="middle" class="body">인라인 필터</text></g>
  <path d="M212 225 H246" class="arrowLine"/>
  <polygon points="270,225 246,211 246,239" class="arrowHead"/>
  <g transform="translate(285 120)"><rect width="160" height="210" class="step"/><circle cx="80" cy="42" r="24" class="num"/><text x="80" y="49" text-anchor="middle" class="numt">2</text><text x="80" y="90" text-anchor="middle" class="h">플러시</text><text x="80" y="120" text-anchor="middle" class="body">깨끗한 물</text><text x="80" y="146" text-anchor="middle" class="body">콜드 플레이트 절연됨</text></g>
  <path d="M457 225 H491" class="arrowLine"/>
  <polygon points="515,225 491,211 491,239" class="arrowHead"/>
  <g transform="translate(530 120)"><rect width="160" height="210" class="step"/><circle cx="80" cy="42" r="24" class="num"/><text x="80" y="49" text-anchor="middle" class="numt">3</text><text x="80" y="90" text-anchor="middle" class="h">반복</text><text x="80" y="120" text-anchor="middle" class="body">콜드 플레이트</text><text x="80" y="146" text-anchor="middle" class="body">연결됨</text></g>
  <path d="M702 225 H736" class="arrowLine"/>
  <polygon points="760,225 736,211 736,239" class="arrowHead"/>
  <g transform="translate(775 120)"><rect width="180" height="210" class="step"/><circle cx="90" cy="42" r="24" class="num"/><text x="90" y="49" text-anchor="middle" class="numt">4</text><text x="90" y="90" text-anchor="middle" class="h">채우기 및 샘플링</text><text x="90" y="120" text-anchor="middle" class="body">최종 유체</text><text x="90" y="146" text-anchor="middle" class="body">기준선 기록</text></g>
  <text x="500" y="430" text-anchor="middle" class="body">순서는 간단합니다. 규율은 청결, 호환성 및 기록에 있습니다.</text>
</svg>
