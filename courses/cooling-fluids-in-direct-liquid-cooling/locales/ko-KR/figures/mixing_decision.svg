<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="유체 혼합 결정 논리">
  <style>
    .title{font:700 30px Open Sans,Arial,sans-serif;fill:#333}
    .h{font:700 21px Open Sans,Arial,sans-serif;fill:#333}
    .body{font:600 16px Open Sans,Arial,sans-serif;fill:#5f6062}
    .small{font:600 15px Open Sans,Arial,sans-serif;fill:#5f6062}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:3}
    .warn{stroke:#343895;stroke-width:5}
    .green{stroke:#8dc63f;stroke-width:6}
    .arrowLine{fill:none;stroke:#8dc63f;stroke-width:7;stroke-linecap:round}
    .arrowHead{fill:#8dc63f}
  </style>

  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="44" text-anchor="middle" class="title">혼합은 카테고리 규칙이 아닌 작동 이벤트입니다.</text>

  <rect x="45" y="112" width="280" height="250" rx="18" class="box warn"/>
  <text x="185" y="176" text-anchor="middle" class="h">피할 수 있습니까?</text>
  <text x="185" y="230" text-anchor="middle" class="body">플러시 잔여물</text>
  <text x="185" y="259" text-anchor="middle" class="body">마무리</text>
  <text x="185" y="288" text-anchor="middle" class="body">운영자 오류</text>

  <path d="M338 237 H357" class="arrowLine"/>
  <polygon points="378,237 357,225 357,249" class="arrowHead"/>

  <rect x="380" y="112" width="280" height="250" rx="18" class="box green"/>
  <text x="520" y="164" text-anchor="middle" class="h">유체 평가</text>
  <text x="520" y="191" text-anchor="middle" class="h">유체로</text>
  <text x="520" y="238" text-anchor="middle" class="body">저장 안정성</text>
  <text x="520" y="267" text-anchor="middle" class="body">부식 테스트</text>
  <text x="520" y="296" text-anchor="middle" class="body">공급업체 안내</text>

  <path d="M673 237 H692" class="arrowLine"/>
  <polygon points="713,237 692,225 692,249" class="arrowHead"/>

  <rect x="715" y="112" width="240" height="250" rx="18" class="box warn"/>
  <text x="835" y="164" text-anchor="middle" class="h">모니터링 계획</text>
  <text x="835" y="191" text-anchor="middle" class="h">재설정</text>
  <text x="835" y="238" text-anchor="middle" class="small">기준선 변경</text>
  <text x="835" y="267" text-anchor="middle" class="small">억제제 표적 이동</text>
  <text x="835" y="296" text-anchor="middle" class="small">수정이 더 어려워진다</text>

  <text x="500" y="440" text-anchor="middle" class="body">OAT 더하기 OAT는 항상 안전하다거나 IAT 더하기 OAT는 항상 안전하지 않다고 말하지 마세요.</text>
</svg>
