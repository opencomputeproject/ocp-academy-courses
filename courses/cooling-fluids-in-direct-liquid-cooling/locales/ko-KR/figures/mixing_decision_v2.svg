<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">의도하지 않은 혼합을 방지하고 정확한 액체를 확인하며 변화를 모니터링합니다.</title><desc id="desc">수입 장비에는 공급업체 승인된 플러시 및 필링 프로토콜을 사용하십시오. 정확한 제형은 증거가 필요합니다. 변경 후에는 기준선을 샘플링하고 문서화하십시오. PG25 준수 상태는 상호 교환이 불가능합니다.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">입고 장비 / 재충전 / 서비스 이벤트</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">혼동을 방지하다</text><text x="166" y="178" text-anchor="middle" class="b">잔류 액체를 식별하다</text><text x="166" y="217" text-anchor="middle" class="b">공급업체 승인 누출 방지</text><text x="166" y="256" text-anchor="middle" class="b">운영 유체로 채우세요</text><text x="166" y="295" text-anchor="middle" class="s">연결하기 전에</text>
<text x="500" y="128" text-anchor="middle" class="h">정확한 액체를 확인하세요</text><text x="500" y="178" text-anchor="middle" class="b">제조 공정별 증거</text><text x="500" y="217" text-anchor="middle" class="b">재료 + 조건</text><text x="500" y="256" text-anchor="middle" class="b">공급업체 승인된 계획</text><text x="500" y="295" text-anchor="middle" class="s">가족 수준에 대한 가정 없음</text>
<text x="834" y="128" text-anchor="middle" class="h">변화를 모니터링합니다.</text><text x="834" y="178" text-anchor="middle" class="b">이벤트 기반 샘플링</text><text x="834" y="217" text-anchor="middle" class="b">억제제 기준선 검토하기</text><text x="834" y="256" text-anchor="middle" class="b">모든 변경 사항을 기록합니다.</text><text x="834" y="295" text-anchor="middle" class="s">안정성이 확인될 때까지</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25 규정 준수는 다른 공급업체의 유체를 상호 교환할 수 있게 하는 것은 아닙니다.</text>
</svg>
