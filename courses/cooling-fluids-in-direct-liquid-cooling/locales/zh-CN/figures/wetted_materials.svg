<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-label="接液材料兼容性图">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 22px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.node{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.core{stroke:#8DC63F;stroke-width:6}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="44" text-anchor="middle" class="title">流体接触的每个表面都具有兼容性</text>
  <rect x="400" y="210" width="200" height="100" class="node core"/><text x="500" y="246" text-anchor="middle" class="h">TCS 流体</text><text x="500" y="274" text-anchor="middle" class="body">及运行</text><text x="500" y="298" text-anchor="middle" class="body">条件</text>
  <rect x="70" y="95" width="230" height="92" class="node"/><text x="185" y="133" text-anchor="middle" class="h">金属</text><text x="185" y="160" text-anchor="middle" class="body">铜、钢、黄铜</text>
  <rect x="70" y="335" width="230" height="92" class="node"/><text x="185" y="373" text-anchor="middle" class="h">弹性体</text><text x="185" y="400" text-anchor="middle" class="body">密封件和软管</text>
  <rect x="385" y="55" width="230" height="92" class="node"/><text x="500" y="93" text-anchor="middle" class="h">连接器</text><text x="500" y="120" text-anchor="middle" class="body">QDs、阀门、配件</text>
  <rect x="700" y="95" width="230" height="92" class="node"/><text x="815" y="133" text-anchor="middle" class="h">冷板</text><text x="815" y="160" text-anchor="middle" class="body">微通道、钎焊</text>
  <rect x="700" y="335" width="230" height="92" class="node"/><text x="815" y="373" text-anchor="middle" class="h">泵和过滤器</text><text x="815" y="400" text-anchor="middle" class="body">介质、密封件、轴承</text>
  <path d="M300 150 L400 230" class="line"/><path d="M300 380 L400 285" class="line"/><path d="M500 147 V210" class="line"/><path d="M700 150 L600 230" class="line"/><path d="M700 380 L600 285" class="line"/>
</svg>
