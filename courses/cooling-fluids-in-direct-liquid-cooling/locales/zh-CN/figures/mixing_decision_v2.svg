<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">防止意外混合，验证准确的液体，并监控变化</title><desc id="desc">为 incoming 设备使用供应商批准的冲洗和填充协议。精确配方需要证据。更改后，请样品并记录 基线；PG25 合规性不可互换。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="410" fill="#fff"/>

<text x="500" y="44" text-anchor="middle" class="s">进货设备/补货/服务活动</text>
<rect x="24" y="81" width="284" height="246" rx="8" class="box"/><rect x="358" y="81" width="284" height="246" rx="8" fill="#f5faee" stroke="#8dc63f" stroke-width="2"/><rect x="692" y="81" width="284" height="246" rx="8" class="box"/>
<text x="166" y="128" text-anchor="middle" class="h">防止混合</text><text x="166" y="178" text-anchor="middle" class="b">识别残留液体</text><text x="166" y="217" text-anchor="middle" class="b">供应商批准的冲洗</text><text x="166" y="256" text-anchor="middle" class="b">填充操作液</text><text x="166" y="295" text-anchor="middle" class="s">连接前</text>
<text x="500" y="128" text-anchor="middle" class="h">验证确切的液体</text><text x="500" y="178" text-anchor="middle" class="b">配方特定的证据</text><text x="500" y="217" text-anchor="middle" class="b">材料+条件</text><text x="500" y="256" text-anchor="middle" class="b">供应商批准的计划</text><text x="500" y="295" text-anchor="middle" class="s">没有家庭层面的假设</text>
<text x="834" y="128" text-anchor="middle" class="h">监控变化</text><text x="834" y="178" text-anchor="middle" class="b">事件驱动采样</text><text x="834" y="217" text-anchor="middle" class="b">审查缓蚀剂基线</text><text x="834" y="256" text-anchor="middle" class="b">记录每次更改</text><text x="834" y="295" text-anchor="middle" class="s">直到稳定性得到确认</text>
<path d="M308 206 H342" class="flow"/><polygon points="358,206 342,198 342,214" class="arrowhead"/><path d="M642 206 H676" class="flow"/><polygon points="692,206 676,198 676,214" class="arrowhead"/>
<text x="500" y="376" text-anchor="middle" class="b">PG25合规性并不意味着不同供应商的液体可以互换。</text>
</svg>
