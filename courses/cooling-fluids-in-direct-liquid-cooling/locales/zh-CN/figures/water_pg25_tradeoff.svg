<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">水质和PG25的比较</title><desc id="desc">不暗示任何数值性能比。确切的配方和温度决定了测量到的特性。重量和体积浓度基不互换。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:20px;font-weight:700;fill:#292b30}.b{font-size:16px;fill:#5f6062}.s{font-size:15px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="390" fill="#fff"/>

<rect x="235" y="20" width="335" height="270" rx="8" fill="#f5faee"/><rect x="610" y="20" width="365" height="270" rx="8" fill="#f1f2fb"/>
<text x="263" y="54" class="h">经过处理的水</text><text x="638" y="54" class="h">PG25</text>
<path d="M24 80 H975 M24 132 H975 M24 184 H975 M24 242 H975" stroke="#d6dbe0" stroke-width="1.5"/>
<text x="24" y="109" class="b">热容量</text><text x="263" y="109" class="b">教育高级证书</text><text x="638" y="109" class="b">低于水位</text>
<text x="24" y="161" class="b">黏滞性</text><text x="263" y="161" class="b">较低的</text><text x="638" y="161" class="b">更高；温度很重要</text>
<text x="24" y="221" class="b">化学控制</text><text x="263" y="209" class="b">腐蚀+</text><text x="263" y="231" class="b">微生物控制</text><text x="638" y="209" class="b">丙二醇浓度+</text><text x="638" y="231" class="b">缓蚀剂平衡</text>
<text x="24" y="268" class="b">新产品基础</text><text x="263" y="268" class="b">水冷却剂 V1.3</text><text x="638" y="268" class="b">25-28%按重量计算的PG</text>
<text x="500" y="317" text-anchor="middle" class="s">仅定性。在工作温度下使用供应商属性数据进行设计。</text>
<rect x="70" y="334" width="860" height="44" rx="6" fill="#fafbfc" stroke="#c4c9d0" stroke-width="1.5"/>
<text x="500" y="362" text-anchor="middle" class="b">记录浓度基准：重量百分比不是体积百分比。</text>
</svg>
