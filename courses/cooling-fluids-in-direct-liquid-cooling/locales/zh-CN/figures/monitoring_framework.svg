<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="流体健康状况监控框架">
  <style>.title{font:700 30px Open Sans,Arial;fill:#333}.h{font:700 23px Open Sans,Arial;fill:#333}.body{font:600 17px Open Sans,Arial;fill:#5F6062}.box{fill:#fff;stroke:#d1d5db;stroke-width:3;rx:18}.green{stroke:#8DC63F;stroke-width:6}.blue{stroke:#343895;stroke-width:5}.line{stroke:#8DC63F;stroke-width:5;stroke-linecap:round}</style>
  <text x="500" y="42" text-anchor="middle" class="title">将系统运行状况与流体健康状况分开</text>
  <rect x="90" y="120" width="360" height="300" class="box green"/>
  <text x="270" y="170" text-anchor="middle" class="h">系统健康信号</text>
  <text x="270" y="220" text-anchor="middle" class="body">铜、铁、锌等金属</text>
  <text x="270" y="260" text-anchor="middle" class="body">钙、镁、硫酸盐、硅</text>
  <text x="270" y="300" text-anchor="middle" class="body">浊度和过滤器负载</text>
  <text x="270" y="340" text-anchor="middle" class="body">热性能漂移</text>
  <rect x="550" y="120" width="360" height="300" class="box blue"/>
  <text x="730" y="170" text-anchor="middle" class="h">流体健康状况信号</text>
  <text x="730" y="220" text-anchor="middle" class="body">抑制剂水平和唑类</text>
  <text x="730" y="260" text-anchor="middle" class="body">pH、电导率和 TDS</text>
  <text x="730" y="300" text-anchor="middle" class="body">乙二醇降解产物</text>
  <text x="730" y="340" text-anchor="middle" class="body">适用时的 PG 浓度</text>
  <text x="500" y="470" text-anchor="middle" class="body">好的决策来自于清晰的基线趋势，而不是孤立的阅读。</text>
</svg>
