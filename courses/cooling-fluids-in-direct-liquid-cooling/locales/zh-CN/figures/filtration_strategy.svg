<g fill="#5f6062"><circle cx="319" cy="177" r="3"/><circle cx="342" cy="177" r="3"/><circle cx="365" cy="177" r="3"/><circle cx="388" cy="177" r="3"/><circle cx="328" cy="190" r="3"/><circle cx="351" cy="190" r="3"/><circle cx="374" cy="190" r="3"/><circle cx="319" cy="203" r="3"/><circle cx="342" cy="203" r="3"/><circle cx="365" cy="203" r="3"/><circle cx="388" cy="203" r="3"/></g>
