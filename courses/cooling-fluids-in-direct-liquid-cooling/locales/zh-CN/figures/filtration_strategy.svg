<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">主电路和侧流过滤器提供不同的路径</title><desc id="desc">内置穿孔过滤器可以看到主电路的流量。部分流量分支通过侧流过滤器，然后重新连接到回流。同时选择额定值、效率、流量和添加剂兼容介质。</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.h{font-size:24px;font-weight:700;fill:#292b30}.b{font-size:19px;fill:#5f6062}.s{font-size:17px;fill:#5f6062}.box{fill:#fff;stroke:#c4c9d0;stroke-width:2}.flow{fill:none;stroke:#74a82d;stroke-width:4;stroke-linejoin:round}.arrowhead{fill:#74a82d}</style><rect width="1000" height="560" fill="#fff"/>

<text x="345" y="66" text-anchor="middle" class="h">内置过滤器</text><text x="345" y="96" text-anchor="middle" class="s">所有主电路流量</text>
<text x="667" y="141" text-anchor="middle" class="b">主要冷却路径</text>
