<circle cx="560" cy="190" r="6" fill="#343895"/>
<path d="M560 190 V291 H654 V317" fill="none" stroke="#343895" stroke-width="4" stroke-linejoin="round"/><polygon points="654,333 646,317 662,317" class="arrowhead" style="fill:#343895"/>
<rect x="580" y="333" width="148" height="96" rx="6" fill="#f1f2fb" stroke="#343895" stroke-width="2"/><path d="M606 359 V405 M622 359 V405 M638 359 V405 M654 359 V405 M670 359 V405 M686 359 V405 M702 359 V405" stroke="#9b9fcf" stroke-width="3"/>
