<text x="159" y="76" text-anchor="middle" class="h">钙+镁</text>
<circle cx="115" cy="167" r="31" fill="#eef0fb" stroke="#343895" stroke-width="2"/><text x="115" y="174" text-anchor="middle" class="h">加利福尼亚州</text>
<circle cx="204" cy="208" r="31" fill="#e9f5d8" stroke="#74a82d" stroke-width="2"/><text x="204" y="215" text-anchor="middle" class="h">毫克</text>
<text x="159" y="290" text-anchor="middle" class="b">水质或</text><text x="159" y="317" text-anchor="middle" class="b">材料浸出</text>
<text x="500" y="76" text-anchor="middle" class="h">可能会沉淀</text>
<g fill="#8dc63f" stroke="#74a82d" stroke-width="2"><circle cx="477" cy="174" r="16"/><circle cx="500" cy="194" r="20"/><circle cx="525" cy="175" r="14"/><circle cx="463" cy="205" r="12"/><circle cx="529" cy="217" r="15"/></g>
<text x="500" y="290" text-anchor="middle" class="b">化学相互作用</text><text x="500" y="317" text-anchor="middle" class="b">结垢/沉积形成</text>
<text x="841" y="76" text-anchor="middle" class="h">狭窄的通道</text>
