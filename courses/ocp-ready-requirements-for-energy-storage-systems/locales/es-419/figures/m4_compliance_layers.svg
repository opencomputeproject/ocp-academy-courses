<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es-419" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="Modelo de cumplimiento en capas desde la evidencia del producto hasta las operaciones." font-family="Open Sans, Arial, sans-serif">
