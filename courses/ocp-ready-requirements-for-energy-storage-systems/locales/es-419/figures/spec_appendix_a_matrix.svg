<text data-phrase="2.3-B" data-container="20 314 112 151" x="76" y="396.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="396.10">2.3-B</tspan></text>
<rect x="132" y="314" width="420" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Segregación de espacios blancos/grises" data-container="132 314 420 151" x="152" y="382.3" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="382.30">Segregación de espacios</tspan><tspan x="152" y="409.90">blancos/grises</tspan></text>
<rect x="552" y="314" width="540" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Se requiere un sistema de rociadores de agua para todo almacenamiento electroquímico de energía." data-container="552 314 540 151" x="572" y="382.3" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="382.30">Se requiere un sistema de rociadores de agua para</tspan><tspan x="572" y="409.90">todo almacenamiento electroquímico de energía.</tspan></text>
<rect x="1092" y="314" width="608" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Diseñar considerando todos los materiales inflamables, incluido el sistema de almacenamiento de energía. Algunos ESS pueden contener componentes inflamables que reaccionen negativamente con ciertos métodos de extinción." data-container="1092 314 608 151" x="1112" y="354.70000000000005" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="354.70">Diseñar considerando todos los materiales inflamables, incluido</tspan><tspan x="1112" y="382.30">el sistema de almacenamiento de energía. Algunos ESS</tspan><tspan x="1112" y="409.90">pueden contener componentes inflamables que reaccionen</tspan><tspan x="1112" y="437.50">negativamente con ciertos métodos de extinción.</tspan></text>
<rect x="20" y="465" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-C" data-container="20 465 112 96" x="76" y="519.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="519.60">2.3-C</tspan></text>
<rect x="132" y="465" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Sistema de detección de gases/humo" data-container="132 465 420 96" x="152" y="519.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="519.60">Sistema de detección de gases/humo</tspan></text>
<rect x="552" y="465" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Según lo exigido por los códigos de incendio aplicables" data-container="552 465 540 96" x="572" y="519.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="519.60">Según lo exigido por los códigos de incendio aplicables</tspan></text>
<rect x="1092" y="465" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Sistemas redundantes que supervisan y notifican/alarman de forma independiente la acumulación de gases y/o humo." data-container="1092 465 608 96" x="1112" y="505.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="505.80">Sistemas redundantes que supervisan y notifican/alarman de</tspan><tspan x="1112" y="533.40">forma independiente la acumulación de gases y/o humo.</tspan></text>
<rect x="20" y="561" width="112" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-D" data-container="20 561 112 151" x="76" y="643.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="643.10">2.3-D</tspan></text>
<rect x="132" y="561" width="420" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Ventilación" data-container="132 561 420 151" x="152" y="643.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="643.10">Ventilación</tspan></text>
<rect x="552" y="561" width="540" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Requerido para todos los sistemas de almacenamiento electroquímico de energía." data-container="552 561 540 151" x="572" y="629.3000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="629.30">Requerido para todos los sistemas de almacenamiento</tspan><tspan x="572" y="656.90">electroquímico de energía.</tspan></text>
<rect x="1092" y="561" width="608" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Generalmente se prefieren sistemas automatizados. Algunas tecnologías ESS requieren ventilación mejorada y pueden requerir venteo de deflagración y/o control de explosiones según NFPA 68 y/o NFPA 69." data-container="1092 561 608 151" x="1112" y="601.7" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="601.70">Generalmente se prefieren sistemas automatizados. Algunas</tspan><tspan x="1112" y="629.30">tecnologías ESS requieren ventilación mejorada y pueden</tspan><tspan x="1112" y="656.90">requerir venteo de deflagración y/o control de explosiones</tspan><tspan x="1112" y="684.50">según NFPA 68 y/o NFPA 69.</tspan></text>
<rect x="20" y="712" width="112" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-E" data-container="20 712 112 123" x="76" y="780.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="780.10">2.3-E</tspan></text>
<rect x="132" y="712" width="420" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Tecnología de almacenamiento de energía" data-container="132 712 420 123" x="152" y="766.3000000000001" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="766.30">Tecnología de almacenamiento de</tspan><tspan x="152" y="793.90">energía</tspan></text>
<rect x="552" y="712" width="540" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Debería cumplir los requisitos de capacidad, ubicación, separación y contención de incendios de NFPA 855." data-container="552 712 540 123" x="572" y="766.3000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="766.30">Debería cumplir los requisitos de capacidad, ubicación,</tspan><tspan x="572" y="793.90">separación y contención de incendios de NFPA 855.</tspan></text>
<rect x="1092" y="712" width="608" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Seleccionar la tecnología de almacenamiento de energía según menores riesgos de incendio y la aceptación de FM Global u otra aseguradora de responsabilidad civil." data-container="1092 712 608 123" x="1112" y="752.5" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="752.50">Seleccionar la tecnología de almacenamiento de energía según</tspan><tspan x="1112" y="780.10">menores riesgos de incendio y la aceptación de FM Global u</tspan><tspan x="1112" y="807.70">otra aseguradora de responsabilidad civil.</tspan></text>
