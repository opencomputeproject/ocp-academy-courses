<text data-phrase="2.3-A" data-container="20 218 112 96" x="76" y="272.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="272.60">2.3-A</tspan></text>
<rect x="132" y="218" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Control y extinción automáticos de incendios" data-container="132 218 420 96" x="152" y="258.8" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="258.80">Control y extinción automáticos de</tspan><tspan x="152" y="286.40">incendios</tspan></text>
<rect x="552" y="218" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Debe cumplir varios códigos y normas NFPA (o equivalentes aplicables)" data-container="552 218 540 96" x="572" y="258.8" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="258.80">Debe cumplir varios códigos y normas NFPA (o</tspan><tspan x="572" y="286.40">equivalentes aplicables)</tspan></text>
<rect x="1092" y="218" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Los requisitos del código son el nivel mínimo aceptable de cumplimiento." data-container="1092 218 608 96" x="1112" y="258.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="258.80">Los requisitos del código son el nivel mínimo aceptable de</tspan><tspan x="1112" y="286.40">cumplimiento.</tspan></text>
