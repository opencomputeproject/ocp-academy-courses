<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja-JP" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="製品証拠から運用までの階層化されたコンプライアンス モデル。" font-family="Open Sans, Arial, sans-serif">
