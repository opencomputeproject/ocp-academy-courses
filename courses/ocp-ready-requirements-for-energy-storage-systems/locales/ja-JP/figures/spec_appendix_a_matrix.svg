<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja-JP" width="1720" height="745" viewBox="0 0 1720 745" role="img" aria-label="付録 A ESS マトリックスの OCP Ready™ 要件。" font-family="Open Sans, Arial, sans-serif">
