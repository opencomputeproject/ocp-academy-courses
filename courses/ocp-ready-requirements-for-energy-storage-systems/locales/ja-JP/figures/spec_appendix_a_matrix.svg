<rect x="552" y="20" width="540" height="96" rx="0" fill="#EDF0F2" stroke="#72777B" stroke-width="2" />
<text data-phrase="許容パラメータ" data-container="552 20 540 96" x="822" y="74.6" font-size="20" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="822" y="74.60">許容パラメータ</tspan></text>
<rect x="1092" y="20" width="608" height="96" rx="0" fill="#EDF0F2" stroke="#72777B" stroke-width="2" />
<text data-phrase="最適パラメータ" data-container="1092 20 608 96" x="1396" y="74.6" font-size="20" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="1396" y="74.60">最適パラメータ</tspan></text>
<rect x="20" y="116" width="1680" height="75" rx="0" fill="#EAF4E1" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3" data-container="20 116 112 75" x="76" y="160.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="160.10">2.3</tspan></text>
<text data-phrase="消火" data-container="132 116 1568 75" x="154" y="160.76" font-size="22" font-weight="700" fill="#343895" text-anchor="start"><tspan x="154" y="160.76">消火</tspan></text>
<rect x="20" y="191" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-A" data-container="20 191 112 96" x="76" y="245.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="245.60">2.3-A</tspan></text>
<rect x="132" y="191" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="自動火災制御・消火" data-container="132 191 420 96" x="152" y="245.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="245.60">自動火災制御・消火</tspan></text>
<rect x="552" y="191" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="複数の NFPA 法規・規格（または適用される同等基準）に適合すること" data-container="552 191 540 96" x="572" y="231.79999999999998" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="231.80">複数の NFPA 法規・規格（または適用される同等</tspan><tspan x="572" y="259.40">基準）に適合すること</tspan></text>
<rect x="1092" y="191" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="法規要件は、コンプライアンスの最低許容レベルです。" data-container="1092 191 608 96" x="1112" y="245.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="245.60">法規要件は、コンプライアンスの最低許容レベルです。</tspan></text>
<rect x="20" y="287" width="112" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-B" data-container="20 287 112 123" x="76" y="355.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="355.10">2.3-B</tspan></text>
<rect x="132" y="287" width="420" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="ホワイトスペース／グレースペースの分離" data-container="132 287 420 123" x="152" y="355.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="355.10">ホワイトスペース／グレースペースの分離</tspan></text>
<rect x="552" y="287" width="540" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="すべての電気化学エネルギー貯蔵に水系スプリンクラー設備が必要。" data-container="552 287 540 123" x="572" y="341.3" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="341.30">すべての電気化学エネルギー貯蔵に水系</tspan><tspan x="572" y="368.90">スプリンクラー設備が必要。</tspan></text>
<rect x="1092" y="287" width="608" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="エネルギー貯蔵システムを含むすべての可燃物を考慮して設計する。一部の ESS には、特定の消火方法と不適合な反応を起こす可燃性部品が含まれる場合がある。" data-container="1092 287 608 123" x="1112" y="327.5" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="327.50">エネルギー貯蔵システムを含むすべての可燃物を考慮して設計</tspan><tspan x="1112" y="355.10">する。一部の ESS には、特定の消火方法と不適合な反応を</tspan><tspan x="1112" y="382.70">起こす可燃性部品が含まれる場合がある。</tspan></text>
<rect x="20" y="410" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-C" data-container="20 410 112 96" x="76" y="464.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="464.60">2.3-C</tspan></text>
<rect x="132" y="410" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="ガス・煙検知システム" data-container="132 410 420 96" x="152" y="464.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="464.60">ガス・煙検知システム</tspan></text>
<rect x="552" y="410" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="適用される消防法規の要求に従う" data-container="552 410 540 96" x="572" y="464.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="464.60">適用される消防法規の要求に従う</tspan></text>
<rect x="1092" y="410" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="ガスおよび／または煙の蓄積を独立して監視し、報告・警報する冗長システム。" data-container="1092 410 608 96" x="1112" y="450.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="450.80">ガスおよび／または煙の蓄積を独立して監視し、報告・警報</tspan><tspan x="1112" y="478.40">する冗長システム。</tspan></text>
<rect x="20" y="506" width="112" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-D" data-container="20 506 112 123" x="76" y="574.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="574.10">2.3-D</tspan></text>
<rect x="132" y="506" width="420" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="換気" data-container="132 506 420 123" x="152" y="574.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="574.10">換気</tspan></text>
<rect x="552" y="506" width="540" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="すべての電気化学エネルギー貯蔵システムに必要。" data-container="552 506 540 123" x="572" y="574.1" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="574.10">すべての電気化学エネルギー貯蔵システムに必要。</tspan></text>
<rect x="1092" y="506" width="608" height="123" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="通常は自動システムが望ましい。一部の ESS 技術には強化換気が必要で、NFPA 68 および／または NFPA 69 に基づく爆燃放散や爆発制御が必要になる場合がある。" data-container="1092 506 608 123" x="1112" y="546.5" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="546.50">通常は自動システムが望ましい。一部の ESS 技術には強化</tspan><tspan x="1112" y="574.10">換気が必要で、NFPA 68 および／または NFPA 69 に基づく爆</tspan><tspan x="1112" y="601.70">燃放散や爆発制御が必要になる場合がある。</tspan></text>
<rect x="20" y="629" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-E" data-container="20 629 112 96" x="76" y="683.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="683.60">2.3-E</tspan></text>
<rect x="132" y="629" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="エネルギー貯蔵技術" data-container="132 629 420 96" x="152" y="683.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="683.60">エネルギー貯蔵技術</tspan></text>
<rect x="552" y="629" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="NFPA 855 の容量、場所、離隔、火災封じ込め要件に適合することが望ましい。" data-container="552 629 540 96" x="572" y="669.8000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="669.80">NFPA 855 の容量、場所、離隔、火災封じ込め要件に</tspan><tspan x="572" y="697.40">適合することが望ましい。</tspan></text>
<rect x="1092" y="629" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="火災リスクの低さと FM Global または他の賠償責任保険会社の受入れに基づき、エネルギー貯蔵技術を選択する。" data-container="1092 629 608 96" x="1112" y="669.8000000000001" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="669.80">火災リスクの低さと FM Global または他の賠償責任保険会社の</tspan><tspan x="1112" y="697.40">受入れに基づき、エネルギー貯蔵技術を選択する。</tspan></text>
</svg>
