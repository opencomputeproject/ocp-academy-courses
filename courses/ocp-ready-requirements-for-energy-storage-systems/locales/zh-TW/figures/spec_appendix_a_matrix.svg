<rect x="132" y="20" width="420" height="96" rx="0" fill="#EDF0F2" stroke="#72777B" stroke-width="2" />
<text data-phrase="要求屬性（OCP Ready 認證所需的最佳或可接受參數）" data-container="132 20 420 96" x="342" y="60.800000000000004" font-size="20" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="342" y="60.80">要求屬性（OCP Ready 認證所需的最佳</tspan><tspan x="342" y="88.40">或可接受參數）</tspan></text>
<rect x="552" y="20" width="540" height="96" rx="0" fill="#EDF0F2" stroke="#72777B" stroke-width="2" />
<text data-phrase="可接受參數" data-container="552 20 540 96" x="822" y="74.6" font-size="20" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="822" y="74.60">可接受參數</tspan></text>
<rect x="1092" y="20" width="608" height="96" rx="0" fill="#EDF0F2" stroke="#72777B" stroke-width="2" />
<text data-phrase="最佳參數" data-container="1092 20 608 96" x="1396" y="74.6" font-size="20" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="1396" y="74.60">最佳參數</tspan></text>
<rect x="20" y="116" width="1680" height="75" rx="0" fill="#EAF4E1" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3" data-container="20 116 112 75" x="76" y="160.1" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="160.10">2.3</tspan></text>
<text data-phrase="滅火" data-container="132 116 1568 75" x="154" y="160.76" font-size="22" font-weight="700" fill="#343895" text-anchor="start"><tspan x="154" y="160.76">滅火</tspan></text>
<rect x="20" y="191" width="112" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-A" data-container="20 191 112 68" x="76" y="231.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="231.60">2.3-A</tspan></text>
<rect x="132" y="191" width="420" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="自動火災控制與滅火" data-container="132 191 420 68" x="152" y="231.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="231.60">自動火災控制與滅火</tspan></text>
<rect x="552" y="191" width="540" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="必須遵守多項 NFPA 規範與標準（或適用的同等標準）" data-container="552 191 540 68" x="572" y="231.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="231.60">必須遵守多項 NFPA 規範與標準（或適用的同等標準）</tspan></text>
<rect x="1092" y="191" width="608" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="規範要求是可接受的最低合規水準。" data-container="1092 191 608 68" x="1112" y="231.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="231.60">規範要求是可接受的最低合規水準。</tspan></text>
<rect x="20" y="259" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-B" data-container="20 259 112 96" x="76" y="313.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="313.60">2.3-B</tspan></text>
<rect x="132" y="259" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="白區/灰區隔離" data-container="132 259 420 96" x="152" y="313.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="313.60">白區/灰區隔離</tspan></text>
<rect x="552" y="259" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="所有電化學儲能都需要水基灑水系統。" data-container="552 259 540 96" x="572" y="313.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="313.60">所有電化學儲能都需要水基灑水系統。</tspan></text>
<rect x="1092" y="259" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="設計時應考慮包括儲能系統在內的所有易燃材料。某些 ESS 可能含有會與特定滅火方法產生不良反應的易燃組件。" data-container="1092 259 608 96" x="1112" y="299.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="299.80">設計時應考慮包括儲能系統在內的所有易燃材料。某些 ESS</tspan><tspan x="1112" y="327.40">可能含有會與特定滅火方法產生不良反應的易燃組件。</tspan></text>
<rect x="20" y="355" width="112" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-C" data-container="20 355 112 68" x="76" y="395.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="395.60">2.3-C</tspan></text>
<rect x="132" y="355" width="420" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="氣體/煙霧偵測系統" data-container="132 355 420 68" x="152" y="395.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="395.60">氣體/煙霧偵測系統</tspan></text>
<rect x="552" y="355" width="540" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="依適用消防規範要求" data-container="552 355 540 68" x="572" y="395.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="395.60">依適用消防規範要求</tspan></text>
<rect x="1092" y="355" width="608" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="獨立監測並報告/警報氣體和/或煙霧積聚的備援系統。" data-container="1092 355 608 68" x="1112" y="395.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="395.60">獨立監測並報告/警報氣體和/或煙霧積聚的備援系統。</tspan></text>
<rect x="20" y="423" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-D" data-container="20 423 112 96" x="76" y="477.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="477.60">2.3-D</tspan></text>
<rect x="132" y="423" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="通風" data-container="132 423 420 96" x="152" y="477.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="477.60">通風</tspan></text>
<rect x="552" y="423" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="所有電化學儲能系統均要求。" data-container="552 423 540 96" x="572" y="477.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="477.60">所有電化學儲能系統均要求。</tspan></text>
<rect x="1092" y="423" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="通常優先採用自動化系統。某些 ESS 技術需要強化通風，並可能需要 NFPA 68 和/或 NFPA 69 要求的洩爆和/或爆炸控制。" data-container="1092 423 608 96" x="1112" y="463.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="463.80">通常優先採用自動化系統。某些 ESS 技術需要強化通風，並</tspan><tspan x="1112" y="491.40">可能需要 NFPA 68 和/或 NFPA 69 要求的洩爆和/或爆炸控制。</tspan></text>
<rect x="20" y="519" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-E" data-container="20 519 112 96" x="76" y="573.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="573.60">2.3-E</tspan></text>
<rect x="132" y="519" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="儲能技術" data-container="132 519 420 96" x="152" y="573.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="573.60">儲能技術</tspan></text>
<rect x="552" y="519" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="應符合 NFPA 855 的容量、位置、間距與火災控制要求。" data-container="552 519 540 96" x="572" y="559.8000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="559.80">應符合 NFPA 855 的容量、位置、間距與火災控制</tspan><tspan x="572" y="587.40">要求。</tspan></text>
<rect x="1092" y="519" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="依據較低火災風險以及 FM Global 或其他責任保險公司的接受情況選擇儲能技術。" data-container="1092 519 608 96" x="1112" y="559.8000000000001" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="559.80">依據較低火災風險以及 FM Global 或其他責任保險公司的接受</tspan><tspan x="1112" y="587.40">情況選擇儲能技術。</tspan></text>
</svg>
