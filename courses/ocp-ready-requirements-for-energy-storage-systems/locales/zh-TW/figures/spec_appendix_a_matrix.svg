<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-TW" width="1720" height="635" viewBox="0 0 1720 635" role="img" aria-label="附錄 A ESS 矩陣的 OCP Ready™ 要求。" font-family="Open Sans, Arial, sans-serif">
