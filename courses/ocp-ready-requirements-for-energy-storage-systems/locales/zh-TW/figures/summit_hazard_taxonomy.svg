<text data-phrase="電解液洩漏" data-container="1220 95 384 68" x="1412" y="135.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="1412" y="135.60">電解液洩漏</tspan></text>
<text data-phrase="有毒與有害副產物" data-container="1220 163 384 68" x="1412" y="203.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="1412" y="203.60">有毒與有害副產物</tspan></text>
<text data-phrase="系統與部署問題" data-container="20 253 1584 80" x="44" y="300.92" font-size="24" font-weight="700" fill="#343895" text-anchor="start"><tspan x="44" y="300.92">系統與部署問題</tspan></text>
