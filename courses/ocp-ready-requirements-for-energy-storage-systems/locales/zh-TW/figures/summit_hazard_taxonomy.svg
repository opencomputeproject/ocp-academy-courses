<text data-phrase="高壓 DC 系統" data-container="20 95 384 68" x="212" y="135.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="212" y="135.60">高壓 DC 系統</tspan></text>
<text data-phrase="帶電維護條件" data-container="20 163 384 68" x="212" y="203.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="212" y="203.60">帶電維護條件</tspan></text>
