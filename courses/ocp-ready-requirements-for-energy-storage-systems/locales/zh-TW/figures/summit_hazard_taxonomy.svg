<text data-phrase="故障期間釋氣" data-container="820 95 384 68" x="1012" y="135.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="1012" y="135.60">故障期間釋氣</tspan></text>
<text data-phrase="可燃氣體積聚" data-container="820 163 384 68" x="1012" y="203.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="1012" y="203.60">可燃氣體積聚</tspan></text>
<rect x="1220" y="20" width="384" height="211" rx="4" fill="#F4F8F1" stroke="#8DC63F" stroke-width="2" />
