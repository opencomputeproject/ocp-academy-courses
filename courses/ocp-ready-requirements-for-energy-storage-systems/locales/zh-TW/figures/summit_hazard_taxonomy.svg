<text data-phrase="熱失控（尤其是 Li-ion）" data-container="420 95 384 68" x="612" y="135.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="612" y="135.60">熱失控（尤其是 Li-ion）</tspan></text>
<text data-phrase="系統間熱傳播" data-container="420 163 384 68" x="612" y="203.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="612" y="203.60">系統間熱傳播</tspan></text>
<rect x="820" y="20" width="384" height="211" rx="4" fill="#F4F8F1" stroke="#BD9200" stroke-width="2" />
