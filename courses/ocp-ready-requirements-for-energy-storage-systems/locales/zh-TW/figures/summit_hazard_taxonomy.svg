<text data-phrase="位置、間距與耐火結構" data-container="1086 424 517 68" x="1344.5" y="464.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="middle"><tspan x="1344.5" y="464.60">位置、間距與耐火結構</tspan></text>
