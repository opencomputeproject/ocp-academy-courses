<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-TW" width="1624" height="580" viewBox="0 0 1624 580" role="img" aria-label="針對電氣、熱力、氣體和爆炸、化學、整合、標準和安裝問題的峰會危險分類。" font-family="Open Sans, Arial, sans-serif">
<rect width="1624" height="580" fill="#FFFFFF"/>
