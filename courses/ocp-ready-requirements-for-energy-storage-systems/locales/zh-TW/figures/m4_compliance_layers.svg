<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-TW" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="從產品證據到營運的分層合規模型。" font-family="Open Sans, Arial, sans-serif">
<rect width="1200" height="455" fill="#FFFFFF"/>
<rect x="40" y="20" width="1120" height="75" rx="4" fill="#F4F8F1" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="產品認證及測試證據" data-container="40 20 1120 75" x="600" y="64.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="64.76">產品認證及測試證據</tspan></text>
<rect x="80" y="105" width="1040" height="75" rx="4" fill="#FFFFFF" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="安裝規範和防火規範" data-container="80 105 1040 75" x="600" y="149.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="149.76">安裝規範和防火規範</tspan></text>
<rect x="120" y="190" width="960" height="75" rx="4" fill="#F4F8F1" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="當地修訂和AHJ接受" data-container="120 190 960 75" x="600" y="234.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="234.76">當地修訂和AHJ接受</tspan></text>
<rect x="160" y="275" width="880" height="75" rx="4" fill="#FFFFFF" stroke="#343895" stroke-width="2" />
<text data-phrase="保險和防損要求" data-container="160 275 880 75" x="600" y="319.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="319.76">保險和防損要求</tspan></text>
<rect x="200" y="360" width="800" height="75" rx="4" fill="#F4F8F1" stroke="#343895" stroke-width="2" />
<text data-phrase="營運和緊急應變" data-container="200 360 800 75" x="600" y="404.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="404.76">營運和緊急應變</tspan></text>
</svg>
