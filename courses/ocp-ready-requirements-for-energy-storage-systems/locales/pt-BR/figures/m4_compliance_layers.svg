<svg xmlns="http://www.w3.org/2000/svg" xml:lang="pt-BR" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="Modelo de conformidade em camadas, desde a evidência do produto até as operações." font-family="Open Sans, Arial, sans-serif">
