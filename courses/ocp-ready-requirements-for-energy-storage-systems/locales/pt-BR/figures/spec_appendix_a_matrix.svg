<text data-phrase="Exigido para todos os sistemas de armazenamento eletroquímico de energia." data-container="552 561 540 151" x="572" y="629.3000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="629.30">Exigido para todos os sistemas de armazenamento</tspan><tspan x="572" y="656.90">eletroquímico de energia.</tspan></text>
<rect x="1092" y="561" width="608" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Sistemas automatizados geralmente são preferidos. Algumas tecnologias ESS exigem ventilação reforçada e podem exigir alívio de deflagração e/ou controle de explosão conforme NFPA 68 e/ou NFPA 69." data-container="1092 561 608 151" x="1112" y="601.7" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="601.70">Sistemas automatizados geralmente são preferidos. Algumas</tspan><tspan x="1112" y="629.30">tecnologias ESS exigem ventilação reforçada e podem exigir</tspan><tspan x="1112" y="656.90">alívio de deflagração e/ou controle de explosão conforme NFPA</tspan><tspan x="1112" y="684.50">68 e/ou NFPA 69.</tspan></text>
