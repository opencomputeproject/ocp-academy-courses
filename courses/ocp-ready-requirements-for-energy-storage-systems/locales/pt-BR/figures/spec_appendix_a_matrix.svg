<text data-phrase="Sistema de sprinklers à base de água exigido para todo armazenamento eletroquímico de energia." data-container="552 314 540 151" x="572" y="382.3" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="382.30">Sistema de sprinklers à base de água exigido para todo</tspan><tspan x="572" y="409.90">armazenamento eletroquímico de energia.</tspan></text>
<rect x="1092" y="314" width="608" height="151" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="Projetar considerando todos os materiais inflamáveis, incluindo o sistema de armazenamento de energia. Alguns ESS podem conter componentes inflamáveis que reagem negativamente a certos métodos de supressão." data-container="1092 314 608 151" x="1112" y="354.70000000000005" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="354.70">Projetar considerando todos os materiais inflamáveis, incluindo</tspan><tspan x="1112" y="382.30">o sistema de armazenamento de energia. Alguns ESS podem</tspan><tspan x="1112" y="409.90">conter componentes inflamáveis que reagem negativamente a</tspan><tspan x="1112" y="437.50">certos métodos de supressão.</tspan></text>
