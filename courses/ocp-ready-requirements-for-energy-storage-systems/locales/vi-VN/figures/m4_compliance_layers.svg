<svg xmlns="http://www.w3.org/2000/svg" xml:lang="vi-VN" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="Mô hình tuân thủ theo lớp từ bằng chứng sản phẩm đến hoạt động." font-family="Open Sans, Arial, sans-serif">
<rect width="1200" height="455" fill="#FFFFFF"/>
<rect x="40" y="20" width="1120" height="75" rx="4" fill="#F4F8F1" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="Chứng nhận sản phẩm và bằng chứng thử nghiệm" data-container="40 20 1120 75" x="600" y="64.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="64.76">Chứng nhận sản phẩm và bằng chứng thử nghiệm</tspan></text>
<rect x="80" y="105" width="1040" height="75" rx="4" fill="#FFFFFF" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="Quy chuẩn lắp đặt và quy chuẩn phòng cháy" data-container="80 105 1040 75" x="600" y="149.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="149.76">Quy chuẩn lắp đặt và quy chuẩn phòng cháy</tspan></text>
<rect x="120" y="190" width="960" height="75" rx="4" fill="#F4F8F1" stroke="#8DC63F" stroke-width="2" />
<text data-phrase="Sửa đổi cục bộ và chấp nhận AHJ" data-container="120 190 960 75" x="600" y="234.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="234.76">Sửa đổi cục bộ và chấp nhận AHJ</tspan></text>
<rect x="160" y="275" width="880" height="75" rx="4" fill="#FFFFFF" stroke="#343895" stroke-width="2" />
<text data-phrase="Yêu cầu về bảo hiểm và phòng ngừa tổn thất" data-container="160 275 880 75" x="600" y="319.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="319.76">Yêu cầu về bảo hiểm và phòng ngừa tổn thất</tspan></text>
<rect x="200" y="360" width="800" height="75" rx="4" fill="#F4F8F1" stroke="#343895" stroke-width="2" />
<text data-phrase="Hoạt động và ứng phó khẩn cấp" data-container="200 360 800 75" x="600" y="404.76" font-size="22" font-weight="700" fill="#343895" text-anchor="middle"><tspan x="600" y="404.76">Hoạt động và ứng phó khẩn cấp</tspan></text>
</svg>
