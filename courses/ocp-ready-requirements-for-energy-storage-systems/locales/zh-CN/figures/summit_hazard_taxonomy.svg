<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1624" height="580" viewBox="0 0 1624 580" role="img" aria-label="针对电气、热力、气体和爆炸、化学、集成、标准和安装问题的峰会危险分类。" font-family="Open Sans, Arial, sans-serif">
