<rect x="20" y="191" width="112" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-A" data-container="20 191 112 68" x="76" y="231.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="231.60">2.3-A</tspan></text>
<rect x="132" y="191" width="420" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="自动火灾控制与灭火" data-container="132 191 420 68" x="152" y="231.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="231.60">自动火灾控制与灭火</tspan></text>
<rect x="552" y="191" width="540" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="必须遵守多项 NFPA 规范与标准（或适用的等效标准）" data-container="552 191 540 68" x="572" y="231.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="231.60">必须遵守多项 NFPA 规范与标准（或适用的等效标准）</tspan></text>
<rect x="1092" y="191" width="608" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="规范要求是可接受的最低合规水平。" data-container="1092 191 608 68" x="1112" y="231.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="231.60">规范要求是可接受的最低合规水平。</tspan></text>
<rect x="20" y="259" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-B" data-container="20 259 112 96" x="76" y="313.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="313.60">2.3-B</tspan></text>
<rect x="132" y="259" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="白区/灰区隔离" data-container="132 259 420 96" x="152" y="313.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="313.60">白区/灰区隔离</tspan></text>
<rect x="552" y="259" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="所有电化学储能都需要水基喷淋系统。" data-container="552 259 540 96" x="572" y="313.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="313.60">所有电化学储能都需要水基喷淋系统。</tspan></text>
<rect x="1092" y="259" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="设计时应考虑包括储能系统在内的所有易燃材料。某些 ESS 可能含有会与特定灭火方法产生不良反应的易燃部件。" data-container="1092 259 608 96" x="1112" y="299.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="299.80">设计时应考虑包括储能系统在内的所有易燃材料。某些 ESS</tspan><tspan x="1112" y="327.40">可能含有会与特定灭火方法产生不良反应的易燃部件。</tspan></text>
<rect x="20" y="355" width="112" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-C" data-container="20 355 112 68" x="76" y="395.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="395.60">2.3-C</tspan></text>
<rect x="132" y="355" width="420" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="气体/烟雾检测系统" data-container="132 355 420 68" x="152" y="395.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="395.60">气体/烟雾检测系统</tspan></text>
<rect x="552" y="355" width="540" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="按适用消防规范要求" data-container="552 355 540 68" x="572" y="395.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="395.60">按适用消防规范要求</tspan></text>
<rect x="1092" y="355" width="608" height="68" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="独立监测并报告/报警气体和/或烟雾积聚的冗余系统。" data-container="1092 355 608 68" x="1112" y="395.6" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="395.60">独立监测并报告/报警气体和/或烟雾积聚的冗余系统。</tspan></text>
<rect x="20" y="423" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-D" data-container="20 423 112 96" x="76" y="477.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="477.60">2.3-D</tspan></text>
<rect x="132" y="423" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="通风" data-container="132 423 420 96" x="152" y="477.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="477.60">通风</tspan></text>
<rect x="552" y="423" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="所有电化学储能系统均要求。" data-container="552 423 540 96" x="572" y="477.6" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="477.60">所有电化学储能系统均要求。</tspan></text>
<rect x="1092" y="423" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="通常优先采用自动化系统。某些 ESS 技术需要强化通风，并可能需要 NFPA 68 和/或 NFPA 69 要求的泄爆和/或爆炸控制。" data-container="1092 423 608 96" x="1112" y="463.8" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="463.80">通常优先采用自动化系统。某些 ESS 技术需要强化通风，并</tspan><tspan x="1112" y="491.40">可能需要 NFPA 68 和/或 NFPA 69 要求的泄爆和/或爆炸控制。</tspan></text>
<rect x="20" y="519" width="112" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="2.3-E" data-container="20 519 112 96" x="76" y="573.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="middle"><tspan x="76" y="573.60">2.3-E</tspan></text>
<rect x="132" y="519" width="420" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="储能技术" data-container="132 519 420 96" x="152" y="573.6" font-size="20" font-weight="700" fill="#3F4246" text-anchor="start"><tspan x="152" y="573.60">储能技术</tspan></text>
<rect x="552" y="519" width="540" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="应符合 NFPA 855 的容量、位置、间距与火灾控制要求。" data-container="552 519 540 96" x="572" y="559.8000000000001" font-size="20" font-weight="400" fill="#225BA8" text-anchor="start"><tspan x="572" y="559.80">应符合 NFPA 855 的容量、位置、间距与火灾控制</tspan><tspan x="572" y="587.40">要求。</tspan></text>
<rect x="1092" y="519" width="608" height="96" rx="0" fill="#FFFFFF" stroke="#72777B" stroke-width="2" />
<text data-phrase="基于较低火灾风险以及 FM Global 或其他责任保险公司的接受情况选择储能技术。" data-container="1092 519 608 96" x="1112" y="559.8000000000001" font-size="20" font-weight="400" fill="#3F4246" text-anchor="start"><tspan x="1112" y="559.80">基于较低火灾风险以及 FM Global 或其他责任保险公司的接受</tspan><tspan x="1112" y="587.40">情况选择储能技术。</tspan></text>
