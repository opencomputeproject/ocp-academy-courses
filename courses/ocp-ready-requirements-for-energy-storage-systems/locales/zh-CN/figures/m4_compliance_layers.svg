<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="从产品证据到运营的分层合规模型。" font-family="Open Sans, Arial, sans-serif">
