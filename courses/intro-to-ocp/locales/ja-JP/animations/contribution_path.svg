<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial,sans-serif"><rect width="1280" height="720" fill="white"></rect><g data-stage="0" style="opacity: 1;"><rect x="40" y="155" width="250" height="145" rx="18" fill="#eef0fa" stroke="#343895" stroke-width="3"></rect><text x="165.0" y="192" text-anchor="middle" fill="#343895" font-size="25"><tspan x="165.0" dy="0">提案</tspan></text><text x="165.0" y="230" text-anchor="middle" fill="#4e5b71" font-size="20"><tspan x="165" dy="0">範囲・プロジェクトとの</tspan><tspan x="165" dy="26">適合性・ライセンス</tspan></text></g><g data-stage="1" style="opacity: 1;"><path class="flow" d="M 290 227 L 337 227" fill="none" stroke="#7f8aa3" stroke-width="4" stroke-linejoin="round"></path><polygon class="arrowhead" fill="#7f8aa3" points="337,234 350,227 337,220"></polygon><rect x="350" y="155" width="250" height="145" rx="18" fill="#eef0fa" stroke="#343895" stroke-width="3"></rect><text x="475.0" y="192" text-anchor="middle" fill="#343895" font-size="25"><tspan x="475.0" dy="0">草案</tspan></text><text x="475.0" y="230" text-anchor="middle" fill="#4e5b71" font-size="20"><tspan x="475" dy="0">適用指針と貢献内容</tspan></text><path class="flow" d="M 600 227 L 647 227" fill="none" stroke="#7f8aa3" stroke-width="4" stroke-linejoin="round"></path><polygon class="arrowhead" fill="#7f8aa3" points="647,234 660,227 647,220"></polygon><rect x="660" y="155" width="250" height="145" rx="18" fill="#eef0fa" stroke="#343895" stroke-width="3"></rect><text x="785.0" y="192" text-anchor="middle" fill="#343895" font-size="20"><tspan x="785.0" dy="0">コミュニティのレビュー</tspan></text><text x="785.0" y="230" text-anchor="middle" fill="#4e5b71" font-size="20"><tspan x="785" dy="0">疑問・証拠・改善</tspan></text></g><g data-stage="2" style="opacity: 1;"><path class="flow" d="M 785 300 L 785 410 L 475 410 L 475 313" fill="none" stroke="#659c25" stroke-width="4" stroke-linejoin="round"></path><polygon class="arrowhead" fill="#659c25" points="482,313 475,300 468,313"></polygon><text x="630" y="450" text-anchor="middle" fill="#659c25" font-size="24"><tspan x="630" dy="0">提案を修正</tspan></text></g><g data-stage="3" style="opacity: 1;"><path class="flow" d="M 910 227 L 957 227" fill="none" stroke="#7f8aa3" stroke-width="4" stroke-linejoin="round"></path><polygon class="arrowhead" fill="#7f8aa3" points="957,234 970,227 957,220"></polygon><rect x="970" y="155" width="250" height="145" rx="18" fill="#f0f7e7" stroke="#659c25" stroke-width="3"></rect><text x="1095.0" y="192" text-anchor="middle" fill="#659c25" font-size="25"><tspan x="1095.0" dy="0">公開</tspan></text><text x="1095.0" y="230" text-anchor="middle" fill="#4e5b71" font-size="20"><tspan x="1095" dy="0">必要な承認と通知期間</tspan></text><text x="620" y="580" text-anchor="middle" fill="#283260" font-size="24"><tspan x="620" dy="0">公開後も改訂を続けられます。</tspan></text></g><g data-stage="4" style="opacity: 1;"><path class="flow" d="M 1095 300 L 1095 432" fill="none" stroke="#b66a17" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 7"></path><polygon class="arrowhead" fill="#b66a17" points="1088,432 1095,445 1102,432"></polygon><rect x="970" y="445" width="250" height="130" rx="18" fill="#fff4e7" stroke="#b66a17" stroke-width="3"></rect><text x="1095.0" y="482" text-anchor="middle" fill="#b66a17" font-size="25"><tspan x="1095.0" dy="0">製品認定の申請</tspan></text><text x="1095.0" y="520" text-anchor="middle" fill="#4e5b71" font-size="20"><tspan x="1095" dy="0">別のプログラムで審査</tspan></text><text x="1095" y="620" text-anchor="middle" fill="#9b5812" font-size="22"><tspan x="1095" dy="0">自動的には認定されない</tspan></text></g></svg>