</head><body data-duration-ms="84616.417234" data-poster-ms="83347.171"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Equal Average Readiness Can Hide Different Completion Times"></svg>
<script>window.TEACHING_CONFIG={"module": 3, "durationMs": 84616.417234, "posterMs": 83347.171, "audio_path": "audio/module3/slide_05_equal_average_readiness_can_hide_different_completion_times.wav", "audio_sha256": "c51ce8d11473ce796b33554fd66d4628d8e16f0c61ca014045e0ca01afd2a502", "measured_audio": true, "timing_basis": "Local ASR word timestamps matched to approved paragraph openings and key quantities; remaining within-paragraph cues are proportional. Not forced alignment or human listening approval.", "alignment_file": "authoring/alignment/M3S5.json", "events": {"second_case": 48900.0}, "paragraphs": [{"paragraph": 0, "start": 0, "end": 9080.0, "text": "A message leaves host A at a local reading of one hundred milliseconds. Host B records its arrival at ninety-seven. Has the message arrived before it was sent?", "words": 28}, {"paragraph": 1, "start": 9080.0, "end": 21280.0, "text": "In this illustrative example, a shared reference shows the arrival at one hundred and three milliseconds. B's clock is six milliseconds behind that reference. Sorting the local timestamps alone reverses the apparent sequence.", "words": 33, "alignment_match": 1}, {"paragraph": 2, "start": 21280.0, "end": 37340.0, "text": "The matching message identity connects the send to its receive. That dependency establishes causal order. Unrelated events don't acquire a causal relationship simply because one local clock shows an earlier time. Timestamps remain useful when their offset and uncertainty are understood.", "words": 41, "alignment_match": 1}, {"paragraph": 3, "start": 37340.0, "end": 44760.0, "text": "Now separate that ordering question from performance. Consider one operation requiring four participants, with no overlapping work.", "words": 17, "alignment_match": 1}, {"paragraph": 4, "start": 44760.0, "end": 59660.0, "text": "In the first example, all four contributions are ready at ten milliseconds. In the second, three are ready at five milliseconds and one at twenty-five. Both sets average ten milliseconds. Yet the group is ready at ten in the first example and twenty-five in the second.", "words": 46, "alignment_match": 1}, {"paragraph": 5, "start": 59660.0, "end": 72360.0, "text": "The second group takes fifteen milliseconds longer to become ready. Its three early participants each wait twenty milliseconds: sixty participant-milliseconds altogether. That aggregate waiting time is different from elapsed delay.", "words": 30, "alignment_match": 1}, {"paragraph": 6, "start": 72360.0, "end": 84616.41723356009, "text": "These four samples demonstrate a dependency, not a diagnosis or a reliable percentile estimate. Investigate the affected steps using participant readiness, network and compute evidence, and correlated operation identities.", "words": 29, "alignment_match": 1}], "final_hold_ms": 12256.417};</script><script src="teaching.js"></script></body></html>
