</head><body data-duration-ms="76138.820862" data-poster-ms="74996.739"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Follow a Gradient Reduction into the Next Step"></svg>
<script>window.TEACHING_CONFIG={"module": 2, "durationMs": 76138.820862, "posterMs": 74996.739, "audio_path": "audio/module2/slide_05_follow_a_gradient_reduction_into_the_next_step.wav", "audio_sha256": "4a2997120168cd2dd23fd36b15c7fd1f10c8741cea3ede8a16dae3b8306b06fe", "measured_audio": true, "timing_basis": "Local ASR word timestamps matched to approved paragraph openings and key quantities; remaining within-paragraph cues are proportional. Not forced alignment or human listening approval.", "alignment_file": "authoring/alignment/M2S5.json", "events": {"gradients": 16620.0, "mean": 30140.0, "updated": 44480.0}, "paragraphs": [{"paragraph": 0, "start": 0, "end": 12180.0, "text": "Follow one update through four data-parallel model replicas. Each worker has a rank, its identity within the group. Each replica starts step forty-two with the same weight, ten, and processes different input data.", "words": 33}, {"paragraph": 1, "start": 12180.0, "end": 23560.0, "text": "This is a scalar teaching example, with one weight and equally weighted batches. The local gradients are two, four, six, and eight. A gradient describes how the loss changes as a weight changes.", "words": 33, "alignment_match": 1}, {"paragraph": 2, "start": 23560.0, "end": 35780.0, "text": "The declared reduction sums those four contributions to twenty. We then divide by four to obtain the averaged gradient, five. Summation alone doesn't perform that division. Every participant receives the same result.", "words": 32, "alignment_match": 1}, {"paragraph": 3, "start": 35780.0, "end": 46560.0, "text": "Using simple stochastic gradient descent with a learning rate of zero point one, each replica subtracts zero point five from ten. All reach nine point five and advance to step forty-three.", "words": 31, "alignment_match": 1}, {"paragraph": 4, "start": 46560.0, "end": 55280.0, "text": "These are replicated models. Tensor or pipeline parallelism places different model parts on different resources. Don't confuse that arrangement with this example.", "words": 22, "alignment_match": 1}, {"paragraph": 5, "start": 55280.0, "end": 68900.0, "text": "Now a replacement worker arrives without the required state. It must pass a supported membership and restoration process before participating. Recovery must define the model, optimizer, and input-progress state required by the implementation.", "words": 33, "alignment_match": 1}, {"paragraph": 6, "start": 68900.0, "end": 76138.820861678, "text": "Matching operation identities and restored state matter. Accepting contributions merely in arrival order doesn't define the training algorithm.", "words": 18, "alignment_match": 1}], "final_hold_ms": 7238.821};</script><script src="teaching.js"></script></body></html>
