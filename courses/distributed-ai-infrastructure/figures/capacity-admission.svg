<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="590" rx="20" fill="white"/><rect x="55" y="65" width="340" height="280" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="79" y="108" class="lead" text-anchor="start"><tspan x="79" dy="0">Workload request</tspan></text><text x="79" y="153" class="small" text-anchor="start"><tspan x="79" dy="0">Compute and memory</tspan><tspan x="79" dy="31">Input and checkpoint paths</tspan><tspan x="79" dy="31">Communication pattern</tspan></text><rect x="805" y="65" width="340" height="280" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="829" y="108" class="lead" text-anchor="start"><tspan x="829" dy="0">Approved envelope</tspan></text><text x="829" y="153" class="small" text-anchor="start"><tspan x="829" dy="0">Electrical and thermal limits</tspan><tspan x="829" dy="31">Fabric and data readiness</tspan><tspan x="829" dy="31">Maintenance and redundancy</tspan></text><path d="M395 205 H450" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="465,205 450,197 450,213" fill="#8DC63F"/><rect x="465" y="120" width="270" height="170" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="489" y="163" class="lead" text-anchor="start"><tspan x="489" dy="0">Admission check</tspan></text><text x="489" y="208" class="small" text-anchor="start"><tspan x="489" dy="0">Demand fits?</tspan><tspan x="489" dy="31">Readiness passes?</tspan></text><path d="M805 205 H750" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="735,205 750,197 750,213" fill="#8DC63F"/><text x="600" y="430" class="lead" text-anchor="middle"><tspan x="600" dy="0">Start only when the complete contract is satisfied.</tspan></text><text x="600" y="486" class="" text-anchor="middle"><tspan x="600" dy="0">Otherwise keep the request pending, change demand,</tspan><tspan x="600" dy="31">or validate additional capacity.</tspan></text></svg>