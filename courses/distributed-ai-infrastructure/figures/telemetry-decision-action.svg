<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 1200 435" role="img" width="1200" height="435">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="435" rx="20" fill="white" x="0" y="65"/><rect x="50" y="90" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="74" y="133" class="lead" text-anchor="start"><tspan x="74" dy="0">Observe useful work</tspan></text><text x="74" y="178" class="small" text-anchor="start"><tspan x="74" dy="0">Step progress or serving SLO</tspan><tspan x="74" dy="31">Correlate system evidence</tspan><tspan x="74" dy="31">Preserve IDs + clock context</tspan></text><rect x="440" y="90" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="464" y="133" class="lead" text-anchor="start"><tspan x="464" dy="0">Decide within policy</tspan></text><text x="464" y="178" class="small" text-anchor="start"><tspan x="464" dy="0">Test the suspected cause</tspan><tspan x="464" dy="31">Declare authority and scope</tspan><tspan x="464" dy="31">Apply the action budget</tspan></text><rect x="830" y="90" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="854" y="133" class="lead" text-anchor="start"><tspan x="854" dy="0">Act and verify</tspan></text><text x="854" y="178" class="small" text-anchor="start"><tspan x="854" dy="0">Isolate, retry or recover</tspan><tspan x="854" dy="31">Check resulting readiness</tspan><tspan x="854" dy="31">Escalate or stop if needed</tspan></text><path d="M370 225 H425" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="440,225 425,217 425,233" fill="#8DC63F"/><path d="M760 225 H815" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="830,225 815,217 815,233" fill="#8DC63F"/><text x="600" y="470" class="lead" text-anchor="middle"><tspan x="600" dy="0">Observation supplies evidence. Policy authorizes action.</tspan></text></svg>
