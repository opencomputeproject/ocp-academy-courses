<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="580" rx="20" fill="white"/><rect x="45" y="80" width="330" height="230" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="69" y="123" class="lead" text-anchor="start"><tspan x="69" dy="0">Current group</tspan></text><text x="69" y="168" class="small" text-anchor="start"><tspan x="69" dy="0">Work uses declared roles,</tspan><tspan x="69" dy="31">state and membership.</tspan></text><rect x="435" y="80" width="330" height="230" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="459" y="123" class="lead" text-anchor="start"><tspan x="459" dy="0">Supported transition</tspan></text><text x="459" y="168" class="small" text-anchor="start"><tspan x="459" dy="0">Stop or re-form at the</tspan><tspan x="459" dy="31">framework’s defined boundary.</tspan></text><rect x="825" y="80" width="330" height="230" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="849" y="123" class="lead" text-anchor="start"><tspan x="849" dy="0">Ready group</tspan></text><text x="849" y="168" class="small" text-anchor="start"><tspan x="849" dy="0">Restore required state,</tspan><tspan x="849" dy="31">initialize and validate.</tspan></text><path d="M375 195 H420" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="435,195 420,187 420,203" fill="#8DC63F"/><path d="M765 195 H810" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="825,195 810,187 810,203" fill="#8DC63F"/><rect x="170" y="390" width="860" height="140" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="194" y="433" class="lead" text-anchor="start"><tspan x="194" dy="0">Two different readiness contracts</tspan></text><text x="194" y="478" class="small" text-anchor="start"><tspan x="194" dy="0">Serving replica: approved model + request readiness</tspan><tspan x="194" dy="31">Training participant: state + role + communication membership</tspan></text></svg>