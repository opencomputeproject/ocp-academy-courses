<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 1200 464" role="img" width="1200" height="464">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="464" rx="20" fill="white" x="0" y="45"/><rect x="50" y="70" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="74" y="113" class="lead" text-anchor="start"><tspan x="74" dy="0">Scale up</tspan></text><text x="74" y="158" class="small" text-anchor="start"><tspan x="74" dy="0">Closely connected</tspan><tspan x="74" dy="31">compute domain</tspan><tspan x="74" dy="31">Boundary ≠ one rack</tspan></text><rect x="440" y="70" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="464" y="113" class="lead" text-anchor="start"><tspan x="464" dy="0">Scale out</tspan></text><text x="464" y="158" class="small" text-anchor="start"><tspan x="464" dy="0">Domains in a cluster</tspan><tspan x="464" dy="31">Fabric and shared services</tspan><tspan x="464" dy="31">support the traffic pattern</tspan></text><rect x="830" y="70" width="320" height="270" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="854" y="113" class="lead" text-anchor="start"><tspan x="854" dy="0">Scale across</tspan></text><text x="854" y="158" class="small" text-anchor="start"><tspan x="854" dy="0">Between sites or domains</tspan><tspan x="854" dy="31">Data, artifacts, requests</tspan><tspan x="854" dy="31">or dependent computation</tspan></text><path d="M370 205 H425" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="440,205 425,197 425,213" fill="#8DC63F"/><path d="M760 205 H815" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="830,205 815,197 815,213" fill="#8DC63F"/><text x="600" y="428" class="lead" text-anchor="middle"><tspan x="600" dy="0">At each boundary, ask:</tspan></text><text x="600" y="480" class="" text-anchor="middle"><tspan x="600" dy="0">What crosses?   •   How often?   •   What must wait?</tspan></text></svg>
