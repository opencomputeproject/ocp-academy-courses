<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="610" rx="20" fill="white"/><rect x="60" y="75" width="465" height="230" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="84" y="118" class="lead" text-anchor="start"><tspan x="84" dy="0">Region A</tspan></text><text x="84" y="163" class="small" text-anchor="start"><tspan x="84" dy="0">Approved version V1</tspan><tspan x="84" dy="31">Existing traffic remains served.</tspan></text><rect x="675" y="75" width="465" height="230" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="699" y="118" class="lead" text-anchor="start"><tspan x="699" dy="0">Region B</tspan></text><text x="699" y="163" class="small" text-anchor="start"><tspan x="699" dy="0">Candidate version V2</tspan><tspan x="699" dy="31">Limited traffic + validation</tspan></text><path d="M525 190 H660" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="675,190 660,182 660,198" fill="#8DC63F"/><rect x="205" y="400" width="790" height="150" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="229" y="443" class="lead" text-anchor="start"><tspan x="229" dy="0">Promotion or rollback follows policy</tspan></text><text x="229" y="488" class="small" text-anchor="start"><tspan x="229" dy="0">Define session compatibility, data freshness and routing.</tspan><tspan x="229" dy="31">Model rollout does not by itself resolve application-state consistency.</tspan></text></svg>