<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="600" rx="20" fill="white"/><text x="65" y="72" class="lead" text-anchor="start"><tspan x="65" dy="0">Follow the dependency, not the arrival position.</tspan></text><rect x="65" y="135" width="280" height="170" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="89" y="178" class="lead" text-anchor="start"><tspan x="89" dy="0">Process A</tspan></text><text x="89" y="223" class="small" text-anchor="start"><tspan x="89" dy="0">Send message 17</tspan></text><rect x="455" y="135" width="280" height="170" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="479" y="178" class="lead" text-anchor="start"><tspan x="479" dy="0">Process B</tspan></text><text x="479" y="223" class="small" text-anchor="start"><tspan x="479" dy="0">Receive message 17</tspan></text><rect x="845" y="135" width="290" height="170" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="869" y="178" class="lead" text-anchor="start"><tspan x="869" dy="0">Dependent work</tspan></text><text x="869" y="223" class="small" text-anchor="start"><tspan x="869" dy="0">Use the received value</tspan></text><path d="M345 220 H440" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="455,220 440,212 440,228" fill="#8DC63F"/><path d="M735 220 H830" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="845,220 830,212 830,228" fill="#8DC63F"/><rect x="260" y="395" width="680" height="145" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="284" y="438" class="lead" text-anchor="start"><tspan x="284" dy="0">Independent event C</tspan></text><text x="284" y="483" class="small" text-anchor="start"><tspan x="284" dy="0">No dependency is declared between C and this chain.</tspan><tspan x="284" dy="31">C’s finish order does not create a new causal rule.</tspan></text></svg>