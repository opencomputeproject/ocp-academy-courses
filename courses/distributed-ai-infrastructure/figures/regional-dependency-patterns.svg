<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 477" role="img" width="1200" height="477">
<style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:23px}.small{font-size:20px;fill:#526673}.lead{font-size:27px;font-weight:700}.green{fill:#8DC63F}</style>
<rect width="1200" height="477" rx="20" fill="white" x="0" y="60"/><rect x="40" y="85" width="320" height="300" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="64" y="128" class="lead" text-anchor="start"><tspan x="64" dy="0">Regional work</tspan></text><text x="64" y="173" class="small" text-anchor="start"><tspan x="64" dy="0">Complete local jobs or replicas</tspan><tspan x="64" dy="31">Remote work need not block</tspan><tspan x="64" dy="31">every local operation</tspan></text><rect x="440" y="85" width="320" height="300" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="464" y="128" class="lead" text-anchor="start"><tspan x="464" dy="0">Buffered supply</tspan></text><text x="464" y="173" class="small" text-anchor="start"><tspan x="464" dy="0">Producer → buffer</tspan><tspan x="464" dy="31">Buffer → consumer</tspan><tspan x="464" dy="31">Absorb short variation</tspan><tspan x="464" dy="31">within the buffer budget</tspan></text><rect x="840" y="85" width="320" height="300" rx="16" fill="#f1f6f8" stroke="#c7d7dd" stroke-width="2"/><text x="864" y="128" class="lead" text-anchor="start"><tspan x="864" dy="0">Remote dependency</tspan></text><text x="864" y="173" class="small" text-anchor="start"><tspan x="864" dy="0">Remote result is required</tspan><tspan x="864" dy="31">Communication enters the</tspan><tspan x="864" dy="31">execution’s critical path</tspan></text><text x="600" y="477" class="" text-anchor="middle"><tspan x="600" dy="0">Placement follows the dependency and service objective.</tspan><tspan x="600" dy="31">A second site does not imply one stretched synchronous group.</tspan></text></svg>
