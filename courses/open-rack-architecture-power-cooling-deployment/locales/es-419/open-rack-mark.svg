<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <title>Open Structure — Open Rack course mark</title>
  <defs>
    <!-- One continuous silhouette, with shared vertices at every rail joint.
         Color boundaries are cut inside it rather than formed by end caps. -->
    <mask id="open-structure-frame" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <g fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M64 13 103 35V94L64 116 25 94V35Z"/>
        <path d="M25 35 64 57 103 35M64 57V116"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#open-structure-frame)">
    <path d="M0 0H128V128H0Z" fill="#343895"/>
    <!-- The crown follows the lower edges of its two front rails. -->
    <path d="M0 0H128V26.063L64 62.166 0 26.063Z" fill="#8DC63F"/>
    <!-- The lower color seam meets the front post's exact centerline, x=64. -->
    <path d="M98.5 30H128V128H64V110.834L98.5 91.372Z" fill="#8DC63F"/>
  </g>
  <!-- Both trays use the frame's 22:39 diagonal grid and are centered at x=64. -->
  <path d="M35 55.641 64 72 93 55.641V67.641L64 84 35 67.641Z" fill="#343895"/>
  <path d="M35 79.641 64 96 93 79.641V91.641L64 108 35 91.641Z" fill="#343895"/>
</svg>
