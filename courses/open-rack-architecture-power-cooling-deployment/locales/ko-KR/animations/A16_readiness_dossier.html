span></text><line x1="100" y1="585" x2="1800" y2="585" stroke="#BCC7CF" stroke-width="3"></line></g><g data-start="0.17" style="opacity: 1;"><g class="text-container" data-box="1120,420,680,140"><rect x="1120" y="420" width="680" height="140" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3"></rect><text x="1460" y="482.2499853515625" text-anchor="middle" style="font-size:34px;"><tspan x="1460" dy="0">제공됨: 개정 일치</tspan><tspan x="1460" dy="1.25em">전력 시스템 근거</tspan></text></g></g><g data-start="0" style="opacity: 1;"><text x="100" y="725" text-anchor="start" class="strong" style="font-size:37px;"><tspan x="100" dy="0em">열 / 유체</tspan></text><text x="100" y="780" text-anchor="start" class="small"><tspan x="100" dy="0em">호환성 + 열 배출 + 제어</tspan></text><line x1="100" y1="825" x2="1800" y2="825" stroke="#BCC7CF" stroke-width="3"></line></g><g data-start="0.34" style="opacity: 1;"><g class="text-container" data-box="1120,660,680,140"><rect x="1120" y="660" width="680" height="140" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3"></rect><text x="1460" y="722.2499853515624" text-anchor="middle" style="font-size:34px;"><tspan x="1460" dy="0">제공됨: 열 조건</tspan><tspan x="1460" dy="1.25em">및 시운전 기록</tspan></text></g></g><g data-start="0.84" style="opacity: 1;"><g class="text-container" data-box="220,940,1480,110"><rect x="220" y="940" width="1480" height="110" rx="10" fill="#FFF4E8" stroke="#A65D22" stroke-width="3"></rect><text x="960" y="1010.4999975585938" text-anchor="middle" style="font-size:39px;"><tspan x="960" dy="0">보류 — 탑재 경로 인수가 미해결</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0, 0], [0.17, 0.06359187057737571], [0.34, 0.08283677877842362], [0.66, 0.2020715361110031], [0.84, 0.34222467192298245], [1, 1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
