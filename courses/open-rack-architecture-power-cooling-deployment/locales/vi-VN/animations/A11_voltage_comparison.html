th="3"></rect><text x="430" y="414.2499963378906" text-anchor="middle" style="font-size:46px;"><tspan x="430" dy="0">50 V</tspan><tspan x="430" dy="1.25em">2,000 A</tspan></text></g></g><g data-start="0.19" style="opacity: 1;"><g class="text-container" data-box="130,600,600,190"><rect x="130" y="600" width="600" height="190" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3"></rect><text x="430" y="684.2500268554686" text-anchor="middle" style="font-size:46px;"><tspan x="430" dy="0">800 V</tspan><tspan x="430" dy="1.25em">125 A</tspan></text></g></g><g data-start="0.4" style="opacity: 1;"><line x1="850" y1="170" x2="850" y2="840" stroke="#BCC7CF" stroke-width="3"></line></g><g data-start="0.4" style="opacity: 1;"><g class="text-container" data-box="980,210,760,125"><rect x="980" y="210" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3"></rect><text x="1360" y="285.9999938964844" text-anchor="middle" style="font-size:35px;"><tspan x="1360" dy="0">Đầu nối + cách điện</tspan></text></g></g><g data-start="0.5" style="opacity: 1;"><g class="text-container" data-box="980,390,760,125"><rect x="980" y="390" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3"></rect><text x="1360" y="465.9999938964844" text-anchor="middle" style="font-size:35px;"><tspan x="1360" dy="0">Bảo vệ + cô lập</tspan></text></g></g><g data-start="0.6000000000000001" style="opacity: 1;"><g class="text-container" data-box="980,570,760,125"><rect x="980" y="570" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3"></rect><text x="1360" y="646.0000244140624" text-anchor="middle" style="font-size:35px;"><tspan x="1360" dy="0">Chuyển đổi + tương thích</tspan></text></g></g><g data-start="0.7000000000000001" style="opacity: 1;"><g class="text-container" data-box="980,750,760,125"><rect x="980" y="750" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3"></rect><text x="1360" y="826.0000244140624" text-anchor="middle" style="font-size:35px;"><tspan x="1360" dy="0">Bảo trì + đủ điều kiện</tspan></text></g></g><g data-start="0.75" style="opacity: 1;"><text x="960" y="980" text-anchor="middle" class="strong" style="font-size:37px;"><tspan x="960" dy="0em">Đoạn 50 V không đổi vẫn mang dòng ban đầu.</tspan></text></g></svg><script>window.TEACHING_CUE_MAP=[[0, 0], [0.09, 0.10266006875359873], [0.19, 0.1512664686532618], [0.4, 0.42488697843326173], [0.5, 0.4617607990467992], [0.6, 0.47558848177687574], [0.7, 0.5045009093033994], [0.75, 0.6654048537988358], [1, 1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
