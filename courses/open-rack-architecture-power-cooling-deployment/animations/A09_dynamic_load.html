<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A09 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="60347.709750567" data-poster-ms="56123.370068027"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Illustrative workload demand · no measured response or numeric time scale</tspan></text><g data-start="0" ><line x1="180" y1="650" x2="1650" y2="650" stroke="#28374A" stroke-width="4"/><line x1="180" y1="650" x2="180" y2="190" stroke="#28374A" stroke-width="4"/><text x="175" y="145" text-anchor="start" class="label"><tspan x="175" dy="0em">Power demand</tspan></text><text x="1660" y="700" text-anchor="start" class="small"><tspan x="1660" dy="0em">Time</tspan></text></g><g data-start="0.1" ><line x1="185" y1="440" x2="1620" y2="440" stroke="#BCC7CF" stroke-width="3" stroke-dasharray="12 10"/><text x="220" y="410" text-anchor="start" class="small"><tspan x="220" dy="0em">Illustrative capacity</tspan></text></g><g data-start="0.12" ><path d="M 190 560 L 540 560 L 540 270 L 860 270 L 860 500 L 1110 500 L 1110 340 L 1430 340 L 1430 560 L 1620 560" fill="none" stroke="#168A9B" stroke-width="9" stroke-linejoin="round" data-draw="0.12,0.58"/></g><g data-start="0.4" ><text x="700" y="220" text-anchor="middle" class="label"><tspan x="700" dy="0em">A load step</tspan></text><text x="1260" y="290" text-anchor="middle" class="label"><tspan x="1260" dy="0em">A later pulse</tspan></text></g><g data-start="0.4" ><g class="text-container" data-box="140,815,500,150"><rect x="140" y="815" width="500" height="150" rx="10" fill="#F0F6E7" stroke="none" stroke-width="3" /><text x="390.0" y="879.12" text-anchor="middle" style="font-size:34px;"><tspan x="390.0" dy="0em">Buffer limits</tspan><tspan x="390.0" dy="1.3em">power + energy + state</tspan></text></g></g><g data-start="0.63" ><g class="text-container" data-box="710,815,500,150"><rect x="710" y="815" width="500" height="150" rx="10" fill="#ECF7F9" stroke="none" stroke-width="3" /><text x="960.0" y="879.12" text-anchor="middle" style="font-size:34px;"><tspan x="960.0" dy="0em">Shared fault domains</tspan><tspan x="960.0" dy="1.3em">input + bus + control</tspan></text></g></g><g data-start="0.8" ><g class="text-container" data-box="1280,815,500,150"><rect x="1280" y="815" width="500" height="150" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="1530.0" y="879.12" text-anchor="middle" style="font-size:34px;"><tspan x="1530.0" dy="0em">Validate the response</tspan><tspan x="1530.0" dy="1.3em">event + topology</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.1,0.08915002776802912],[0.12,0.2469190638980301],[0.4,0.3668739060937109],[0.63,0.5292661499834294],[0.8,0.7721916903327429],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
