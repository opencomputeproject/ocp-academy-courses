x="605.0" dy="0em">Matching</tspan><tspan x="605.0" dy="1.3em">interface drawing</tspan></text></g></g><g data-start="0.28" ><polyline points="755,420 783,420 783,510" fill="none" stroke="#76A931" stroke-width="5" stroke-linejoin="round"/><line x1="783" y1="510" x2="792.0" y2="510.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="792.0,519.0 792.0,501.0 810,510" fill="#76A931"/></g><g data-start="0.32" ><g class="text-container" data-box="810,440,300,140"><rect x="810" y="440" width="300" height="140" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="960.0" y="500.08000000000004" text-anchor="middle" style="font-size:31px;"><tspan x="960.0" dy="0em">Component</tspan><tspan x="960.0" dy="1.3em">rating evidence</tspan></text></g></g><g data-start="0.44" ><polyline points="1110,510 1138,510 1138,600" fill="none" stroke="#76A931" stroke-width="5" stroke-linejoin="round"/><line x1="1138" y1="600" x2="1147.0" y2="600.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1147.0,609.0 1147.0,591.0 1165,600" fill="#76A931"/></g><g data-start="0.48" ><g class="text-container" data-box="1165,530,300,140"><rect x="1165" y="530" width="300" height="140" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="1315.0" y="590.72" text-anchor="middle" style="font-size:29px;"><tspan x="1315.0" dy="0em">Assembled-system</tspan><tspan x="1315.0" dy="1.3em">test evidence</tspan></text></g></g><g data-start="0.6" ><polyline points="1465,600 1493,600 1493,690" fill="none" stroke="#76A931" stroke-width="5" stroke-linejoin="round"/><line x1="1493" y1="690" x2="1502.0" y2="690.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1502.0,699.0 1502.0,681.0 1520,690" fill="#76A931"/></g><g data-start="0.64" ><g class="text-container" data-box="1520,620,300,140"><rect x="1520" y="620" width="300" height="140" rx="10" fill="#FFF4E8" stroke="#A65D22" stroke-width="3" /><text x="1670.0" y="680.72" text-anchor="middle" style="font-size:29px;"><tspan x="1670.0" dy="0em">Site acceptance</tspan><tspan x="1670.0" dy="1.3em">NOT YET SHOWN</tspan></text></g></g><g data-start="0.8" ><g class="text-container" data-box="420,870,1080,100"><rect x="420" y="870" width="1080" height="100" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="960.0" y="929.9" text-anchor="middle" style="font-size:30px;"><tspan x="960.0" dy="0em">Request the missing evidence before release.</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.16,0.28231369585156196],[0.32,0.3018190057467608],[0.48,0.4578614849083514],[0.64,0.5998738288821674],[0.8,0.7897939515459453],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
