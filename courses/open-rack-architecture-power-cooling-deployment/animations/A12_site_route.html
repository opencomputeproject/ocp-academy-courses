<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A12 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="55322.857142857" data-poster-ms="51450.257142857015"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Hypothetical route · no handling method, mass or floor rating is implied</tspan></text><g data-start="0" ><polyline points="160,465 1760,465" fill="none" stroke="#BCC7CF" stroke-width="12" stroke-linejoin="round"/><text x="230" y="720" text-anchor="middle" class="strong" style="font-size:32px;"><tspan x="230" dy="0em">Receiving</tspan></text><text x="720" y="720" text-anchor="middle" class="strong" style="font-size:32px;"><tspan x="720" dy="0em">Site route</tspan></text><text x="1240" y="720" text-anchor="middle" class="strong" style="font-size:32px;"><tspan x="1240" dy="0em">Handling gate</tspan></text><text x="1710" y="720" text-anchor="middle" class="strong" style="font-size:32px;"><tspan x="1710" dy="0em">Final position</tspan></text></g><g data-start="0.18" ><rect x="450" y="280" width="300" height="330" rx="0" fill="none" stroke="#BCC7CF" stroke-width="3" /><text x="600" y="220" text-anchor="middle" class="small"><tspan x="600" dy="0em">Openings + clearance</tspan></text><rect x="1510" y="280" width="300" height="330" rx="0" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-dasharray="10 8"/></g><g data-start="0.06" data-route="0.06,0.22,0.31,0.51,-800,-470"><rect x="960" y="310" width="170" height="300" rx="4" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><rect x="982" y="332" width="126" height="256" rx="0" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><rect x="1004" y="380" width="58" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="1004" y="450" width="58" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="1004" y="520" width="58" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="1082" y="355" width="14" height="210" rx="0" fill="#76A931" stroke="#76A931" stroke-width="3" /></g><g data-start="0.49" ><line x1="1240" y1="280" x2="1240" y2="610" stroke="#A65D22" stroke-width="14"/><text x="1240" y="235" text-anchor="middle" class="strong" style="font-size:38px;fill:#A65D22;"><tspan x="1240" dy="0em">HOLD</tspan></text></g><g data-start="0.68" ><g class="text-container" data-box="100,835,500,150"><rect x="100" y="835" width="500" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="350.0" y="900.08" text-anchor="middle" style="font-size:31px;"><tspan x="350.0" dy="0em">Transport evidence</tspan><tspan x="350.0" dy="1.3em">shipment configuration</tspan></text></g><g class="text-container" data-box="710,835,500,150"><rect x="710" y="835" width="500" height="150" rx="10" fill="#FFF4E8" stroke="#A65D22" stroke-width="3" /><text x="960.0" y="900.08" text-anchor="middle" style="font-size:31px;"><tspan x="960.0" dy="0em">Movement / handling</tspan><tspan x="960.0" dy="1.3em">qualified route review</tspan></text></g><g class="text-container" data-box="1320,835,500,150"><rect x="1320" y="835" width="500" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1570.0" y="900.08" text-anchor="middle" style="font-size:31px;"><tspan x="1570.0" dy="0em">Installed condition</tspan><tspan x="1570.0" dy="1.3em">support + service space</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.06,0.053504105768734184],[0.18,0.1424366058978464],[0.49,0.37778236843464336],[0.68,0.5961369622475855],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
