<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A13 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="56407.437641723" data-poster-ms="52458.917006802396"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Conceptual integration boundary · not a disconnect-under-load procedure</tspan></text><g data-start="0" ><rect x="130" y="210" width="430" height="570" rx="4" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><rect x="152" y="232" width="386" height="526" rx="0" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="280" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="350" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="420" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="490" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="560" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="630" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" stroke-width="3" /><rect x="174" y="700" width="318" height="44" rx="3" fill="#F4F6F8" stroke="#BCC7CF" text-anchor="start" class="label"><tspan x="1370" dy="0em">entry behavior</tspan></text></g><g data-start="0.74" ><g class="text-container" data-box="750,830,1020,150"><rect x="750" y="830" width="1020" height="150" rx="10" fill="#F0F6E7" stroke="none" stroke-width="3" /><text x="1260.0" y="894.76" text-anchor="middle" style="font-size:32px;"><tspan x="1260.0" dy="0em">Power: capacity, mating and entry behavior</tspan><tspan x="1260.0" dy="1.3em">Thermal: fluid and receiving-loop evidence</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.14,0.16629012754626207],[0.34,0.3878921098840313],[0.51,0.4056202684710528],[0.74,0.5605643745216211],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
