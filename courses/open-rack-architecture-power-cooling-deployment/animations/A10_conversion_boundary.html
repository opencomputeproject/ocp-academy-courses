n x="275.0" dy="0em">Higher-voltage</tspan><tspan x="275.0" dy="1.3em">feed</tspan></text></g></g><g data-start="0.5" ><line x1="450" y1="802.5" x2="532.0" y2="802.5" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="532.0,811.5 532.0,793.5 550,802.5" fill="#76A931"/></g><g data-start="0.5" ><g class="text-container" data-box="550,740,350,125"><rect x="550" y="740" width="350" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="725.0" y="792.9" text-anchor="middle" style="font-size:30px;"><tspan x="725.0" dy="0em">Higher-voltage</tspan><tspan x="725.0" dy="1.3em">distribution</tspan></text></g></g><g data-start="0.5" ><line x1="900" y1="802.5" x2="982.0" y2="802.5" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="982.0,811.5 982.0,793.5 1000,802.5" fill="#76A931"/></g><g data-start="0.5" ><g class="text-container" data-box="1000,740,350,125"><rect x="1000" y="740" width="350" height="125" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="1175.0" y="812.4" text-anchor="middle" style="font-size:30px;"><tspan x="1175.0" dy="0em">IT-side converter</tspan></text></g></g><g data-start="0.5" ><line x1="1350" y1="802.5" x2="1432.0" y2="802.5" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1432.0,811.5 1432.0,793.5 1450,802.5" fill="#76A931"/></g><g data-start="0.5" ><g class="text-container" data-box="1450,740,350,125"><rect x="1450" y="740" width="350" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1625.0" y="812.4" text-anchor="middle" style="font-size:30px;"><tspan x="1625.0" dy="0em">IT load</tspan></text></g></g><g data-start="0.78" ><text x="960" y="1000" text-anchor="middle" class="small"><tspan x="960" dy="0em">Compare conversion, protection, cabling, service and compatibility across the complete path.</tspan></text></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.06,0.06890013684401432],[0.28,0.2669447512901258],[0.5,0.5425452986661831],[0.78,0.792178457784446],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
