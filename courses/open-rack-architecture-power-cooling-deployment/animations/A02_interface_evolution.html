<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A02 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="65429.024943311" data-poster-ms="60848.99319727923"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Conceptual evolution map · branches are not universal replacements</tspan></text><g data-start="0" ><g class="text-container" data-box="100,390,350,150"><rect x="100" y="390" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="275.0" y="453.48" text-anchor="middle" style="font-size:36px;"><tspan x="275.0" dy="0em">Earlier Open Rack</tspan><tspan x="275.0" dy="1.3em">interfaces</tspan></text></g></g><g data-start="0.18" ><line x1="450" y1="465" x2="592.0" y2="465.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="592.0,474.0 592.0,456.0 610,465" fill="#76A931"/><g class="text-container" data-box="610,375,500,180"><rect x="610" y="375" width="500" height="180" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="860.0" y="452.2" text-anchor="middle" style="font-size:40px;"><tspan x="860.0" dy="0em">ORv3</tspan><tspan x="860.0" dy="1.3em">shared rack interfaces</tspan></text></g></g><g data-start="0.18" ><text x="640" y="315" text-anchor="start" class="small"><tspan x="640" dy="0em">Interface reuse + integration flexibility</tspan></text></g><g data-start="0.42" ><polyline points="1110,465 1240,465 1240,250" fill="none" stroke="#76A931" stroke-width="6" stroke-linejoin="round"/><line x1="1240" y1="250" x2="1332.0" y2="250.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1332.0,259.0 1332.0,241.0 1350,250" fill="#76A931"/><g class="text-container" data-box="1350,170,450,160"><rect x="1350" y="170" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#76A931" stroke-width="3" /><text x="1575.0" y="239.76" text-anchor="middle" style="font-size:32px;"><tspan x="1575.0" dy="0em">High-power work</tspan><tspan x="1575.0" dy="1.3em">power-path capability</tspan></text></g></g><g data-start="0.58" ><polyline points="1240,465 1240,680" fill="none" stroke="#168A9B" stroke-width="6" stroke-linejoin="round"/><line x1="1240" y1="680" x2="1332.0" y2="680.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="1332.0,689.0 1332.0,671.0 1350,680" fill="#168A9B"/><g class="text-container" data-box="1350,600,450,160"><rect x="1350" y="600" width="450" height="160" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3" /><text x="1575.0" y="669.76" text-anchor="middle" style="font-size:32px;"><tspan x="1575.0" dy="0em">Open Rack Wide</tspan><tspan x="1575.0" dy="1.3em">equipment envelope</tspan></text></g></g><g data-start="0.78" ><g class="text-container" data-box="440,870,1040,100"><rect x="440" y="870" width="1040" height="100" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="960.0" y="929.9" text-anchor="middle" style="font-size:30px;"><tspan x="960.0" dy="0em">Check the document revision and implementation</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.18,0.32798899293690353],[0.42,0.39584878457902145],[0.58,0.46279155200975947],[0.78,0.8305182607731285],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
