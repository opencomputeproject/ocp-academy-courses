<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A15 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="56681.315192744" data-poster-ms="52713.62312925192"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Conceptual liquid-to-liquid configuration · other cooling topologies exist</tspan></text><g data-start="0" ><g class="text-container" data-box="90,365,320,210"><rect x="90" y="365" width="320" height="210" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="250.0" y="458.48" text-anchor="middle" style="font-size:36px;"><tspan x="250.0" dy="0em">Facility-side</tspan><tspan x="250.0" dy="1.3em">heat removal</tspan></text></g><g class="text-container" data-box="690,310,360,320"><rect x="690" y="310" width="360" height="320" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3" /><text x="870.0" y="457.84000000000003" text-anchor="middle" style="font-size:38px;"><tspan x="870.0" dy="0em">CDU / heat</tspan><tspan x="870.0" dy="1.3em">exchanger</tspan></text></g><g class="text-container" data-box="1430,355,360,230"><rect x="1430" y="355" width="360" height="230" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="1610.0" y="459.12" text-anchor="middle" style="font-size:34px;"><tspan x="1610.0" dy="0em">IT equipment</tspan><tspan x="1610.0" dy="1.3em">+ cold plates</tspan></text></g></g><g data-start="0" ><line x1="1050" y1="385" x2="1412.0" y2="385.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="1412.0,394.0 1412.0,376.0 1430,385" fill="#168A9B"/><text x="1210" y="325" text-anchor="middle" class="label"><tspan x="1210" dy="0em">Supply</tspan></text></g><g data-start="0" ><line x1="1430" y1="560" x2="1068.0" y2="560.0" stroke="#A65D22" stroke-width="6"/><polygon class="arrowhead" points="1068.0,551.0 1068.0,569.0 1050,560" fill="#A65D22"/><text x="1210" y="620" text-anchor="middle" class="label"><tspan x="1210" dy="0em">Return</tspan></text></g><g data-start="0" ><line x1="410" y1="405" x2="672.0" y2="405.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="672.0,414.0 672.0,396.0 690,405" fill="#168A9B"/><line x1="690" y1="540" x2="428.0" y2="540.0" stroke="#A65D22" stroke-width="6"/><polygon class="arrowhead" points="428.0,531.0 428.0,549.0 410,540" fill="#A65D22"/><text x="550" y="315" text-anchor="middle" class="small"><tspan x="550" dy="0em">Separate loop</tspan></text></g><g data-start="0" ><text x="1240" y="470" text-anchor="middle" class="small"><tspan x="1240" dy="0em">Rack manifolds</tspan></text><line x1="1350" y1="360" x2="1350" y2="590" stroke="#BCC7CF" stroke-width="3" stroke-dasharray="7 7"/></g><g data-start="0" ><line x1="1610" y1="355" x2="1610.0" y2="213.0" stroke="#A65D22" stroke-width="6"/><polygon class="arrowhead" points="1619.0,213.0 1601.0,213.0 1610,195" fill="#A65D22"/><g class="text-container" data-box="1430,95,360,100"><rect x="1430" y="95" width="360" height="100" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="1610.0" y="155.56" text-anchor="middle" style="font-size:32px;"><tspan x="1610.0" dy="0em">Residual air heat</tspan></text></g></g><g data-start="0.67" ><polyline points="1360,340 1830,340 1830,620 1360,620 1360,340" fill="none" stroke="#A65D22" stroke-width="3" stroke-linejoin="round" stroke-dasharray="12 9"/><text x="1450" y="685" text-anchor="start" class="label" style="fill:#A65D22;"><tspan x="1450" dy="0em">Illustrative low-flow anomaly</tspan></text></g><g data-start="0.7" ><g class="text-container" data-box="90,805,500,150"><rect x="90" y="805" width="500" height="150" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="340.0" y="870.4" text-anchor="middle" style="font-size:30px;"><tspan x="340.0" dy="0em">Observe</tspan><tspan x="340.0" dy="1.3em">flow • pressure • temperature</tspan></text></g></g><g data-start="0.79" ><g class="text-container" data-box="690,805,500,150"><rect x="690" y="805" width="500" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="940.0" y="870.4" text-anchor="middle" style="font-size:30px;"><tspan x="940.0" dy="0em">Decide</tspan><tspan x="940.0" dy="1.3em">validated response only</tspan></text></g></g><g data-start="0.86" ><g class="text-container" data-box="1290,805,500,150"><rect x="1290" y="805" width="500" height="150" rx="10" fill="#F0F6E7" stroke="none" stroke-width="3" /><text x="1540.0" y="870.4" text-anchor="middle" style="font-size:30px;"><tspan x="1540.0" dy="0em">Verify</tspan><tspan x="1540.0" dy="1.3em">conditions before recovery</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.67,0.0007056999271096787],[0.7,0.08503684121671629],[0.79,0.4213028564844782],[0.86,0.6548895323577818],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
