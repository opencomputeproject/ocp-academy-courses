<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A06 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="60137.46031746" data-poster-ms="55927.8380952378"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Documented implementation examples · not a product ranking</tspan></text><g data-start="0" ><g class="text-container" data-box="90,140,1720,100"><rect x="90" y="140" width="1720" height="100" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="950.0" y="202.54" text-anchor="middle" style="font-size:38px;"><tspan x="950.0" dy="0em">ORv3 base interfaces — common starting point</tspan></text></g></g><g data-start="0.08" ><text x="700" y="330" text-anchor="middle" class="strong" style="font-size:40px;"><tspan x="700" dy="0em">Meta Rev 1.3</tspan></text><text x="1410" y="330" text-anchor="middle" class="strong" style="font-size:40px;"><tspan x="1410" dy="0em">Google Rev 0.2</tspan></text></g><g data-start="0.18" ><line x1="100" y1="370" x2="1800" y2="370" stroke="#BCC7CF" stroke-width="3"/><text x="100" y="420" text-anchor="start" class="strong" style="font-size:30px;"><tspan x="100" dy="0em">Scope</tspan></text><text x="700" y="420" text-anchor="middle" style="font-size:30px;"><tspan x="700" dy="0em">Option 1 implementation</tspan></text><text x="1410" y="420" text-anchor="middle" style="font-size:30px;"><tspan x="1410" dy="0em">ORv3 + 19-inch EIA support</tspan></text></g><g data-start="0.33999999999999997" ><line x1="100" y1="495" x2="1800" y2="495" stroke="#BCC7CF" stroke-width="3"/><text x="100" y="545" text-anchor="start" class="strong" style="font-size:30px;"><tspan x="100" dy="0em">Mechanical</tspan></text><text x="700" y="545" text-anchor="middle" style="font-size:30px;"><tspan x="700" dy="0em">44 OU / 47 RU capacity</tspan></text><text x="1410" y="545" text-anchor="middle" style="font-size:30px;"><tspan x="1410" dy="0em">Add-on payload support kits</tspan></text></g><g data-start="0.5" ><line x1="100" y1="620" x2="1800" y2="620" stroke="#BCC7CF" stroke-width="3"/><text x="100" y="670" text-anchor="start" class="strong" style="font-size:30px;"><tspan x="100" dy="0em">Configuration</tspan></text><text x="700" y="670" text-anchor="middle" style="font-size:30px;"><tspan x="700" dy="0em">Accessory and cooling options</tspan></text><text x="1410" y="670" text-anchor="middle" style="font-size:30px;"><tspan x="1410" dy="0em">Two base-depth options</tspan></text></g><g data-start="0.6599999999999999" ><line x1="100" y1="745" x2="1800" y2="745" stroke="#BCC7CF" stroke-width="3"/><text x="100" y="795" text-anchor="start" class="strong" style="font-size:30px;"><tspan x="100" dy="0em">Qualification</tspan></text><text x="700" y="795" text-anchor="middle" style="font-size:30px;"><tspan x="700" dy="0em">Check the assembled configuration</tspan></text><text x="1410" y="795" text-anchor="middle" style="font-size:30px;"><tspan x="1410" dy="0em">Check the assembled configuration</tspan></text></g><g data-start="0.82" ><g class="text-container" data-box="330,945,1260,100"><rect x="330" y="945" width="1260" height="100" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="960.0" y="1004.9" text-anchor="middle" style="font-size:30px;"><tspan x="960.0" dy="0em">Preferred implementation depends on the requirement set.</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.08,0.0036582855151953463],[0.18,0.12138856482239103],[0.34,0.16828113369898592],[0.5,0.2973188409622399],[0.66,0.5371028279127712],[0.82,0.7785496719156642],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
