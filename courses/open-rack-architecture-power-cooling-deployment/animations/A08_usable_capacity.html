<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A08 editable teaching source</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}svg{display:block;width:100%;height:100%;object-fit:contain}</style></head><body data-duration-ms="54645.804988662" data-poster-ms="50820.59863945566"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1920" height="1080" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Hypothetical capacity case · matched units, equal sharing and stated downstream limit</tspan></text><g data-start="0" ><g class="text-container" data-box="90,400,360,150"><rect x="90" y="400" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="270.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="270.0" dy="0em">Facility input</tspan></text></g></g><g data-start="0.16" ><line x1="450" y1="475" x2="522.0" y2="475.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="522.0,484.0 522.0,466.0 540,475" fill="#76A931"/></g><g data-start="0" ><g class="text-container" data-box="540,400,360,150"><rect x="540" y="400" width="360" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="720.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="720.0" dy="0em">Power shelves</tspan></text></g></g><g data-start="0.16" ><line x1="900" y1="475" x2="972.0" y2="475.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="972.0,484.0 972.0,466.0 990,475" fill="#76A931"/></g><g data-start="0.16" ><g class="text-container" data-box="990,400,360,150"><rect x="990" y="400" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="1170.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="1170.0" dy="0em">Distribution</tspan></text></g></g><g data-start="0.16" ><line x1="1350" y1="475" x2="1422.0" y2="475.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1422.0,484.0 1422.0,466.0 1440,475" fill="#76A931"/></g><g data-start="0.16" ><g class="text-container" data-box="1440,400,360,150"><rect x="1440" y="400" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="1620.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="1620.0" dy="0em">IT demand</tspan></text></g></g><g data-start="0.12" ><g class="text-container" data-box="540,145,360,150"><rect x="540" y="145" width="360" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="720.0" y="208.8" text-anchor="middle" style="font-size:35px;"><tspan x="720.0" dy="0em">6 × 12 kW</tspan><tspan x="720.0" dy="1.3em">72 kW installed</tspan></text></g><line x1="720" y1="295" x2="720.0" y2="382.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="711.0,382.0 729.0,382.0 720,400" fill="#76A931"/></g><g data-start="0.48" ><text x="270" y="645" text-anchor="middle" class="small"><tspan x="270" dy="0em">Input + protection</tspan></text><text x="1170" y="645" text-anchor="middle" class="small"><tspan x="1170" dy="0em">Busbar + connections</tspan></text><text x="1620" y="645" text-anchor="middle" class="small"><tspan x="1620" dy="0em">Thermal + mechanical</tspan></text></g><g data-start="0.48" ><rect x="70" y="355" width="1750" height="355" rx="12" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-dasharray="12 9"/></g><g data-start="0.35" ><g class="text-container" data-box="140,800,720,150"><rect x="140" y="800" width="720" height="150" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="500.0" y="863.48" text-anchor="middle" style="font-size:36px;"><tspan x="500.0" dy="0em">One unit unavailable</tspan><tspan x="500.0" dy="1.3em">5 × 12 kW = 60 kW</tspan></text></g></g><g data-start="0.58" ><g class="text-container" data-box="1010,800,720,150"><rect x="1010" y="800" width="720" height="150" rx="10" fill="#ECF7F9" stroke="none" stroke-width="3" /><text x="1370.0" y="865.08" text-anchor="middle" style="font-size:31px;"><tspan x="1370.0" dy="0em">Qualified downstream limit: 55 kW</tspan><tspan x="1370.0" dy="1.3em">Usable: 55 kW before extra margin</tspan></text></g></g></svg><script>window.TEACHING_CUE_MAP=[[0,0],[0.12,0.03403737945457865],[0.35,0.14163941773034344],[0.48,0.25619532922801136],[0.58,0.2821808554782811],[1,1]];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
window.renderFraction=function(f){
 f=clamp(Number(f)||0,0,1); window.currentTeachingFraction=f;
 const cues=window.TEACHING_CUE_MAP;
 if(Array.isArray(cues)&&cues.length>1){
  let j=1;while(j<cues.length-1&&f>cues[j][1])j++;
  const a=cues[j-1],b=cues[j];
  f=a[0]+clamp((f-a[1])/(b[1]-a[1]),0,1)*(b[0]-a[0]);
 }
 for(const g of document.querySelectorAll('[data-start]')){
  const a=Number(g.dataset.start), b=g.dataset.end?Number(g.dataset.end):2;
  const enter=a===0?1:clamp((f-a)/.025,0,1);
  const leave=b===2?1:1-clamp((f-b)/.025,0,1);
  g.style.opacity=String(Math.min(enter,leave));
 }
 for(const g of document.querySelectorAll('[data-move]')){
  const [a,b,dx,dy]=g.dataset.move.split(',').map(Number);
  const t=clamp((f-a)/(b-a),0,1); const e=t*t*(3-2*t);
  g.setAttribute('transform',`translate(${dx*(1-e)} ${dy*(1-e)})`);
 }
 for(const g of document.querySelectorAll('[data-draw]')){
  const [a,b]=g.dataset.draw.split(',').map(Number); const t=clamp((f-a)/(b-a),0,1);
  const length=g.getTotalLength(); g.style.strokeDasharray=String(length);g.style.strokeDashoffset=String(length*(1-t));
 }
 for(const g of document.querySelectorAll('[data-route]')){
  const [a,b,c,d,start,mid]=g.dataset.route.split(',').map(Number);
  const tween=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  const dx=f<c?start+(mid-start)*tween((f-a)/(b-a)):mid*(1-tween((f-c)/(d-c)));
  g.setAttribute('transform',`translate(${dx} 0)`);
 }
};
window.setTeachingTime=function(ms){window.renderFraction(ms/Number(document.body.dataset.durationMs));};
window.renderAt=function(seconds){window.setTeachingTime(seconds*1000);};
window.setDuration=function(seconds){document.body.dataset.durationMs=String(seconds*1000);document.body.dataset.posterMs=String(seconds*1000*.92);};
window.renderFraction(0);
</script></body></html>
