<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 35 1770 1050" width="1770" height="1050" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="65" y="35" width="1770" height="1050" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Hypothetical deployment dossier · evidence statuses are scenario inputs</tspan></text><g ><text x="100" y="245" text-anchor="start" class="strong" style="font-size:37px;"><tspan x="100" dy="0em">Mechanical / logistics</tspan></text><text x="100" y="300" text-anchor="start" class="small"><tspan x="100" dy="0em">Configuration + route + handling</tspan></text><line x1="100" y1="345" x2="1800" y2="345" stroke="#BCC7CF" stroke-width="3"/></g><g ><g class="text-container" data-box="1120,180,680,140"><rect x="1120" y="180" width="680" height="140" rx="10" fill="#FFF4E8" stroke="#A65D22" stroke-width="3" /><text x="1460.0" y="239.12" text-anchor="middle" style="font-size:34px;"><tspan x="1460.0" dy="0em">OPEN: qualified</tspan><tspan x="1460.0" dy="1.3em">loaded-route acceptance</tspan></text></g></g><g ><text x="100" y="485" text-anchor="start" class="strong" style="font-size:37px;"><tspan x="100" dy="0em">Electrical / control</tspan></text><text x="100" y="540" text-anchor="start" class="small"><tspan x="100" dy="0em">Capacity + protection + operating state</tspan></text><line x1="100" y1="585" x2="1800" y2="585" stroke="#BCC7CF" stroke-width="3"/></g><g ><g class="text-container" data-box="1120,420,680,140"><rect x="1120" y="420" width="680" height="140" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="1460.0" y="479.12" text-anchor="middle" style="font-size:34px;"><tspan x