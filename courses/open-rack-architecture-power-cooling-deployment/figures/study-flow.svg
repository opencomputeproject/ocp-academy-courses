<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img"><title>For the same coolant and heat load, a larger flow needs a smaller temperature rise.</title><text x="166" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Smaller flow</text><text x="510" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Larger flow</text><line x1="80" y1="90" x2="255" y2="90" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><line x1="80" y1="105" x2="255" y2="105" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><text x="163" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Larger temperature rise</text><line x1="425" y1="90" x2="600" y2="90" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><line x1="425" y1="105" x2="600" y2="105" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><line x1="425" y1="120" x2="600" y2="120" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><line x1="425" y1="135" x2="600" y2="135" stroke="#176889" stroke-width="5" stroke-dasharray="none"/><text x="508" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Smaller temperature rise</text><text x="335" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#243c4a">Comparison at the same heat load and with the same coolant.</text></svg>
