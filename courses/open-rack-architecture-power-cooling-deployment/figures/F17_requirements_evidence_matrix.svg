<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 650" width="1820" height="650" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1820" height="650" fill="white"/><text x="60" y="55" text-anchor="start" class="tiny"><tspan x="60" dy="0em">Example review structure · records must match the proposed configuration</tspan></text><text x="60" y="135" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="60" dy="0em">Requirement</tspan></text><text x="600" y="135" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="600" dy="0em">Supporting record</tspan></text><text x="1250" y="135" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="1250" dy="0em">Closure condition</tspan></text><line x1="60" y1="180" x2="1760" y2="180" stroke="#BCC7CF" stroke-width="3"/><text x="60" y="235" text-anchor="start" style="font-size:31px;"><tspan x="60" dy="0em">Connection position</tspan></text><text x="600" y="235" text-anchor="start" style="font-size:31px;"><tspan x="600" dy="0em">Revision-matched drawing</tspan><tspan x="600" dy="1.3em">+ inspection result</tspan></text><text x="1250" y="235" text-anchor="start" style="font-size:31px;"><tspan x="1250" dy="0em">Within the specified</tspan><tspan x="1250" dy="1.3em">interface envelope</tspan></text><line x1="60" y1="330" x2="1760" y2="330" stroke="#BCC7CF" stroke-width="3"/><text x="60" y="385" text-anchor="start" style="font-size:31px;"><tspan x="60" dy="0em">Thermal conditions</tspan></text><text x="600" y="385" text-anchor="start" style="font-size:31px;"><tspan x="600" dy="0em">Configured test evidence</tspan><tspan x="600" dy="1.3em">+ receiving-loop commitment</tspan></text><text x="1250" y="385" text-anchor="start" style="font-size:31px;"><tspan x="1250" dy="0em">Required conditions</tspan><tspan x="1250" dy="1.3em">available at the handoff</tspan></text><line x1="60" y1="480" x2="1760" y2="480" stroke="#BCC7CF" stroke-width="3"/><text x="60" y="535" text-anchor="start" style="font-size:31px;"><tspan x="60" dy="0em">Loaded move</tspan></text><text x="600" y="535" text-anchor="start" style="font-size:31px;"><tspan x="600" dy="0em">Approved handling configuration</tspan><tspan x="600" dy="1.3em">+ site-route review</tspan></text><text x="1250" y="535" text-anchor="start" style="font-size:31px;"><tspan x="1250" dy="0em">Qualified owner accepts</tspan><tspan x="1250" dy="1.3em">the actual move</tspan></text></svg>