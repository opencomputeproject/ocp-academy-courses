<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 825" width="1840" height="825" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1840" height="825" fill="white"/><text x="60" y="55" text-anchor="start" class="tiny"><tspan x="60" dy="0em">Conceptual handover record · not a commissioning procedure</tspan></text><polyline points="80,120 350,120 410,180 410,390 80,390 80,120" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><polyline points="350,120 350,180 410,180" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><text x="245" y="245" text-anchor="middle" class="strong" style="font-size:34px;"><tspan x="245" dy="0em">Configuration</tspan></text><text x="245" y="305" text-anchor="middle" style="font-size:26px;"><tspan x="245" dy="0em">equipment + revisions</tspan></text><line x1="245" y1="390" x2="245.0" y2="512.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="236.0,512.0 254.0,512.0 245,530" fill="#76A931"/><polyline points="530,120 800,120 860,180 860,390 530,390 530,120" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><polyline points="800,120 800,180 860,180" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><text x="695" y="245" text-anchor="middle" class="strong" style="font-size:34px;"><tspan x="695" dy="0em">Acceptance</tspan></text><text x="695" y="305" text-anchor="middle" style="font-size:26px;"><tspan x="695" dy="0em">conditions + results</tspan></text><line x1="695" y1="390" x2="695.0" y2="512.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="686.0,512.0 704.0,512.0 695,530" fill="#76A931"/><polyline points="980,120 1250,120 1310,180 1310,390 980,390 980,120" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><polyline points="1250,120 1250,180 1310,180" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><text x="1145" y="245" text-anchor="middle" class="strong" style="font-size:34px;"><tspan x="1145" dy="0em">Limits</tspan></text><text x="1145" y="305" text-anchor="middle" style="font-size:26px;"><tspan x="1145" dy="0em">restrictions + exceptions</tspan></text><line x1="1145" y1="390" x2="1145.0" y2="512.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1136.0,512.0 1154.0,512.0 1145,530" fill="#76A931"/><polyline points="1430,120 1700,120 1760,180 1760,390 1430,390 1430,120" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><polyline points="1700,120 1700,180 1760,180" fill="none" stroke="#BCC7CF" stroke-width="3" stroke-linejoin="round"/><text x="1595" y="245" text-anchor="middle" class="strong" style="font-size:34px;"><tspan x="1595" dy="0em">Response</tspan></text><text x="1595" y="305" text-anchor="middle" style="font-size:26px;"><tspan x="1595" dy="0em">signals + owners</tspan></text><line x1="1595" y1="390" x2="1595.0" y2="512.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1586.0,512.0 1604.0,512.0 1595,530" fill="#76A931"/><g class="text-container" data-box="80,530,1680,130"><rect x="80" y="530" width="1680" height="130" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="920.0" y="607.87" text-anchor="middle" style="font-size:39px;"><tspan x="920.0" dy="0em">Accepted configuration + traceable operating record</tspan></text></g><text x="920" y="765" text-anchor="middle" class="strong" style="font-size:32px;"><tspan x="920" dy="0em">A change to equipment, fluid, routing or controls triggers a scoped reassessment.</tspan></text></svg>