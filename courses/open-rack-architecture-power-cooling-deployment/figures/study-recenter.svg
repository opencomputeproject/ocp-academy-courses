<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img"><title>The unmated valve bodies return toward center. The published design has a limited mating range.</title><text x="166" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Body pivots at its mount</text><text x="510" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Unmated body recenters</text><line x1="91" y1="131" x2="257" y2="131" stroke="#526978" stroke-width="1" stroke-dasharray="4 4"/><line x1="91" y1="86" x2="91" y2="173" stroke="#526978" stroke-width="5" stroke-dasharray="none"/><circle cx="113" cy="131" r="9" fill="#243c4a"/><line x1="113" y1="131" x2="238" y2="109" stroke="#176889" stroke-width="12" stroke-dasharray="none"/><line x1="424" y1="131" x2="590" y2="131" stroke="#526978" stroke-width="1" stroke-dasharray="4 4"/><line x1="424" y1="86" x2="424" y2="173" stroke="#526978" stroke-width="5" stroke-dasharray="none"/><circle cx="446" cy="131" r="9" fill="#243c4a"/><line x1="446" y1="131" x2="571" y2="131" stroke="#176889" stroke-width="12" stroke-dasharray="none"/><text x="335" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243c4a">The next tray approaches a centered connection.</text></svg>
