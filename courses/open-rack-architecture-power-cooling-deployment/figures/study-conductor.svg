<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img"><title>In this example only cross-sectional area changes. Matching the mounting holes does not establish a current rating.</title><text x="166" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Cross-section A</text><text x="510" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Cross-section 2A</text><rect x="141.5" y="75" width="43" height="65" fill="#d7a280" stroke="#9c4b2f" stroke-width="2"/><text x="163" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243c4a">Resistance R</text><rect x="463.0" y="75" width="86" height="65" fill="#d7a280" stroke="#9c4b2f" stroke-width="2"/><text x="506" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243c4a">About half the resistance</text><text x="335" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Same material, length, temperature and current.</text></svg>
