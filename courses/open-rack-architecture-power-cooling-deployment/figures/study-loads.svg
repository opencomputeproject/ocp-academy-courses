<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img"><title>Two example jobs consume the same energy whether their run times overlap or not. Their peak combined demand changes.</title><text x="166" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Jobs overlap</text><text x="510" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">Jobs run in sequence</text><line x1="58" y1="182" x2="302" y2="182" stroke="#526978" stroke-width="2" stroke-dasharray="none"/><line x1="58" y1="57" x2="58" y2="182" stroke="#526978" stroke-width="2" stroke-dasharray="none"/><rect x="66" y="133" width="91" height="48" fill="#d6eaf0" stroke="#176889" stroke-width="2"/><rect x="66" y="84" width="91" height="48" fill="#dfefd4" stroke="#487438" stroke-width="2"/><text x="110" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#243c4a">Job A</text><text x="110" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#243c4a">Job B</text><text x="171" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#176889">Higher peak</text><line x1="382" y1="182" x2="626" y2="182" stroke="#526978" stroke-width="2" stroke-dasharray="none"/><line x1="382" y1="57" x2="382" y2="182" stroke="#526978" stroke-width="2" stroke-dasharray="none"/><rect x="390" y="133" width="91" height="48" fill="#d6eaf0" stroke="#176889" stroke-width="2"/><rect x="483" y="133" width="91" height="48" fill="#dfefd4" stroke="#487438" stroke-width="2"/><text x="434" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#243c4a">Job A</text><text x="527" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#243c4a">Job B</text><text x="495" y="214" te