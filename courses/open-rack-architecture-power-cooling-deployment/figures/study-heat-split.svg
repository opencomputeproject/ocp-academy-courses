<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img"><title>Illustrative 1,000 W tray: 800 W leaves in liquid and 200 W in air. The split is an example, not a target.</title><text x="335" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243c4a">1,000 W of heat from one example tray</text><rect x="64" y="97" width="432" height="62" fill="#d6eaf0" stroke="#176889" stroke-width="2"/><rect x="496" y="97" width="108" height="62" fill="#dfefd4" stroke="#487438" stroke-width="2"/><text x="275" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243c4a">800 W to liquid</text><text x="551" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243c4a">200 W</text><text x="551" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">to air</text></svg>
