<svg xmlns="http://www.w3.org/2000/svg" width="650" height="161" viewBox="0 0 650 161" role="img"><title>One accelerator sends a partial result through a switch to the accelerator that needs it.</title><rect x="11" y="28" width="150" height="67" fill="#d6eaf0" stroke="#176889" stroke-width="2"/><text x="86" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243c4a">Accelerator A</text><text x="86" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Produces a result</text><rect x="250" y="28" width="150" height="67" fill="#dfefd4" stroke="#487438" stroke-width="2"/><text x="325" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243c4a">Switch</text><text x="325" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Forwards the data</text><rect x="489" y="28" width="150" height="67" fill="#d6eaf0" stroke="#176889" stroke-width="2"/><text x="564" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243c4a">Accelerator B</text><text x="564" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243c4a">Uses the result</text><line x1="161" y1="61" x2="237" y2="61" stroke="#176889" stroke-width="3" stroke-dasharray="none"/><polygon class="arrowhead" points="237,54 250,61 237,68" fill="#176889"/><line x1="400" y1="61" x2="476" y2="61" stroke="#176889" stroke-width="3" stroke-dasharray="none"/><polygon class="arrowhead" points="476,54 489,61 476,68" fill="#176889"/></svg>
