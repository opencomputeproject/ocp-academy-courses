<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 35 1820 990" width="1820" height="990" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="40" y="35" width="1820" height="990" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Hypothetical capacity case · matched units, equal sharing and stated downstream limit</tspan></text><g ><g class="text-container" data-box="90,400,360,150"><rect x="90" y="400" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="270.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="270.0" dy="0em">Facility input</tspan></text></g></g><g ><line x1="450" y1="475" x2="522.0" y2="475.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="522.0,484.0 522.0,466.0 540,475" fill="#76A931"/></g><g ><g class="text-container" data-box="540,400,360,150"><rect x="540" y="400" width="360" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="720.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="720.0" dy="0em">Power shelves</tspan></text></g></g><g ><line x1="900" y1="475" x2="972.0" y2="475.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="972.0,484.0 972.0,466.0 990,475" fill="#76A931"/></g><g ><g class="text-container" data-box="990,400,360,150"><rect x="990" y="400" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="1170.0" y="486.22" text-anchor="middle" style="font-size:34px;"><tspan x="1170.0" dy="0em">Distribution</tspan></text></g></g><g ><line x1="1350" y1="475" x2="1422.0" y2="475.0" stroke="#76A931" stroke-