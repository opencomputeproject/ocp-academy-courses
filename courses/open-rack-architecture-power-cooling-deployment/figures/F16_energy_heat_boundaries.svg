<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 670" width="1700" height="670" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1700" height="670" fill="white"/><text x="50" y="60" text-anchor="start" class="tiny"><tspan x="50" dy="0em">Conceptual energy map · not an electrical circuit or hydraulic drawing</tspan></text><g class="text-container" data-box="50,245,350,150"><rect x="50" y="245" width="350" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="225.0" y="309.12" text-anchor="middle" style="font-size:34px;"><tspan x="225.0" dy="0em">Rack electrical</tspan><tspan x="225.0" dy="1.3em">input</tspan></text></g><line x1="400" y1="320" x2="632.0" y2="320.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="632.0,329.0 632.0,311.0 650,320" fill="#76A931"/><g class="text-container" data-box="650,220,360,200"><rect x="650" y="220" width="360" height="200" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="830.0" y="308.48" text-anchor="middle" style="font-size:36px;"><tspan x="830.0" dy="0em">IT + rack</tspan><tspan x="830.0" dy="1.3em">power hardware</tspan></text></g><polyline points="1010,270 1110,270 1110,140" fill="none" stroke="#168A9B" stroke-width="6" stroke-linejoin="round"/><line x1="1110" y1="140" x2="1222.0" y2="140.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="1222.0,149.0 1222.0,131.0 1240,140" fill="#168A9B"/><g class="text-container" data-box="1240,65,400,150"><rect x="1240" y="65" width="400" height="150" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3" /><text x="1440.0" y="129.12" text-anchor="middle" style="font-size:34px;"><tspan x="1440.0" dy="0em">Liquid-side</tspan><tspan x="1440.0" dy="1.3em">heat removal</tspan></text></g><polyline points="1010,370 1110,370 1110,500" fill="none" stroke="#A65D22" stroke-width="6" stroke-linejoin="round"/><line x1="1110" y1="500" x2="1222.0" y2="500.0" stroke="#A65D22" stroke-width="6"/><polygon class="arrowhead" points="1222.0,509.0 1222.0,491.0 1240,500" fill="#A65D22"/><g class="text-container" data-box="1240,425,400,150"><rect x="1240" y="425" width="400" height="150" rx="10" fill="#FFF4E8" stroke="#A65D22" stroke-width="3" /><text x="1440.0" y="489.12" text-anchor="middle" style="font-size:34px;"><tspan x="1440.0" dy="0em">Residual air-side</tspan><tspan x="1440.0" dy="1.3em">heat removal</tspan></text></g><text x="50" y="620" text-anchor="start" class="strong" style="font-size:32px;"><tspan x="50" dy="0em">Each receiving system needs a defined condition and a responsible owner.</tspan></text></svg>