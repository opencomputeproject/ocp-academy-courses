<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 35 1750 985" width="1750" height="985" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="90" y="35" width="1750" height="985" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Illustrative workload demand · no measured response or numeric time scale</tspan></text><g ><line x1="180" y1="650" x2="1650" y2="650" stroke="#28374A" stroke-width="4"/><line x1="180" y1="650" x2="180" y2="190" stroke="#28374A" stroke-width="4"/><text x="175" y="145" text-anchor="start" class="label"><tspan x="175" dy="0em">Power demand</tspan></text><text x="1660" y="700" text-anchor="start" class="small"><tspan x="1660" dy="0em">Time</tspan></text></g><g ><line x1="185" y1="440" x2="1620" y2="440" stroke="#BCC7CF" stroke-width="3" stroke-dasharray="12 10"/><text x="220" y="410" text-anchor="start" class="small"><tspan x="220" dy="0em">Illustrative capacity</tspan></text></g><g ><path d="M 190 560 L 540 560 L 540 270 L 860 270 L 860 500 L 1110 500 L 1110 340 L 1430 340 L 1430 560 L 1620 560" fill="none" stroke="#168A9B" stroke-width="9" stroke-linejoin="round"/></g><g ><text x="700" y="220" text-anchor="middle" class="label"><tspan x="700" dy="0em">A load step</tspan></text><text x="1260" y="290" text-anchor="middle" class="label"><tspan x="1260" dy="0em">A later pulse</tspan></text></g><g ><g class="text-container" data-box="140,815,500,150"><rect x="140" y="815" width="500" height="150" rx="10" fill="#F0F6E7" stroke="none" stroke-width="3" /><text x="390.0" y="879.12" text-anchor="middle" style="font-size:34px;"><tspan x="390.0" dy="0em">Buffer limits</tspan><tspan x="390.0" dy="1.3em">