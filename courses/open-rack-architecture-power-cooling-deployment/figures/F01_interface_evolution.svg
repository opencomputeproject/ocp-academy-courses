<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 35 1770 990" width="1770" height="990" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="65" y="35" width="1770" height="990" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Conceptual evolution map · branches are not universal replacements</tspan></text><g ><g class="text-container" data-box="100,390,350,150"><rect x="100" y="390" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="275.0" y="453.48" text-anchor="middle" style="font-size:36px;"><tspan x="275.0" dy="0em">Earlier Open Rack</tspan><tspan x="275.0" dy="1.3em">interfaces</tspan></text></g></g><g ><line x1="450" y1="465" x2="592.0" y2="465.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="592.0,474.0 592.0,456.0 610,465" fill="#76A931"/><g class="text-container" data-box="610,375,500,180"><rect x="610" y="375" width="500" height="180" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="860.0" y="452.2" text-anchor="middle" style="font-size:40px;"><tspan x="860.0" dy="0em">ORv3</tspan><tspan x="860.0" dy="1.3em">shared rack interfaces</tspan></text></g></g><g ><text x="640" y="315" text-anchor="start" class="small"><tspan x="640" dy="0em">Interface reuse + integration flexibility</tspan></text></g><g ><polyline points="1110,465 1240,465 1240,250" fill="none" stroke="#76A931" stroke-width="6" stroke-linejoin="round"/><line x1="1240" y1="250" x2="1332.0" y2="250.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1332.0,259.0 1332.0,241.0 1350,250" fill="#76A931"/><g class="text-container" data-box="1350