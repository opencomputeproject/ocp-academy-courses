<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 35 1770 980" width="1770" height="980" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="65" y="35" width="1770" height="980" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Conceptual power path · bond locations and protection are not shown</tspan></text><g ><g class="text-container" data-box="90,300,300,150"><rect x="90" y="300" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="240.0" y="386.22" text-anchor="middle" style="font-size:34px;"><tspan x="240.0" dy="0em">Facility input</tspan></text></g><line x1="390" y1="375" x2="502.0" y2="375.0" stroke="#28374A" stroke-width="6"/><polygon class="arrowhead" points="502.0,384.0 502.0,366.0 520,375" fill="#28374A"/><g class="text-container" data-box="520,260,360,250"><rect x="520" y="260" width="360" height="250" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="700.0" y="372.2" text-anchor="middle" style="font-size:40px;"><tspan x="700.0" dy="0em">Conversion</tspan><tspan x="700.0" dy="1.3em">power shelf</tspan></text></g></g><g ><line x1="880" y1="315" x2="1290" y2="315" stroke="#76A931" stroke-width="7"/><line x1="1290" y1="315" x2="1422.0" y2="315.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1422.0,324.0 1422.0,306.0 1440,315" fill="#76A931"/><g class="text-container" data-box="1440,250,360,300"><rect x="1440" y="250" width="360" height="300" rx="10" fill="#FFFFFF" stroke="#28374A" stroke-width="3" /><text x="1620.0" y="413.86" text-anchor="middle" style="font-size:42px;"><tspan x="1620.0" dy="0em">IT load</tspan></text></g><text x="1090" y="260" text-anchor="middle" class="label"><tspan x="1090" dy="0em">DC supply</tspan></text></g><g ><line x1="1440" y1="490" x2="1060" y2="490" stroke="#168A9B" stroke-width="7"/><line x1="1060" y1="490" x2="898.0" y2="490.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="898.0,481.0 898.0,499.0 880,490" fill="#168A9B"/><text x="1100" y="555" text-anchor="middle" class="label"><tspan x="1100" dy="0em">DC return</tspan></text></g><g ><text x="1090" y="390" text-anchor="middle" class="small"><tspan x="1090" dy="0em">Busbar distribution</tspan></text><g class="text-container" data-box="100,640,1700,100"><rect x="100" y="640" width="1700" height="100" rx="10" fill="#ECF7F9" stroke="none" stroke-width="3" /><text x="950.0" y="699.9" text-anchor="middle" style="font-size:30px;"><tspan x="950.0" dy="0em">Architecture label ≠ the actual nominal voltage or accepted input range</tspan></text></g></g><g ><g class="text-container" data-box="140,830,720,140"><rect x="140" y="830" width="720" height="140" rx="10" fill="#F0F6E7" stroke="none" stroke-width="3" /><text x="500.0" y="889.12" text-anchor="middle" style="font-size:34px;"><tspan x="500.0" dy="0em">Match the source output</tspan><tspan x="500.0" dy="1.3em">to the equipment input range</tspan></text></g><g class="text-container" data-box="1010,830,720,140"><rect x="1010" y="830" width="720" height="140" rx="10" fill="#FFF4E8" stroke="none" stroke-width="3" /><text x="1370.0" y="889.12" text-anchor="middle" style="font-size:34px;"><tspan x="1370.0" dy="0em">Check connections, busbars,</tspan><tspan x="1370.0" dy="1.3em">thermal and entry limits</tspan></text></g></g></svg>