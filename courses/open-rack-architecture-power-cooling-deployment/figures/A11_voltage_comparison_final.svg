<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 35 1680 1000" width="1680" height="1000" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect x="90" y="35" width="1680" height="1000" fill="white"/><text x="90" y="80" text-anchor="start" class="tiny"><tspan x="90" dy="0em">Ideal DC segment · fixed 100 kW · losses ignored · not a sizing or safety approval</tspan></text><g ><text x="430" y="245" text-anchor="middle" class="strong" style="font-size:76px;"><tspan x="430" dy="0em">P = V × I</tspan></text></g><g ><g class="text-container" data-box="130,330,600,190"><rect x="130" y="330" width="600" height="190" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="430.0" y="410.28000000000003" text-anchor="middle" style="font-size:46px;"><tspan x="430.0" dy="0em">50 V</tspan><tspan x="430.0" dy="1.3em">2,000 A</tspan></text></g></g><g ><g class="text-container" data-box="130,600,600,190"><rect x="130" y="600" width="600" height="190" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3" /><text x="430.0" y="680.28" text-anchor="middle" style="font-size:46px;"><tspan x="430.0" dy="0em">800 V</tspan><tspan x="430.0" dy="1.3em">125 A</tspan></text></g></g><g ><line x1="850" y1="170" x2="850" y2="840" stroke="#BCC7CF" stroke-width="3"/></g><g ><g class="text-container" data-box="980,210,760,125"><rect x="980" y="210" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1360.0" y="284.05" text-anchor="middle" style="font-size:35px;"><tspan x="1360.0" dy="0em">Connector + insulation</tspan></text></g></g><g ><g class="text-container" data-box="980,390,760,125"><rect x="980" y="390" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1360.0" y="464.05" text-anchor="middle" style="font-size:35px;"><tspan x="1360.0" dy="0em">Protection + isolation</tspan></text></g></g><g ><g class="text-container" data-box="980,570,760,125"><rect x="980" y="570" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1360.0" y="644.05" text-anchor="middle" style="font-size:35px;"><tspan x="1360.0" dy="0em">Conversion + compatibility</tspan></text></g></g><g ><g class="text-container" data-box="980,750,760,125"><rect x="980" y="750" width="760" height="125" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1360.0" y="824.05" text-anchor="middle" style="font-size:35px;"><tspan x="1360.0" dy="0em">Service + qualification</tspan></text></g></g><g ><text x="960" y="980" text-anchor="middle" class="strong" style="font-size:37px;"><tspan x="960" dy="0em">An unchanged 50 V segment still carries its original current.</tspan></text></g></svg>