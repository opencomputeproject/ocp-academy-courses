" height="16" fill="#dfefd4" stroke="#487438" stroke-width="2"/><path d="M418 63 Q502 73 584 47" fill="none" stroke="#176889" stroke-width="9" stroke-linejoin="round"/><line x1="500" y1="122" x2="500" y2="89" stroke="#487438" stroke-width="2" stroke-dasharray="4 3"/><text x="330" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243c4a">The latch needs room to move, not just room to sit.</text></svg>
