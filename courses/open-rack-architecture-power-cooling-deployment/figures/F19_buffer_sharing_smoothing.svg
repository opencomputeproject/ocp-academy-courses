<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 930" width="1800" height="930" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#28374A;font-size:32px} .small{font-size:27px;fill:#687887}.tiny{font-size:23px;fill:#687887}.strong{font-weight:700}.label{font-size:30px}.outline{fill:none;stroke:#BCC7CF;stroke-width:3}.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.arrowhead{stroke:none}</style><rect width="1800" height="930" fill="white"/><text x="60" y="55" text-anchor="start" class="tiny"><tspan x="60" dy="0em">Conceptual functions · no measured dynamic response or storage rating</tspan></text><text x="60" y="185" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="60" dy="0em">Energy buffering</tspan></text><text x="60" y="235" text-anchor="start" class="small"><tspan x="60" dy="0em">Stores and returns energy</tspan></text><g class="text-container" data-box="610,115,500,150"><rect x="610" y="115" width="500" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="860.0" y="180.4" text-anchor="middle" style="font-size:30px;"><tspan x="860.0" dy="0em">Available power + energy</tspan><tspan x="860.0" dy="1.3em">permitted state + thermal limits</tspan></text></g><line x1="1110" y1="165" x2="1372.0" y2="165.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1372.0,174.0 1372.0,156.0 1390,165" fill="#76A931"/><line x1="1390" y1="225" x2="1128.0" y2="225.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="1128.0,216.0 1128.0,234.0 1110,225" fill="#168A9B"/><g class="text-container" data-box="1390,115,350,150"><rect x="1390" y="115" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1565.0" y="179.44" text-anchor="middle" style="font-size:33px;"><tspan x="1565.0" dy="0em">Defined event</tspan><tspan x="1565.0" dy="1.3em">and duration</tspan></text></g><line x1="60" y1="325" x2="1740" y2="325" stroke="#BCC7CF" stroke-width="3"/><text x="60" y="445" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="60" dy="0em">Power sharing</tspan></text><text x="60" y="495" text-anchor="start" class="small"><tspan x="60" dy="0em">Redistributes within a system</tspan></text><g class="text-container" data-box="610,385,500,150"><rect x="610" y="385" width="500" height="150" rx="10" fill="#F0F6E7" stroke="#76A931" stroke-width="3" /><text x="860.0" y="470.56" text-anchor="middle" style="font-size:32px;"><tspan x="860.0" dy="0em">Available system capacity</tspan></text></g><polyline points="1110,460 1200,460 1200,405" fill="none" stroke="#76A931" stroke-width="6" stroke-linejoin="round"/><line x1="1200" y1="405" x2="1372.0" y2="405.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1372.0,414.0 1372.0,396.0 1390,405" fill="#76A931"/><g class="text-container" data-box="1390,350,350,110"><rect x="1390" y="350" width="350" height="110" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1565.0" y="415.56" text-anchor="middle" style="font-size:32px;"><tspan x="1565.0" dy="0em">Load group A</tspan></text></g><polyline points="1200,460 1200,535" fill="none" stroke="#76A931" stroke-width="6" stroke-linejoin="round"/><line x1="1200" y1="535" x2="1372.0" y2="535.0" stroke="#76A931" stroke-width="6"/><polygon class="arrowhead" points="1372.0,544.0 1372.0,526.0 1390,535" fill="#76A931"/><g class="text-container" data-box="1390,480,350,110"><rect x="1390" y="480" width="350" height="110" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1565.0" y="545.56" text-anchor="middle" style="font-size:32px;"><tspan x="1565.0" dy="0em">Load group B</tspan></text></g><line x1="60" y1="650" x2="1740" y2="650" stroke="#BCC7CF" stroke-width="3"/><text x="60" y="775" text-anchor="start" class="strong" style="font-size:36px;"><tspan x="60" dy="0em">Load smoothing</tspan></text><text x="60" y="825" text-anchor="start" class="small"><tspan x="60" dy="0em">Changes demand at a boundary</tspan></text><g class="text-container" data-box="610,710,500,150"><rect x="610" y="710" width="500" height="150" rx="10" fill="#ECF7F9" stroke="#168A9B" stroke-width="3" /><text x="860.0" y="774.76" text-anchor="middle" style="font-size:32px;"><tspan x="860.0" dy="0em">Workload + storage</tspan><tspan x="860.0" dy="1.3em">within their own constraints</tspan></text></g><line x1="1110" y1="785" x2="1372.0" y2="785.0" stroke="#168A9B" stroke-width="6"/><polygon class="arrowhead" points="1372.0,794.0 1372.0,776.0 1390,785" fill="#168A9B"/><g class="text-container" data-box="1390,710,350,150"><rect x="1390" y="710" width="350" height="150" rx="10" fill="#FFFFFF" stroke="#BCC7CF" stroke-width="3" /><text x="1565.0" y="775.72" text-anchor="middle" style="font-size:29px;"><tspan x="1565.0" dy="0em">Selected</tspan><tspan x="1565.0" dy="1.3em">measurement boundary</tspan></text></g></svg>