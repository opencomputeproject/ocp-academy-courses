<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, initial-scale=1">
<title>Open Rack: Architecture, Power, Cooling and Deployment — catalog poster</title>
<style>
@font-face{font-family:Lato;src:url(../../../skills/academy-wizard/assets/fonts/lato2-bold.woff) format('woff');font-weight:700;font-style:normal;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:800px;height:400px;overflow:hidden}
body{font-family:Lato,Arial,sans-serif;color:#fff;background:#1d2258}
.poster{position:relative;width:800px;height:400px;overflow:hidden;isolation:isolate}
.art{position:absolute;inset:0;width:800px;height:400px;z-index:-1}
.logo{position:absolute;left:42px;top:26px;width:142px;height:64px;object-fit:contain;object-position:left center}
.badge{position:absolute;left:44px;top:117px;padding:6px 13px 7px;border-radius:20px;background:#8dc63f;color:#1d2258;font-size:12px;line-height:16px;letter-spacing:1.7px;font-weight:700}
h1{position:absolute;left:42px;top:157px;margin:0;font-size:48px;line-height:58px;letter-spacing:.5px;font-weight:700}
.subtitle{position:absolute;left:44px;top:219px;font-size:22px;line-height:28px;letter-spacing:.6px;font-weight:700}
.subtitle span{display:block;width:max-content}
.divider{position:absolute;left:44px;top:290px;width:60px;height:4px;border-radius:2px;background:#8dc63f}
.support{position:absolute;left:44px;top:309px;margin:0;font-size:17px;line-height:25px;font-weight:700}
.support span{display:block;width:max-content}
.mark{position:absolute;left:538px;top:88px;width:224px;height:224px;object-fit:contain}
</style>
</head>
<body>
<main class="poster" aria-label="OCP Academy — Open Rack: Architecture, Power, Cooling and Deployment">

    <defs>

        <stop stop-color="#1b1d4d"/><stop offset=".56" stop-color="#26286e"/><stop offset="1" stop-color="#343895"/>
      </linearGradient>
      <linearGradient id="rail" x1="0" y1="0" x2=".2" y2="1">
        <stop stop-color="#97cc44"/><stop offset="1" stop-color="#78aa32"/>

      <radialGradient id="face" cx=".72" cy=".25" r=".95">
        <stop stop-color="#fff"/><stop offset=".72" stop-color="#fbfcff"/><stop offset="1" stop-color="#eeeffc"/>
      </radialGradient>
      <filter id="depth" x="-20%" y="-20%" width="140%" height="145%">
        <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#11143c" flood-opacity=".18"/>

    <rect width="800" height="400" fill="url(#navy)"/>
    <path d="M576 0H604L684 400H656Z" fill="#8588c5" opacity=".2"/>

    <path d="M605 0H612L692 400H684Z" fill="#c4e897" opacity=".22"/>
    <g fill="none" stroke="#a3a6d3" stroke-width="1.5" opacity=".33">
      <path d="M548 112A139 139 0 0 0 548 288"/>
      <path d="M535 92A151 151 0 0 1 714 84"/>
      <path d="M528 304A153 153 0 0 0 730 321"/>
      <path d="M528 92H566M730 92H758M730 308H758"/>
    </g>
    <g fill="#b1b4df" opacity=".48">
      <circle cx="528" cy="92" r="4.5"/><circle cx="548" cy="112" r="3.5"/>
      <circle cx="548" cy="288" r="3.5"/><circle cx="528" cy="304" r="4.5"/>
    </g>
    <g fill="#d3efac" opacity=".7"><circle cx="758" cy="92" r="4.5"/><circle cx="758" cy="308" r="4.5"/></g>

  <img class="logo" src="../../../skills/academy-wizard/assets/ocp_academy_white.svg" alt="OCP Academy">
  <div class="badge" data-poster-text>OCP OPEN RACK</div>
  <h1 data-poster-text>OPEN RACK</h1>
  <div class="subtitle"><span data-poster-text>ARCHITECTURE, POWER,</span><span data-poster-text>COOLING &amp; DEPLOYMENT</span></div>
  <div class="divider" aria-hidden="true"></div>
  <p class="support"><span data-poster-text>From ORv3 to Open Rack Wide</span><span data-poster-text>Complete-rack engineering reviews</span></p>

</html>
