<svg font-family="Open Sans, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" aria-label="Fiber Density Pressure Across AI Generations">
  <rect width="768" height="360" fill="#fff"/>
  <text x="384" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#343895">Fiber Density Pressure Across AI Generations</text>
  <line x1="90" y1="160" x2="700" y2="160" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <polygon points="700,151 718,160 700,169" fill="#9ca3af"/>
  <circle cx="90" cy="160" r="16" fill="#343895"/><text x="90" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">Hopper</text><text x="90" y="242" text-anchor="middle" font-size="16" fill="#5F6062">Hundreds</text><text x="90" y="266" text-anchor="middle" font-size="16" fill="#5F6062">of strands</text><circle cx="285" cy="160" r="16" fill="#5F6062"/><text x="285" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">Blackwell</text><text x="285" y="242" text-anchor="middle" font-size="16" fill="#5F6062">800G baseline</text><text x="285" y="266" text-anchor="middle" font-size="16" fill="#5F6062">1.6T ramp</text><circle cx="480" cy="160" r="16" fill="#8DC63F"/><text x="480" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">Rubin</text><text x="480" y="242" text-anchor="middle" font-size="16" fill="#5F6062">Denser racks</text><text x="480" y="266" text-anchor="middle" font-size="16" fill="#5F6062">more optics</text><circle cx="675" cy="160" r="16" fill="#D88911"/><text x="675" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#343895">Feynman</text><text x="675" y="242" text-anchor="middle" font-size="16" fill="#5F6062">Scale-up</text><text x="675" y="266" text-anchor="middle" font-size="16" fill="#5F6062">plus scale-out</text>
  <text x="384" y="325" text-anchor="middle" font-size="17" fill="#5F6062">Each generation increases the amount of optical connectivity the physical plant must support.</text>
</svg>
