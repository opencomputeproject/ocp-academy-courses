<svg xmlns="http://www.w3.org/2000/svg" font-family="AcademyZhCN, PingFang SC, Microsoft YaHei, sans-serif" viewBox="0 0 768 360" aria-label="光电转换逐步靠近 ASIC">
  <style data-zh-font="true">@font-face{font-family:AcademyZhCN;src:url(data:font/woff2;base64,) format("woff2")}text,tspan{font-family:AcademyZhCN,sans-serif}</style><rect width="768" height="360" fill="#fff"/>
  <text x="384" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#343895">光电转换逐步靠近 ASIC</text>
  <rect x="70" y="92" width="270" height="180" rx="14" fill="#F8FAFC" stroke="#9ca3af" stroke-width="3"/>
  <rect x="428" y="92" width="270" height="180" rx="14" fill="#F4FAEF" stroke="#8DC63F" stroke-width="3"/>
  <text x="205" y="132" text-anchor="middle" font-size="22" font-weight="800" fill="#343895">可插拔光模块</text>
  <text x="563" y="132" text-anchor="middle" font-size="22" font-weight="800" fill="#343895">近封装或共封装</text>
  <text x="205" y="170" text-anchor="middle" font-size="16" fill="#5F6062">前面板</text><text x="205" y="194" text-anchor="middle" font-size="16" fill="#5F6062">较长电气路径</text><text x="205" y="218" text-anchor="middle" font-size="16" fill="#5F6062">易于更换</text>
  <text x="563" y="170" text-anchor="middle" font-size="16" fill="#5F6062">靠近 ASIC</text><text x="563" y="194" text-anchor="middle" font-size="16" fill="#5F6062">较短电气路径</text><text x="563" y="218" text-anchor="middle" font-size="16" fill="#5F6062">新维护模式</text>
  <line x1="355" y1="182" x2="414" y2="182" stroke="#8DC63F" stroke-width="5"/>
  <polygon class="arrowhead" points="414,174 428,182 414,190" fill="#8DC63F"/>
