<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510"><rect width="1200" height="510" fill="white"/><rect x="32.0" y="48" width="362.6666666666667" height="410" rx="18" fill="#f5f7fb" stroke="#ced3df" stroke-width="2"/><rect x="32.0" y="48" width="362.6666666666667" height="9" rx="4" fill="#8DC63F"/><text x="213.33333333333334" y="115" font-family="Arial" font-size="26" font-weight="700" fill="#343895" text-anchor="middle">Target queue</text><text x="213.33333333333334" y="230" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">Write accepted</text><text x="213.33333333333334" y="268" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">XPU processing remains</text><text x="213.33333333333334" y="306" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">Memory placement pending</text><rect x="418.6666666666667" y="48" width="362.6666666666667" height="410" rx="18" fill="#f5f7fb" stroke="#ced3df" stroke-width="2"/><rect x="418.6666666666667" y="48" width="362.6666666666667" height="9" rx="4" fill="#8DC63F"/><text x="600.0" y="115" font-family="Arial" font-size="26" font-weight="700" fill="#343895" text-anchor="middle">Global observability</text><text x="600.0" y="230" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">If supported/requested:</text><text x="600.0" y="268" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">XPU holds its response</text><text x="600.0" y="306" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">until data is placed</text><rect x="805.3333333333334" y="48" width="362.6666666666667" height="410" rx="18" fill="#f5f7fb" stroke="#ced3df" stroke-width="2"/><rect x="805.3333333333334" y="48" width="362.6666666666667" height="9" rx="4" fill="#8DC63F"/><text x="986.6666666666667" y="115" font-family="Arial" font-size="26" font-weight="700" fill="#343895" text-anchor="middle">Other observer</text><text x="986.6666666666667" y="230" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">Queue acceptance alone</text><text x="986.6666666666667" y="268" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">does not establish</text><text x="986.6666666666667" y="306" font-family="Arial" font-size="23" fill="#333b50" text-anchor="middle">visible memory data</text></svg>