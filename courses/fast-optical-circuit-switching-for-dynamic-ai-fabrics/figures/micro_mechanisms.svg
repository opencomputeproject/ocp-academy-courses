<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562"><rect width="1200" height="562" fill="white"/><g font-family="Arial,sans-serif"><rect x="50" y="70" width="350" height="350" rx="16" fill="#F1F4F8" stroke="#D8DEE8" stroke-width="2"/><text x="225.0" y="252.04" text-anchor="middle" font-size="22" fill="#242947" font-weight="400"><tspan x="225.0" dy="0"></tspan></text><text x="225" y="125" text-anchor="middle" font-size="26" fill="#343895" font-weight="700"><tspan x="225" dy="0">Thermo-optic</tspan></text><text x="225" y="225" text-anchor="middle" font-size="23" fill="#242947" font-weight="400"><tspan x="225" dy="0">Heat changes the</tspan><tspan x="225" dy="33.35">refractive index</tspan></text><text x="225" y="355" text-anchor="middle" font-size="21" fill="#657080" font-weight="400"><tspan x="225" dy="0">Temperature settling</tspan></text><rect x="440" y="70" width="350" height="350" rx="16" fill="#F1F4F8" stroke="#D8DEE8" stroke-width="2"/><text x="615.0" y="252.04" text-anchor="middle" font-size="22" fill="#242947" font-weight="400"><tspan x="615.0" dy="0"></tspan></text><text x="615" y="125" text-anchor="middle" font-size="26" fill="#343895" font-weight="700"><tspan x="615" dy="0">Integrated MEMS</tspan></text><text x="615" y="225" text-anchor="middle" font-size="23" fill="#242947" font-weight="400"><tspan x="615" dy="0">Small mechanical motion</tspan><tspan x="615" dy="33.35">changes coupling</tspan></text><text x="615" y="355" text-anchor="middle" font-size="21" fill="#657080" font-weight="400"><tspan x="615" dy="0">Mechanical settling</tspan></text><rect x="830" y="70" width="350" height="350" rx="16" fill="#F1F4F8" stroke="#D8DEE8" stroke-width="2"/><text x="1005.0" y="252.04" text-anchor="middle" font-size="22" fill="#242947" font-weight="400"><tspan x="1005.0" dy="0"></tspan></text><text x="1005" y="125" text-anchor="middle" font-size="26" fill="#343895" font-weight="700"><tspan x="1005" dy="0">Metasurface</tspan></text><text x="1005" y="225" text-anchor="middle" font-size="23" fill="#242947" font-weight="400"><tspan x="1005" dy="0">A phase profile</tspan><tspan x="1005" dy="33.35">steers a beam</tspan></text><text x="1005" y="355" text-anchor="middle" font-size="21" fill="#657080" font-weight="400"><tspan x="1005" dy="0">Liquid-crystal response</tspan></text><text x="600" y="488" text-anchor="middle" font-size="23" fill="#242947" font-weight="400"><tspan x="600" dy="0">Conceptual mechanisms; device speed is not end-to-end readiness.</tspan></text></g></svg>