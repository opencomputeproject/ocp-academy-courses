<!doctype html><html lang="en"><meta charset="utf-8"><title>OCS teaching sequence</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}svg{width:100%;height:100%;display:block}</style><div id="stage"></div><script src="engine.js"></script><script>const data={"asset": "communication_windows", "duration": 89.51455782312925, "chapters": [{"index": 1, "start": 0, "end": 14.953650793650795, "text": "Start with the gap before a communication phase. A topology change is useful only if the complete system becomes ready in time to carry the intended traffic. The setup window belongs to the workload; it is not a property of the optical switch alone."}, {"index": 2, "start": 15.203673469387756, "end": 31.550521541950115, "text": "A sporadic transfer may leave a generous interval for preparation. Scheduling, control messages, and receiver recovery can finish while there is no useful traffic to send. A relatively slow reconfiguration can still be entirely adequate if the connection is ready when the transfer begins."}, {"index": 3, "start": 31.800544217687076, "end": 48.61179138321995, "text": "Periodic communication creates a different opportunity. A training workload may repeat compute and communication phases. Predictability can let the controller prepare the next topology in advance. But any work that cannot be hidden must fit within the remaining interval before the next phase needs the path."}, {"index": 4, "start": 48.86181405895692, "end": 68.0879365079365, "text": "Unpredictable bursts remove some of that advance notice. Their short or irregular gaps can leave little time to collect demand, decide, configure, and recover. A packet path, buffering, or another way to absorb uncertainty may remain necessary. Making the optical element faster solves only one part of this problem."}, {"index": 5, "start": 68.33795918367346, "end": 89.51455782312925, "text": "Compare the three patterns by asking the same question: when must usable traffic begin? Then work backward to identify the preparation window. The animated spacing is illustrative; it is not a measured workload trace. The lesson is that a switching-time figure has meaning only when it is compared with the timing and predictability of the communication it will serve."}]};window.ACADEMY_ANIMATION_DURATION_MS=data.duration*1000;window.ACADEMY_POSTER_TIME_MS=data.chapters[2].start*1000;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=OCSVideo.render(data,Math.min(data.duration,Math.max(0,ms/1000)));};renderAtTime(0);</script></html>
