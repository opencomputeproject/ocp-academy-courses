<!doctype html><html lang="en"><meta charset="utf-8"><title>OCS teaching sequence</title><style>html,body{margin:0;width:100%;height:100%;background:white;overflow:hidden}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}svg{width:100%;height:100%;display:block}</style><div id="stage"></div><script src="engine.js"></script><script>const data={"asset": "optical_routing", "duration": 87.33188208616781, "chapters": [{"index": 1, "start": 0, "end": 13.281814058956916, "text": "Consider an optical input with two possible output routes. The switching task is to select which route receives the intended signal. A simple conceptual diagram can show that change without claiming to represent every physical implementation."}, {"index": 2, "start": 13.531836734693877, "end": 28.949886621315194, "text": "In an electro-optic mechanism, electrical control changes the refractive index or absorption of the optical structure. In an interferometer, a controlled phase difference can change which output receives the light. Different material platforms and device designs implement this in different ways."}, {"index": 3, "start": 29.199909297052155, "end": 47.265034013605444, "text": "Follow the two routing states separately. The optical path changes when the electrical state changes, but the diagram does not measure the transition or prove that the receiver can immediately read data. Drive circuitry, optical stabilization, calibration, and the rest of the communication path still determine usable operation."}, {"index": 4, "start": 47.51505668934241, "end": 70.22417233560091, "text": "A semiconductor optical amplifier, or SOA, provides another mechanism. Electrical current controls optical gain, allowing a selected path to pass an amplified signal while other paths are suppressed. This is gain gating rather than the same phase-routing mechanism shown in the first example. Practical designs must also account for noise, power, and signal quality."}, {"index": 5, "start": 70.47419501133787, "end": 87.33188208616781, "text": "The common lesson is that electrical control can change optical routing rapidly, while the physical effects and system requirements remain different. Use the mechanism to ask the right questions about the device. Then return to the end-to-end budget before drawing a conclusion about a network or workload."}]};window.ACADEMY_ANIMATION_DURATION_MS=data.duration*1000;window.ACADEMY_POSTER_TIME_MS=data.chapters[2].start*1000;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=OCSVideo.render(data,Math.min(data.duration,Math.max(0,ms/1000)));};renderAtTime(0);</script></html>
