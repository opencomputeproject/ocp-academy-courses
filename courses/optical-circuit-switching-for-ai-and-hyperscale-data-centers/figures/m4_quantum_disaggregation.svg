<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Two panels distinguish quantum state transport constraints from classical compute-to-resource connections."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="25" width="555" height="355" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="615" y="25" width="555" height="355" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><text x="65" y="75" font-size="30" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="65" dy="0">Quantum transport</tspan></text><text x="650" y="75" font-size="30" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="650" dy="0">Classical resource pooling</tspan></text><rect x="65" y="120" width="160" height="85" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="145.0" y="171.5" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="145.0" dy="0">Photons</tspan></text><line x1="225" y1="162" x2="297.0" y2="162.0" stroke="#8DC63F" stroke-width="6"/><polygon points="310,162 297.0,156.0 297.0,168.0" fill="#8DC63F"/><rect x="310" y="120" width="240" height="85" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><text x="430.0" y="171.5" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="430.0" dy="0">Optical path</tspan></text><text x="65" y="260" font-size="24" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="65" dy="0">Avoid measurement-based routing</tspan></text><text x="65" y="305" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="65" dy="0">Loss, noise and state fidelity</tspan><tspan x="65" dy="32.400000000000006">still require verification.</tspan></text><rect x="650" y="120" width="175" height="85" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="737.5" y="171.5" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="737.5" dy="0">Compute</tspan></text><line x1="825" y1="162" x2="897.0" y2="162.0" stroke="#8DC63F" stroke-width="6"/><polygon points="910,162 897.0,156.0 897.0,168.0" fill="#8DC63F"/><rect x="910" y="120" width="225" height="85" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><text x="1022.5" y="171.5" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="1022.5" dy="0">Resources</tspan></text><text x="650" y="260" font-size="24" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="650" dy="0">Connect supported pooled resources</tspan></text><text x="650" y="305" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="650" dy="0">Protocol, distance and latency</tspan><tspan x="650" dy="32.400000000000006">budgets still apply.</tspan></text><rect x="30" y="420" width="265" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="162.5" y="450" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="162.5" dy="0">Emerging applications</tspan></text><text x="325" y="448" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="325" dy="0">Optical transparency is a property, not an end-to-end guarantee.</tspan></text></g></svg>
