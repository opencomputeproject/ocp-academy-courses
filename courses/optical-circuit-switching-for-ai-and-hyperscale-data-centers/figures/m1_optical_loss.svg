<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Four progressively smaller qualitative power bars accompany a transmitter, optical switch, connectors and receiver."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="150" width="210" height="100" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="135.0" y="192.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="135.0" dy="0">Transmitter</tspan></text><text x="135.0" y="229.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="135.0" dy="0">launch power</tspan></text><rect x="360" y="150" width="190" height="100" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><text x="455.0" y="192.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="455.0" dy="0">OCS path</tspan></text><text x="455.0" y="229.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="455.0" dy="0">insertion loss</tspan></text><rect x="670" y="150" width="190" height="100" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><text x="765.0" y="192.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="765.0" dy="0">Connectors</tspan></text><text x="765.0" y="229.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="765.0" dy="0">additional loss</tspan></text><rect x="980" y="150" width="190" height="100" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="1075.0" y="192.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="1075.0" dy="0">Receiver</tspan></text><text x="1075.0" y="229.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="1075.0" dy="0">required power</tspan></text><line x1="240" y1="200" x2="347.0" y2="200.0" stroke="#8DC63F" stroke-width="6"/><polygon points="360,200 347.0,194.0 347.0,206.0" fill="#8DC63F"/><line x1="550" y1="200" x2="657.0" y2="200.0" stroke="#8DC63F" stroke-width="6"/><polygon points="670,200 657.0,194.0 657.0,206.0" fill="#8DC63F"/><line x1="860" y1="200" x2="967.0" y2="200.0" stroke="#8DC63F" stroke-width="6"/><polygon points="980,200 967.0,194.0 967.0,206.0" fill="#8DC63F"/><text x="600" y="35" font-size="23" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Illustrative relative power — no numeric loss scale</tspan></text><rect x="88" y="60" width="44" height="65" rx="4" fill="#8DC63F" stroke="none" stroke-width="2"/><rect x="433" y="76" width="44" height="49" rx="4" fill="#8DC63F" stroke="none" stroke-width="2"/><rect x="743" y="92" width="44" height="33" rx="4" fill="#8DC63F" stroke="none" stroke-width="2"/><rect x="1053" y="102" width="44" height="23" rx="4" fill="#8DC63F" stroke="none" stroke-width="2"/><rect x="90" y="310" width="1020" height="90" rx="18" fill="#F6F8FA" stroke="none" stroke-width="2"/><text x="600" y="348" font-size="26" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Every passive element contributes to the link budget.</tspan></text><text x="600" y="382" font-size="24" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Allowed hop count depends on the complete optical design.</tspan></text></g></svg>
