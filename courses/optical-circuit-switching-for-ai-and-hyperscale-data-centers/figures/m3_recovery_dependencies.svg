<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="A four-step detect, plan, reconfigure and validate sequence includes a distinction between restored connectivity and lost compute state."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="75" width="255" height="200" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="50" y="94" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="75.0" y="124" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="75.0" dy="0">01</tspan></text><text x="55" y="177" font-size="29" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="55" dy="0">Detect</tspan></text><text x="55" y="220" font-size="22" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="55" dy="0">Identify the failed link</tspan><tspan x="55" dy="29.700000000000003">or component</tspan></text><line x1="285" y1="175" x2="312.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="325,175 312.0,169.0 312.0,181.0" fill="#343895"/><rect x="325" y="75" width="255" height="200" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="345" y="94" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="370.0" y="124" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="370.0" dy="0">02</tspan></text><text x="350" y="177" font-size="29" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="350" dy="0">Plan</tspan></text><text x="350" y="220" font-size="22" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="350" dy="0">Find supported spare</tspan><tspan x="350" dy="29.700000000000003">connectivity</tspan></text><line x1="580" y1="175" x2="607.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="620,175 607.0,169.0 607.0,181.0" fill="#343895"/><rect x="620" y="75" width="255" height="200" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><rect x="640" y="94" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="665.0" y="124" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="665.0" dy="0">03</tspan></text><text x="645" y="177" font-size="29" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="645" dy="0">Reconfigure</tspan></text><text x="645" y="220" font-size="22" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="645" dy="0">Establish the revised</tspan><tspan x="645" dy="29.700000000000003">physical path</tspan></text><line x1="875" y1="175" x2="902.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="915,175 902.0,169.0 902.0,181.0" fill="#343895"/><rect x="915" y="75" width="255" height="200" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="935" y="94" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="960.0" y="124" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="960.0" dy="0">04</tspan></text><text x="940" y="177" font-size="29" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="940" dy="0">Validate</tspan></text><text x="940" y="220" font-size="22" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="940" dy="0">Check topology and</tspan><tspan x="940" dy="29.700000000000003">service capacity</tspan></text><rect x="75" y="330" width="1050" height="110" rx="18" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="600" y="373" font-size="25" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Recovery depends on available spares and application behavior.</tspan></text><text x="600" y="412" font-size="24" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Restored connectivity does not replace lost compute state.</tspan></text></g></svg>
