<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-label="Four steps show requirements, evidence, review and improvements to shared specifications and reference designs."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="60" width="255" height="230" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="50" y="80" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="75.0" y="110" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="75.0" dy="0">01</tspan></text><text x="52" y="160" font-size="22" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="52" dy="0">Bring a requirement</tspan></text><text x="52" y="215" font-size="21" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Define the problem</tspan><tspan x="52" dy="28.35">and constraints</tspan></text><line x1="285" y1="175" x2="312.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="325,175 312.0,169.0 312.0,181.0" fill="#343895"/><rect x="325" y="60" width="255" height="230" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="345" y="80" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="370.0" y="110" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="370.0" dy="0">02</tspan></text><text x="347" y="160" font-size="22" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="347" dy="0">Contribute evidence</tspan></text><text x="347" y="215" font-size="21" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="347" dy="0">Share a reproducible</tspan><tspan x="347" dy="28.35">design or finding</tspan></text><line x1="580" y1="175" x2="607.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="620,175 607.0,169.0 607.0,181.0" fill="#343895"/><rect x="620" y="60" width="255" height="230" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="640" y="80" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="665.0" y="110" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="665.0" dy="0">03</tspan></text><text x="642" y="160" font-size="22" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="642" dy="0">Review together</tspan></text><text x="642" y="215" font-size="21" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="642" dy="0">Compare assumptions</tspan><tspan x="642" dy="28.35">and interface needs</tspan></text><line x1="875" y1="175" x2="902.0" y2="175.0" stroke="#343895" stroke-width="4"/><polygon points="915,175 902.0,169.0 902.0,181.0" fill="#343895"/><rect x="915" y="60" width="255" height="230" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><rect x="935" y="80" width="50" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="960.0" y="110" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="960.0" dy="0">04</tspan></text><text x="937" y="160" font-size="22" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="937" dy="0">Improve the work</tspan></text><text x="937" y="215" font-size="21" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="937" dy="0">Refine specifications</tspan><tspan x="937" dy="28.35">and reference designs</tspan></text><text x="600" y="365" font-size="25" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Choose the handoff your team knows; contribute clear requirements and evidence.</tspan></text></g></svg>
