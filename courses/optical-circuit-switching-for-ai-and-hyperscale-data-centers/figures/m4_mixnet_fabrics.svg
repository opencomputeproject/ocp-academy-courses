<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Three horizontal bands distinguish local electrical scale-up, cluster-wide electrical scale-out and regional optical expert-parallel traffic."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="25" width="1140" height="120" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><rect x="30" y="25" width="13" height="120" rx="3" fill="#343895" stroke="none" stroke-width="2"/><text x="65" y="73" font-size="28" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="65" dy="0">Local scale-up</tspan></text><text x="420" y="70" font-size="25" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="420" dy="0">Within a server / high-bandwidth domain</tspan></text><text x="420" y="113" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="420" dy="0">Electrical fabric; e.g. NVSwitch</tspan></text><rect x="30" y="170" width="1140" height="120" rx="18" fill="#F6F8FA" stroke="#DCE2E6" stroke-width="2"/><rect x="30" y="170" width="13" height="120" rx="3" fill="#5F6062" stroke="none" stroke-width="2"/><text x="65" y="218" font-size="28" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="65" dy="0">Global scale-out</tspan></text><text x="420" y="215" font-size="25" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="420" dy="0">Across the cluster</tspan></text><text x="420" y="258" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="420" dy="0">EPS; e.g. Ethernet or InfiniBand</tspan></text><rect x="30" y="315" width="1140" height="120" rx="18" fill="#F1F8E8" stroke="#DCE2E6" stroke-width="2"/><rect x="30" y="315" width="13" height="120" rx="3" fill="#8DC63F" stroke="none" stroke-width="2"/><text x="65" y="363" font-size="28" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="65" dy="0">Regional OCS</tspan></text><text x="420" y="360" font-size="25" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="420" dy="0">Expert-parallel communication groups</tspan></text><text x="420" y="403" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="420" dy="0">Optical circuits; workload-aware allocation</tspan></text><rect x="30" y="480" width="240" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="150.0" y="510" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="150.0" dy="0">Research architecture</tspan></text><text x="310" y="508" font-size="24" fill="#5F6062" font-weight="400" text-anchor="start"><tspan x="310" dy="0">MixNet combines fabrics for different communication roles.</tspan></text></g></svg>
