<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-label="A five-row OCS versus electrical packet switching comparison."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="20" width="1140" height="66" rx="14" fill="#343895" stroke="none" stroke-width="2"/><text x="60" y="63" font-size="24" fill="white" font-weight="600" text-anchor="start"><tspan x="60" dy="0">Dimension</tspan></text><text x="360" y="63" font-size="24" fill="white" font-weight="600" text-anchor="start"><tspan x="360" dy="0">OCS</tspan></text><text x="810" y="63" font-size="24" fill="white" font-weight="600" text-anchor="start"><tspan x="810" dy="0">EPS</tspan></text><rect x="30" y="100" width="1140" height="70" rx="8" fill="#F1F8E8" stroke="none" stroke-width="2"/><text x="60" y="144" font-size="23" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="60" dy="0">Signal path</tspan></text><text x="360" y="144" font-size="23" fill="#27313B" font-weight="400" text-anchor="start"><tspan x="360" dy="0">No OEO inside the OCS</tspan></text><text x="810" y="144" font-size="22" fill="#27313B" font-weight="400" text-anchor="start"><tspan x="810" dy="0">Electronic packet processing</tspan></text><rect x="30" y="181" width="1140" height="70" rx="8" fill="#F6F8FA" stroke="none" stroke-width="2"/><text x="60" y="225" font-size="23" fill="#27313B" font-weight="600" text-anchor="start"><tspan x="60" dy="0">Timing</tspan></text><text x="360" y="225" font-size="23" fill="#27313B" font-weight="400" text-anchor="start"><tspan x="360" dy="0">No packet queue in the OCS</tspan></text><text x="810" y="225" font-size="22" fill="#27313B" font-weight="400" text-anchor="start"><tspan x="810" dy="0">Queueing depends on traffic</tspan></text><rect x="30" y="262" width="1140" height="70" rx="8" fill="#F1F8E8" stroke="none" stroke-width="2"/><text x="60" y="306" font-size="23" fill="#27313B" font-weight="600" t