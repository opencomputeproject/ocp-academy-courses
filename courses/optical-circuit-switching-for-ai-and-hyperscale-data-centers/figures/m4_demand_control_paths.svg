<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Traffic demand flows through a control decision to supported optical resources, with a physical-topology constraint."><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="145" width="305" height="120" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="182.5" y="197.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="182.5" dy="0">Traffic demand</tspan></text><text x="182.5" y="234.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="182.5" dy="0">who needs to communicate?</tspan></text><rect x="447" y="145" width="305" height="120" rx="18" fill="#F1F8E8" stroke="#8DC63F" stroke-width="2"/><text x="599.5" y="197.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="599.5" dy="0">Control decision</tspan></text><text x="599.5" y="234.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="599.5" dy="0">supported allocation</tspan></text><rect x="865" y="145" width="305" height="120" rx="18" fill="#F0F0FA" stroke="#DCE2E6" stroke-width="2"/><text x="1017.5" y="197.0" font-size="27" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="1017.5" dy="0">Optical resources</tspan></text><text x="1017.5" y="234.0" font-size="21" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="1017.5" dy="0">available paths</tspan></text><line x1="335" y1="205" x2="434.0" y2="205.0" stroke="#343895" stroke-width="4"/><polygon points="447,205 434.0,199.0 434.0,211.0" fill="#343895"/><line x1="752" y1="205" x2="852.0" y2="205.0" stroke="#343895" stroke-width="4"/><polygon points="865,205 852.0,199.0 852.0,211.0" fill="#343895"/><rect x="120" y="330" width="960" height="100" rx="18" fill="#F6F8FA" stroke="none" stroke-width="2"/><text x="600" y="372" font-size="25" fill="#27313B" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Wavelength assignment operates within the physical topology.</tspan></text><text x="600" y="409" font-size="24" fill="#5F6062" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">It does not create arbitrary new fiber connections.</tspan></text><rect x="30" y="35" width="300" height="46" rx="23" fill="#F0F0FA" stroke="none" stroke-width="2"/><text x="180.0" y="65" font-size="20" fill="#343895" font-weight="600" text-anchor="middle"><tspan x="180.0" dy="0">Conceptual research model</tspan></text></g></svg>
