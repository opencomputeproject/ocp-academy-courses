<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">HBM, HBF, and SSD tier map</title>
  <desc id="desc">A three-tier comparison showing HBM closest to compute, HBF as high-capacity on-package memory, and SSD as persistent storage.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf2fb"/></linearGradient>
    <linearGradient id="hbm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#525ac0"/><stop offset="1" stop-color="#343895"/></linearGradient>
    <linearGradient id="hbf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8dc5b"/><stop offset="1" stop-color="#6fa030"/></linearGradient>
    <linearGradient id="ssd" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8390a7"/><stop offset="1" stop-color="#4e596d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263252" flood-opacity=".16"/></filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#canvas)"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#20263b">A three-tier AI data hierarchy</text>
  <rect x="55" y="92" width="100" height="292" rx="28" fill="#20263b" filter="url(#s)"/>
  <rect x="76" y="120" width="58" height="58" rx="16" fill="#8dc63f"/>
  <circle cx="105" cy="149" r="14" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="105" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">xPU</text>
  <text x="105" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dfe5f5">Compute</text>
  <g filter="url(#s)" font-family="Arial, sans-serif">
    <rect x="190" y="92" width="210" height="292" rx="26" fill="url(#hbm)"/>
    <rect x="420" y="92" width="210" height="292" rx="26" fill="url(#hbf)"/>
    <rect x="650" y="92" width="210" height="292" rx="26" fill="url(#ssd)"/>
    <g fill="#fff" text-anchor="middle">
      <text x="295" y="139" font-size="30" font-weight="800">HBM</text>
      <text x="525" y="139" font-size="30" font-weight="800">HBF</text>
      <text x="755" y="139" font-size="30" font-weight="800">SSD</text>
    </g>
    <g fill="#fff" text-anchor="middle" font-size="17">
      <text x="295" y="188">Stacked DRAM</text><text x="295" y="218">Ultra-fast working set</text><text x="295" y="248">Lower capacity</text><text x="295" y="278">Volatile</text>
      <text x="525" y="188">Stacked NAND</text><text x="525" y="218">High aggregate read BW</text><text x="525" y="248">Much larger capacity</text><text x="525" y="278">Host-managed lifecycle</text>
      <text x="755" y="188">Persistent flash</text><text x="755" y="218">Storage interface</text><text x="755" y="248">Durable capacity</text><text x="755" y="278">System source of truth</text>
    </g>
    <g fill="#fff" fill-opacity=".16">
      <rect x="218" y="310" width="154" height="44" rx="14"/><rect x="448" y="310" width="154" height="44" rx="14"/><rect x="678" y="310" width="154" height="44" rx="14"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-size="14" font-weight="700">
      <text x="295" y="338">HOTTEST DATA</text><text x="525" y="327" font-size="12"><tspan x="525">READ-DOMINANT</tspan><tspan x="525" dy="15">AI DATA</tspan></text><text x="755" y="338">DURABLE DATA</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="190" y="425" width="670" height="16" rx="8" fill="#d8deeb"/>
    <rect x="190" y="425" width="215" height="16" rx="8" fill="#4a50ad"/>
    <rect x="405" y="425" width="225" height="16" fill="#8dc63f"/>
    <rect x="630" y="425" width="230" height="16" rx="8" fill="#657287"/>
    <text x="190" y="474" font-size="15" font-weight="700" fill="#343895">Higher local bandwidth</text>
    <text x="860" y="474" text-anchor="end" font-size="15" font-weight="700" fill="#4e596d">Higher capacity and durability</text>
    <text x="525" y="508" text-anchor="middle" font-size="17" fill="#3c4558">HBF adds a managed layer; it does not erase the roles of HBM or SSD storage.</text>
  </g>
</svg>
