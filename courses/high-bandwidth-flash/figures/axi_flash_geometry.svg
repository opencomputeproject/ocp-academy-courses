<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AXI transactions and NAND page geometry</title>
  <desc id="desc">Three examples show a valid aligned read within a 4 KiB page, a valid complete 4 KiB write, and an invalid read crossing a page boundary.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263252" flood-opacity=".14"/></filter></defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="480" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#20263b">AXI remains familiar; NAND geometry remains visible</text>
  <g transform="translate(60 95)" font-family="Arial, sans-serif" filter="url(#s)">
    <rect width="840" height="110" rx="20" fill="#fff"/>
    <text x="24" y="33" font-size="17" font-weight="800" fill="#5d8924">VALID READ · 64 B TO 4 KiB</text>
    <g transform="translate(24 50)">
      <rect width="792" height="38" rx="10" fill="#e9edf5"/>
      <g stroke="#fff" stroke-width="2"><line x1="49" y1="0" x2="49" y2="38"/><line x1="98" y1="0" x2="98" y2="38"/><line x1="147" y1="0" x2="147" y2="38"/><line x1="196" y1="0" x2="196" y2="38"/><line x1="245" y1="0" x2="245" y2="38"/><line x1="294" y1="0" x2="294" y2="38"/><line x1="343" y1="0" x2="343" y2="38"/><line x1="392" y1="0" x2="392" y2="38"/><line x1="441" y1="0" x2="441" y2="38"/><line x1="490" y1="0" x2="490" y2="38"/><line x1="539" y1="0" x2="539" y2="38"/><line x1="588" y1="0" x2="588" y2="38"/><line x1="637" y1="0" x2="637" y2="38"/><line x1="686" y1="0" x2="686" y2="38"/><line x1="735" y1="0" x2="735" y2="38"/></g>
      <rect x="147" width="294" height="38" rx="9" fill="#8dc63f"/><text x="294" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ALIGNED 64 B MULTIPLES · STAYS IN PAGE</text>
    </g>
  </g>
  <g transform="translate(60 225)" font-family="Arial, sans-serif" filter="url(#s)">
    <rect width="840" height="110" rx="20" fill="#fff"/>
    <text x="24" y="33" font-size="17" font-weight="800" fill="#343895">VALID WRITE · COMPLETE 4 KiB LOGICAL UNIT</text>
    <rect x="24" y="50" width="792" height="38" rx="10" fill="#343895"/><g fill="#fff" font-size="14" font-weight="800"><text x="420" y="75" text-anchor="middle">4 KiB ALIGNED ADDRESS · FULL PAGE ASSEMBLED</text></g>
  </g>
  <g transform="translate(60 355)" font-family="Arial, sans-serif" filter="url(#s)">
    <rect width="840" height="120" rx="20" fill="#fff"/>
    <text x="24" y="33" font-size="17" font-weight="800" fill="#b63a46">INVALID READ · CROSSES A 4 KiB PAGE BOUNDARY</text>
    <rect x="24" y="50" width="380" height="40" rx="10" fill="#e9edf5"/><rect x="436" y="50" width="380" height="40" rx="10" fill="#e9edf5"/>
    <rect x="330" y="50" width="180" height="40" rx="10" fill="#d84b58"/>
    <line x1="420" y1="44" x2="420" y2="96" stroke="#b63a46" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="214" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4e596d">PAGE N</text><text x="626" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4e596d">PAGE N + 1</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#68758b"><text x="820" y="511" text-anchor="end">One, two, or four virtual AXI paths per UCIe channel</text></g>
</svg>
