<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">UCIe HBF channel architecture</title>
  <desc id="desc">A single UCIe channel between an xPU and HBF Base die showing AXI streaming protocol, die-to-die adapter, physical layer, mainband, and sideband, repeated sixteen times.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263252" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#20263b">One self-contained UCIe channel, repeated sixteen times</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="55" y="105" width="170" height="286" rx="26" fill="#343895"/>
    <rect x="735" y="105" width="170" height="286" rx="26" fill="#28304e"/>
    <rect x="275" y="105" width="410" height="74" rx="20" fill="#fff" stroke="#525ac0" stroke-width="3"/>
    <rect x="275" y="196" width="410" height="74" rx="20" fill="#fff" stroke="#8dc63f" stroke-width="3"/>
    <rect x="275" y="287" width="410" height="104" rx="20" fill="#fff" stroke="#68758b" stroke-width="3"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="140" y="170" font-size="33" font-weight="800" fill="#fff">xPU</text><text x="140" y="205" font-size="15" fill="#e5e8ff">HOST SIDE</text>
    <text x="820" y="170" font-size="26" font-weight="800" fill="#fff">HBF</text><text x="820" y="201" font-size="17" fill="#dfe5f5">BASE DIE</text>
    <text x="480" y="137" font-size="18" font-weight="800" fill="#343895">PROTOCOL LAYER</text><text x="480" y="161" font-size="15" fill="#4e596d">AXI over Streaming Protocol · Format 6 · 256-byte flit</text>
    <text x="480" y="228" font-size="18" font-weight="800" fill="#5d8924">DIE-TO-DIE ADAPTER</text><text x="480" y="252" font-size="15" fill="#4e596d">Framing · CRC · link state · negotiation · flow control</text>
    <text x="480" y="319" font-size="18" font-weight="800" fill="#4e596d">PHYSICAL LAYER</text>
    <rect x="315" y="338" width="225" height="34" rx="12" fill="#343895"/><text x="427" y="360" font-size="14" font-weight="800" fill="#fff">MAINBAND · x64 FULL DUPLEX</text>
    <rect x="552" y="338" width="95" height="34" rx="12" fill="#8dc63f"/><text x="599" y="360" font-size="14" font-weight="800" fill="#fff">SIDEBAND</text>
  </g>
  <g stroke-linecap="round">
    <line x1="225" y1="142" x2="275" y2="142" stroke="#525ac0" stroke-width="8"/><line x1="685" y1="142" x2="735" y2="142" stroke="#525ac0" stroke-width="8"/>
    <line x1="225" y1="233" x2="275" y2="233" stroke="#8dc63f" stroke-width="8"/><line x1="685" y1="233" x2="735" y2="233" stroke="#8dc63f" stroke-width="8"/>
    <line x1="225" y1="338" x2="275" y2="338" stroke="#68758b" stroke-width="8"/><line x1="685" y1="338" x2="735" y2="338" stroke="#68758b" stroke-width="8"/>
  </g>
  <g transform="translate(265 438)" font-family="Arial, sans-serif">
    <text x="-24" y="24" text-anchor="end" font-size="14" font-weight="800" fill="#343895">16×</text>
    <g fill="#fff" stroke="#8dc63f" stroke-width="2">
      <rect x="0" y="0" width="32" height="32" rx="8"/><rect x="40" y="0" width="32" height="32" rx="8"/><rect x="80" y="0" width="32" height="32" rx="8"/><rect x="120" y="0" width="32" height="32" rx="8"/><rect x="160" y="0" width="32" height="32" rx="8"/><rect x="200" y="0" width="32" height="32" rx="8"/><rect x="240" y="0" width="32" height="32" rx="8"/><rect x="280" y="0" width="32" height="32" rx="8"/>
      <rect x="320" y="0" width="32" height="32" rx="8"/><rect x="360" y="0" width="32" height="32" rx="8"/><rect x="400" y="0" width="32" height="32" rx="8"/><rect x="440" y="0" width="32" height="32" rx="8"/><rect x="480" y="0" width="32" height="32" rx="8"/><rect x="520" y="0" width="32" height="32" rx="8"/><rect x="560" y="0" width="32" height="32" rx="8"/><rect x="600" y="0" width="32" height="32" rx="8"/>
    </g>
    <text x="316" y="65" text-anchor="middle" font-size="15" fill="#3c4558">Independent clocking · independent bring-up · channel-local NAND resources</text>
  </g>
</svg>
