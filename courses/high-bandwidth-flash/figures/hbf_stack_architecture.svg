<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">HBF stack architecture</title>
  <desc id="desc">An xPU connects through sixteen independent host channels to an HBF Base die beneath a sixteen-die NAND Core stack joined by TSVs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="xpu" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#525ac0"/><stop offset="1" stop-color="#343895"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#343895"/><stop offset="1" stop-color="#555bb2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273252" flood-opacity=".16"/></filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="480" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#20263b">Logic below, dense NAND above, parallel links beside</text>
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="210" height="260" rx="30" fill="url(#xpu)"/>
    <rect x="560" y="380" width="320" height="86" rx="18" fill="url(#base)"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="175" y="222" font-size="37" font-weight="800" fill="#fff">xPU</text>
    <text x="175" y="253" font-size="15" fill="#e5e8ff"><tspan x="175">GPU · TPU · CPU</tspan><tspan x="175" dy="20">ACCELERATOR</tspan></text>
    <rect x="103" y="295" width="144" height="52" rx="16" fill="#8dc63f"/><text x="175" y="328" font-size="17" font-weight="800" fill="#fff">HOST COMPUTE</text>
    <text x="720" y="414" font-size="24" font-weight="800" fill="#fff">BASE DIE</text>
    <text x="720" y="438" font-size="13" fill="#e7e9ff"><tspan x="720">UCIe · TRAFFIC MANAGEMENT</tspan><tspan x="720" dy="17">NAND CONTROL · TEST · DEBUG</tspan></text>
  </g>
  <g stroke="#8dc63f" stroke-width="7" stroke-linecap="round">
    <line x1="280" y1="182" x2="550" y2="182"/><line x1="280" y1="232" x2="550" y2="232"/><line x1="280" y1="282" x2="550" y2="282"/><line x1="280" y1="332" x2="550" y2="332"/>
  </g>
  <g fill="#343895" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="298" y="172">CH 0</text><text x="298" y="222">CH 1</text><text x="298" y="272">CH 2</text><text x="298" y="322">CH 15</text>
  </g>
  <circle cx="415" cy="307" r="3" fill="#8dc63f"/><circle cx="415" cy="317" r="3" fill="#8dc63f"/><circle cx="415" cy="327" r="3" fill="#8dc63f"/>
  <rect x="320" y="365" width="190" height="48" rx="14" fill="#fff" stroke="#8dc63f" stroke-width="2"/>
  <text x="415" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#5d8924">16 INDEPENDENT</text><text x="415" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4e596d">HOST CHANNELS</text>
  <g transform="translate(585 96)" filter="url(#shadow)">
    <g fill="#b8e76c" stroke="#fff" stroke-width="2">
      <rect x="0" y="0" width="270" height="24" rx="7"/><rect x="4" y="18" width="262" height="24" rx="7"/><rect x="8" y="36" width="254" height="24" rx="7"/><rect x="12" y="54" width="246" height="24" rx="7"/>
      <rect x="16" y="72" width="238" height="24" rx="7"/><rect x="20" y="90" width="230" height="24" rx="7"/><rect x="24" y="108" width="222" height="24" rx="7"/><rect x="28" y="126" width="214" height="24" rx="7"/>
      <rect x="32" y="144" width="206" height="24" rx="7"/><rect x="36" y="162" width="198" height="24" rx="7"/><rect x="40" y="180" width="190" height="24" rx="7"/><rect x="44" y="198" width="182" height="24" rx="7"/>
      <rect x="48" y="216" width="174" height="24" rx="7"/><rect x="52" y="234" width="166" height="24" rx="7"/><rect x="56" y="252" width="158" height="24" rx="7"/><rect x="60" y="270" width="150" height="24" rx="7"/>
    </g>
  </g>
  <g stroke="#6fa030" stroke-width="5" stroke-linecap="round">
    <line x1="660" y1="116" x2="660" y2="380"/><line x1="690" y1="116" x2="690" y2="380"/><line x1="720" y1="116" x2="720" y2="380"/><line x1="750" y1="116" x2="750" y2="380"/><line x1="780" y1="116" x2="780" y2="380"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="625" y="64" width="190" height="48" rx="14" fill="#fff" stroke="#8dc63f" stroke-width="2"/>
    <text x="720" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#5d8924">16-DIE NAND</text><text x="720" y="103" text-anchor="middle" font-size="14" fill="#4e596d">CORE STACK</text>
    <text x="808" y="247" font-size="14" font-weight="700" fill="#5d8924">TSVs</text>
    <text x="480" y="510" text-anchor="middle" font-size="17" fill="#3c4558">The Base die owns protocol and media management; requests remain local to their assigned channel resources.</text>
  </g>
</svg>
