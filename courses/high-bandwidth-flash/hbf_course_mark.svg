<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">High Bandwidth Flash course mark</title>
  <desc id="desc">A graphical stack of memory layers above a wide-interface base with parallel data lanes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343895"/>
      <stop offset="1" stop-color="#20255f"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e86d"/>
      <stop offset="1" stop-color="#8dc63f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#12153a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M112 352 256 294 400 352 256 416Z" fill="#11183f" stroke="#dfe6ff" stroke-width="5"/>
    <path d="M112 320 256 262 400 320 256 384Z" fill="#555bb2" stroke="#dfe6ff" stroke-width="4"/>
    <g fill="url(#layer)" stroke="#edf8dc" stroke-width="3">
      <path d="M142 274 256 228 370 274 256 324Z"/>
      <path d="M148 242 256 198 364 242 256 290Z" opacity=".94"/>
      <path d="M154 211 256 169 358 211 256 257Z" opacity=".88"/>
      <path d="M160 181 256 141 352 181 256 225Z" opacity=".82"/>
      <path d="M166 152 256 114 346 152 256 194Z" opacity=".76"/>
    </g>
    <g fill="#8dc63f">
      <rect x="137" y="376" width="11" height="38" rx="5"/>
      <rect x="166" y="389" width="11" height="38" rx="5"/>
      <rect x="196" y="402" width="11" height="38" rx="5"/>
      <rect x="226" y="416" width="11" height="38" rx="5"/>
      <rect x="275" y="416" width="11" height="38" rx="5"/>
      <rect x="305" y="402" width="11" height="38" rx="5"/>
      <rect x="335" y="389" width="11" height="38" rx="5"/>
      <rect x="364" y="376" width="11" height="38" rx="5"/>
    </g>
  </g>
</svg>
