<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">OCP Academy 고대역폭 플래시 과정 포스터</title>
  <desc id="desc">큰 HBF 글자와 고대역폭 플래시 과정 마크를 사용한 네이비 및 OCP 녹색 포스터입니다.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19194d"/>
      <stop offset="0.58" stop-color="#292d77"/>
      <stop offset="1" stop-color="#343895"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dc58"/>
      <stop offset="1" stop-color="#78ad2d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111438" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#navy)"/>
  <path d="M602 0H800V400H682L602 0Z" fill="url(#green)"/>
  <path d="M571 0H610L690 400H655Z" fill="#4a50aa" opacity=".72"/>
  <g opacity=".24" fill="none" stroke="#dce5ff" stroke-width="2">
    <path d="M520 101C561 66 613 57 661 71"/><path d="M517 303C557 337 614 346 664 329"/><path d="M748 101H776M748 303H776"/>
    <circle cx="520" cy="101" r="5" fill="#dce5ff" stroke="none"/><circle cx="517" cy="303" r="5" fill="#dce5ff" stroke="none"/><circle cx="776" cy="101" r="5" fill="#dce5ff" stroke="none"/><circle cx="776" cy="303" r="5" fill="#dce5ff" stroke="none"/>
  </g>
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <text x="42" y="58" font-size="22" font-weight="900" letter-spacing="3" fill="#fff">OCP ACADEMY</text>
    <rect x="43" y="111" width="112" height="30" rx="15" fill="#8dc63f"/>
    <text x="99" y="132" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.6" fill="#171b42">OCP HBF</text>
    <text x="39" y="224" font-size="98" font-weight="900" letter-spacing="3" fill="#fff">HBF</text>
    <text x="43" y="260" font-size="26" font-weight="800" fill="#fff">고대역폭 플래시</text>
    <rect x="44" y="281" width="62" height="4" rx="2" fill="#8dc63f"/>
    <text x="43" y="321" font-size="18" font-weight="700" fill="#f5f7ff">SSD 용량과 HBM 성능의</text>
    <text x="43" y="347" font-size="18" font-weight="700" fill="#f5f7ff">간극을 연결합니다</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="653" cy="201" r="124" fill="#fff" stroke="#535ab3" stroke-width="4"/>
    <image href="hbf_course_mark.svg" x="563" y="111" width="180" height="180" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g fill="#8dc63f" opacity=".95">
    <rect x="552" y="312" width="16" height="4" rx="2"/><rect x="573" y="312" width="16" height="4" rx="2"/><rect x="594" y="312" width="16" height="4" rx="2"/><rect x="615" y="312" width="16" height="4" rx="2"/><rect x="636" y="312" width="16" height="4" rx="2"/><rect x="657" y="312" width="16" height="4" rx="2"/><rect x="678" y="312" width="16" height="4" rx="2"/><rect x="699" y="312" width="16" height="4" rx="2"/><rect x="720" y="312" width="16" height="4" rx="2"/>
  </g>
