<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>HBF 주소 인터리빙</title>
<style>
  :root{--blue:#525ac0;--deep:#11152f;--green:#8dc63f;--ink:#f7f9ff;--muted:#b9c2dc;--amber:#efa140}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0e1229;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 50% 44%,#272d6b,#121631 62%,#090d20)}
  .grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#7d88bd22 1px,transparent 1px),linear-gradient(90deg,#7d88bd22 1px,transparent 1px);background-size:54px 54px}
  .eyebrow{position:absolute;left:92px;top:64px;color:var(--green);font-size:24px;font-weight:900;letter-spacing:.2em}h1{position:absolute;left:92px;top:94px;margin:0;font-size:60px;letter-spacing:-.03em}.sub{position:absolute;left:96px;top:170px;font-size:24px;color:#c9d0e6}
  .stage{position:absolute;top:238px;height:72px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:900;letter-spacing:.08em;color:#98a4c8;animation:stage 12s ease infinite}.stage .n{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#30376f;border:2px solid #6973bc;animation:stageNum 12s ease infinite}.stage.s1{left:92px}.stage.s2{left:742px}.stage.s3{right:92px}.stage.s2,.stage.s2 .n{animation-delay:4s}.stage.s3,.stage.s3 .n{animation-delay:8s}@keyframes stage{0%,29%{color:#fff}30%,100%{color:#98a4c8}}@keyframes stageNum{0%,29%{background:var(--green);border-color:#b9e86d}30%,100%{background:#30376f;border-color:#6973bc}}
  .page{position:absolute;left:92px;top:338px;width:540px;height:545px;border:2px solid #4b54a4;border-radius:30px;background:#1d2350cc;box-shadow:0 25px 70px #03061488;padding:36px;overflow:hidden}.page h2{margin:0 0 8px;font-size:30px}.page p{margin:0 0 28px;color:var(--muted);font-size:19px}.segments{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.seg{height:34px;border-radius:8px;background:#535bc2;border:1px solid #8f97ec;opacity:.9;animation:segPulse 12s ease infinite;animation-delay:calc(var(--i)*25ms)}@keyframes segPulse{0%,20%{transform:scale(.8);opacity:.25}28%,42%{transform:none;opacity:1}52%,100%{opacity:.35}}
  .local{position:absolute;left:740px;top:338px;width:1090px;height:545px;border:2px solid #3e476f;border-radius:30px;background:#151a3bcc;box-shadow:0 25px 70px #03061488;padding:36px}.local h2{margin:0;font-size:30px}.local p{margin:8px 0 24px;color:var(--muted);font-size:19px}.channels{display:grid;grid-template-columns:repeat(16,1fr);gap:10px;height:330px}.ch{position:relative;border:2px solid #4f597f;border-radius:15px;background:#20264b;overflow:hidden}.ch:before{content:"";position:absolute;left:9px;right:9px;bottom:12px;height:20%;border-radius:8px;background:linear-gradient(#a9db61,#6fa030);animation:fill 12s cubic-bezier(.2,.7,.2,1) infinite;animation-delay:calc(4.5s + var(--i)*45ms)}.ch:after{content:"CH" attr(data-n);position:absolute;left:0;right:0;top:13px;text-align:center;font-size:13px;font-weight:900;color:#aeb8d4}.ch:nth-child(4n+1):before{height:72%}.ch:nth-child(4n+2):before{height:55%}.ch:nth-child(4n+3):before{height:84%}.ch:nth-child(4n):before{height:64%}@keyframes fill{0%,35%{transform:scaleY(.03);transform-origin:bottom;opacity:.1}48%,83%{transform:scaleY(1);opacity:1}92%,100%{transform:scaleY(.03);opacity:.1}}
  .packet{position:absolute;width:16px;height:16px;border-radius:50%;background:#b8ea70;box-shadow:0 0 18px #8dc63f;opacity:0;z-index:8;animation:fly 12s cubic-bezier(.2,.75,.2,1) infinite;animation-delay:calc(3.7s + var(--i)*55ms)}@keyframes fly{0%,28%{opacity:0;transform:translate(0,0)}34%{opacity:1}46%{opacity:1;transform:translate(calc(600px + var(--x)),calc(-35px + var(--y)))}47%,100%{opacity:0;transform:translate(calc(600px + var(--x)),calc(-35px + var(--y)))}}
  .status{position:absolute;left:1030px;bottom:76px;width:500px;height:72px;border:2px solid #8dc63f;border-radius:24px;background:#5f8e2533;display:grid;place-items:center;font-size:25px;font-weight:900;letter-spacing:.12em;color:#ccef9c;opacity:0;animation:status 12s ease infinite}@keyframes status{0%,64%{opacity:0;transform:translateY(18px)}72%,92%{opacity:1;transform:none}100%{opacity:0}}
  .legend{position:absolute;left:94px;bottom:70px;font-size:18px;color:#bdc5de}.legend b{color:#fff}.line{position:absolute;left:635px;top:537px;width:108px;height:5px;border-radius:3px;background:linear-gradient(90deg,#525ac0,#8dc63f);opacity:.75}
</style></head><body><div class="grid"></div><div class="eyebrow">OCP HBF · 소프트웨어에서 미디어로</div><h1>인터리빙이 대역폭을 활성화합니다</h1><div class="sub">하나의 선형 4 KiB 영역이 채널 로컬 병렬 작업으로 전환됩니다</div>
<div class="stage s1"><span class="n">1</span>전역 영역</div><div class="stage s2"><span class="n">2</span>로컬 매핑</div><div class="stage s3"><span class="n">3</span>병렬 읽기</div>
<section class="page"><h2>4 KiB 전역 영역</h2><p>64개 정렬 세그먼트 · 누락 없음 · 중복 없음</p><div class="segments" id="segments"></div></section><div class="line"></div>
<section class="local"><h2>16개 UCIe 채널 로컬 공간</h2><p>배치가 작업을 분산하고 베이스 다이가 뱅크, 다이, 블록 및 페이지를 결정합니다.</p><div class="channels" id="channels"></div></section>
<div id="packets"></div><div class="status">전체 채널 병렬성</div><div class="legend"><b>배치 규칙:</b> 한 채널에 집중된 데이터는 해당 채널의 대역폭만 사용할 수 있습니다.</div>
<script>
  const segs=document.getElementById('segments');for(let i=0;i<64;i++){const e=document.createElement('div');e.className='seg';e.style.setProperty('--i',i);segs.appendChild(e)}
  const channels=document.getElementById('channels');for(let i=0;i<16;i++){const e=document.createElement('div');e.className='ch';e.dataset.n=i;e.style.setProperty('--i',i);channels.appendChild(e)}
  const packets=document.getElementById('packets');for(let i=0;i<32;i++){const e=document.createElement('div');const startX=510+(i%8)*15;const targetX=808+(i%16)*64;e.className='packet';e.style.left=startX+'px';e.style.top=(460+Math.floor(i/8)*24)+'px';e.style.setProperty('--i',i);e.style.setProperty('--x',(targetX-startX-600)+'px');e.style.setProperty('--y',(120+Math.floor(i/16)*92)+'px');packets.appendChild(e)}
</script></body></html>
