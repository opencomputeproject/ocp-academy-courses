<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">HBF 개방형 아키텍처 타임라인</title>
  <desc id="desc">2025년 업계 협업부터 2026년 2월 OCP 작업 흐름, 2026년 8월 FMS의 버전 0.7.0 발표까지를 보여 주는 타임라인입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273252" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="480" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#20263b">개념에서 개방형 통합 아키텍처로</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="128" y="92" width="180" height="42" rx="21" fill="#eef0ff" stroke="#4a50ad" stroke-width="2"/><text x="218" y="119" font-size="15" font-weight="700" fill="#343895">개방성</text>
    <rect x="390" y="92" width="180" height="42" rx="21" fill="#eff8e2" stroke="#8dc63f" stroke-width="2"/><text x="480" y="119" font-size="15" font-weight="700" fill="#5d8924">확장성 + 효율성</text>
    <rect x="652" y="92" width="180" height="42" rx="21" fill="#edf1f6" stroke="#68758b" stroke-width="2"/><text x="742" y="119" font-size="15" font-weight="700" fill="#4e596d">생태계 영향</text>
  </g>
  <line x1="170" y1="270" x2="790" y2="270" stroke="#cbd3e4" stroke-width="10" stroke-linecap="round"/>
  <line x1="170" y1="270" x2="790" y2="270" stroke="#8dc63f" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <circle cx="210" cy="270" r="28" fill="#343895" stroke="#fff" stroke-width="7"/>
    <circle cx="480" cy="270" r="28" fill="#8dc63f" stroke="#fff" stroke-width="7"/>
    <circle cx="750" cy="270" r="28" fill="#343895" stroke="#fff" stroke-width="7"/>
    <rect x="105" y="315" width="210" height="132" rx="20" fill="#fff"/>
    <rect x="375" y="315" width="210" height="132" rx="20" fill="#fff"/>
    <rect x="645" y="315" width="210" height="132" rx="20" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="210" y="209" font-size="20" font-weight="800" fill="#343895">2025</text>
    <text x="480" y="209" font-size="20" font-weight="800" fill="#5d8924">2026년 2월</text>
    <text x="750" y="209" font-size="20" font-weight="800" fill="#343895">2026년 8월</text>
    <text x="210" y="350" font-size="18" font-weight="800" fill="#20263b">업계 협업</text><text x="210" y="380" font-size="15" fill="#4e596d">공통 표준화</text><text x="210" y="403" font-size="15" fill="#4e596d">목표 구체화</text>
    <text x="480" y="350" font-size="18" font-weight="800" fill="#20263b">OCP 작업 흐름</text><text x="480" y="380" font-size="15" fill="#4e596d">전담 작업 그룹</text><text x="480" y="403" font-size="15" fill="#4e596d">Storage 프로젝트</text>
    <text x="750" y="350" font-size="18" font-weight="800" fill="#20263b">v0.7.0 + FMS</text><text x="750" y="380" font-size="15" fill="#4e596d">첫 개방형 아키텍처</text><text x="750" y="403" font-size="15" fill="#4e596d">사양 발표</text>
    <text x="480" y="500" font-size="17" font-weight="700" fill="#343895">인터페이스 · 프로토콜 · 패키징 · 신뢰성 · 소프트웨어 · 애플리케이션</text>
  </g>
</svg>
