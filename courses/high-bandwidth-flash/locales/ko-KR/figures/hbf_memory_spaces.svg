<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">분리된 HBM 및 HBF 메모리 공간</title>
  <desc id="desc">호스트 전역 맵은 분리된 HBM 및 HBF 영역을 포함하며, HBF는 16개의 채널 로컬 선형 공간과 선택적 스크래치패드 SRAM으로 나뉩니다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263252" flood-opacity=".14"/></filter></defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="480" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#20263b">하나의 호스트 맵, 두 계층, 16개의 HBF 로컬 공간</text>
  <g transform="translate(70 86)" font-family="Arial, sans-serif" filter="url(#s)">
    <rect width="820" height="85" rx="20" fill="#fff"/>
    <text x="22" y="28" font-size="15" font-weight="800" fill="#4e596d">호스트 전역 주소 맵</text>
    <rect x="22" y="42" width="210" height="28" rx="9" fill="#343895"/><rect x="240" y="42" width="558" height="28" rx="9" fill="#8dc63f"/>
    <text x="127" y="61" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">HBM 영역</text><text x="519" y="61" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">HBF 영역</text>
  </g>
  <g transform="translate(70 205)" font-family="Arial, sans-serif" filter="url(#s)">
    <rect width="820" height="210" rx="22" fill="#fff"/>
    <text x="22" y="32" font-size="16" font-weight="800" fill="#343895">HBF 채널 로컬 주소 공간</text>
    <g transform="translate(22 52)">
      <g fill="#eff8e2" stroke="#8dc63f" stroke-width="2">
        <rect x="0" y="0" width="42" height="104" rx="10"/><rect x="48" y="0" width="42" height="104" rx="10"/><rect x="96" y="0" width="42" height="104" rx="10"/><rect x="144" y="0" width="42" height="104" rx="10"/>
        <rect x="192" y="0" width="42" height="104" rx="10"/><rect x="240" y="0" width="42" height="104" rx="10"/><rect x="288" y="0" width="42" height="104" rx="10"/><rect x="336" y="0" width="42" height="104" rx="10"/>
        <rect x="384" y="0" width="42" height="104" rx="10"/><rect x="432" y="0" width="42" height="104" rx="10"/><rect x="480" y="0" width="42" height="104" rx="10"/><rect x="528" y="0" width="42" height="104" rx="10"/>
        <rect x="576" y="0" width="42" height="104" rx="10"/><rect x="624" y="0" width="42" height="104" rx="10"/><rect x="672" y="0" width="42" height="104" rx="10"/><rect x="720" y="0" width="42" height="104" rx="10"/>
      </g>
      <g fill="#5d8924" text-anchor="middle" font-size="11" font-weight="800">
        <text x="21" y="25">CH0</text><text x="69" y="25">CH1</text><text x="117" y="25">CH2</text><text x="165" y="25">CH3</text><text x="213" y="25">CH4</text><text x="261" y="25">CH5</text><text x="309" y="25">CH6</text><text x="357" y="25">CH7</text>
        <text x="405" y="25">CH8</text><text x="453" y="25">CH9</text><text x="501" y="25">10</text><text x="549" y="25">11</text><text x="597" y="25">12</text><text x="645" y="25">13</text><text x="693" y="25">14</text><text x="741" y="25">15</text>
      </g>
      <g fill="#8dc63f" opacity=".7"><rect x="8" y="43" width="26" height="50" rx="6"/><rect x="56" y="52" width="26" height="41" rx="6"/><rect x="104" y="35" width="26" height="58" rx="6"/><rect x="152" y="61" width="26" height="32" rx="6"/><rect x="200" y="46" width="26" height="47" rx="6"/><rect x="248" y="38" width="26" height="55" rx="6"/><rect x="296" y="57" width="26" height="36" rx="6"/><rect x="344" y="43" width="26" height="50" rx="6"/><rect x="392" y="52" width="26" height="41" rx="6"/><rect x="440" y="35" width="26" height="58" rx="6"/><rect x="488" y="61" width="26" height="32" rx="6"/><rect x="536" y="46" width="26" height="47" rx="6"/><rect x="584" y="38" width="26" height="55" rx="6"/><rect x="632" y="57" width="26" height="36" rx="6"/><rect x="680" y="43" width="26" height="50" rx="6"/><rect x="728" y="52" width="26" height="41" rx="6"/></g>
    </g>
    <text x="410" y="187" text-anchor="middle" font-size="14" fill="#4e596d">읽기는 독립적으로 완료될 수 있으며, 소프트웨어는 요청 ID와 배치 정책으로 정확성을 유지합니다.</text>
  </g>
  <g transform="translate(190 444)" font-family="Arial, sans-serif">
    <rect width="580" height="58" rx="18" fill="#343895"/>
    <rect x="18" y="13" width="118" height="32" rx="11" fill="#8dc63f"/>
    <text x="77" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">선택적 SRAM</text>
    <text x="156" y="35" font-size="15" fill="#fff">채널별 스크래치패드 · 높은 우선순위 · 휘발성 · 런타임 검색</text>
  </g>
</svg>
