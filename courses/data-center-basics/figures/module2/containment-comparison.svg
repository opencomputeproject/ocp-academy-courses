"#243244" font-weight="700"><tspan x="900" dy="0">Hot-aisle containment</tspan></text><g id="supply1" data-box="true"><rect x="640" y="110" width="150" height="150" rx="14" fill="#EAF2FF" stroke="#3B7FA8" stroke-width="2"/><text x="715.0" y="177.59" font-size="26" text-anchor="middle" fill="#243244" font-weight="500"><tspan x="715.0" dy="0">Cool</tspan><tspan x="715.0" dy="32.5">supply</tspan></text></g><g id="rack1" data-box="true"><rect x="850" y="110" width="120" height="150" rx="14" fill="#F1F5ED" stroke="#8DC63F" stroke-width="2"/><text x="910.0" y="177.305" font-size="27" text-anchor="middle" fill="#243244" font-weight="500"><tspan x="910.0" dy="0">IT</tspan><tspan x="910.0" dy="33.75">row</tspan></text></g><g id="exhaust1" data-box="true"><rect x="1030" y="110" width="150" height="150" rx="14" fill="#FFF0E9" stroke="#BA6545" stroke-width="2"/><text x="1105.0" y="177.59" font-size="26" text-anchor="middle" fill="#243244" font-weight="500"><tspan x="1105.0" dy="0">Warm</tspan><tspan x="1105.0" dy="32.5">return</tspan></text></g><g id="in1"><path class="arrow-shaft" d="M790,185H837" fill="none" stroke="#3B7FA8" stroke-width="4"/><polygon class="arrowhead" points="837,178 850,185 837,192" fill="#3B7FA8"/></g><g id="out1"><path class="arrow-shaft" d="M970,185H1017" fill="none" stroke="#BA6545" stroke-width="4"/><polygon class="arrowhead" points="1017,178 1030,185 1017,192" fill="#BA6545"/></g><path d="M1015,85h180v200h-180Z" fill="none" stroke="#719E2F" stroke-width="6" stroke-linejoin="round" stroke-dasharray="12 7"/><text x="900" y="325" font-size="24" text-anchor="middle" fill="#243244" font-weight="500"><tspan x="900" dy="0">Enclose the warm exhaust side</tspan></text><g id="unit" data-box="true"><rect x="310" y="375" width="580" height="110" rx="14" fill="#F0F1FA" stroke="#343895" stroke-width="2"/><text x="600.0" y="422.875" font-size="25" text-anchor="middle" fill="#243244" font-weight="500"><tspan x="600.0" dy="0">CRAC or CRAH</tspan><tspan x="600.0" dy="3