<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="675" fill="white"/><rect x="90" y="80" width="480" height="175" rx="18" fill="#F1F5ED" stroke="#dce4d5" stroke-width="2"/><text x="120" y="123" text-anchor="start" fill="#243244" font-size="26" font-weight="700"><tspan x="120" dy="0">Power supply</tspan></text><text x="120" y="166" text-anchor="start" fill="#243244" font-size="23" font-weight="500"><tspan x="120" dy="0">AC input to usable DC</tspan></text><rect x="630" y="80" width="480" height="175" rx="18" fill="#F1F5ED" stroke="#dce4d5" stroke-width="2"/><text x="660" y="123" text-anchor="start" fill="#243244" font-size="26" font-weight="700"><tspan x="660" dy="0">PCIe expansion</tspan></text><text x="660" y="166" text-anchor="start" fill="#243244" font-size="23" font-weight="500"><tspan x="660" dy="0">Network, storage or accelerator</tspan><tspan x="660" dy="29.900000000000002">interfaces</tspan></text><rect x="90" y="310" width="480" height="175" rx="18" fill="#F1F5ED" stroke="#dce4d5" stroke-width="2"/><text x="120" y="353" text-anchor="start" fill="#243244" font-size="26" font-weight="700"><tspan x="120" dy="0">Processor and memory</tspan></text><text x="120" y="396" text-anchor="start" fill="#243244" font-size="23" font-weight="500"><tspan x="120" dy="0">Execute work and hold active</tspan><tspan x="120" dy="29.900000000000002">data</tspan></text><rect x="630" y="310" width="480" height="175" rx="18" fill="#F1F5ED" stroke="#dce4d5" stroke-width="2"/><text x="660" y="353" text-anchor="start" fill="#243244" font-size="26" font-weight="700"><tspan x="660" dy="0">Persistent storage</tspan></text><text x="660" y="396" text-anchor="start" fill="#243244" font-size="23" font-weight="500"><tspan x="660" dy="0">Retain information beyond a</tspan><tspan x="660" dy="29.900000000000002">running process</tspan></text></svg>