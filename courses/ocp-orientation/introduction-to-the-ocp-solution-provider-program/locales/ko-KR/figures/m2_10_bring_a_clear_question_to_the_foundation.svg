<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img"><style data-locale-font="true">@font-face{font-family:AcademyLocale;src:url('../fonts/locale.woff2') format('woff2');font-weight:100 900;}text,tspan{font-family:AcademyLocale,sans-serif!important}</style>
<rect width="1200" height="100%" fill="#fff"/>
