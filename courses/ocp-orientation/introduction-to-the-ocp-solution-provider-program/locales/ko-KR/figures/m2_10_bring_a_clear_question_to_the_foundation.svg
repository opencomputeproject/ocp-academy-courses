<text x="49.0" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#343895">제공 대상</text>
<text x="49.0" y="97" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">무엇을</text>
<text x="49.0" y="122" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">제공하는가?</text>
