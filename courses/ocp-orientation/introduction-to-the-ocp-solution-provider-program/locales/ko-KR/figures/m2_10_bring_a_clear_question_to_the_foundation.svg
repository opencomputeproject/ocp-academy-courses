<text x="342.0" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#343895">근거</text>
<text x="342.0" y="97" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">어떤 기여 성과나</text>
<text x="342.0" y="122" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">기준이 적용되는가?</text>
