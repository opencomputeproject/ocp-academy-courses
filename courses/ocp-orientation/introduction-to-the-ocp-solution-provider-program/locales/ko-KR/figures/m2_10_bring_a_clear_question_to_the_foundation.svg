<text x="635.0" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#343895">경로</text>
<text x="635.0" y="97" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">어떤 프로그램이</text>
<text x="635.0" y="122" font-family="Arial,sans-serif" font-size="20" fill="#5F6062">맞는가?</text>
<rect x="903.0" y="24" width="273.0" height="220" rx="15" fill="#f3f4f8" stroke="#d6dccf"/>
