84.8" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 629.029)"><rect x="469" y="613.029" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 657.257)"><rect x="469" y="641.257" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 685.486)"><rect x="469" y="669.486" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 713.714)"><rect x="469" y="697.714" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 741.943)"><rect x="469" y="725.943" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1054.32)"><rect x="469" y="1038.32" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 770.171)"><rect x="469" y="754.171" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 798.4)"><rect x="469" y="782.4" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 854.857)"><rect x="469" y="838.857" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1081.86)"><rect x="469" y="1065.86" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 883.086)"><rect x="469" y="867.086" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1110.09)"><rect x="469" y="1094.09" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 911.314)"><rect x="469" y="895.314" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1138.31)"><rect x="469" y="1122.31" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 939.543)"><rect x="469" y="923.543" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1166.54)"><rect x="469" y="1150.54" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 967.771)"><rect x="469" y="951.771" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 996.621)"><rect x="469" y="980.621" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1"><rect x="413.597" y="818.271" width="80" height="16" rx="8" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="562" y="549.271" width="343" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">2000年代</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">走向主流</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">像Linux和Apache這樣的專案表明，開源軟體可以優於專有軟體。IBM和英特爾等公司投入了大量資金，而Git和GitHub等工具使專家和新手都能無縫地進行全球協作。</span></p></div></foreignObject><foreignObject x="71" y="296.271" width="323" height="302"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">20世紀90年代</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">轉向開源</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">到 20 世紀 90 年代末，“自由軟體”一詞在商業界看來政治色彩過強且風險較高。Christine Peterson 提出了“開源”這一說法，開源促進會（OSI）隨後於 1998 年成立。這種新表述強調協作、可靠性與成本節約，使開放理念對企業更具吸引力。</span></p></div></foreignObject><foreignObject x="562" y="97.2713" width="351" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">20世紀70年代</span></strong><strong><span style="color:rgb(0, 0, 0);font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">–</span></strong><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">20世紀80年代</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">早期階段</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">開放技術起源於學術界和駭客社群。Richard Stallman 的 GNU 專案和自由軟體運動倡導軟體自由，並引入著佐權許可，確保程式碼始終向所有人開放。</span></p></div></foreignObject><foreignObject x="71" y="805.271" width="323" height="332"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">當下</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">開放無處不在</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">如今，開放技術推動著數字世界的骨幹——從雲基礎設施到TensorFlow和PyTorch等人工智慧框架。谷歌、Meta和微軟等科技巨頭積極貢獻，而整個行業都依賴開放標準、開放資料和開放硬體。 </span></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1" transform="rotate(90 477 997)"><rect x="469" y="981" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477.5 1025.47)"><rect x="469.5" y="1009.47" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g></svg>
