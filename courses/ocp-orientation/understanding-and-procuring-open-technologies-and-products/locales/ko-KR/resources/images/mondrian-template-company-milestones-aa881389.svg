584.8" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 629.029)"><rect x="469" y="613.029" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 657.257)"><rect x="469" y="641.257" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 685.486)"><rect x="469" y="669.486" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 713.714)"><rect x="469" y="697.714" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 741.943)"><rect x="469" y="725.943" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1054.32)"><rect x="469" y="1038.32" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 770.171)"><rect x="469" y="754.171" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 798.4)"><rect x="469" y="782.4" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 854.857)"><rect x="469" y="838.857" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1081.86)"><rect x="469" y="1065.86" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 883.086)"><rect x="469" y="867.086" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1110.09)"><rect x="469" y="1094.09" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 911.314)"><rect x="469" y="895.314" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1138.31)"><rect x="469" y="1122.31" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 939.543)"><rect x="469" y="923.543" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1166.54)"><rect x="469" y="1150.54" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 967.771)"><rect x="469" y="951.771" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 996.621)"><rect x="469" y="980.621" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1"><rect x="413.597" y="818.271" width="80" height="16" rx="8" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="562" y="549.271" width="343" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">2000년대</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">주류로의 도약</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Linux와 Apache 같은 프로젝트는 오픈 소스가 독점 소프트웨어보다 뛰어난 성능을 발휘할 수 있음을 보여주었습니다. IBM과 인텔 같은 회사는 막대한 투자를 했고, Git과 GitHub 같은 도구는 전문가와 초보자를 모두 위한 원활한 글로벌 협력을 가능하게 했습니다.</span></p></div></foreignObject><foreignObject x="71" y="296.271" width="323" height="302"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1990년대</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">오픈 소스로의 전환</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1990년대 후반까지, "자유 소프트웨어"라는 용어는 기업에게 너무 정치적이고 위험하다고 느껴졌습니다. 크리스틴 피터슨은 "오픈 소스"를 제안했고, 오픈 소스 이니셔티브(OSI)는 1998년에 설립되었습니다. 이 새로운 프레임워크는 협업, 신뢰성, 비용 절감을 강조하여 개방성을 기업 세계에 더 매력적으로 만들었습니다.</span></p></div></foreignObject><foreignObject x="562" y="97.2713" width="351" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1970년대</span></strong><strong><span style="color:rgb(0, 0, 0);font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">–</span></strong><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1980년대</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">초창기</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">개방형 기술은 학계와 해커 커뮤니티에서 시작되었습니다. Richard Stallman의 GNU 프로젝트와 자유 소프트웨어 운동은 소프트웨어의 자유를 옹호하고 카피레프트 라이선스를 도입하여 누구에게나 코드가 계속 공개되도록 했습니다.</span></p></div></foreignObject><foreignObject x="71" y="805.271" width="323" height="332"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">현재</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">어디서나 누리는 개방성</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">오늘날, 오픈 기술은 클라우드 인프라부터 TensorFlow 및 PyTorch와 같은 AI 프레임워크에 이르기까지 디지털 세계의 핵심을 주도하고 있습니다. Google, Meta 및 Microsoft와 같은 기술 거대 기업들은 적극적으로 기여하고 있으며, 전 산업은 오픈 표준, 오픈 데이터 및 오픈 하드웨어에 의존하고 있습니다. </span></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1" transform="rotate(90 477 997)"><rect x="469" y="981" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477.5 1025.47)"><rect x="469.5" y="1009.47" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g></svg>
