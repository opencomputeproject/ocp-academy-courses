<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1314 554" width="1314" height="554"><title>과정 그래픽</title><style>p,h1,h2,h3,h4,h5,h6,ul,ol{margin-top:0}strong{font-weight:700}a{color:#1a1a1a;text-decoration:underline}</style><rect width="1314" height="554" fill="#ffffff"/><g opacity="1"><rect x="15.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="35.5" y="114" width="369" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">도입</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">기존의 개방형 기술을 활용하여 비용을 절감하고 혁신을 가속화합니다.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="454.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="474.5" y="112" width="379" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">기여</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">공개 기술 생태계의 이점을 이용하고 합법성을 알리기 위해 눈에 띄는 참가자가 되는 것이 중요합니다.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="896.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="916.5" y="112" width="369" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">방향 설정</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">전략적 목표와 일치하도록 프로젝트와 생태계의 방향을 형성한다.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="240" y="295" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="260" y="397" width="369" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">동원</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">열린 기술을 전술적으로 사용하여 경쟁자들을 약화시키고 사용자 커뮤니티에 영향을 미칩니다.</span></p></div></foreignObject><g opacity="1"><rect x="679" y="295" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="699" y="395" width="379" height="132"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">확장</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">산업과 인프라를 재편하기 위해 여러 분야를 아우르는 개방형 기술의 영향력을 확장한다.</span></p></div></foreignObject><g opacity="1"><rect x="36" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="49.5" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1</span></strong></h2></div></foreignObject><g opacity="1"><rect x="474.5" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="488" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">2</span></strong></h2></div></foreignObject><g opacity="1"><rect x="916.5" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="930" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">3</span></strong></h2></div></foreignObject><g opacity="1"><rect x="260" y="318.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="273.5" y="328" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">4</span></strong></h2></div></foreignObject><g opacity="1"><rect x="699" y="318.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="712.5" y="328" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">5</span></strong></h2></div></foreignObject></svg>
