stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1110.09)"><rect x="469" y="1094.09" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 911.314)"><rect x="469" y="895.314" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1138.31)"><rect x="469" y="1122.31" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 939.543)"><rect x="469" y="923.543" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 1166.54)"><rect x="469" y="1150.54" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 967.771)"><rect x="469" y="951.771" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477 996.621)"><rect x="469" y="980.621" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1"><rect x="413.597" y="818.271" width="80" height="16" rx="8" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="562" y="549.271" width="343" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">2000s</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Going Mainstream</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Projects like Linux and Apache showed that open source could outperform proprietary software. Companies like IBM and Intel invested heavily, while tools like Git and GitHub made global collaboration seamless for both experts and newcomers.</span></p></div></foreignObject><foreignObject x="71" y="296.271" width="323" height="302"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1990s</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Switch to Open Source</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">By the late 1990s, the term “free software” felt too political and risky for business. Christine Peterson suggested “open source,” and the Open Source Initiative (OSI) was founded in 1998. This new framing emphasized collaboration, reliability, and cost savings – making openness more appealing to the corporate world.</span></p></div></foreignObject><foreignObject x="562" y="97.2713" width="351" height="225"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1970s</span></strong><strong><span style="color:rgb(0, 0, 0);font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">–</span></strong><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1980s</span></strong></h3><h4 style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">The Early Days</span></strong></h4><p style="text-align:left;line-height:1.5;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Open technologies began in academic and hacker communities. Richard Stallman’s GNU Project and the Free Software movement championed software freedom and introduced copyleft licenses, ensuring code remained open for everyone.</span></p></div></foreignObject><foreignObject x="71" y="805.271" width="323" height="332"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h3 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:28px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Present</span></strong></h3><h4 style="text-align:right;line-height:1.5;margin-bottom:0px"><strong><span style="color:rgb(0, 0, 0);font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Open Everywhere</span></strong></h4><p style="text-align:right;line-height:1.5;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Today, open technologies power the backbone of the digital world – from cloud infrastructure to AI frameworks like TensorFlow and PyTorch. Tech giants like Google, Meta, and Microsoft actively contribute, while entire industries rely on open standards, open data, and open hardware. </span></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p><p style="text-align:right;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1" transform="rotate(90 477 997)"><rect x="469" y="981" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g><g opacity="1" transform="rotate(90 477.5 1025.47)"><rect x="469.5" y="1009.47" width="16" height="32" rx="8" fill="#e2e2e2" fill-opacity="1" stroke="none" stroke-width="0"/></g></svg>
