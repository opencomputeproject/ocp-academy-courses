<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1314 554" width="1314" height="554"><title>Custom Block</title><style>p,h1,h2,h3,h4,h5,h6,ul,ol{margin-top:0}strong{font-weight:700}a{color:#1a1a1a;text-decoration:underline}</style><rect width="1314" height="554" fill="#ffffff"/><g opacity="1"><rect x="15.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="35.5" y="114" width="369" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Adopting</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Leveraging existing open technologies to reduce costs and accelerate innovation.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="454.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="474.5" y="112" width="379" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Contributing</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:#000000;font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Becoming a visible participant to access open technology ecosystem benefits and signal legitimacy.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="896.5" y="12" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="916.5" y="112" width="369" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Steering</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Shaping the direction of projects and ecosystems to align with strategic goals.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="240" y="295" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="260" y="397" width="369" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Mobilizing</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Using open technologies tactically to weaken competitors and influence user communities.</span></p></div></foreignObject><g opacity="1"><rect x="679" y="295" width="409" height="250" rx="20" fill="#F7F7F7" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="699" y="395" width="379" height="132"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Projecting</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Extending open technology influence across multiple domains to reshape industries and infrastructures.</span></p></div></foreignObject><g opacity="1"><rect x="36" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="49.5" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1</span></strong></h2></div></foreignObject><g opacity="1"><rect x="474.5" y="34.5" width="60" heigh