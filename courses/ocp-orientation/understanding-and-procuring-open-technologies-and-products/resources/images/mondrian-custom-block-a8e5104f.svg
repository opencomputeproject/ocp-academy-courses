<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1321 688" width="1321" height="688"><title>Custom Block</title><style>p,h1,h2,h3,h4,h5,h6,ul,ol{margin-top:0}strong{font-weight:700}a{color:#1a1a1a;text-decoration:underline}</style><rect width="1321" height="688" fill="#f7f7f7"/><g opacity="1"><rect x="15.5" y="12" width="409" height="320" rx="20" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="35.5" y="114" width="369" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Acquisition Cost</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Proprietary software often requires steep licensing fees. Open technologies eliminate this, giving immediate savings at adoption.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="454.5" y="12" width="409" height="320" rx="20" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="474.5" y="112" width="379" height="194"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Customization &amp; Integration Cost</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Open source software offers full access to source code, enabling deeper and more cost-effective customization than proprietary software.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="896.5" y="12" width="409" height="320" rx="20" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="916.5" y="112" width="369" height="228"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Deployment Cost</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Open source software offer flexibility and can be deployed on-premises, on the cloud, or on a hybrid infrastructure which reduces constraints imposed by suppliers and the associated costs.</span></p><p style="text-align:left;line-height:2;margin-bottom:0px"><br/></p></div></foreignObject><g opacity="1"><rect x="240" y="361" width="409" height="320" rx="20" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="260" y="463" width="369" height="166"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Maintenance &amp; Support Cost</span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">For open source software diverse options can be contracted for maintenance and support enabling flexible, usage-aligned spending in comparison to proprietary solutions.</span></p></div></foreignObject><g opacity="1"><rect x="679" y="361" width="409" height="320" rx="20" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="699" y="461" width="379" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><p style="text-align:left;line-height:1.5;margin-bottom:0px"><strong><span style="color:#000000;font-size:20px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Exit &amp; Migration Cost </span></strong></p><p style="text-align:left;line-height:2;margin-bottom:0px"><span style="color:rgb(0, 0, 0);font-size:17px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">Open source offer easier and cost effective migration than proprietary solutions.</span></p></div></foreignObject><g opacity="1"><rect x="36" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="49.5" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">1</span></strong></h2></div></foreignObject><g opacity="1"><rect x="474.5" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="488" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">2</span></strong></h2></div></foreignObject><g opacity="1"><rect x="916.5" y="34.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="930" y="44" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">3</span></strong></h2></div></foreignObject><g opacity="1"><rect x="260" y="384.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="273.5" y="394" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">4</span></strong></h2></div></foreignObject><g opacity="1"><rect x="699" y="384.5" width="60" height="60" rx="30" fill="transparent" fill-opacity="1" stroke="none" stroke-width="0"/></g><foreignObject x="712.5" y="394" width="33" height="41"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0px 0px 0px 0px;font-family:'Open Sans',Arial,sans-serif;font-size:17px;line-height:1.5;color:#1a1a1a;"><h2 style="text-align:center;line-height:1.25;margin-bottom:0px"><strong><span style="color:var(--color-theme-tint);font-size:32px;font-family:&#x27;Open Sans&#x27;,Arial,sans-serif">5</span></strong></h2></div></foreignObject></svg>
