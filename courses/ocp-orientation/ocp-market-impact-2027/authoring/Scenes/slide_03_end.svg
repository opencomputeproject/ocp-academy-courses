<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 960 540"><rect x="0" y="0" width="960.00" height="540.00" rx="0" fill="#F6F8F3" stroke="none" stroke-width="2"/><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#DCE5DC"/></pattern></defs><rect x="0" y="0" width="960.00" height="540.00" rx="0" fill="url(#grid)" stroke="none" stroke-width="2"/><rect x="0" y="0" width="960.00" height="108.00" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="106" width="960.00" height="2.00" rx="0" fill="#DCE5DC" stroke="none" stroke-width="2"/><rect x="38" y="29.25" width="7.00" height="55.25" rx="3" fill="#8DC63F" stroke="none" stroke-width="2"/><text x="62" y="51" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#182B36" text-anchor="start">What did IDC expect?</text><text x="62" y="81" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="450" fill="#405963" text-anchor="start">Forecast publication year and target spending year</text><g transform="translate(0.00 0.00) scale(1)" opacity="1.000"><text x="68" y="180" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="650" fill="#182B36" text-anchor="start">Beyond 2029</text><text x="70" y="299" font-family="Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" fill="#343895" text-anchor="start">$892B</text><text x="72" y="343" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="550" fill="#405963" text-anchor="start">IDC forecast for 2030</text><path d="M455 182L455 372" stroke="#DCE5DC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="505" y="274" font-family="Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="700" fill="#14766F" text-anchor="start">About 51%</text><text x="505" y="319" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="550" fill="#405963" text-anchor="start">of spending across the</text><text x="505" y="352" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="550" fill="#405963" text-anchor="start">categories IDC measures</text></g><rect x="0" y="476" width="960.00" height="64.00" rx="0" fill="#E8EFE7" stroke="none" stroke-width="2"/><text x="40" y="516" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#182B36" text-anchor="start">For 2029, IDC raised its forecast from $295B to about $800B.</text></svg>