<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" role="img" aria-labelledby="roadmap-title">
  <title id="roadmap-title">3つの施設DC導入段階</title>
  <g font-family="Arial,sans-serif" fill="#5F6062" text-anchor="middle">
    <rect x="20" y="20" width="210" height="140" rx="10" fill="#f5fbef" stroke="#8DC63F" stroke-width="2" />
    <text x="125" y="56" font-size="19" font-weight="700">ステージ1</text>
    <text x="125" y="92" font-size="16">DCからITラックまで</text>
    <text x="125" y="127" font-size="14">オプションの冷却</text>
    <line x1="230" y1="90" x2="258" y2="90" stroke="#6FA030" stroke-width="3" />
    <polygon class="arrowhead" points="258,84 270,90 258,96" fill="#6FA030" />
    <rect x="270" y="20" width="210" height="140" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2" />
    <text x="375" y="56" font-size="19" font-weight="700">ステージ2</text>
    <text x="375" y="92" font-size="16">ITモジュールへのDC</text>
    <text x="375" y="127" font-size="14">IT、ネットワーク、冷却</text>
    <line x1="480" y1="90" x2="508" y2="90" stroke="#6FA030" stroke-width="3" />
    <polygon class="arrowhead" points="508,84 520,90 508,96" fill="#6FA030" />
    <rect x="520" y="20" width="210" height="140" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2" />
    <text x="625" y="56" font-size="19" font-weight="700">ステージ3</text>
    <text x="625" y="92" font-size="16">施設LVDC</text>
    <text x="625" y="127" font-size="14">すべての設備負荷への DC</text>
  </g>
</svg>