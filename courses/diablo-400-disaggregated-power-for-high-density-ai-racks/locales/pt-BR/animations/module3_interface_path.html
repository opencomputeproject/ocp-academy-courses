<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animação do caminho da interface utilizável do Monte Diablo</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef1f3}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="scene" width="1280" height="720" aria-label="Caminho animado da interface utilizável desde a instalação AC até o rack de TI"></canvas>
<script src="academy_video_common.js"></script>
<script>
(function () {
  'use strict';
  var V = window.AcademyVideo;
  var ctx = V.ctx;
  var C = V.C;
  var blocks = [
    { x: 36, w: 136, lines: ["SUPERIOR", "BARRAMENTO AC"] },
    { x: 208, w: 136, lines: ["PDU CA", "PROTEÇÃO DE ENTRADA"] },
    { x: 380, w: 136, lines: ["PRATELEIRAS PSU", "Fontes de alimentação HOT-SWAP"] },
    { x: 552, w: 136, lines: ["VERTICAL", "BARRAMENTO"] },
    { x: 724, w: 136, lines: ["PDU CC", "PROTEGER / CONTROLAR"] },
    { x: 896, w: 136, lines: ["SAÍDA", "CABO"] },
    { x: 1068, w: 176, lines: ["IT RACK", "CARGA DE COMPUTAÇÃO"] }
  ];
  var notes = [
    "A instalação AC entra pela barramento superior.",
    "A PDU AC aceita entrada e protege as prateleiras de energia.",
    "Módulos PSU hot-swap nas prateleiras convertem energia e compartilham corrente.",
    "O barramento vertical distribui mais, menos e comum.",
    "A PDU DC protege, comuta, controla e reporta telemetria.",
    "A tensão de saída é desconectada antes que um cabo seja reparado.",
    "Juntas, as interfaces formam um caminho de serviço deliberado."
  ];

  function block(item, active, index) {
    var tone = active ? C.greenPale : '#ffffff';
    var stroke = active ? C.green : C.border;
    ctx.save();
    if (active) {
      ctx.shadowColor = C.green;
      ctx.shadowBlur = 10;
    }
    V.roundedRect(item.x, 260, item.w, 150, 14, tone, stroke, active ? 4 : 2);
    ctx.restore();
    V.roundedRect(item.x + 18, 282, 40, 40, 10, active ? C.green : C.bluePale);
    V.text(String(index + 1), item.x + 38, 302, 19, 700, active ? '#ffffff' : C.blue, 'center');
    V.text(item.lines[0], item.x + (item.w / 2), 350, 17, 700, C.text, 'center', item.w - 18);
    V.text(item.lines[1], item.x + (item.w / 2), 379, 13, 700, C.muted, 'center', item.w - 18);
  }

  function renderFrame(elapsed) {
    var t = elapsed * 0.5;
    var stage = Math.min(6, Math.floor(Math.max(0, t - 300) / 1050));
    var complete = V.progress(t, 6900, 7900);

    V.header("Siga o caminho de alimentação da instalação AC até o rack de TI");
    V.panel(28, 124, 1224, 400, "CAMINHO DE INTERFACES MANUTENÍVEIS");

    for (var i = 0; i < blocks.length; i += 1) {
      var local = V.progress(t, 300 + (i * 900), 850 + (i * 900));
      block(blocks[i], local > 0.55, i);
      if (i < blocks.length - 1) {
        var x1 = blocks[i].x + blocks[i].w;
        var x2 = blocks[i + 1].x;
        V.arrow(x1, 335, x2, 335, C.greenDark, 5, V.progress(t, 720 + (i * 900), 1210 + (i * 900)));
      }
    }

    V.panel(86, 555, 1108, 110, '', complete > 0.2 ? 'green' : 'blue');
    V.text("ETAPA ATUAL DA EXPLICAÇÃO", 120, 585, 14, 700, complete > 0.2 ? C.greenDark : C.blue);
    V.text(complete > 0.55 ? notes[6] : notes[stage], 640, 624, 24, 700, C.text, 'center', 1020);
  }

  V.install(renderFrame, 17700, 15400);
}());
</script>
</body>
</html>
