<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Specification collaboration expands in Revision 0.7</title>
  <desc id="d">Version 0.5 begins with Google. Version 0.7 brings AMD, Google, Meta, and NVIDIA together.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f4f2"/>
  <rect x="76" y="118" width="410" height="420" rx="28" fill="#fff" stroke="#d8d9d6" stroke-width="4"/>
  <rect x="714" y="118" width="410" height="420" rx="28" fill="#5f6062"/>
  <path d="M510 328h180" stroke="#8dc63f" stroke-width="18" stroke-linecap="round"/>
  <circle cx="510" cy="328" r="16" fill="#8dc63f"/><circle cx="690" cy="328" r="16" fill="#8dc63f"/>
  <text x="116" y="184" fill="#6fa030" font-family="Arial,sans-serif" font-size="28" font-weight="700">REVISION 0.5.0</text>
  <text x="116" y="265" fill="#5f6062" font-family="Arial,sans-serif" font-size="50" font-weight="800">Google</text>
  <text x="116" y="324" fill="#5f6062" font-family="Arial,sans-serif" font-size="26">Earlier Google baseline</text>
  <text x="754" y="184" fill="#8dc63f" font-family="Arial,sans-serif" font-size="28" font-weight="700">REVISION 0.7.0</text>
  <text x="754" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="800">AMD · Google</text>
  <text x="754" y="312" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="800">Meta · NVIDIA</text>
  <text x="754" y="382" fill="#f3f4f2" font-family="Arial,sans-serif" font-size="26">Unified 2027–2028 envelope</text>
  <rect x="744" y="430" width="350" height="54" rx="27" fill="#8dc63f"/>
  <text x="919" y="465" text-anchor="middle" fill="#292929" font-family="Arial,sans-serif" font-size="19" font-weight="800">BROADER COLLABORATION</text>
</svg>
