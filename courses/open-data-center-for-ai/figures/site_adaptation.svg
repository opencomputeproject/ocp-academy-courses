tor</text><rect x="70" y="850" width="1780" height="125" rx="12" fill="#fff" stroke="#DADED4" stroke-width="3"/><text class="" x="100" y="926" font-size="42" font-weight="800" fill="#6FA030" text-anchor="start">STATUS</text><text class="" x="455" y="926" font-size="40" font-weight="700" fill="#5F6062" text-anchor="start">OPEN · required reviews and acceptance pending</text></svg>