<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Open Data Center for AI course mark</title>
  <desc id="d">A simplified perspective view down an AI data-center row, with opposing rack banks, an open aisle, and overhead power and cooling infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343895"/>
      <stop offset="1" stop-color="#171b4b"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555bb2"/>
      <stop offset="1" stop-color="#20255f"/>
    </linearGradient>
    <linearGradient id="aisle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#bfc8dc"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9e86d"/>
      <stop offset="1" stop-color="#8dc63f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#101337" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <!-- The bright aisle preserves the recognizable row-view silhouette at icon scale. -->
    <path d="M218 246H294L366 451H146Z" fill="url(#aisle)" stroke="#eef2ff" stroke-width="5"/>
    <g fill="none" stroke="#8d99b5" stroke-width="4" opacity=".85">
      <path d="M256 250V449"/>
      <path d="M199 301H313M182 349H330M165 398H347"/>
    </g>

    <!-- Two simplified rack banks converge on the same vanishing point. -->
    <path d="M76 220 218 246 218 416 76 453Z" fill="url(#rack)" stroke="#eef2ff" stroke-width="6"/>
    <path d="M294 246 436 220V453L294 416Z" fill="url(#rack)" stroke="#eef2ff" stroke-width="6"/>
    <g fill="none" stroke="#dfe6ff" stroke-width="5" opacity=".95">
      <path d="M105 225V445M133 230V438M162 235V430M190 240V423"/>
      <path d="M322 240V423M350 235V430M379 230V438M407 225V445"/>
    </g>
    <g fill="#8dc63f">
      <rect x="196" y="273" width="8" height="29" rx="4"/><rect x="196" y="325" width="8" height="29" rx="4"/><rect x="196" y="377" width="8" height="29" rx="4"/>
      <rect x="308" y="273" width="8" height="29" rx="4"/><rect x="308" y="325" width="8" height="29" rx="4"/><rect x="308" y="377" width="8" height="29" rx="4"/>
    </g>

    <!-- A compact overhead service gantry echoes the row image used on the poster. -->
    <path d="M105 117H407L372 172H140Z" fill="#69738b" stroke="#eef2ff" stroke-width="6"/>
    <path d="M140 172 218 246M372 172 294 246" fill="none" stroke="#dfe6ff" stroke-width="9"/>
    <path d="M163 183H349L315 218H197Z" fill="#20255f" stroke="#eef2ff" stroke-width="5"/>
    <path d="M96 151H416" fill="none" stroke="url(#pipe)" stroke-width="16" stroke-linecap="round"/>
    <path d="M117 151V229M395 151V229" fill="none" stroke="url(#pipe)" stroke-width="13" stroke-linecap="round"/>
    <path d="M187 198H325" fill="none" stroke="#757ee0" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
