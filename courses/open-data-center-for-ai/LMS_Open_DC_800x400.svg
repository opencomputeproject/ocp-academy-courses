    <g fill="#8dc63f" opacity=".96">
      <rect x="552" y="312" width="16" height="4" rx="2"/><rect x="573" y="312" width="16" height="4" rx="2"/>
      <rect x="594" y="312" width="16" height="4" rx="2"/><rect x="615" y="312" width="16" height="4" rx="2"/>
      <rect x="636" y="312" width="16" height="4" rx="2"/><rect x="657" y="312" width="16" height="4" rx="2"/>
      <rect x="678" y="312" width="16" height="4" rx="2"/><rect x="699" y="312" width="16" height="4" rx="2"/>
      <rect x="720" y="312" width="16" height="4" rx="2"/>
    </g>
