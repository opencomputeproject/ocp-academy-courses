<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">OCP Academy Open Data Center for AI course poster</title>
  <desc id="desc">A branded indigo and OCP green course poster with a rack-row infrastructure emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19194d"/>
      <stop offset="0.58" stop-color="#292d77"/>
      <stop offset="1" stop-color="#343895"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dc58"/>
      <stop offset="1" stop-color="#78ad2d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111438" flood-opacity=".32"/>
    </filter>
    <clipPath id="canvas"><rect width="800" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="800" height="400" fill="url(#background)"/>
    <path d="M596 -34L864 -34L864 434L690 434Z" fill="url(#sweep)"/>
    <path d="M568 -34L604 -34L698 434L662 434Z" fill="#4a50aa" opacity=".70"/>
    <g fill="none" stroke="#dce5ff" stroke-width="2" opacity=".24">
      <path d="M520 98C556 68 606 58 660 72"/>
      <path d="M518 302C557 335 610 345 665 329"/>
      <path d="M748 98H776M748 302H776"/>
      <circle cx="520" cy="98" r="5" fill="#dce5ff" stroke="none"/>
      <circle cx="518" cy="302" r="5" fill="#dce5ff" stroke="none"/>
      <circle cx="776" cy="98" r="5" fill="#dce5ff" stroke="none"/>
      <circle cx="776" cy="302" r="5" fill="#dce5ff" stroke="none"/>
    </g>
    <image x="42" y="27" width="135" height="66" href="ocp_academy_white.svg" xlink:href="ocp_academy_white.svg" preserveAspectRatio="xMidYMid meet"/>
    <g font-family="Lato, Open Sans, Arial, sans-serif">
      <rect x="43" y="112" width="132" height="30" rx="15" fill="#8dc63f"/>
      <text x="109" y="133" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.45" fill="#171b42">OCP OPEN DC</text>
      <text x="42" y="203" font-size="48" font-weight="900" letter-spacing="2.2" fill="#fff">OPEN DATA</text>
      <text x="42" y="254" font-size="48" font-weight="900" letter-spacing="2.2" fill="#fff">CENTER FOR AI</text>
      <rect x="44" y="279" width="62" height="4" rx="2" fill="#8dc63f"/>
      <text x="42" y="319" font-size="17" font-weight="700" fill="#f5f7ff">A shared facility envelope for</text>
      <text x="42" y="344" font-size="17" font-weight="700" fill="#f5f7ff">AI infrastructure at scale</text>
    </g>
    <g filter="url(#shadow)">
      <circle cx="651" cy="200" r="122" fill="#fff" stroke="#535ab3" stroke-width="4"/>
      <image x="552" y="101" width="198" height="198" href="figures/open_dc_generated_emblem.png" xlink:href="figures/open_dc_generated_emblem.png" preserveAspectRatio="xMidYMid meet"/>
