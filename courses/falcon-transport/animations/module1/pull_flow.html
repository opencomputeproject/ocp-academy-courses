<!doctype html><html><head><meta charset="utf-8"><title>pull_flow</title><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:white}svg{display:block}#scene{width:1920px;height:1080px}</style></head><body><main id="scene"></main><script>const DATA={"kind": "pull", "durationMs": 94780.36281179138, "stages": [{"at": 0.0, "cue": "Send two Pull Requests", "packet": "RSNs 1 / 2 \u00b7 PSNs 100 / 101", "detail": "Request-window packet numbers", "dir": "right", "at_seconds": 0, "motion_ms": 2000, "narration_anchor": "Begin with two Pull Requests"}, {"at": 0.1342050148642978, "cue": "Request 101 arrives before request 100", "packet": "PSN 101 \u00b7 RSN 2 first", "detail": "Ordered connection retains the later request", "dir": "right", "at_seconds": 12.72, "motion_ms": 2820, "narration_anchor": "Suppose request one hundred one reaches the target first"}, {"at": 0.18801362931460588, "cue": "Both requests can be delivered in RSN order", "packet": "Request 100 closes the gap", "detail": "Present requests 1, then 2 to target ULP", "dir": "right", "at_seconds": 17.82, "motion_ms": 1400, "narration_anchor": "request one hundred arrives"}, {"at": 0.3004841842244655, "cue": "Request ACK reports delivery, not response data", "packet": "ACK \u00b7 request base 102", "detail": "No Pull Data has returned yet", "dir": "left", "at_seconds": 28.48, "motion_ms": 1800, "narration_anchor": "one coalesced request acknowledgement"}, {"at": 0.48638767179592207, "cue": "Target sends responses in a separate data window", "packet": "RSNs 1 / 2 \u00b7 PSNs 200 / 201", "detail": "Target transmits; initiator receives", "dir": "left", "at_seconds": 46.1, "motion_ms": 3500, "narration_anchor": "target upper-layer protocol supplies the responses"}, {"at": 0.7391826526252125, "cue": "Deliver responses and acknowledge the data", "packet": "ACK \u00b7 returned data received", "detail": "Response delivery preserves RSN order", "dir": "right", "at_seconds": 70.06, "motion_ms": 1400, "narration_anchor": "delivers the responses in request-sequence order"}], "timing_basis": "measured_word_alignment", "alignment_source": "../../../authoring/alignments/falcon-transaction-architecture/slide_06_a_pull_an_ack_is_not_the_response.json", "audio_sha256": "9d95eeedc29daa82bca3ba4cf6ea5dfe39529afba066962d597ee8dae4c7cc2a", "dataAckMs": 72720};</script><script>
let CLOCK_MS=0;
const G='#8DC63F',D='#5F6062',I='#343895',L='#E5E8E2',BG='#F5F7F3';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');
const tx=(x,y,s,z=32,w=400,c=D,a='start')=>`<text x="${x}" y="${y}" font-size="${z}" font-weight="${w}" fill="${c}" text-anchor="${a}">${esc(s)}</text>`;
const rect=(x,y,w,h,f='white',s=L,r=20)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="2"/>`;
function ar(x1,y1,x2,y2,c=G){let dx=x2-x1,dy=y2-y1,n=Math.hypot(dx,dy),ux=dx/n,uy=dy/n,bx=x2-18*ux,by=y2-18*uy;return `<path d="M ${x1} ${y1} L ${bx} ${by}" fill="none" stroke="${c}" stroke-width="4"/><polygon class="arrowhead" points="${bx-9*uy},${by+9*ux} ${x2},${y2} ${bx+9*uy},${by-9*ux}" fill="${c}"/>`;}
function card(x,y,w,title,lines,accent=false){return rect(x,y,w,195,accent?BG:'white',accent?G:L)+tx(x+30,y+48,title,29,600)+lines.map((s,j)=>tx(x+30,y+103+43*j,s,32,j===0?600:400)).join('');}
function actors(lrole,rrole){let s='';for(let [x,n,role]of [[50,'Initiator',lrole],[1260,'Target',rrole]]){s+=tx(x+305,145,n,42,700,D,'middle')+rect(x,205,610,95,BG)+tx(x+305,264,'Upper-layer protocol',34,600,D,'middle')+rect(x,420,610,190,'white',G)+tx(x+305,493,'Falcon',42,600,D,'middle')+tx(x+305,555,role,31,400,D,'middle');}return s;}
function milestones(labels,stage){let w=(1820-(labels.length-1)*20)/labels.length;return labels.map((s,i)=>rect(50+i*(w+20),937,w,79,i<=stage?BG:'white',i===stage?G:L,14)+tx(50+i*(w+20)+w/2,986,s,25,i===stage?700:400,D,'middle')).join('');}
function wire(label,detail,direction,progress){let s=tx(960,353,label,36,600,direction==='left'?I:D,'middle')+tx(960,398,detail,28,400,D,'middle');if(direction){let a=direction==='right'?660:1260,b=direction==='right'?1260:660,c=direction==='right'?G:I;s+=ar(a,500,b,500,c);if(progress<1){let x=a+(b-a)*progress;s+=`<circle cx="${x}" cy="500" r="12" fill="${c}" stroke="white" stroke-width="4"/>`;}}return s;}
function internal(x,direction,label){return ar(x,direction==='down'?300:420,x,direction==='down'?420:300,I)+tx(x+34,370,label,28,600,I);}
function wrap(body){return `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="font-family:Open Sans,Arial,sans-serif"><rect width="1920" height="1080" fill="white"/>${body}</svg>`;}
function phase(i){return rect(50,28,1820,82,BG,L,16)+tx(80,78,`${String(i+1).padStart(2,'0')}  ${DATA.stages[i].cue}`,30,600);}
function push(i,p){let a=DATA.stages[i],arrived=p>=1,display=(i===1||i===2||i===4||i===5)&&!arrived?DATA.stages[i-1]:a,s=phase(i)+actors('Push Data transmitter','Push Data receiver');s+=wire(a.packet,a.detail,a.dir,p);if(i===0)s+=internal(355,'down','RSN 1, then 2');if(i===3)s+=internal(1565,'up','RSN 1, then 2');if(i===4)s+=internal(1565,'down','ULP ACKs');if(i>=5&&arrived)s+=internal(355,'up','Completions 1, 2');s+=card(50,675,610,'INITIATOR COMPLETION',i>=5&&arrived?['RSN 1, then RSN 2','Returning ACK received']:['Waiting for target ACK','No completion yet'],i>=5&&arrived);s+=card(690,675,540,'PERSISTENT IDENTITIES',['RSN 1 ↔ PSN 300','RSN 2 ↔ PSN 301']);s+=rect(1260,675,610,195,i>0?BG:'white',i>0?G:L)+tx(1290,723,'STATE AT ORIGINAL BASE 300',28,600);for(let [y,label,bits]of [[775,'Received',display.rx],[833,'Acknowledged',display.ack]]){s+=tx(1290,y,label,31,600);for(let k=0;k<2;k++){s+=`<path d="M ${1655+k*75} ${y+7} h 46" stroke="${bits[k]==='1'?G:L}" stroke-width="5"/>`+tx(1678+k*75,y-3,bits[k],32,700,D,'middle');}}s+=tx(1565,911,`Cumulative base ${CLOCK_MS>=(DATA.baseAdvanceMs??DATA.durationMs*.70)?'302':'300'} · bit 0 = PSN 300`,25,400,D,'middle');s+=milestones(['Assign','Receive 301','Receive 300','Deliver in order','ULP ACK','Complete'],i);return wrap(s);}
function pull(i,p){let a=DATA.stages[i],arrived=p>=1,s=phase(i)+actors(i<4?'Request transmitter':'Data receiver',i<4?'Request receiver':'Data transmitter');let ackStart=DATA.dataAckMs??DATA.durationMs*.75,ackNow=CLOCK_MS>=ackStart;let wp=i===5?Math.min(1,Math.max(0,(CLOCK_MS-ackStart)/1400)):p;s+=wire(i===5&&!ackNow?'Deliver responses in RSN order':a.packet,i===5&&!ackNow?'Initiator ULP receives RSN 1, then RSN 2':a.detail,i===5&&!ackNow?'':a.dir,wp);if(i===0)s+=internal(355,'down','RSN 1, then 2');if(i===2)s+=internal(1565,'up','Requests 1, 2');if(i===4)s+=internal(1565,'down','Responses 1, 2');if(i>=5)s+=internal(355,'up','Responses 1, 2');s+=card(50,675,610,'REQUEST WINDOW',[i>3||i===3&&arrived?'Request base 102':'PSNs 100 and 101',i>3||i===3&&arrived?'Requests acknowledged':'Awaiting request ACK'],i>=3);s+=card(690,675,540,'TRANSACTION IDENTITY',['RSN 1 and RSN 2','Unchanged on return']);s+=card(1260,675,610,'DATA WINDOW',[i>=4?'PSNs 200 and 201':'No response data yet',i>=5&&ackNow?'Data received and ACKed':i>=4?'Pull Data → initiator':'Request ACK ≠ response'],i>=4);s+=milestones(['Send requests','Reorder','Deliver requests','Request ACK','Return data','Data ACK'],i);return wrap(s);}
function resource(i,p){let a=DATA.stages[i],stage=i,allocated=CLOCK_MS>=(DATA.bufferAllocationMs??DATA.durationMs*.65); i=Math.max(0,i-1);let s=phase(stage);s+=tx(355,155,'Initiator',42,700,D,'middle')+tx(1565,155,'Target',42,700,D,'middle');s+=rect(50,205,610,340,'white',G)+tx(355,264,stage===0?'Independent receive resources':'Outstanding pull · RSN 7',34,600,D,'middle');s+=rect(1260,205,610,340)+tx(1565,264,'Response producer',34,600,D,'middle');s+=tx(355,350,stage===0?'Packet metadata + buffers':i===0?'Request accepted':i===1?'Waiting for data':i===2?(allocated?'Admit response':'Validate outstanding request'):i===3?'Separate failed arrival':'Older-peer condition',36,600,D,'middle');s+=tx(1565,350,stage===0?'Independent transmit resources':i<2?'Prepare Pull Data':i<4?'Send Pull Data':'Gate Pull Responses',34,600,D,'middle');s+=tx(1565,420,stage===0?'Requests + responses':i===4?'on ncwnd for performance':'Preserve RSN 7',30,400,D,'middle');s+=wire(a.packet,a.detail,a.dir,p);s+=card(50,655,860,'RECEIVE PACKET METADATA',stage===0?['Packet context is distinct from payload','Separate resources preserve progress']:['Reserved proactively at request initiation','ULP Requests region · match RSN 7'],stage>0);s+=card(960,655,910,'RECEIVE PAYLOAD BUFFER',stage===0?['Protect head-of-line capacity','Requests and responses remain independent']:i<2?['Not reserved while waiting','Allocate from network region on arrival']:i===2?(allocated?['Allocated when Pull Data arrives','Successful admission → delivery']:['Awaiting buffer admission','Validate the outstanding request first']):i===3?['Unavailable in this separate case','Discard packet → resource NACK event']:['v1.0 / v1.1 peer limits remain','Negotiation does not upgrade its behavior'],i===2);s+=tx(960,908,i===3?'Failed admission produces no delivery or completion.':'Independent Tx / Rx and request / response resources protect HoL progress.',30,600,D,'middle');s+=milestones(['Independence','Reserve metadata','Wait','Allocate buffer','Failure case','Older peer'],stage);return wrap(s);}
function render(ms){CLOCK_MS=ms;let u=Math.max(0,Math.min(1,ms/DATA.durationMs)),i=DATA.stages.findLastIndex(x=>u>=x.at);i=Math.max(0,i);let start=DATA.stages[i].at,end=DATA.stages[i+1]?.at??1;let p=Math.min(1,Math.max(0,(ms-start*DATA.durationMs)/(DATA.stages[i].motion_ms??Math.min(3500,(end-start)*DATA.durationMs*.5))));document.getElementById('scene').innerHTML=({push,pull,resource}[DATA.kind])(i,p);window.currentTeachingStage=i;}
window.setTeachingTime=render;document.body.dataset.durationMs=DATA.durationMs;document.body.dataset.posterMs=Math.round(DATA.durationMs*.97);render(0);
</script></body></html>
