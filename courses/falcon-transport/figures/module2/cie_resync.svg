<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:Arial,sans-serif;font-weight:500}</style><g data-containment="true"><rect class="container" x="60" y="30" width="1800" height="100" rx="16" fill="#f2f7ec"/><text x="90" y="91.55" font-size="33" fill="#26332d">Push transaction: PSN 301 / RSN 1 · same path-id preserved through Resync</text></g><text x="105" y="205" font-size="32" fill="#26332d">Initiator Falcon</text><text x="1320" y="205" font-size="32" fill="#26332d">Target Falcon + ULP</text><line x1="190" y1="242" x2="190" y2="892" stroke="#e8ebe7" stroke-width="4"/><line x1="1710" y1="242" x2="1710" y2="892" stroke="#e8ebe7" stroke-width="4"/><text x="80" y="285" font-size="32" fill="#26332d">1</text><text x="290" y="270" font-size="30" fill="#26332d">Push Data 301 → ULP returns CIE</text><line x1="190" y1="307" x2="1694" y2="307" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1694,299 1710,307 1694,315" fill="#8DC63F"/><text x="80" y="389" font-size="32" fill="#26332d">2</text><text x="290" y="374" font-size="30" fill="#26332d">First CIE NACK is lost</text><line x1="1710" y1="411" x2="960" y2="411" stroke="#5F6062" stroke-width="4"/><line x1="935" y1="399" x2="959" y2="423" stroke="#5F6062" stroke-width="4"/><line x1="935" y1="423" x2="959" y2="399" stroke="#5F6062" stroke-width="4"/><text x="80" y="493" font-size="32" fill="#26332d">3</text><text x="290" y="478" font-size="30" fill="#26332d">Timeout → retransmit 301; target recognizes saved CIE</text><line x1="190" y1="515" x2="1694" y2="515" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1694,507 1710,515 1694,523" fill="#8DC63F"/><text x="80" y="597" font-size="32" fill="#26332d">4</text><text x="290" y="582" font-size="30" fill="#26332d">Same CIE NACK returned; failed ULP operation is not repeated</text><line x1="1710" y1="619" x2="206" y2="619" stroke="#5F6062" stroke-width="4"/><polygon class="arrowhead" points="206,611 190,619 206,627" fill="#5F6062"/><text x="80" y="701" font-size="32" fill="#26332d">5</text><text x="290" y="686" font-size="30" fill="#26332d">Resync uses original PSN 301, RSN 1, and path-id</text><line x1="190" y1="723" x2="1694" y2="723" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1694,715 1710,723 1694,731" fill="#8DC63F"/><text x="80" y="805" font-size="32" fill="#26332d">6</text><text x="290" y="790" font-size="30" fill="#26332d">Resync ACK → initiator returns error completion</text><line x1="1710" y1="827" x2="206" y2="827" stroke="#5F6062" stroke-width="4"/><polygon class="arrowhead" points="206,819 190,827 206,835" fill="#5F6062"/><g data-containment="true"><rect class="container" x="60" y="940" width="1800" height="100" rx="16" fill="#f2f7ec"/><text x="90" y="1000.85" font-size="31" fill="#26332d">Sequence hole closed. Transaction remains in error. Timeouts and retry limits bound resource retention.</text></g></svg>