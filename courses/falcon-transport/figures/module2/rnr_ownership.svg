<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:Arial,sans-serif;font-weight:500}</style><g data-containment="true"><rect class="container" x="60" y="30" width="870" height="150" rx="16" fill="#f2f7ec"/><text x="90" y="87" font-size="32" fill="#26332d">PUSH · initiator owns retransmission</text><text x="90" y="134" font-size="32" fill="#26332d">Push Data remains unacknowledged.</text></g><g data-containment="true"><rect class="container" x="990" y="30" width="870" height="150" rx="16" fill="#f2f7ec"/><text x="1020" y="87" font-size="32" fill="#26332d">PULL · target owns local retry</text><text x="1020" y="134" font-size="32" fill="#26332d">Pull Request can already be acknowledged.</text></g><text x="80" y="225" font-size="30" fill="#26332d">Initiator</text><text x="620" y="225" font-size="30" fill="#26332d">Target + ULP</text><text x="1010" y="225" font-size="30" fill="#26332d">Initiator</text><text x="1540" y="225" font-size="30" fill="#26332d">Target + ULP</text><line x1="140" y1="255" x2="140" y2="910" stroke="#e8ebe7" stroke-width="3"/><line x1="790" y1="255" x2="790" y2="910" stroke="#e8ebe7" stroke-width="3"/><line x1="1070" y1="255" x2="1070" y2="910" stroke="#e8ebe7" stroke-width="3"/><line x1="1720" y1="255" x2="1720" y2="910" stroke="#e8ebe7" stroke-width="3"/><text x="180" y="284" font-size="26" fill="#26332d">1 · Push Data · PSN 301 / RSN 1</text><line x1="140" y1="315" x2="774" y2="315" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="774,307 790,315 774,323" fill="#8DC63F"/><text x="180" y="389" font-size="26" fill="#26332d">2 · RNR NACK lost in network</text><line x1="790" y1="420" x2="470" y2="420" stroke="#5F6062" stroke-width="4"/><line x1="450" y1="408" x2="474" y2="432" stroke="#5F6062" stroke-width="4"/><line x1="450" y1="432" x2="474" y2="408" stroke="#5F6062" stroke-width="4"/><text x="180" y="494" font-size="26" fill="#26332d">3 · Timeout → retransmit 301</text><line x1="140" y1="525" x2="774" y2="525" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="774,517 790,525 774,533" fill="#8DC63F"/><text x="180" y="599" font-size="26" fill="#26332d">4 · Later RNR NACK received</text><line x1="790" y1="630" x2="156" y2="630" stroke="#5F6062" stroke-width="4"/><polygon class="arrowhead" points="156,622 140,630 156,638" fill="#5F6062"/><text x="180" y="704" font-size="26" fill="#26332d">5 · Delay expires → retry 301</text><line x1="140" y1="735" x2="774" y2="735" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="774,727 790,735 774,743" fill="#8DC63F"/><text x="180" y="809" font-size="26" fill="#26332d">6 · ULP accepts → final ACK</text><line x1="790" y1="840" x2="156" y2="840" stroke="#5F6062" stroke-width="4"/><polygon class="arrowhead" points="156,832 140,840 156,848" fill="#5F6062"/><text x="1110" y="284" font-size="26" fill="#26332d">1 · Pull Request · RSN 1</text><line x1="1070" y1="315" x2="1704" y2="315" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1704,307 1720,315 1704,323" fill="#8DC63F"/><text x="1110" y="389" font-size="26" fill="#26332d">2 · Request ACK</text><line x1="1720" y1="420" x2="1086" y2="420" stroke="#5F6062" stroke-width="4"/><polygon class="arrowhead" points="1086,412 1070,420 1086,428" fill="#5F6062"/><g data-containment="true"><rect class="container" x="1120" y="490" width="690" height="150" rx="16" fill="#f2f7ec"/><text x="1150" y="547" font-size="27" fill="#26332d">3 · ULP returns RNR</text><text x="1150" y="589" font-size="27" fill="#26332d">Target waits the indicated delay.</text></g><g data-containment="true"><rect class="container" x="1120" y="675" width="690" height="150" rx="16" fill="#f2f7ec"/><text x="1150" y="732" font-size="27" fill="#26332d">4 · Target redelivers to local ULP</text><text x="1150" y="774" font-size="27" fill="#26332d">Accepted → returned Pull Data.</text></g><text x="1110" y="863" font-size="26" fill="#26332d">5 · Pull Data to initiator</text><line x1="1720" y1="895" x2="1086" y2="895" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1086,887 1070,895 1086,903" fill="#8DC63F"/><g data-containment="true"><rect class="container" x="60" y="950" width="1800" height="90" rx="16" fill="#f2f7ec"/><text x="90" y="1004.45" font-size="27" fill="#26332d">Lost push NACK: original packet timeout still protects progress. Retry delay = max(RTO, RNR-NACK-timeout).</text></g></svg>