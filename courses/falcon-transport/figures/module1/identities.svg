<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="980" viewBox="0 0 1920 980" style="font-family:Open Sans,Arial,sans-serif"><rect width="1920" height="980" fill="white"/><rect x="70" y="70" width="510" height="760" rx="20" fill="white" stroke="#E5E8E2" stroke-width="2"/><text x="110" y="140" font-size="42" font-weight="700" fill="#5F6062" text-anchor="start">Connection</text><text x="110" y="190" font-size="30" font-weight="400" fill="#5F6062" text-anchor="start">Which peer context?</text><rect x="705" y="70" width="510" height="760" rx="20" fill="white" stroke="#E5E8E2" stroke-width="2"/><text x="745" y="140" font-size="42" font-weight="700" fill="#5F6062" text-anchor="start">Transaction</text><text x="745" y="190" font-size="30" font-weight="400" fill="#5F6062" text-anchor="start">Which request?</text><rect x="1340" y="70" width="510" height="760" rx="20" fill="white" stroke="#E5E8E2" stroke-width="2"/><text x="1380" y="140" font-size="42" font-weight="700" fill="#5F6062" text-anchor="start">Packet</text><text x="1380" y="190" font-size="30" font-weight="400" fill="#5F6062" text-anchor="start">Which delivery window?</text><rect x="105" y="255" width="440" height="190" rx="20" fill="#F5F7F3" stroke="#8DC63F" stroke-width="2"/><text x="135" y="305" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">Destination CID</text><text x="135" y="357" font-size="34" font-weight="600" fill="#5F6062" text-anchor="start">Receiver allocated</text><text x="135" y="401" font-size="34" font-weight="400" fill="#5F6062" text-anchor="start">Carried in header</text><rect x="105" y="490" width="440" height="190" rx="20" fill="white" stroke="#E5E8E2" stroke-width="2"/><text x="135" y="540" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">Source CID</text><text x="135" y="592" font-size="34" font-weight="600" fill="#5F6062" text-anchor="start">Locally unique</text><text x="135" y="636" font-size="34" font-weight="400" fill="#5F6062" text-anchor="start">Not in header</text><rect x="740" y="255" width="440" height="190" rx="20" fill="#F5F7F3" stroke="#8DC63F" stroke-width="2"/><text x="770" y="305" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">RSN</text><text x="770" y="357" font-size="34" font-weight="600" fill="#5F6062" text-anchor="start">Transaction identity</text><text x="770" y="401" font-size="34" font-weight="400" fill="#5F6062" text-anchor="start">Ordering state</text><text x="775" y="560" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">Ordered connection:</text><text x="775" y="615" font-size="30" font-weight="400" fill="#5F6062" text-anchor="start">deliver in RSN order</text><text x="775" y="700" font-size="30" font-weight="400" fill="#5F6062" text-anchor="start">Arrival may differ.</text><rect x="1375" y="255" width="440" height="190" rx="20" fill="#F5F7F3" stroke="#8DC63F" stroke-width="2"/><text x="1405" y="305" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">Request PSN</text><text x="1405" y="357" font-size="34" font-weight="600" fill="#5F6062" text-anchor="start">Pull Request</text><rect x="1375" y="490" width="440" height="190" rx="20" fill="white" stroke="#E5E8E2" stroke-width="2"/><text x="1405" y="540" font-size="30" font-weight="600" fill="#5F6062" text-anchor="start">Data PSN</text><text x="1405" y="592" font-size="34" font-weight="600" fill="#5F6062" text-anchor="start">Push Data</text><text x="1405" y="636" font-size="34" font-weight="400" fill="#5F6062" text-anchor="start">Pull Data</text><text x="960" y="910" font-size="34" font-weight="600" fill="#5F6062" text-anchor="middle">Independent meanings · independent sequence spaces</text></svg>