<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 795" width="1920" height="795" style="font-family:Arial,sans-serif"><g class="text-card" data-bounds="60,65,510,180" id=""><rect x="60" y="65" width="510" height="180" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="100" y="130" font-size="37" fill="#37393B" font-weight="700" text-anchor="start" >Sender Falcon</text><text x="100" y="178" font-size="29" fill="#5F6062" font-weight="400" text-anchor="start" >Construct compact 4-byte tag</text></g><g class="text-card" data-bounds="705,65,510,180" id=""><rect x="705" y="65" width="510" height="180" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="745" y="130" font-size="37" fill="#37393B" font-weight="700" text-anchor="start" >Supporting fabric</text><text x="745" y="178" font-size="29" fill="#5F6062" font-weight="400" text-anchor="start" >Update bottleneck signal</text></g><g class="text-card" data-bounds="1350,65,510,180" id=""><rect x="1350" y="65" width="510" height="180" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="1390" y="130" font-size="37" fill="#37393B" font-weight="700" text-anchor="start" >Receiver Falcon</text><text x="1390" y="178" font-size="29" fill="#5F6062" font-weight="400" text-anchor="start" >Store latest tag per flow</text></g><path d="M570,155 L688.0,155.0" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="688.0,163.0 688.0,147.0 705,155" fill="#8DC63F"/><path d="M1215,155 L1333.0,155.0" fill="none" stroke="#8DC63F" stroke-width="4"/><polygon class="arrowhead" points="1333.0,163.0 1333.0,147.0 1350,155" fill="#8DC63F"/><g class="text-card" data-bounds="60,340,510,180" id=""><rect x="60" y="340" width="510" height="180" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="100" y="405" font-size="36" fill="#37393B" font-weight="700" text-anchor="start" >Rate Update Engine</text><text x="100" y="453" font-size="29" fill="#5F6062" font-weight="400" text-anchor="start" >Process reflected signal</text></g><g class="text-card" data-bounds="1350,340,510,180" id=""><rect x="1350" y="340" width="510" height="180" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="1390" y="405" font-size="35" fill="#37393B" font-weight="700" text-anchor="start" >ACK / NACK reflection</text><text x="1390" y="453" font-size="29" fill="#5F6062" font-weight="400" text-anchor="start" >Return signal to sender</text></g><path d="M1605,245 L1605.0,323.0" fill="none" stroke="#343895" stroke-width="4"/><polygon class="arrowhead" points="1597.0,323.0 1613.0,323.0 1605,340" fill="#343895"/><path d="M1350,430 L587.0,430.0" fill="none" stroke="#343895" stroke-width="4"/><polygon class="arrowhead" points="587.0,422.0 587.0,438.0 570,430" fill="#343895"/><text x="960" y="395" font-size="31" fill="#343895" font-weight="600" text-anchor="middle" >Reflection ≠ control algorithm</text><g class="text-card" data-bounds="60,585,1800,160" id=""><rect x="60" y="585" width="1800" height="160" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="100" y="650" font-size="33" fill="#37393B" font-weight="600" text-anchor="start" >Two conditions: negotiated endpoint capability + end-to-end fabric support</text><text x="100" y="698" font-size="30" fill="#5F6062" font-weight="400" text-anchor="start" >Endpoint negotiation does not negotiate switch support. Introduced in v1.1.</text></g></svg>