<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="1920" height="640" style="font-family:Arial,sans-serif"><g class="text-card" data-bounds="60,50,870,265" id=""><rect x="60" y="50" width="870" height="265" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="100" y="115" font-size="38" fill="#37393B" font-weight="700" text-anchor="start" >Fabric control</text><text x="100" y="163" font-size="36" fill="#37393B" font-weight="600" text-anchor="start" >Measured delay → fcwnd</text><text x="100" y="211" font-size="31" fill="#5F6062" font-weight="400" text-anchor="start" >Per flow with multipathing</text><text x="100" y="259" font-size="30" fill="#5F6062" font-weight="400" text-anchor="start" >Reduce at most once within an RTT</text></g><g class="text-card" data-bounds="990,50,870,265" id=""><rect x="990" y="50" width="870" height="265" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="1030" y="115" font-size="38" fill="#37393B" font-weight="700" text-anchor="start" >Receiver control</text><text x="1030" y="163" font-size="36" fill="#37393B" font-weight="600" text-anchor="start" >Receive pressure → ncwnd</text><text x="1030" y="211" font-size="31" fill="#5F6062" font-weight="400" text-anchor="start" >Per connection</text><text x="1030" y="259" font-size="30" fill="#5F6062" font-weight="400" text-anchor="start" >Same-direction changes are guarded</text></g><g class="text-card" data-bounds="60,370,870,220" id=""><rect x="60" y="370" width="870" height="220" rx="18" fill="#F5F7F3" stroke="#DCE1DC" stroke-width="2" /><text x="100" y="435" font-size="35" fill="#37393B" font-weight="600" text-anchor="start" >Feedback type matters</text><text x="100" y="483" font-size="31" fill="#5F6062" font-weight="400" text-anchor="start" >ACK / NACK · resource exhaustion</text><text x="100" y="531" font-size="31" fill="#5F6062" font-weight="400" text-anchor="start" >Retransmission has a defined response</text></g><g class="text-card" data-