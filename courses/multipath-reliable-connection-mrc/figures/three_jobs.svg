<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 360' style='max-width:100%;height:auto;'><g font-family='Open Sans, sans-serif'><rect x='10' y='15' width='400' height='95' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><circle cx='50' cy='62' r='22' fill='#8DC63F'/><text x='50' y='71' text-anchor='middle' font-size='22' font-weight='700' fill='#ffffff'>⚖</text><text x='90' y='52' font-size='17' font-weight='700' fill='#5F6062'>Load‑balance</text><text x='90' y='75' font-size='12.5' fill='#5F6062'>Spread flows across many paths</text><text x='90' y='93' font-size='12.5' fill='#5F6062'>so no link becomes a bottleneck.</text><rect x='10' y='130' width='400' height='95' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><circle cx='50' cy='177' r='22' fill='#8DC63F'/><text x='50' y='186' text-anchor='middle' font-size='22' font-weight='700' fill='#ffffff'>⇉</text><text x='90' y='167' font-size='17' font-weight='700' fill='#5F6062'>Absorb in‑cast</text><text x='90' y='190' font-size='12.5' fill='#5F6062'>Drain many‑to‑one bursts without</text><text x='90' y='208' font-size='12.5' fill='#5F6062'>pushing pressure backward.</text><rect x='10' y='245' width='400' height='95' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><circle cx='50' cy='292' r='22' fill='#8DC63F'/><text x='50' y='301' text-anchor='middle' font-size='22' font-weight='700' fill='#ffffff'>↺</text><text x='90' y='282' font-size='17' font-weight='700' fill='#5F6062'>Ride out failures</text><text x='90' y='305' font-size='12.5' fill='#5F6062'>Detect and bypass broken paths</text><text x='90' y='323' font-size='12.5' fill='#5F6062'>without crashing the training job.</text></g></svg>
