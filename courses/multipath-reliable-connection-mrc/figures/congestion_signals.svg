<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 360' style='max-width:100%;height:auto;'><g font-family='Open Sans, sans-serif'><rect x='10' y='15' width='400' height='100' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><text x='30' y='42' font-size='15' font-weight='700' fill='#6FA030'>1. NSCC</text><text x='30' y='62' font-size='12' fill='#5F6062'>Sender-based congestion window —</text><text x='30' y='80' font-size='12' fill='#5F6062'>from UltraEthernet Consortium</text><text x='30' y='98' font-size='12' fill='#5F6062'>(UEC transport spec 1.01).</text><rect x='10' y='130' width='400' height='100' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><text x='30' y='157' font-size='15' font-weight='700' fill='#6FA030'>2. Packet Trimming</text><text x='30' y='177' font-size='12' fill='#5F6062'>Switch strips payload, forwards header</text><text x='30' y='195' font-size='12' fill='#5F6062'>at high priority → receiver NACKs →</text><text x='30' y='213' font-size='12' fill='#5F6062'>surgical retransmit. No timeout.</text><rect x='10' y='245' width='400' height='100' rx='14' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><text x='30' y='272' font-size='15' font-weight='700' fill='#6FA030'>3. ECN as per-EV signal</text><text x='30' y='292' font-size='12' fill='#5F6062'>SACK echoes ECN → sender rotates</text><text x='30' y='310' font-size='12' fill='#5F6062'>the affected EV out for ≥ 1 RTT.</text><text x='30' y='328' font-size='12' font-weight='600' fill='#5F6062'>Load-balance, not just throttle.</text></g></svg>
