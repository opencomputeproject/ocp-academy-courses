<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 360' style='max-width:100%;height:auto;'><g font-family='Open Sans, sans-serif'><rect x='10' y='10' width='205' height='340' rx='10' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><text x='112' y='34' text-anchor='middle' font-size='14' font-weight='700' fill='#5F6062'>SACK · SETH + CC_STATE</text><text x='25' y='60' font-size='11' fill='#5F6062'>Carries</text><text x='25' y='80' font-size='11.5' font-weight='600' fill='#6FA030'>cack_psn</text><text x='25' y='98' font-size='10.5' fill='#5F6062'>cumulative ACK position</text><text x='25' y='122' font-size='11.5' font-weight='600' fill='#6FA030'>ack_psn_offset</text><text x='25' y='140' font-size='10.5' fill='#5F6062'>PSN that triggered the SACK</text><text x='25' y='164' font-size='11.5' font-weight='600' fill='#6FA030'>64-bit bitmap</text><text x='25' y='182' font-size='10.5' fill='#5F6062'>nearby PSNs received</text><text x='25' y='206' font-size='11.5' font-weight='600' fill='#6FA030'>ECN echo</text><text x='25' y='224' font-size='10.5' fill='#5F6062'>per-path congestion signal</text><text x='25' y='248' font-size='11.5' font-weight='600' fill='#6FA030'>tx_timestamp</text><text x='25' y='266' font-size='10.5' fill='#5F6062'>round-trip time</text><text x='25' y='298' font-size='11' fill='#5F6062'>Triggered on:</text><text x='25' y='316' font-size='10.5' fill='#5F6062'>byte threshold · ECN ·</text><text x='25' y='332' font-size='10.5' fill='#5F6062'>retransmit · AR flag · probe</text><rect x='245' y='10' width='205' height='340' rx='10' fill='#5F6062' opacity='0.10' stroke='#5F6062' stroke-width='2'/><text x='347' y='34' text-anchor='middle' font-size='14' font-weight='700' fill='#5F6062'>NACK · NETH</text><text x='260' y='60' font-size='11' fill='#5F6062'>Codes (mandatory):</text><text x='260' y='80' font-size='11' font-weight='600' fill='#5F6062'>NO_BITMAP</text><text x='260' y='100' font-size='11' font-weight='600' fill='#5F6062'>NO_PKT_BUFFER</text><text x='260' y='120' font-size='11' font-weight='600' fill='#5F6062'>NO_RESOURCE</text><text x='260' y='140' font-size='11' font-weight='600' fill='#5F6062'>PSN_OOR_WINDOW</text><text x='260' y='160' font-size='11' font-weight='600' fill='#5F6062'>UNEXP_EVENT</text><text x='260' y='190' font-size='11' fill='#5F6062'>Codes (optional):</text><text x='260' y='210' font-size='11' font-weight='600' fill='#5F6062'>TRIMMED</text><text x='260' y='230' font-size='11' font-weight='600' fill='#5F6062'>TRIMMED_LASTHOP</text><text x='260' y='262' font-size='11' fill='#5F6062'>Drives:</text><text x='260' y='280' font-size='10.5' fill='#5F6062'>retry logic · CC response ·</text><text x='260' y='296' font-size='10.5' fill='#5F6062'>QP error transitions</text></g></svg>
