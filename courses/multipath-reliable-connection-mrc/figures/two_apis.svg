<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 360' style='max-width:100%;height:auto;'><g font-family='Open Sans, sans-serif'><rect x='10' y='15' width='400' height='155' rx='12' fill='#8DC63F' opacity='0.10' stroke='#8DC63F' stroke-width='2'/><text x='30' y='42' font-size='14' font-weight='700' fill='#6FA030'>Application API</text><text x='30' y='60' font-size='11.5' fill='#5F6062'>Mirrors libibverbs.</text><text x='30' y='82' font-size='11.5' fill='#5F6062'>• Allocate MRC QP type</text><text x='30' y='102' font-size='11.5' fill='#5F6062'>• ibv_modify_qp transitions</text><text x='30' y='122' font-size='11.5' fill='#5F6062'>• Post Write / WriteIMM</text><text x='30' y='142' font-size='11.5' fill='#5F6062'>• Poll completions</text><text x='30' y='159' font-size='10.5' fill='#6FA030' font-weight='600'>Audience: app and library developers</text><rect x='10' y='185' width='400' height='160' rx='12' fill='#5F6062' opacity='0.10' stroke='#5F6062' stroke-width='2'/><text x='30' y='212' font-size='14' font-weight='700' fill='#5F6062'>Controller API · spec §10.2</text><text x='30' y='232' font-size='11.5' fill='#5F6062'>• Per-QP multipath policy</text><text x='30' y='252' font-size='11.5' fill='#5F6062'>• EV count &amp; plane allocation</text><text x='30' y='272' font-size='11.5' fill='#5F6062'>• Failure-bypass aggressiveness</text><text x='30' y='292' font-size='11.5' fill='#5F6062'>• EV probe scheduling</text><text x='30' y='312' font-size='11.5' fill='#5F6062'>• SRv6 path-template distribution</text><text x='30' y='334' font-size='10.5' fill='#5F6062' font-weight='600'>Audience: fleet operators &amp; tooling</text></g></svg>
