<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="90" y="70" width="1420" height="270" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="120" y="124" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="120" dy="0">MEASUREMENT CONVENTION</tspan></text><text x="120" y="178" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="120" dy="0">Line-to-neutral or line-to-line at the POI</tspan><tspan x="120" dy="36.45">Different measurements can classify the same fault differently</tspan></text></g><g data-containment="box"><rect x="90" y="385" width="1420" height="310" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="120" y="439" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="120" dy="0">PROTECTION + RECLOSING</tspan></text><text x="120" y="493" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="120" dy="0">Rapid operations can affect equipment interpretation</tspan><tspan x="120" dy="36.45">Coordinate settings and event treatment with the utility</tspan><tspan x="120" dy="36.45">No universal numerical fault counter is supplied</tspan></text></g></svg>