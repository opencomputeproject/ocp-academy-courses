<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="100" y="95" width="1400" height="230" rx="24" fill="#EDF6E4" stroke="none" stroke-width="3" /><text x="130" y="149" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="130" dy="0">COMPUTATIONAL LOAD</tspan></text><text x="130" y="203" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="130" dy="0">Typically ~70–90% of total load</tspan><tspan x="130" dy="36.45">The stated LVRT / HVRT / PFAPR commitment</tspan></text></g><g data-containment="box"><rect x="100" y="355" width="800" height="320" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="130" y="409" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="130" dy="0">COOLING LOAD</tspan></text><text x="130" y="463" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="130" dy="0">Different drive characteristics</tspan><tspan x="130" dy="36.45">and restoration times</tspan><tspan x="130" dy="36.45">Discussed separately</tspan></text></g><g data-containment="box"><rect x="940" y="355" width="560" height="320" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="970" y="409" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="970" dy="0">AUXILIARY LOAD</tspan></text><text x="970" y="463" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="970" dy="0">Typically &lt;1%</tspan><tspan x="970" dy="36.45">No commitment specified</tspan><tspan x="970" dy="36.45">for this subset</tspan></text></g></svg>