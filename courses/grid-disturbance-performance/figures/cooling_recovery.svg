<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="80" y="110" width="650" height="500" rx="24" fill="#EDF6E4" stroke="none" stroke-width="3" /><text x="110" y="164" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="110" dy="0">Computational load</tspan></text><text x="110" y="218" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="110" dy="0">Specified recovery target:</tspan><tspan x="110" dy="36.45">90% within 2 seconds</tspan><tspan x="110" dy="36.45">after normal voltage returns</tspan></text></g><g data-containment="box"><rect x="870" y="110" width="650" height="500" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="900" y="164" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="900" dy="0">Cooling equipment</tspan></text><text x="900" y="218" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="900" dy="0">Different electrical behavior</tspan><tspan x="900" dy="36.45">Restart can take minutes</tspan><tspan x="900" dy="36.45">Thermal support is site-specific</tspan></text></g><text x="800" y="725" text-anchor="middle" fill="#59697D" font-size="36" font-weight="500"><tspan x="800" dy="0">Separate commitments; coordinated facility operation.</tspan></text></svg>