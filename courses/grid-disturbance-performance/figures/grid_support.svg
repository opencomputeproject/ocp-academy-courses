<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="65" y="120" width="450" height="350" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="95" y="174" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="95" dy="0">Grid-side support</tspan></text><text x="95" y="228" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="95" dy="0">Reactive-power support</tspan><tspan x="95" dy="36.45">may improve voltage</tspan><tspan x="95" dy="36.45">during and after a fault</tspan></text></g><g data-containment="box"><rect x="600" y="120" width="400" height="350" rx="24" fill="#EDF6E4" stroke="none" stroke-width="3" /><text x="630" y="174" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="630" dy="0">POI voltage</tspan></text><text x="630" y="228" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="630" dy="0">Potentially less severe</tspan><tspan x="630" dy="36.45">sag / swell</tspan></text></g><g data-containment="box"><rect x="1085" y="120" width="450" height="350" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="1115" y="174" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="1115" dy="0">Facility response</tspan></text><text x="1115" y="228" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="1115" dy="0">Still requires its own</tspan><tspan x="1115" dy="36.45">performance evidence</tspan></text></g><line x1="515" y1="295" x2="582" y2="295" stroke="#79B632" stroke-width="6" /><polygon class="arrowhead" points="582,284 600,295 582,306" fill="#79B632"/><line x1="1000" y1="295" x2="1067" y2="295" stroke="#79B632" stroke-width="6" /><polygon class="arrowhead" points="1067,284 1085,295 1067,306" fill="#79B632"/><text x="800" y="650" text-anchor="middle" fill="#59697D" font-size="32" font-weight="500"><tspan x="800" dy="0">Improving the disturbance does not establish facility compliance.</tspan></text></svg>