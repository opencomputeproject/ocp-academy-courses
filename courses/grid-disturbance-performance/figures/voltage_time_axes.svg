<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="80" y="110" width="590" height="550" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="110" y="164" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="110" dy="0">Voltage magnitude</tspan></text><text x="110" y="218" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="110" dy="0">V = measured / nominal</tspan><tspan x="110" dy="36.45">1.00 p.u. = nominal</tspan><tspan x="110" dy="36.45">0.80 p.u. = 80% of nominal</tspan></text></g><text x="130" y="470" text-anchor="start" fill="#357BB7" font-size="34" font-weight="700"><tspan x="130" dy="0">Choose the correct band</tspan></text><g data-containment="box"><rect x="760" y="110" width="760" height="550" rx="24" fill="#EFF5FA" stroke="none" stroke-width="3" /><text x="790" y="164" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="790" dy="0">Elapsed disturbance time</tspan></text><text x="790" y="218" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="790" dy="0">Read the minimum duration</tspan><tspan x="790" dy="36.45">from the same table row</tspan></text></g><line x1="830" y1="440" x2="1420" y2="440" stroke="#172744" stroke-width="4" /><line x1="830" y1="420" x2="830" y2="460" stroke="#172744" stroke-width="4" /><line x1="1320" y1="410" x2="1320" y2="470" stroke="#79B632" stroke-width="6" /><text x="830" y="510" text-anchor="start" fill="#172744" font-size="28" font-weight="500"><tspan x="830" dy="0">Event starts</tspan></text><text x="1320" y="555" text-anchor="middle" fill="#79B632" font-size="28" font-weight="700"><tspan x="1320" dy="0">Band-specific limit</tspan></text><text x="800" y="740" text-anchor="middle" fill="#59697D" font-size="30" font-weight="500"><tspan x="800" dy="0">Then read power behavior and recovery from that same row.</tspan></text></svg>