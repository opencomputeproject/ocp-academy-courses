<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" style="font-family:Arial,sans-serif"><rect width="1600" height="800" fill="white"/><g data-containment="box"><rect x="80" y="170" width="690" height="430" rx="24" fill="#EDF6E4" stroke="none" stroke-width="3" /><text x="110" y="224" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="110" dy="0">Within specified limits</tspan></text><text x="110" y="278" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="110" dy="0">Apply the relevant band’s</tspan><tspan x="110" dy="36.45">power behavior and</tspan><tspan x="110" dy="36.45">recovery commitment</tspan></text></g><g data-containment="box"><rect x="830" y="170" width="690" height="430" rx="24" fill="#FFF5E6" stroke="none" stroke-width="3" /><text x="860" y="224" text-anchor="start" fill="#172744" font-size="31" font-weight="700"><tspan x="860" dy="0">Outside specified limits</tspan></text><text x="860" y="278" text-anchor="start" fill="#59697D" font-size="27" font-weight="500"><tspan x="860" dy="0">Backup transfer allowed</tspan><tspan x="860" dy="36.45">No return timing or magnitude</tspan><tspan x="860" dy="36.45">expectation in this specification</tspan></text></g><text x="800" y="715" text-anchor="middle" fill="#59697D" font-size="29" font-weight="500"><tspan x="800" dy="0">Table 1, footnote 5 • Permission to transfer is not a command to transfer.</tspan></text></svg>