<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="white"/><text x="960.000" y="130.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="58" font-weight="600" fill="#5F6062"><tspan x="960.000" dy="0.000">Different responsibilities can share a chiplet</tspan></text><rect x="120.000" y="265.000" width="790.000" height="590.000" rx="20" fill="#F3F6EF" stroke="#9CA3AF" stroke-width="4"/><text x="515.000" y="365.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="58" font-weight="600" fill="#5F6062"><tspan x="515.000" dy="0.000">System control</tspan></text><text x="515.000" y="485.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="48" font-weight="600" fill="#5F6062"><tspan x="515.000" dy="0.000">Primary coordinates</tspan></text><text x="515.000" y="590.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="48" font-weight="600" fill="#5F6062"><tspan x="515.000" dy="0.000">Controllers set policy</tspan></text><text x="515.000" y="695.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="48" font-weight="600" fill="#5F6062"><tspan x="515.000" dy="0.000">Agents act locally</tspan></text><rect x="1010.000" y="265.000" width="790.000" height="590.000" rx="20" fill="#F3F6EF" stroke="#9CA3AF" stroke-width="4"/><text x="1405.000" y="365.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="58" font-weight="600" fill="#5F6062"><tspan x="1405.000" dy="0.000">Security</tspan></text><text x="1405.000" y="485.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="48" font-weight="600" fill="#5F6062"><tspan x="1405.000" dy="0.000">Local evidence + enforcement</tspan></text><text x="1405.000" y="590.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="47" font-weight="600" fill="#5F6062"><tspan x="1405.000" dy="0.000">System-scoped appraisal</tspan></text><text x="1405.000" y="695.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="47" font-weight="600" fill="#5F6062"><tspan x="1405.000" dy="0.000">Revalidation + response</tspan></text><text x="960.000" y="995.000" text-anchor="middle" font-family="Open Sans,sans-serif" font-size="49" font-weight="600" fill="#5F6062"><tspan x="960.000" dy="0.000">A resource-management decision is not a trust decision</tspan></text></svg>