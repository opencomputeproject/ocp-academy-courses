<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Electrical switching compared with optical circuit switching</title>
  <desc id="desc">An electrical switch terminates and regenerates two optical links. An optical circuit switch preserves one end-to-end light path through the fabric.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.head{font-size:24px;font-weight:800}.label{font-size:18px;font-weight:800}.small{font-size:15px;fill:#5F6062}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="45" y="55" width="870" height="190" rx="22" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="80" y="93" class="head">Electrical switch path</text>
  <rect x="80" y="130" width="120" height="70" rx="13" fill="#E9EDF7" stroke="#343895" stroke-width="2"/><text x="140" y="173" text-anchor="middle" class="label">Endpoint A</text>
  <line x1="200" y1="165" x2="350" y2="165" stroke="#8DC63F" stroke-width="7"/><text x="275" y="148" text-anchor="middle" class="small">optical link 1</text>
  <rect x="350" y="117" width="260" height="96" rx="16" fill="#343895"/><text x="480" y="153" text-anchor="middle" font-size="19" font-weight="800" style="fill:#fff">O/E → electrical switch → E/O</text><text x="480" y="183" text-anchor="middle" font-size="15" style="fill:#DDE4F5">termination • buffering • regeneration</text>
  <line x1="610" y1="165" x2="760" y2="165" stroke="#8DC63F" stroke-width="7"/><text x="685" y="148" text-anchor="middle" class="small">optical link 2</text>
  <rect x="760" y="130" width="120" height="70" rx="13" fill="#E9EDF7" stroke="#343895" stroke-width="2"/><text x="820" y="173" text-anchor="middle" class="label">Endpoint B</text>
  <rect x="45" y="275" width="870" height="210" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="80" y="315" class="head">Optical circuit switch path</text>
  <rect x="80" y="367" width="120" height="70" rx="13" fill="#fff" stroke="#343895" stroke-width="2"/><text x="140" y="410" text-anchor="middle" class="label">Endpoint A</text>
  <line x1="200" y1="402" x2="350" y2="402" stroke="#8DC63F" stroke-width="7"/>
  <rect x="350" y="350" width="260" height="104" rx="16" fill="#fff" stroke="#8DC63F" stroke-width="3"/><text x="480" y="390" text-anchor="middle" class="label">Optical circuit switch</text><line x1="395" y1="415" x2="565" y2="415" stroke="#8DC63F" stroke-width="7"/><text x="480" y="442" text-anchor="middle" class="small">light stays optical</text>
  <line x1="610" y1="402" x2="760" y2="402" stroke="#8DC63F" stroke-width="7"/>
  <rect x="760" y="367" width="120" height="70" rx="13" fill="#fff" stroke="#343895" stroke-width="2"/><text x="820" y="410" text-anchor="middle" class="label">Endpoint B</text>
  <text x="480" y="338" text-anchor="middle" class="small">one end-to-end optical budget—including OCS insertion loss</text>
  <text x="480" y="522" text-anchor="middle" class="small">OCS can remove intermediate electrical I/O, but topology control and optical loss move into the system design.</text>
</svg>
