<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Optical modulation tradeoff at 400 gigabits per second</title>
  <desc id="desc">PAM4, PAM6, and PAM8 are compared for Nyquist frequency, level spacing, and optical margin. PAM4 is highlighted as the more tractable optical choice.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.head{font-size:24px;font-weight:800}.metric{font-size:20px;font-weight:800}.small{font-size:15px;fill:#5F6062}.good{fill:#2E7D32}.warn{fill:#B26A00}</style>
  <rect width="960" height="540" fill="#fff"/>
  <text x="55" y="64" class="head">Same 400G-class payload, different modulation bargain</text>
  <g>
    <rect x="55" y="100" width="260" height="350" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="4"/>
    <text x="185" y="145" text-anchor="middle" font-size="32" font-weight="800">PAM4</text><text x="185" y="176" text-anchor="middle" class="good" font-size="17" font-weight="800">whitepaper baseline</text>
    <text x="185" y="222" text-anchor="middle" class="metric">4 optical levels</text>
    <g fill="#343895"><rect x="104" y="260" width="162" height="10" rx="5"/><rect x="104" y="294" width="162" height="10" rx="5"/><rect x="104" y="328" width="162" height="10" rx="5"/><rect x="104" y="362" width="162" height="10" rx="5"/></g>
    <text x="185" y="409" text-anchor="middle" class="small">workable level spacing</text><text x="185" y="432" text-anchor="middle" class="small">with lower optical penalty</text>
    <rect x="350" y="100" width="260" height="350" rx="22" fill="#FFF4DD" stroke="#D88911" stroke-width="3"/>
    <text x="480" y="145" text-anchor="middle" font-size="32" font-weight="800">PAM6</text><text x="480" y="176" text-anchor="middle" class="warn" font-size="17" font-weight="800">more levels</text>
    <text x="480" y="222" text-anchor="middle" class="metric">6 optical levels</text>
    <g fill="#5260A7"><rect x="399" y="248" width="162" height="8" rx="4"/><rect x="399" y="271" width="162" height="8" rx="4"/><rect x="399" y="294" width="162" height="8" rx="4"/><rect x="399" y="317" width="162" height="8" rx="4"/><rect x="399" y="340" width="162" height="8" rx="4"/><rect x="399" y="363" width="162" height="8" rx="4"/></g>
    <text x="480" y="409" text-anchor="middle" class="small">smaller eye openings</text><text x="480" y="432" text-anchor="middle" class="small">harder optical SNR burden</text>
    <rect x="645" y="100" width="260" height="350" rx="22" fill="#FBEAEA" stroke="#B8473D" stroke-width="3"/>
    <text x="775" y="145" text-anchor="middle" font-size="32" font-weight="800">PAM8</text><text x="775" y="176" text-anchor="middle" style="fill:#B8473D" font-size="17" font-weight="800">tightest margin</text>
    <text x="775" y="222" text-anchor="middle" class="metric">8 optical levels</text>
    <g fill="#737EAF"><rect x="694" y="245" width="162" height="7" rx="3"/><rect x="694" y="262" width="162" height="7" rx="3"/><rect x="694" y="279" width="162" height="7" rx="3"/><rect x="694" y="296" width="162" height="7" rx="3"/><rect x="694" y="313" width="162" height="7" rx="3"/><rect x="694" y="330" width="162" height="7" rx="3"/><rect x="694" y="347" width="162" height="7" rx="3"/><rect x="694" y="364" width="162" height="7" rx="3"/></g>
    <text x="775" y="409" text-anchor="middle" class="small">least level separation</text><text x="775" y="432" text-anchor="middle" class="small">highest noise sensitivity</text>
  </g>
  <text x="480" y="495" text-anchor="middle" class="metric">Copper values lower Nyquist frequency; direct-detect optics pays heavily for extra amplitude levels.</text>
  <text x="480" y="520" text-anchor="middle" class="small">That asymmetry supports a PAM4 optical path even when the adjacent electrical interface uses a different encoding.</text>
</svg>
