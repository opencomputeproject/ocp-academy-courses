<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scale-up fabric in the distributed training path</title>
  <desc id="desc">Parallel training work on the left crosses a central scale-up fabric before reaching synchronized accelerators on the right.</desc>
  <style>
    text { font-family: "Open Sans", Arial, sans-serif; fill: #343895; }
    .small { font-size: 17px; fill: #5F6062; }
    .label { font-size: 21px; font-weight: 700; }
    .lead { font-size: 27px; font-weight: 800; }
    .group-head { font-size: 25px; font-weight: 800; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="40" y="58" width="250" height="424" rx="22" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="165" y="101" text-anchor="middle" class="lead">Parallel work</text>
  <g>
    <rect x="72" y="132" width="186" height="66" rx="14" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="165" y="172" text-anchor="middle" class="label">Tensor</text>
    <rect x="72" y="220" width="186" height="66" rx="14" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="165" y="260" text-anchor="middle" class="label">Data</text>
    <rect x="72" y="308" width="186" height="66" rx="14" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="165" y="348" text-anchor="middle" class="label">Expert</text>
    <rect x="72" y="396" width="186" height="54" rx="14" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="165" y="430" text-anchor="middle" class="label">Pipeline</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="5" stroke-linecap="round">
    <line x1="290" y1="165" x2="358" y2="235"/>
    <line x1="290" y1="253" x2="358" y2="253"/>
    <line x1="290" y1="341" x2="358" y2="271"/>
    <line x1="290" y1="423" x2="358" y2="289"/>
  </g>
  <rect x="358" y="170" width="244" height="190" rx="28" fill="#343895"/>
  <text x="480" y="226" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">SYNCHRONIZED</text>
  <text x="480" y="265" text-anchor="middle" font-size="31" font-weight="800" style="fill:#ffffff">SCALE-UP</text>
  <text x="480" y="304" text-anchor="middle" font-size="31" font-weight="800" style="fill:#ffffff">FABRIC</text>
  <text x="480" y="338" text-anchor="middle" font-size="16" style="fill:#DDE4F5">bandwidth + latency + reliability</text>
  <g stroke="#8DC63F" stroke-width="7" stroke-linecap="round">
    <line x1="602" y1="220" x2="676" y2="154"/>
    <line x1="602" y1="265" x2="676" y2="265"/>
    <line x1="602" y1="310" x2="676" y2="376"/>
  </g>
  <rect x="676" y="70" width="244" height="410" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="798" y="111" text-anchor="middle" class="group-head">Accelerator group</text>
  <g>
    <rect x="700" y="137" width="196" height="70" rx="14" fill="#ffffff" stroke="#5F6062" stroke-width="2"/>
    <circle cx="728" cy="172" r="11" fill="#8DC63F"/>
    <text x="800" y="179" text-anchor="middle" class="label">Computing</text>
    <rect x="700" y="230" width="196" height="70" rx="14" fill="#ffffff" stroke="#5F6062" stroke-width="2"/>
    <circle cx="728" cy="265" r="11" fill="#8DC63F"/>
    <text x="800" y="272" text-anchor="middle" class="label">Computing</text>
    <rect x="700" y="323" width="196" height="70" rx="14" fill="#FFF4DD" stroke="#D88911" stroke-width="2"/>
    <circle cx="728" cy="358" r="11" fill="#D88911"/>
    <text x="800" y="365" text-anchor="middle" class="label">Waiting</text>
  </g>
  <text x="798" y="437" text-anchor="middle" class="small">One delayed path can pace</text>
  <text x="798" y="461" text-anchor="middle" class="small">the synchronized group.</text>
</svg>
