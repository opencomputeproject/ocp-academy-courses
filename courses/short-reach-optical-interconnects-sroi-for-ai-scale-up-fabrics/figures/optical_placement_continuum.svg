<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Optical engine placement continuum</title>
  <desc id="desc">Four placements move from front-panel pluggable optics toward co-packaged optics next to the switch ASIC.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.name{font-size:20px;font-weight:800}.small{font-size:15px;fill:#5F6062}.end{font-size:18px;font-weight:800}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="55" y="58" width="850" height="68" rx="20" fill="#F6F8FB"/>
  <text x="78" y="85" class="end">Longer electrical path</text><text x="78" y="109" class="small">easier field replacement</text>
  <text x="882" y="85" text-anchor="end" class="end">Shorter electrical path</text><text x="882" y="109" text-anchor="end" class="small">higher integration burden</text>
  <line x1="130" y1="160" x2="830" y2="160" stroke="#D2D7DF" stroke-width="10" stroke-linecap="round"/>
  <g>
    <circle cx="150" cy="160" r="18" fill="#343895"/><circle cx="370" cy="160" r="18" fill="#5260A7"/><circle cx="590" cy="160" r="18" fill="#6CA853"/><circle cx="810" cy="160" r="18" fill="#8DC63F"/>
  </g>
  <g>
    <rect x="65" y="205" width="170" height="238" rx="18" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="150" y="244" text-anchor="middle" class="name">Pluggable</text><text x="150" y="269" text-anchor="middle" class="name">front panel</text>
    <rect x="91" y="303" width="118" height="49" rx="8" fill="#fff" stroke="#5F6062" stroke-width="2"/><text x="150" y="334" text-anchor="middle" class="small">optical module</text>
    <line x1="110" y1="375" x2="190" y2="375" stroke="#D88911" stroke-width="7"/><text x="150" y="408" text-anchor="middle" class="small">long host channel</text>
    <rect x="285" y="205" width="170" height="238" rx="18" fill="#EDF1F8" stroke="#5260A7" stroke-width="2"/>
    <text x="370" y="244" text-anchor="middle" class="name">Connector-</text><text x="370" y="269" text-anchor="middle" class="name">adjacent</text>
    <rect x="318" y="303" width="104" height="49" rx="8" fill="#fff" stroke="#5F6062" stroke-width="2"/><text x="370" y="334" text-anchor="middle" class="small">optical engine</text>
    <line x1="335" y1="375" x2="405" y2="375" stroke="#D88911" stroke-width="7"/><text x="370" y="408" text-anchor="middle" class="small">shorter channel</text>
    <rect x="505" y="205" width="170" height="238" rx="18" fill="#F0F7EC" stroke="#6CA853" stroke-width="2"/>
    <text x="590" y="244" text-anchor="middle" class="name">Near-package</text><text x="590" y="269" text-anchor="middle" class="name">optics (NPO)</text>
    <rect x="535" y="303" width="110" height="49" rx="8" fill="#fff" stroke="#5F6062" stroke-width="2"/><text x="590" y="334" text-anchor="middle" class="small">engine + ASIC</text>
    <line x1="568" y1="375" x2="612" y2="375" stroke="#8DC63F" stroke-width="7"/><text x="590" y="408" text-anchor="middle" class="small">package edge</text>
    <rect x="725" y="205" width="170" height="238" rx="18" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
    <text x="810" y="244" text-anchor="middle" class="name">Co-packaged</text><text x="810" y="269" text-anchor="middle" class="name">optics (CPO)</text>
    <rect x="758" y="299" width="104" height="58" rx="12" fill="#343895"/><circle cx="785" cy="328" r="11" fill="#8DC63F"/><text x="824" y="334" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">ASIC</text>
    <line x1="795" y1="375" x2="825" y2="375" stroke="#8DC63F" stroke-width="7"/><text x="810" y="408" text-anchor="middle" class="small">same package</text>
  </g>
  <text x="480" y="492" text-anchor="middle" class="small">Moving inward reduces electrical loss and energy—but changes thermal design, repair, and ecosystem boundaries.</text>
</svg>
