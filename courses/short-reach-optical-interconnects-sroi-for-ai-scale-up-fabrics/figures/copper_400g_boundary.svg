<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Shrinking copper reach at future lane rates</title>
  <desc id="desc">A co-packaged copper architecture remains useful at the shortest tier, while practical reach contracts from about one meter toward half a meter at 448 gigabits per second.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.head{font-size:24px;font-weight:800}.big{font-size:35px;font-weight:800}.label{font-size:18px;font-weight:800}.small{font-size:15px;fill:#5F6062}.axis{font-size:16px;font-weight:700;fill:#5F6062}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="52" y="58" width="360" height="405" rx="24" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
  <text x="232" y="103" text-anchor="middle" class="head">Co-packaged copper tier</text>
  <rect x="90" y="148" width="118" height="96" rx="16" fill="#343895"/><text x="149" y="190" text-anchor="middle" font-size="19" font-weight="800" style="fill:#fff">Switch</text><text x="149" y="218" text-anchor="middle" font-size="15" style="fill:#DDE4F5">ASIC</text>
  <rect x="256" y="148" width="118" height="96" rx="16" fill="#343895"/><text x="315" y="190" text-anchor="middle" font-size="19" font-weight="800" style="fill:#fff">XPU</text><text x="315" y="218" text-anchor="middle" font-size="15" style="fill:#DDE4F5">package</text>
  <line x1="208" y1="196" x2="256" y2="196" stroke="#D88911" stroke-width="10"/><text x="232" y="275" text-anchor="middle" class="label">short, dense copper</text>
  <g fill="#fff" stroke="#5F6062" stroke-width="2"><rect x="85" y="313" width="294" height="50" rx="12"/><rect x="85" y="378" width="294" height="50" rx="12"/></g>
  <text x="107" y="344" class="label">Value</text><text x="357" y="344" text-anchor="end" class="small">lowest-reach tier</text><text x="107" y="409" class="label">Constraint</text><text x="357" y="409" text-anchor="end" class="small">loss rises with rate</text>
  <rect x="448" y="58" width="460" height="405" rx="24" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="678" y="103" text-anchor="middle" class="head">Illustrative practical reach envelope</text>
  <line x1="512" y1="386" x2="850" y2="386" stroke="#5F6062" stroke-width="3"/><line x1="512" y1="386" x2="512" y2="145" stroke="#5F6062" stroke-width="3"/>
  <text x="681" y="427" text-anchor="middle" class="axis">lane rate</text><text x="474" y="265" text-anchor="middle" class="axis" transform="rotate(-90 474 265)">reach</text>
  <rect x="594" y="122" width="252" height="56" rx="12" fill="#FFF4DD" stroke="#E7BF70" stroke-width="1.5"/>
  <text x="720" y="145" text-anchor="middle" class="label"><tspan x="720" dy="0">Higher speed compresses</tspan><tspan x="720" dy="21">copper reach</tspan></text>
  <line x1="560" y1="190" x2="807" y2="328" stroke="#D88911" stroke-width="9" stroke-linecap="round"/>
  <circle cx="560" cy="190" r="13" fill="#8DC63F"/><circle cx="807" cy="328" r="13" fill="#B8473D"/>
  <text x="559" y="232" text-anchor="middle" class="big">~1 m</text><text x="580" y="255" text-anchor="middle" class="small">earlier regime</text>
  <text x="808" y="287" text-anchor="middle" class="big">~0.5 m</text><text x="807" y="357" text-anchor="middle" class="small">at 448G forecast</text>
  <text x="560" y="411" text-anchor="middle" class="axis">lower</text><text x="807" y="411" text-anchor="middle" class="axis">448G</text>
  <text x="480" y="526" text-anchor="middle" class="small">Copper is retained where it is strongest; SROI begins where physical placement can no longer stay inside that shrinking envelope.</text>
</svg>
