<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Slow-and-wide wavelength division multiplexing</title>
  <desc id="desc">One very fast serial lane is contrasted with four slower NRZ electrical lanes mapped to four wavelengths and combined onto one fiber.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.head{font-size:24px;font-weight:800}.label{font-size:19px;font-weight:800}.small{font-size:15px;fill:#5F6062}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="55" y="60" width="850" height="160" rx="22" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="88" y="101" class="head">Fast-and-narrow</text>
  <rect x="90" y="128" width="190" height="55" rx="12" fill="#343895"/><text x="185" y="163" text-anchor="middle" font-size="17" font-weight="800" style="fill:#fff">one very fast lane</text>
  <line x1="280" y1="156" x2="725" y2="156" stroke="#B8473D" stroke-width="12"/><circle cx="725" cy="156" r="13" fill="#B8473D"/>
  <text x="505" y="140" text-anchor="middle" class="small">high symbol rate stresses electronics and optics</text><rect x="760" y="128" width="105" height="55" rx="12" fill="#fff" stroke="#343895" stroke-width="2"/><text x="813" y="163" text-anchor="middle" class="label">Fiber</text>
  <rect x="55" y="250" width="850" height="230" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="88" y="293" class="head">Slow-and-wide</text><text x="88" y="320" class="small">parallel NRZ lanes + WDM combine to the same aggregate pipe</text>
  <g>
    <rect x="90" y="345" width="150" height="38" rx="10" fill="#E9EDF7" stroke="#343895"/><text x="165" y="370" text-anchor="middle" class="small">slower NRZ lane 1</text>
    <rect x="90" y="391" width="150" height="38" rx="10" fill="#E9EDF7" stroke="#343895"/><text x="165" y="416" text-anchor="middle" class="small">slower NRZ lane 2</text>
    <rect x="260" y="345" width="150" height="38" rx="10" fill="#E9EDF7" stroke="#343895"/><text x="335" y="370" text-anchor="middle" class="small">slower NRZ lane 3</text>
    <rect x="260" y="391" width="150" height="38" rx="10" fill="#E9EDF7" stroke="#343895"/><text x="335" y="416" text-anchor="middle" class="small">slower NRZ lane 4</text>
  </g>
  <g stroke-width="7"><line x1="410" y1="364" x2="535" y2="377" stroke="#2F77C5"/><line x1="410" y1="410" x2="535" y2="389" stroke="#8DC63F"/><line x1="410" y1="364" x2="535" y2="401" stroke="#D88911"/><line x1="410" y1="410" x2="535" y2="413" stroke="#B8473D"/></g>
  <rect x="535" y="350" width="105" height="92" rx="15" fill="#fff" stroke="#8DC63F" stroke-width="3"/><text x="588" y="388" text-anchor="middle" class="label">WDM</text><text x="588" y="416" text-anchor="middle" class="small">combine</text>
  <g stroke-width="4"><line x1="640" y1="382" x2="760" y2="382" stroke="#2F77C5"/><line x1="640" y1="392" x2="760" y2="392" stroke="#8DC63F"/><line x1="640" y1="402" x2="760" y2="402" stroke="#D88911"/><line x1="640" y1="412" x2="760" y2="412" stroke="#B8473D"/></g>
  <rect x="760" y="369" width="105" height="55" rx="12" fill="#fff" stroke="#343895" stroke-width="2"/><text x="813" y="403" text-anchor="middle" class="label">1 fiber</text>
  <text x="480" y="519" text-anchor="middle" class="small">The trade: more lanes, lasers, and wavelengths in exchange for gentler per-lane speed and simpler signaling.</text>
</svg>
