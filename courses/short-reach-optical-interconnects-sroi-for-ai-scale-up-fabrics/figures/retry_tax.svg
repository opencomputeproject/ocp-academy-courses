<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Error detection and retry tax</title>
  <desc id="desc">A transfer passes through FEC and CRC. Clean data is acknowledged while an uncorrectable error loops back for retry and stalls useful work.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.label{font-size:21px;font-weight:800}.small{font-size:16px;fill:#5F6062}.tiny{font-size:14px;fill:#5F6062}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="55" y="190" width="150" height="105" rx="18" fill="#E9EDF7" stroke="#343895" stroke-width="2"/><text x="130" y="233" text-anchor="middle" class="label">Transfer</text><text x="130" y="263" text-anchor="middle" class="small">data + protection</text>
  <line x1="205" y1="243" x2="275" y2="243" stroke="#8DC63F" stroke-width="6"/>
  <rect x="275" y="172" width="170" height="142" rx="18" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/><text x="360" y="218" text-anchor="middle" class="label">FEC decode</text><text x="360" y="249" text-anchor="middle" class="small">correct bit errors</text><text x="360" y="279" text-anchor="middle" class="tiny">within coding capability</text>
  <line x1="445" y1="243" x2="515" y2="243" stroke="#8DC63F" stroke-width="6"/>
  <rect x="515" y="172" width="170" height="142" rx="18" fill="#F6F8FB" stroke="#343895" stroke-width="2"/><text x="600" y="218" text-anchor="middle" class="label">CRC check</text><text x="600" y="249" text-anchor="middle" class="small">detect residual error</text><text x="600" y="279" text-anchor="middle" class="tiny">after FEC</text>
  <line x1="685" y1="219" x2="755" y2="150" stroke="#8DC63F" stroke-width="6"/><circle cx="690" cy="214" r="6" fill="#8DC63F"/>
  <rect x="755" y="79" width="160" height="142" rx="18" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/><text x="835" y="130" text-anchor="middle" class="label">ACK</text><text x="835" y="161" text-anchor="middle" class="small">commit result</text><text x="835" y="190" text-anchor="middle" class="tiny">useful work continues</text>
  <text x="711" y="163" text-anchor="middle" class="tiny">clean</text>
  <line x1="685" y1="270" x2="755" y2="343" stroke="#B8473D" stroke-width="6"/><circle cx="690" cy="275" r="6" fill="#B8473D"/>
  <rect x="755" y="311" width="160" height="145" rx="18" fill="#FBEAEA" stroke="#B8473D" stroke-width="3"/><text x="835" y="359" text-anchor="middle" class="label">Retry</text><text x="835" y="390" text-anchor="middle" class="small">replay transfer</text><text x="835" y="421" text-anchor="middle" class="tiny">computation waits</text>
  <text x="711" y="329" text-anchor="middle" class="tiny">error</text>
  <path d="M755 431 C585 480 240 465 130 310" fill="none" stroke="#B8473D" stroke-width="5" stroke-dasharray="12 10"/>
  <circle cx="130" cy="310" r="7" fill="#B8473D"/><text x="415" y="510" text-anchor="middle" class="small">Retry latency + fabric occupancy + synchronized accelerator stall</text>
  <rect x="285" y="57" width="390" height="55" rx="14" fill="#FFF4DD"/><text x="480" y="92" text-anchor="middle" font-size="19" font-weight="800">The error tax is paid by the whole tightly coupled job.</text>
</svg>
