<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Naive optical substitution at rack scale</title>
  <desc id="desc">A 72-accelerator design multiplies into 1,296 800G optical modules, nearly 16 kilowatts, and about 100,000 FIT.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.big{font-size:42px;font-weight:800}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#5F6062}.equation{font-size:25px;font-weight:800}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="50" y="64" width="245" height="150" rx="22" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
  <text x="173" y="116" text-anchor="middle" class="big">72</text><text x="173" y="151" text-anchor="middle" class="label">accelerators</text><text x="173" y="181" text-anchor="middle" class="small">18 links per accelerator</text>
  <text x="330" y="146" class="equation">×</text>
  <rect x="375" y="64" width="245" height="150" rx="22" fill="#F6F8FB" stroke="#5F6062" stroke-width="2"/>
  <text x="498" y="116" text-anchor="middle" class="big">18</text><text x="498" y="151" text-anchor="middle" class="label">800G modules</text><text x="498" y="181" text-anchor="middle" class="small">per accelerator</text>
  <text x="655" y="146" class="equation">=</text>
  <rect x="700" y="52" width="210" height="174" rx="22" fill="#FFF4DD" stroke="#D88911" stroke-width="3"/>
  <text x="805" y="113" text-anchor="middle" class="big">1,296</text><text x="805" y="151" text-anchor="middle" class="label">modules</text><text x="805" y="184" text-anchor="middle" class="small">in one scale-up rack</text>
  <line x1="110" y1="270" x2="850" y2="270" stroke="#D2D7DF" stroke-width="3"/>
  <rect x="75" y="311" width="250" height="160" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="200" y="370" text-anchor="middle" class="big">~16 kW</text><text x="200" y="405" text-anchor="middle" class="label">optics power</text><text x="200" y="439" text-anchor="middle" class="small">at roughly 12 W/module</text>
  <rect x="355" y="311" width="250" height="160" rx="22" fill="#FFF4DD" stroke="#D88911" stroke-width="3"/>
  <text x="480" y="370" text-anchor="middle" class="big">~100k</text><text x="480" y="405" text-anchor="middle" class="label">aggregate FIT</text><text x="480" y="439" text-anchor="middle" class="small">using module-class rates</text>
  <rect x="635" y="311" width="250" height="160" rx="22" fill="#FBEAEA" stroke="#B8473D" stroke-width="3"/>
  <text x="760" y="365" text-anchor="middle" font-size="32" font-weight="800">Pod-scale</text><text x="760" y="402" text-anchor="middle" font-size="32" font-weight="800">problem</text><text x="760" y="439" text-anchor="middle" class="small">not a module-level problem</text>
  <text x="480" y="514" text-anchor="middle" class="small">Illustrative whitepaper example: straightforward substitution fails the power and reliability multiplication test.</text>
</svg>
