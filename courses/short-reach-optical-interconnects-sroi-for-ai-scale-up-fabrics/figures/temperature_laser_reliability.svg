<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Temperature and laser reliability strategies</title>
  <desc id="desc">Four clearly separated cards contrast optics near hot compute with a cooler optical goal, then show external and redundant laser options.</desc>
  <style>
    text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}
    .big{font-size:40px;font-weight:800}
    .label{font-size:20px;font-weight:800}
    .small{font-size:17px;fill:#5F6062}
    .statement{font-size:18px;font-weight:800}
    .footer{font-size:15px;fill:#5F6062}
  </style>

  <rect width="960" height="540" fill="#fff"/>

  <!-- Temperature comparison -->
  <rect x="40" y="45" width="420" height="185" rx="22" fill="#FBEAEA" stroke="#B8473D" stroke-width="3"/>
  <circle cx="130" cy="136" r="50" fill="#fff" stroke="#B8473D" stroke-width="7"/>
  <line x1="130" y1="97" x2="130" y2="150" stroke="#B8473D" stroke-width="14" stroke-linecap="round"/>
  <circle cx="130" cy="165" r="16" fill="#B8473D"/>
  <text x="315" y="108" text-anchor="middle" class="big">70°C</text>
  <text x="315" y="146" text-anchor="middle" class="label">Near hot compute</text>
  <text x="315" y="181" text-anchor="middle" class="small">Accelerated optical</text>
  <text x="315" y="205" text-anchor="middle" class="small">and laser aging</text>

  <rect x="500" y="45" width="420" height="185" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <circle cx="590" cy="136" r="50" fill="#fff" stroke="#8DC63F" stroke-width="7"/>
  <line x1="590" y1="97" x2="590" y2="150" stroke="#8DC63F" stroke-width="14" stroke-linecap="round"/>
  <circle cx="590" cy="165" r="16" fill="#8DC63F"/>
  <text x="775" y="108" text-anchor="middle" class="big">40°C</text>
  <text x="775" y="146" text-anchor="middle" class="label">Preferred optical goal</text>
  <text x="775" y="187" text-anchor="middle" class="small">Improves lifetime margin</text>

  <!-- Bridge statement -->
  <rect x="140" y="240" width="680" height="72" rx="24" fill="#F5F7FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="480" y="270" text-anchor="middle" class="statement">Laser architecture can separate the light source</text>
  <text x="480" y="295" text-anchor="middle" class="statement">from the hottest, least serviceable location.</text>

  <!-- Laser architecture options -->
  <rect x="40" y="330" width="420" height="145" rx="20" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
  <circle cx="130" cy="397" r="28" fill="#8DC63F"/>
  <g stroke="#8DC63F" stroke-width="5">
    <line x1="130" y1="348" x2="130" y2="362"/>
    <line x1="130" y1="432" x2="130" y2="446"/>
    <line x1="81" y1="397" x2="97" y2="397"/>
    <line x1="163" y1="397" x2="179" y2="397"/>
  </g>
  <text x="318" y="381" text-anchor="middle" class="label">External laser source</text>
  <text x="318" y="414" text-anchor="middle" class="small">Keep heat and serviceable lasers</text>
  <text x="318" y="440" text-anchor="middle" class="small">outside the optical engine</text>

  <rect x="500" y="330" width="420" height="145" rx="20" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <circle cx="570" cy="397" r="25" fill="#8DC63F"/>
  <circle cx="630" cy="397" r="25" fill="#D2D7DF"/>
  <line x1="655" y1="397" x2="680" y2="397" stroke="#343895" stroke-width="5"/>
  <text x="801" y="381" text-anchor="middle" class="label">Redundant lasers</text>
  <text x="801" y="414" text-anchor="middle" class="small">Switch to a healthy source</text>
  <text x="801" y="440" text-anchor="middle" class="small">without replacing the engine</text>

  <text x="480" y="514" text-anchor="middle" class="footer">Thermal placement and laser redundancy are reliability controls—not afterthoughts.</text>
</svg>
