<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Reach-defined interconnect regimes</title>
  <desc id="desc">A horizontal distance spectrum highlights SROI up to thirty meters between electrical reaches and conventional DR and FR optics.</desc>
  <style>
    text { font-family: "Open Sans", Arial, sans-serif; fill: #343895; }
    .head { font-size: 22px; font-weight: 800; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 15px; fill: #5F6062; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="74" y="85" class="head">Endpoint integration dominates</text>
  <text x="886" y="85" text-anchor="end" class="head">Channel impairments dominate</text>
  <line x1="74" y1="128" x2="886" y2="128" stroke="#D2D7DF" stroke-width="8" stroke-linecap="round"/>
  <g>
    <rect x="74" y="160" width="164" height="172" rx="20" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="156" y="202" text-anchor="middle" class="head">XSR / VSR</text>
    <text x="156" y="237" text-anchor="middle" class="label">mm to cm</text>
    <text x="156" y="276" text-anchor="middle" class="small">Minimal equalization</text>
    <text x="156" y="302" text-anchor="middle" class="small">package-scale paths</text>
  </g>
  <g>
    <rect x="252" y="160" width="170" height="172" rx="20" fill="#F6F8FB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="337" y="202" text-anchor="middle" class="head">Electrical SR</text>
    <text x="337" y="237" text-anchor="middle" class="label">cm to meters</text>
    <text x="337" y="276" text-anchor="middle" class="small">Loss and conditioning</text>
    <text x="337" y="302" text-anchor="middle" class="small">grow with reach</text>
  </g>
  <g>
    <rect x="436" y="140" width="222" height="212" rx="24" fill="#F4F9E9" stroke="#8DC63F" stroke-width="5"/>
    <text x="547" y="192" text-anchor="middle" font-size="31" font-weight="800">SROI</text>
    <text x="547" y="232" text-anchor="middle" font-size="24" font-weight="800" style="fill:#6FA030">up to 30 m</text>
    <text x="547" y="273" text-anchor="middle" class="small">Density • pJ/b • cost</text>
    <text x="547" y="301" text-anchor="middle" class="small">latency • reliability</text>
    <text x="547" y="329" text-anchor="middle" class="small">SMF or MMF</text>
  </g>
  <g>
    <rect x="672" y="160" width="96" height="172" rx="20" fill="#F6F8FB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="720" y="202" text-anchor="middle" class="head">DR</text>
    <text x="720" y="237" text-anchor="middle" class="label">500 m</text>
    <text x="720" y="278" text-anchor="middle" class="small">attenuation</text>
    <text x="720" y="302" text-anchor="middle" class="small">OSNR</text>
  </g>
  <g>
    <rect x="782" y="160" width="104" height="172" rx="20" fill="#F6F8FB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="834" y="202" text-anchor="middle" class="head">FR</text>
    <text x="834" y="237" text-anchor="middle" class="label">2 km</text>
    <text x="834" y="278" text-anchor="middle" class="small">dispersion</text>
    <text x="834" y="302" text-anchor="middle" class="small">link margin</text>
  </g>
  <rect x="150" y="405" width="660" height="76" rx="18" fill="#343895"/>
  <text x="480" y="437" text-anchor="middle" font-size="18" font-weight="700" style="fill:#ffffff">Design for the dominant impairment in each reach class.</text>
  <text x="480" y="466" text-anchor="middle" font-size="16" style="fill:#DDE4F5">SROI is not a reduced-distance implementation of DR or FR.</text>
</svg>
