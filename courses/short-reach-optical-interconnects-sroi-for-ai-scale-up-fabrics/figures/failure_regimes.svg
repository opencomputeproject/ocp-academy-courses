<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Failure regimes and reliability controls</title>
  <desc id="desc">A bathtub curve marks infant mortality, a low random floor, and wear-out, with screening and qualification controls.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.label{font-size:20px;font-weight:800}.small{font-size:16px;fill:#5F6062}.axis{font-size:16px;font-weight:700;fill:#5F6062}</style>
  <rect width="960" height="540" fill="#fff"/>
  <line x1="100" y1="420" x2="880" y2="420" stroke="#5F6062" stroke-width="3"/><line x1="100" y1="420" x2="100" y2="80" stroke="#5F6062" stroke-width="3"/>
  <text x="490" y="472" text-anchor="middle" class="axis">operating time</text><text x="34" y="255" text-anchor="middle" class="axis" transform="rotate(-90 34 255)">failure rate</text>
  <path d="M110 112 C155 240 190 345 285 360 C405 376 535 369 650 360 C748 350 802 300 870 115" fill="none" stroke="#343895" stroke-width="8" stroke-linecap="round"/>
  <rect x="120" y="300" width="190" height="82" rx="16" fill="#FFF4DD" fill-opacity=".9" stroke="#D88911" stroke-width="2"/><text x="215" y="333" text-anchor="middle" class="label">Infant failures</text><text x="215" y="360" text-anchor="middle" class="small">screen + burn-in</text>
  <rect x="355" y="304" width="250" height="82" rx="16" fill="#F4F9E9" fill-opacity=".95" stroke="#8DC63F" stroke-width="3"/><text x="480" y="336" text-anchor="middle" class="label">Random floor</text><text x="480" y="363" text-anchor="middle" class="small">design toward ~2 FIT</text>
  <rect x="650" y="300" width="190" height="82" rx="16" fill="#FBEAEA" fill-opacity=".9" stroke="#B8473D" stroke-width="2"/><text x="745" y="333" text-anchor="middle" class="label">Wear-out</text><text x="745" y="360" text-anchor="middle" class="small">qualify past service life</text>
  <line x1="292" y1="125" x2="292" y2="410" stroke="#D2D7DF" stroke-width="2" stroke-dasharray="8 8"/><line x1="650" y1="125" x2="650" y2="410" stroke="#D2D7DF" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="205" y="84" text-anchor="middle" class="label">Process control</text><text x="205" y="110" text-anchor="middle" class="small">prevents early escapes</text>
  <text x="480" y="84" text-anchor="middle" class="label">Silicon-class target</text><text x="480" y="110" text-anchor="middle" class="small">at Pod-scale population</text>
  <text x="755" y="84" text-anchor="middle" class="label">Lifetime margin</text><text x="755" y="110" text-anchor="middle" class="small">temperature + aging</text>
  <text x="480" y="515" text-anchor="middle" class="small">Field replaceability does not substitute for a low intrinsic failure rate.</text>
</svg>
