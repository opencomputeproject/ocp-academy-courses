<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Two-tier deployment path for short-reach optics</title>
  <desc id="desc">An accessible serviceability-first tier using LPO and retimed linear receive leads toward deeply integrated NPO and CPO after reliability and interface maturity.</desc>
  <style>text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.head{font-size:27px;font-weight:800}.label{font-size:20px;font-weight:800}.small{font-size:16px;fill:#5F6062}.chip{font-size:16px;font-weight:700}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="50" y="62" width="380" height="392" rx="26" fill="#E9EDF7" stroke="#343895" stroke-width="3"/>
  <text x="240" y="111" text-anchor="middle" class="head">Tier 1 · deploy first</text><text x="240" y="144" text-anchor="middle" class="small">serviceability-first optical I/O</text>
  <rect x="91" y="184" width="132" height="73" rx="14" fill="#fff" stroke="#343895" stroke-width="2"/><text x="157" y="215" text-anchor="middle" class="label">LPO</text><text x="157" y="239" text-anchor="middle" class="small">linear transmit</text>
  <rect x="257" y="184" width="132" height="73" rx="14" fill="#fff" stroke="#343895" stroke-width="2"/><text x="323" y="215" text-anchor="middle" class="label">RTLR</text><text x="323" y="239" text-anchor="middle" class="small">retimed receive</text>
  <g><rect x="88" y="295" width="304" height="43" rx="12" fill="#F6F8FB"/><text x="240" y="322" text-anchor="middle" class="chip">Accessible optical engines</text><rect x="88" y="348" width="304" height="43" rx="12" fill="#F6F8FB"/><text x="240" y="375" text-anchor="middle" class="chip">Open electrical interfaces</text><rect x="88" y="401" width="304" height="43" rx="12" fill="#F6F8FB"/><text x="240" y="428" text-anchor="middle" class="chip">Field evidence and learning</text></g>
  <rect x="530" y="62" width="380" height="392" rx="26" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="720" y="111" text-anchor="middle" class="head">Tier 2 · integrate</text><text x="720" y="144" text-anchor="middle" class="small">after interfaces and reliability mature</text>
  <rect x="571" y="184" width="132" height="73" rx="14" fill="#fff" stroke="#8DC63F" stroke-width="2"/><text x="637" y="215" text-anchor="middle" class="label">NPO</text><text x="637" y="239" text-anchor="middle" class="small">near package</text>
  <rect x="737" y="184" width="132" height="73" rx="14" fill="#fff" stroke="#8DC63F" stroke-width="2"/><text x="803" y="215" text-anchor="middle" class="label">CPO</text><text x="803" y="239" text-anchor="middle" class="small">co-packaged</text>
  <g><rect x="568" y="295" width="304" height="43" rx="12" fill="#fff"/><text x="720" y="322" text-anchor="middle" class="chip">Lower electrical loss</text><rect x="568" y="348" width="304" height="43" rx="12" fill="#fff"/><text x="720" y="375" text-anchor="middle" class="chip">Higher edge density</text><rect x="568" y="401" width="304" height="43" rx="12" fill="#fff"/><text x="720" y="428" text-anchor="middle" class="chip">Qualified service model</text></g>
  <text x="480" y="501" text-anchor="middle" class="small">A staged path reduces deployment risk without treating deep integration as the starting assumption.</text>
</svg>
