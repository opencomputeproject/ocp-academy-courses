<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Reach ladder from package to adjacent rack</title>
  <desc id="desc">Four tiers show practical reach growing from package traces through passive and active copper to optical links.</desc>
  <style>
    text{font-family:"Open Sans",Arial,sans-serif;fill:#343895}.tier{font-size:23px;font-weight:800}.metric{font-size:27px;font-weight:800}.metric-small{font-size:25px;font-weight:800}.note{font-size:16px;fill:#5F6062}.axis{font-size:17px;font-weight:700;fill:#5F6062}
  </style>
  <rect width="960" height="540" fill="#fff"/>
  <line x1="70" y1="455" x2="890" y2="455" stroke="#9CA3AF" stroke-width="3"/>
  <g stroke="#9CA3AF" stroke-width="2"><line x1="100" y1="445" x2="100" y2="465"/><line x1="305" y1="445" x2="305" y2="465"/><line x1="510" y1="445" x2="510" y2="465"/><line x1="715" y1="445" x2="715" y2="465"/><line x1="870" y1="445" x2="870" y2="465"/></g>
  <text x="100" y="493" text-anchor="middle" class="axis">package</text><text x="305" y="493" text-anchor="middle" class="axis">~1 m</text><text x="510" y="493" text-anchor="middle" class="axis">~1.5 m</text><text x="715" y="493" text-anchor="middle" class="axis">~3 m</text><text x="870" y="493" text-anchor="middle" class="axis">3–7 m+</text>
  <rect x="55" y="303" width="170" height="124" rx="18" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
  <text x="140" y="329" text-anchor="middle" class="tier">Package</text><text x="140" y="356" text-anchor="middle" class="tier">escape</text><text x="140" y="388" text-anchor="middle" class="metric-small">centimeters</text><text x="140" y="411" text-anchor="middle" class="note">traces + connectors</text>
  <rect x="245" y="254" width="185" height="173" rx="18" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
  <text x="338" y="287" text-anchor="middle" class="tier">Passive</text><text x="338" y="314" text-anchor="middle" class="tier">copper</text><text x="338" y="351" text-anchor="middle" class="metric">~1–1.5 m</text><text x="338" y="382" text-anchor="middle" class="note">at 200G-class lanes</text><text x="338" y="406" text-anchor="middle" class="note">loss budget varies</text>
  <rect x="445" y="197" width="195" height="230" rx="18" fill="#FFF4DD" stroke="#D88911" stroke-width="2"/>
  <text x="543" y="235" text-anchor="middle" class="tier">Active</text><text x="543" y="262" text-anchor="middle" class="tier">copper</text><text x="543" y="301" text-anchor="middle" class="metric">~2.5–3 m</text><text x="543" y="337" text-anchor="middle" class="note">conditioning extends</text><text x="543" y="365" text-anchor="middle" class="note">reach; power + latency</text><text x="543" y="393" text-anchor="middle" class="note">add failure points</text>
  <rect x="655" y="105" width="250" height="322" rx="18" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="780" y="151" text-anchor="middle" class="tier">SROI optical</text><text x="780" y="203" text-anchor="middle" class="metric">adjacent racks</text><text x="780" y="244" text-anchor="middle" font-size="39" font-weight="800">≤30 m class</text><text x="780" y="286" text-anchor="middle" class="note">fiber route is no longer</text><text x="780" y="313" text-anchor="middle" class="note">the dominant constraint</text><line x1="700" y1="345" x2="860" y2="345" stroke="#8DC63F" stroke-width="3"/><text x="780" y="378" text-anchor="middle" class="note">density • energy • cost</text><text x="780" y="403" text-anchor="middle" class="note">latency • reliability</text>
  <text x="55" y="62" class="axis">Practical reach is a system budget—not one universal cable number.</text>
</svg>
