<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rack-scale reach transition</title>
  <desc id="desc">Three panels show a single-rack copper Pod, adjacent rack routing, and a multi-rack optical Pod.</desc>
  <style>
    text { font-family: "Open Sans", Arial, sans-serif; fill: #343895; }
    .head { font-size: 23px; font-weight: 800; }
    .label { font-size: 17px; font-weight: 700; }
    .small { font-size: 15px; fill: #5F6062; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
  <g>
    <rect x="35" y="58" width="270" height="424" rx="22" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
    <text x="170" y="96" text-anchor="middle" class="head">Single rack</text>
    <text x="170" y="122" text-anchor="middle" class="small">Copper fits the physical domain</text>
    <rect x="90" y="150" width="160" height="255" rx="12" fill="#5F6062"/>
    <g fill="#ffffff">
      <rect x="111" y="177" width="118" height="34" rx="5"/><rect x="111" y="229" width="118" height="34" rx="5"/>
      <rect x="111" y="281" width="118" height="34" rx="5"/><rect x="111" y="333" width="118" height="34" rx="5"/>
    </g>
    <line x1="125" y1="246" x2="215" y2="350" stroke="#343895" stroke-width="8" stroke-linecap="round"/>
    <text x="170" y="445" text-anchor="middle" class="label">~1-1.5 m passive copper</text>
  </g>
  <g>
    <rect x="345" y="58" width="270" height="424" rx="22" fill="#FFF7E8" stroke="#D88911" stroke-width="2"/>
    <text x="480" y="96" text-anchor="middle" class="head">Adjacent racks</text>
    <text x="480" y="122" text-anchor="middle" class="small">The service route exceeds the gap</text>
    <rect x="372" y="158" width="88" height="225" rx="10" fill="#5F6062"/>
    <rect x="500" y="158" width="88" height="225" rx="10" fill="#5F6062"/>
    <g fill="#ffffff">
      <rect x="386" y="183" width="60" height="27" rx="4"/><rect x="386" y="226" width="60" height="27" rx="4"/>
      <rect x="386" y="269" width="60" height="27" rx="4"/><rect x="514" y="183" width="60" height="27" rx="4"/>
      <rect x="514" y="226" width="60" height="27" rx="4"/><rect x="514" y="269" width="60" height="27" rx="4"/>
    </g>
    <path d="M416 344 C416 410, 544 410, 544 344" fill="none" stroke="#D88911" stroke-width="8" stroke-linecap="round"/>
    <text x="480" y="445" text-anchor="middle" class="label">~3-7 m routed connection</text>
  </g>
  <g>
    <rect x="655" y="58" width="270" height="424" rx="22" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
    <text x="790" y="96" text-anchor="middle" class="head">Multi-rack Pod</text>
    <text x="790" y="122" text-anchor="middle" class="small">Optics preserves one compute domain</text>
    <g fill="#5F6062">
      <rect x="684" y="168" width="62" height="195" rx="8"/><rect x="759" y="168" width="62" height="195" rx="8"/><rect x="834" y="168" width="62" height="195" rx="8"/>
    </g>
    <g fill="#ffffff">
      <rect x="695" y="193" width="40" height="24" rx="4"/><rect x="695" y="232" width="40" height="24" rx="4"/>
      <rect x="770" y="193" width="40" height="24" rx="4"/><rect x="770" y="232" width="40" height="24" rx="4"/>
      <rect x="845" y="193" width="40" height="24" rx="4"/><rect x="845" y="232" width="40" height="24" rx="4"/>
    </g>
    <g stroke="#8DC63F" stroke-width="8" stroke-linecap="round">
      <line x1="715" y1="310" x2="790" y2="285"/><line x1="790" y1="285" x2="865" y2="310"/><line x1="715" y1="310" x2="865" y2="310"/>
    </g>
    <text x="790" y="413" text-anchor="middle" class="label">SROI up to 30 m</text>
    <text x="790" y="445" text-anchor="middle" class="small">500-1,000+ accelerators</text>
  </g>
</svg>
