<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Radix and Pod size relationship</title>
  <desc id="desc">A fixed switch bandwidth supports more accelerators with narrow links or fewer accelerators with wide links.</desc>
  <style>
    text { font-family: "Open Sans", Arial, sans-serif; fill: #343895; }
    .head { font-size: 25px; font-weight: 800; }
    .label { font-size: 20px; font-weight: 700; }
    .small { font-size: 16px; fill: #5F6062; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="285" y="34" width="390" height="102" rx="20" fill="#343895"/>
  <text x="480" y="77" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">FIXED SWITCH I/O BANDWIDTH</text>
  <text x="480" y="112" text-anchor="middle" font-size="27" font-weight="800" style="fill:#ffffff">B switch</text>
  <line x1="480" y1="136" x2="480" y2="183" stroke="#9CA3AF" stroke-width="5"/>
  <circle cx="480" cy="183" r="8" fill="#8DC63F"/>
  <rect x="250" y="183" width="460" height="72" rx="16" fill="#F4F9E9" stroke="#8DC63F" stroke-width="2.5"/>
  <text x="480" y="213" text-anchor="middle" class="label">Supported accelerators = B switch / B link</text>
  <text x="480" y="239" text-anchor="middle" class="small">Link width sets the population that one switch can reach.</text>
  <line x1="480" y1="255" x2="255" y2="310" stroke="#9CA3AF" stroke-width="4"/>
  <line x1="480" y1="255" x2="705" y2="310" stroke="#9CA3AF" stroke-width="4"/>
  <rect x="42" y="310" width="426" height="184" rx="22" fill="#F6F8FB" stroke="#AAB3C2" stroke-width="2"/>
  <text x="255" y="350" text-anchor="middle" class="head">Narrower link</text>
  <text x="255" y="379" text-anchor="middle" class="small">Lower bandwidth per relationship</text>
  <g fill="#343895">
    <circle cx="112" cy="430" r="17"/><circle cx="167" cy="430" r="17"/><circle cx="222" cy="430" r="17"/>
    <circle cx="277" cy="430" r="17"/><circle cx="332" cy="430" r="17"/><circle cx="387" cy="430" r="17"/>
  </g>
  <text x="255" y="478" text-anchor="middle" class="label">More connected endpoints</text>
  <rect x="492" y="310" width="426" height="184" rx="22" fill="#FFF7E8" stroke="#D88911" stroke-width="2"/>
  <text x="705" y="350" text-anchor="middle" class="head">Wider link</text>
  <text x="705" y="379" text-anchor="middle" class="small">Higher bandwidth per relationship</text>
  <g fill="#8DC63F">
    <circle cx="628" cy="430" r="27"/><circle cx="705" cy="430" r="27"/><circle cx="782" cy="430" r="27"/>
  </g>
  <text x="705" y="478" text-anchor="middle" class="label">Fewer connected endpoints</text>
</svg>
