<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280,height=720,initial-scale=1">
  <link rel="stylesheet" href="animation.css">
  <title>Electrical and optical circuit switching animation</title>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Electrical switching versus a reconfigurable optical circuit switch</title>
  <desc id="desc">The electrical path terminates, buffers, and regenerates light through optical-electrical conversions. The optical circuit switch preserves an end-to-end light path and then reconfigures it from endpoint B to endpoint C while insertion loss remains part of the optical budget.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="34" y="28" width="1212" height="64" rx="20" fill="#F6F8FB"/>
  <text x="62" y="67" class="eyebrow ink">TWO WAYS TO STEER CONNECTIVITY</text>
  <g data-box="true">
    <rect data-bound="true" id="routePill" x="930" y="39" width="288" height="42" rx="21" fill="#F4F9E9" stroke="#8DC63F" stroke-width="2"/>
    <text id="routeText" x="1074" y="65" text-anchor="middle" class="small ink">OCS ROUTE: A → B</text>
  </g>

  <rect x="34" y="116" width="1212" height="226" rx="26" fill="#F6F8FB" stroke="#D2D7DF" stroke-width="2"/>
  <text x="62" y="154" class="eyebrow muted">ELECTRICAL SWITCH PATH</text>
  <g data-box="true" class="soft-shadow"><rect data-bound="true" x="62" y="196" width="164" height="92" rx="18" fill="#ffffff" stroke="#343895" stroke-width="2"/><text x="144" y="235" text-anchor="middle" class="label ink">ENDPOINT A</text><text x="144" y="263" text-anchor="middle" class="small muted">light launches</text></g>
  <path id="electricalPath" d="M226 242 L342 242 L938 242 L1058 242" class="track"/>
  <line x1="226" y1="242" x2="342" y2="242" class="green-line"/>
  <line x1="938" y1="242" x2="1058" y2="242" class="green-line"/>
  <g class="soft-shadow">
    <rect x="342" y="180" width="596" height="124" rx="24" fill="#343895"/>
    <g data-box="true"><rect data-bound="true" x="365" y="200" width="130" height="84" rx="15" fill="#ffffff"/><text x="430" y="236" text-anchor="middle" class="label ink">O / E</text><text x="430" y="263" text-anchor="middle" class="tiny muted">terminate light</text></g>
    <g data-box="true"><rect data-bound="true" x="520" y="200" width="240" height="84" rx="15" fill="#24276D" stroke="#6E79BA" stroke-width="2"/><text x="640" y="236" text-anchor="middle" class="label white">BUFFER + SWITCH</text><text x="640" y="263" text-anchor="middle" class="tiny" fill="#DDE4F5">electrical data path</text></g>
    <g data-box="true"><rect data-bound="true" x="785" y="200" width="130" height="84" rx="15" fill="#ffffff"/><text x="850" y="236" text-anchor="middle" class="label ink">E / O</text><text x="850" y="263" text-anchor="middle" class="tiny muted">regenerate light</text></g>
  </g>
  <g data-box="true" class="soft-shadow"><rect data-bound="true" x="1058" y="196" width="160" height="92" rx="18" fill="#ffffff" stroke="#343895" stroke-width="2"/><text x="1138" y="235" text-anchor="middle" class="label ink">ENDPOINT B</text><text x="1138" y="263" text-anchor="middle" class="small muted">new optical link</text></g>
  <g id="ePacket" class="glow-green"><circle r="10" fill="#8DC63F"/><circle r="4" fill="#ffffff"/></g>
  <g data-box="true"><rect data-bound="true" x="990" y="131" width="228" height="40" rx="20" fill="#FBEAEA"/><text x="1104" y="155" text-anchor="middle" class="tiny" fill="#B8473D">2 OPTICAL TERMINATIONS</text></g>

  <rect x="34" y="366" width="1212" height="320" rx="26" fill="#F4F9E9" stroke="#8DC63F" stroke-width="3"/>
  <text x="62" y="405" class="eyebrow ink">OPTICAL CIRCUIT SWITCH PATH</text>
  <g data-box="true" class="soft-shadow"><rect data-bound="true" x="62" y="484" width="164" height="92" rx="18" fill="#ffffff" stroke="#343895" stroke-width="2"/><text x="144" y="523" text-anchor="middle" class="label ink">ENDPOINT A</text><text x="144" y="551" text-anchor="middle" class="small muted">continuous light</text></g>
  <path id="routeB" d="M226 530 L418 530 C500 530 510 460 640 460 C770 460 790 458 1058 458" class="track"/>
  <path id="routeC" d="M226 530 L418 530 C500 530 510 575 640 575 C770 575 790 590 1058 590" class="track"/>
  <path id="activeB" d="M226 530 L418 530 C500 530 510 460 640 460 C770 460 790 458 1058 458" class="green-line"/>
  <path id="activeC" d="M226 530 L418 530 C500 530 510 575 640 575 C770 575 790 590 1058 590" class="green-line" opacity="0"/>
  <g class="soft-shadow">
    <rect x="418" y="424" width="344" height="196" rx="28" fill="#ffffff" stroke="#8DC63F" stroke-width="4"/>
    <text x="590" y="459" text-anchor="middle" class="label ink">OPTICAL CIRCUIT SWITCH</text>
    <g id="switchMatrix" opacity="0.9">
      <circle cx="492" cy="504" r="11" fill="#2F77C5"/><circle cx="552" cy="504" r="11" fill="#8DC63F"/><circle cx="612" cy="504" r="11" fill="#D88911"/><circle cx="672" cy="504" r="11" fill="#B8473D"/>
      <circle cx="492" cy="550" r="11" fill="#2F77C5"/><circle cx="552" cy="550" r="11" fill="#8DC63F"/><circle cx="612" cy="550" r="11" fill="#D88911"/><circle cx="672" cy="550" r="11" fill="#B8473D"/>
    </g>
    <text x="590" y="603" text-anchor="middle" class="tiny muted">steers wavelengths without O / E / O</text>
  </g>
  <g data-box="true" id="endpointB" class="soft-shadow"><rect data-bound="true" x="1058" y="412" width="160" height="92" rx="18" fill="#ffffff" stroke="#8DC63F" stroke-width="3"/><text x="1138" y="451" text-anchor="middle" class="label ink">ENDPOINT B</text><text x="1138" y="479" text-anchor="middle" class="small muted">active route</text></g>
  <g data-box="true" id="endpointC" class="soft-shadow"><rect data-bound="true" x="1058" y="544" width="160" height="92" rx="18" fill="#ffffff" stroke="#9CA3AF" stroke-width="2"/><text x="1138" y="583" text-anchor="middle" class="label ink">ENDPOINT C</text><text x="1138" y="611" text-anchor="middle" class="small muted">standby route</text></g>
  <g id="photons"></g>
  <g data-box="true">
    <rect data-bound="true" x="62" y="624" width="790" height="42" rx="18" fill="#ffffff" stroke="#8DC63F" stroke-width="2"/>
    <text x="86" y="651" class="small ink">ONE END-TO-END OPTICAL BUDGET</text>
    <text x="827" y="651" text-anchor="end" class="small muted">fiber loss + connectors + OCS insertion loss</text>
  </g>
  <g data-box="true"><rect data-bound="true" x="870" y="624" width="176" height="42" rx="18" fill="#EAF5DC"/><text x="958" y="651" text-anchor="middle" class="tiny ink">0 INTERMEDIATE O/E</text></g>
</svg>
<script>
(() => {
  const NS='http://www.w3.org/2000/svg';
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=v=>{v=clamp(v);return v*v*(3-2*v);};
  const range=(t,a,b)=>smooth((t-a)/(b-a));
  const ePath=document.getElementById('electricalPath');
  const ePacket=document.getElementById('ePacket');
  const activeB=document.getElementById('activeB'),activeC=document.getElementById('activeC');
  const photons=document.getElementById('photons');
  const colors=['#2F77C5','#8DC63F','#D88911','#B8473D'];
  const dots=[];
  for(let i=0;i<12;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r',i%3===0?'8':'6');c.setAttribute('fill',colors[i%4]);c.setAttribute('class',i%4===1?'glow-green':'');photons.appendChild(c);dots.push(c);}
  const point=(path,p)=>path.getPointAtLength(clamp(p)*path.getTotalLength());
  window.setAnimationTime=t=>{
    t=clamp(t);
    const ep=(t*2.4)%1, ept=point(ePath,ep);ePacket.setAttribute('transform',`translate(${ept.x} ${ep>.22&&ep<.78?292:ept.y})`);
    const inside=ep>.22&&ep<.78;
    ePacket.querySelectorAll('circle')[0].setAttribute('fill',inside?'#343895':'#8DC63F');
    ePacket.setAttribute('class',inside?'glow-blue':'glow-green');
    const change=range(t,.42,.58);
    const blackout=range(t,.40,.48)*(1-range(t,.54,.62));
    activeB.style.opacity=1-change;
    activeC.style.opacity=change;
    const route=change>.5?activeC:activeB;
    dots.forEach((c,i)=>{const p=(t*3.3+i/12)%1;const pt=point(route,p);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);const insideSwitch=pt.x>418&&pt.x<762;c.style.opacity=insideSwitch?0:(.25+.75*(1-blackout));});
    document.getElementById('endpointB').querySelector('rect').setAttribute('stroke',change<.5?'#8DC63F':'#9CA3AF');
    document.getElementById('endpointC').querySelector('rect').setAttribute('stroke',change>.5?'#8DC63F':'#9CA3AF');
    document.getElementById('endpointB').querySelector('.small').textContent=change<.5?'active route':'standby route';
    document.getElementById('endpointC').querySelector('.small').textContent=change>.5?'active route':'standby route';
    const pill=document.getElementById('routePill'),txt=document.getElementById('routeText');
    if(blackout>.45){pill.setAttribute('fill','#FFF4DD');pill.setAttribute('stroke','#D88911');txt.textContent='OCS RECONFIGURING';}
    else {pill.setAttribute('fill','#F4F9E9');pill.setAttribute('stroke','#8DC63F');txt.textContent=change>.5?'OCS ROUTE: A → C':'OCS ROUTE: A → B';}
    document.getElementById('switchMatrix').setAttribute('opacity',String(.68+.25*Math.sin(t*22)));
  };
  window.setAnimationTime(0);
})();
</script>
</body>
</html>
