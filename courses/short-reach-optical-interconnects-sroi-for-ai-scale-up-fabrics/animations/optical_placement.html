<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280,height=720,initial-scale=1">
  <link rel="stylesheet" href="animation.css">
  <title>Optical engine placement animation</title>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Optical engine placement moves inward toward system silicon</title>
  <desc id="desc">An optical engine moves inward within a server or switch tray, from a front-panel pluggable position through connector-adjacent and near-package positions to co-packaged optics beside an XPU or switch ASIC. The lossy electrical path visibly shortens while serviceability and integration change.</desc>
  <defs>
    <linearGradient id="boardFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F8FB"/><stop offset="1" stop-color="#EBEFF5"/></linearGradient>
    <linearGradient id="electricalFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8473D"/><stop offset="1" stop-color="#D88911"/></linearGradient>
    <linearGradient id="opticalFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DC63F"/><stop offset="1" stop-color="#2F77C5"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="34" y="28" width="1212" height="64" rx="20" fill="#F6F8FB"/>
  <text x="62" y="67" class="eyebrow ink">MOVE THE OPTICAL BOUNDARY INWARD</text>
  <g data-box="true">
    <rect data-bound="true" id="placementPill" x="945" y="39" width="273" height="42" rx="21" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text id="placementLabel" x="1081" y="65" text-anchor="middle" class="small ink">FRONT-PANEL PLUGGABLE</text>
  </g>

  <rect x="34" y="120" width="1212" height="468" rx="28" fill="url(#boardFill)" stroke="#D2D7DF" stroke-width="2"/>
  <text x="64" y="159" class="eyebrow muted">SERVER OR SWITCH TRAY • SIDE VIEW</text>
  <line x1="1184" y1="176" x2="1184" y2="536" stroke="#9CA3AF" stroke-width="5"/>
  <text x="1184" y="561" text-anchor="middle" class="tiny muted">FRONT PANEL</text>

  <g data-box="true" class="soft-shadow">
    <rect data-bound="true" x="84" y="229" width="266" height="230" rx="28" fill="#343895"/>
    <circle cx="135" cy="281" r="22" fill="#8DC63F"/>
    <circle cx="192" cy="281" r="22" fill="#5260A7"/>
    <circle cx="249" cy="281" r="22" fill="#6CA853"/>
    <circle cx="306" cy="281" r="22" fill="#8DC63F"/>
    <text x="217" y="340" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">XPU / SWITCH</text>
    <text x="217" y="374" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">ASIC</text>
    <text x="217" y="405" text-anchor="middle" class="body" fill="#DDE4F5">high-speed electrical I/O</text>
    <rect x="116" y="430" width="202" height="14" rx="7" fill="#24276D"/>
  </g>

  <line id="electricalTrack" x1="350" y1="344" x2="1030" y2="344" stroke="#D88911" stroke-width="18" stroke-linecap="round"/>
  <line id="electricalCore" x1="350" y1="344" x2="1030" y2="344" stroke="url(#electricalFill)" stroke-width="7" stroke-linecap="round"/>
  <line id="opticalTrack" x1="1090" y1="344" x2="1184" y2="344" stroke="#D8DDE5" stroke-width="18" stroke-linecap="round"/>
  <line id="opticalCore" x1="1090" y1="344" x2="1184" y2="344" stroke="url(#opticalFill)" stroke-width="7" stroke-linecap="round"/>
  <g id="electrons"></g>
  <g id="photons"></g>

  <g id="boundary">
    <line id="boundaryLine" x1="1060" y1="190" x2="1060" y2="502" stroke="#343895" stroke-width="3" stroke-dasharray="10 9"/>
    <g data-box="true" id="boundaryPill">
      <rect data-bound="true" x="920" y="183" width="280" height="40" rx="20" fill="#ffffff" stroke="#343895" stroke-width="2"/>
      <text x="1060" y="207" text-anchor="middle" class="tiny ink">ELECTRICAL / OPTICAL BOUNDARY</text>
    </g>
  </g>
  <g id="engine" class="soft-shadow" data-box="true">
    <rect data-bound="true" x="-64" y="-68" width="128" height="136" rx="22" fill="#ffffff" stroke="#8DC63F" stroke-width="4"/>
    <circle cx="-24" cy="-18" r="14" fill="#2F77C5"/>
    <circle cx="16" cy="-18" r="14" fill="#8DC63F"/>
    <text x="0" y="23" text-anchor="middle" class="label ink">OPTICAL</text>
    <text x="0" y="49" text-anchor="middle" class="small muted">ENGINE</text>
  </g>

  <g id="stationMarkers">
    <g><circle cx="1060" cy="512" r="8" fill="#343895"/><text x="1060" y="542" text-anchor="middle" class="tiny muted">PLUGGABLE</text></g>
    <g><circle cx="835" cy="512" r="8" fill="#5260A7"/><text x="835" y="542" text-anchor="middle" class="tiny muted">CONNECTOR-ADJACENT</text></g>
    <g><circle cx="598" cy="512" r="8" fill="#6CA853"/><text x="598" y="542" text-anchor="middle" class="tiny muted">NPO</text></g>
    <g><circle cx="414" cy="512" r="8" fill="#8DC63F"/><text x="414" y="542" text-anchor="middle" class="tiny muted">CPO</text></g>
  </g>

  <g data-box="true">
    <rect data-bound="true" x="34" y="614" width="382" height="78" rx="20" fill="#FFF4DD" stroke="#D88911" stroke-width="2"/>
    <text x="58" y="646" class="small ink">Electrical-path loss + energy</text>
    <rect x="58" y="662" width="334" height="12" rx="6" fill="#F0DDBE"/>
    <rect id="lossGauge" x="58" y="662" width="315" height="12" rx="6" fill="#D88911"/>
  </g>
  <g data-box="true">
    <rect data-bound="true" x="449" y="614" width="382" height="78" rx="20" fill="#F4F9E9" stroke="#8DC63F" stroke-width="2"/>
    <text x="473" y="646" class="small ink">Field-replacement accessibility</text>
    <rect x="473" y="662" width="334" height="12" rx="6" fill="#DDE7CF"/>
    <rect id="serviceGauge" x="473" y="662" width="315" height="12" rx="6" fill="#8DC63F"/>
  </g>
  <g data-box="true">
    <rect data-bound="true" x="864" y="614" width="382" height="78" rx="20" fill="#E9EDF7" stroke="#343895" stroke-width="2"/>
    <text x="888" y="646" class="small ink">Package / thermal integration</text>
    <rect x="888" y="662" width="334" height="12" rx="6" fill="#D8DDEA"/>
    <rect id="integrationGauge" x="888" y="662" width="32" height="12" rx="6" fill="#343895"/>
  </g>
</svg>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const positions = [1060, 835, 598, 414];
  const labels = ['FRONT-PANEL PLUGGABLE','CONNECTOR-ADJACENT','NEAR-PACKAGE OPTICS','CO-PACKAGED OPTICS'];
  const clamp = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth = v=>{v=clamp(v);return v*v*(3-2*v);};
  const stageAt = t => {
    const s = clamp(t) * 3;
    const i = Math.min(2, Math.floor(s));
    const f = smooth(s-i);
    return {x: positions[i] + (positions[i+1]-positions[i])*f, index: Math.min(3, Math.round(s)), p:s/3};
  };
  const electrons = document.getElementById('electrons');
  const photons = document.getElementById('photons');
  const eDots=[], pDots=[];
  for(let i=0;i<7;i++){
    const e=document.createElementNS(NS,'circle'); e.setAttribute('r','7'); e.setAttribute('fill','#D88911'); e.setAttribute('class','glow-amber'); electrons.appendChild(e); eDots.push(e);
    const p=document.createElementNS(NS,'circle'); p.setAttribute('r','7'); p.setAttribute('fill',i%2?'#8DC63F':'#2F77C5'); p.setAttribute('class',i%2?'glow-green':'glow-blue'); photons.appendChild(p); pDots.push(p);
  }
  window.setAnimationTime = t => {
    t=clamp(t); const {x,index,p}=stageAt(t);
    document.getElementById('engine').setAttribute('transform',`translate(${x} 344)`);
    document.getElementById('boundary').setAttribute('transform',`translate(${x-1060} 0)`);
    document.getElementById('electricalTrack').setAttribute('x2',x-68);
    document.getElementById('electricalCore').setAttribute('x2',x-68);
    document.getElementById('opticalTrack').setAttribute('x1',x+68);
    document.getElementById('opticalCore').setAttribute('x1',x+68);
    eDots.forEach((d,i)=>{const q=(t*9+i/7)%1; d.setAttribute('cx',350+(x-418)*q);d.setAttribute('cy',344);d.style.opacity=(x>430?1:.6);});
    pDots.forEach((d,i)=>{const q=(t*7+i/7)%1; d.setAttribute('cx',x+68+(1116-x)*q);d.setAttribute('cy',344);});
    const pill=document.getElementById('placementPill');
    const stageColors=['#343895','#5260A7','#6CA853','#8DC63F'];
    pill.setAttribute('stroke',stageColors[index]);
    pill.setAttribute('fill',index<2?'#E9EDF7':'#F4F9E9');
    document.getElementById('placementLabel').textContent=labels[index];
    document.getElementById('lossGauge').setAttribute('width',315-255*p);
    document.getElementById('serviceGauge').setAttribute('width',315-238*p);
    document.getElementById('integrationGauge').setAttribute('width',32+283*p);
    [...document.querySelectorAll('#stationMarkers circle')].forEach((c,i)=>c.setAttribute('r',i===index?'12':'8'));
  };
  window.setAnimationTime(0);
})();
</script>
</body>
</html>
