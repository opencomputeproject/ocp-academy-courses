<svg font-family="Open Sans, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" aria-label="Perimeter escape compared with area escape for APO">
  <rect width="768" height="360" fill="#fff"/>
  <text x="384" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#343895">Optical I/O Escape Geometry</text>

  <rect x="48" y="72" width="304" height="236" rx="14" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="200" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#343895">Perimeter escape</text>
  <text x="200" y="128" text-anchor="middle" font-size="14" fill="#5F6062">I/O leaves around the edge</text>
  <rect x="126" y="154" width="148" height="92" rx="10" fill="#EEF2F7" stroke="#5F6062" stroke-width="2"/>
  <text x="200" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#343895">Die / package</text>
  <text x="200" y="220" text-anchor="middle" font-size="13" fill="#5F6062">edge-limited escape</text>
  <g fill="#8DC63F">
    <circle cx="128" cy="172" r="4"/><circle cx="128" cy="190" r="4"/><circle cx="128" cy="208" r="4"/><circle cx="128" cy="226" r="4"/>
    <circle cx="272" cy="172" r="4"/><circle cx="272" cy="190" r="4"/><circle cx="272" cy="208" r="4"/><circle cx="272" cy="226" r="4"/>
    <circle cx="152" cy="154" r="4"/><circle cx="176" cy="154" r="4"/><circle cx="200" cy="154" r="4"/><circle cx="224" cy="154" r="4"/><circle cx="248" cy="154" r="4"/>
    <circle cx="152" cy="246" r="4"/><circle cx="176" cy="246" r="4"/><circle cx="200" cy="246" r="4"/><circle cx="224" cy="246" r="4"/><circle cx="248" cy="246" r="4"/>
  </g>
  <rect x="110" y="272" width="180" height="30" rx="15" fill="#E6EEF8" stroke="#A7BCD3"/>
  <text x="200" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#343895">scales with edge length</text>

  <rect x="416" y="72" width="304" height="236" rx="14" fill="#FFF4DD" stroke="#E0B76A" stroke-width="2.5"/>
  <text x="568" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#343895">Area escape: APO</text>
  <text x="568" y="128" text-anchor="middle" font-size="14" fill="#5F6062">I/O leaves through the die face</text>
  <rect x="494" y="154" width="148" height="88" rx="10" fill="#FFE8BC" stroke="#B9802D" stroke-width="2"/>
  <text x="568" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#343895">Die face</text>
  <g fill="#8DC63F">
    <circle cx="526" cy="198" r="4"/><circle cx="547" cy="198" r="4"/><circle cx="568" cy="198" r="4"/><circle cx="589" cy="198" r="4"/><circle cx="610" cy="198" r="4"/>
    <circle cx="526" cy="218" r="4"/><circle cx="547" cy="218" r="4"/><circle cx="568" cy="218" r="4"/><circle cx="589" cy="218" r="4"/><circle cx="610" cy="218" r="4"/>
  </g>
  <rect x="510" y="249" width="116" height="24" rx="8" fill="#DDF2E7" stroke="#8DC63F" stroke-width="2"/>
  <text x="568" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#343895">OE under die</text>
  <rect x="478" y="278" width="180" height="28" rx="14" fill="#FDE7BE" stroke="#E0B76A"/>
  <text x="568" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#343895">scales with die area</text>
