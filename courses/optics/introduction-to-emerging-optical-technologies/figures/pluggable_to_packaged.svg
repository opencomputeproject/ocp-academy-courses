<svg font-family="Open Sans, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" aria-label="Optical Conversion Moves Closer to the ASIC">
  <rect width="768" height="360" fill="#fff"/>
  <text x="384" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#343895">Optical Conversion Moves Closer to the ASIC</text>
  <rect x="70" y="92" width="270" height="180" rx="14" fill="#F8FAFC" stroke="#9ca3af" stroke-width="3"/>
  <rect x="428" y="92" width="270" height="180" rx="14" fill="#F4FAEF" stroke="#8DC63F" stroke-width="3"/>
  <text x="205" y="132" text-anchor="middle" font-size="22" font-weight="800" fill="#343895">Pluggable</text>
  <text x="563" y="132" text-anchor="middle" font-size="22" font-weight="800" fill="#343895">Near or co-packaged</text>
  <text x="205" y="170" text-anchor="middle" font-size="16" fill="#5F6062">Front panel</text><text x="205" y="194" text-anchor="middle" font-size="16" fill="#5F6062">longer electrical path</text><text x="205" y="218" text-anchor="middle" font-size="16" fill="#5F6062">easy replacement</text>
  <text x="563" y="170" text-anchor="middle" font-size="16" fill="#5F6062">near ASIC</text><text x="563" y="194" text-anchor="middle" font-size="16" fill="#5F6062">shorter electrical path</text><text x="563" y="218" text-anchor="middle" font-size="16" fill="#5F6062">new service model</text>
  <line x1="355" y1="182" x2="414" y2="182" stroke="#8DC63F" stroke-width="5"/>
  <polygon class="arrowhead" points="414,174 428,182 414,190" fill="#8DC63F"/>
</svg>
