<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="32-byte event log record">
  <rect width="960" height="560" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#343895">
    <text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700">One event, 32 bytes of context</text>
    <text x="480" y="80" text-anchor="middle" font-size="18" fill="#5f6062">Little-endian fields; decode details by event ID</text>
    <g font-size="20" font-weight="700">
      <rect x="42" y="110" width="876" height="65" rx="8" fill="#eef0fb" stroke="#343895"/>
      <text x="65" y="150">UID</text><text x="345" y="150">16-bit sequence</text><text x="890" y="150" text-anchor="end">2 bytes</text>
      <rect x="42" y="185" width="876" height="65" rx="8" fill="#eff8e9" stroke="#6fa030"/>
      <text x="65" y="225">TIME_NSEC</text><text x="345" y="225">64-bit timestamp</text><text x="890" y="225" text-anchor="end">8 bytes</text>
      <rect x="42" y="260" width="876" height="65" rx="8" fill="#edf6f7" stroke="#477f87"/>
      <text x="65" y="300">EVENT_ID</text><text x="345" y="300">Event type</text><text x="890" y="300" text-anchor="end">2 bytes</text>
      <rect x="42" y="335" width="876" height="65" rx="8" fill="#eef0fb" stroke="#343895"/>
      <text x="65" y="375">DETAIL0-3</text><text x="345" y="375">Four 32-bit detail fields</text><text x="890" y="375" text-anchor="end">16 bytes</text>
      <rect x="42" y="410" width="876" height="65" rx="8" fill="#f3f4f5" stroke="#94969a"/>
      <text x="65" y="450">Reserved</text><text x="890" y="450" text-anchor="end">4 bytes</text>
    </g>
    <text x="480" y="516" text-anchor="middle" font-size="20" fill="#5f6062">Preserve sequence, time validity and event meaning.</text>
  </g>
</svg>
