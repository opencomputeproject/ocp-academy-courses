<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="Acesso remoto CMIS">
  <style>text { font-family: Arial, "Helvetica Neue", sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="18.2" font-weight="800" fill="#343895">O acesso remoto CMIS alcança o extremo mais distante</text>
  <rect x="74" y="104" width="276" height="142" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="212" y="142" text-anchor="middle" font-size="15.2" font-weight="800" fill="#343895">Acesso por bytes</text>
  <text x="212" y="176" text-anchor="middle" font-size="12.2" fill="#5F6062">pequenas leituras direcionadas</text>
  <text x="212" y="204" text-anchor="middle" font-size="12.2" fill="#5F6062">Verificações de status ou de campo</text>
  <rect x="418" y="104" width="276" height="142" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="556" y="142" text-anchor="middle" font-size="15.2" font-weight="800" fill="#343895">Acesso à página</text>
  <text x="556" y="176" text-anchor="middle" font-size="12.2" fill="#5F6062">Recuperação de página inteira</text>
  <text x="556" y="204" text-anchor="middle" font-size="12.2" fill="#5F6062">Snapshots maiores CMIS</text>
  <text x="384" y="306" text-anchor="middle" font-size="12.9" fill="#5F6062">Ambos preservam a mesma ideia operacional: local host, módulo local, parceiro remoto.</text>

</svg>