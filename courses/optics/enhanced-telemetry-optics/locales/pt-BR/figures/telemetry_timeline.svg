<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="Linha do tempa telemetria">
  <style>text { font-family: Arial, "Helvetica Neue", sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="18.2" font-weight="800" fill="#343895">A coleta de telemetria constrói uma linha do tempo do link</text>
  <line x1="86" y1="182" x2="682" y2="182" stroke="#D0D7DE" stroke-width="7" stroke-linecap="round"/>
  <circle cx="124" cy="182" r="15" fill="#8DC63F"/><text x="124" y="134" text-anchor="middle" font-size="13.7" font-weight="800" fill="#343895">Enquete</text><text x="124" y="226" text-anchor="middle" font-size="11.4" fill="#5F6062">Métricas atuais</text>
  <circle cx="292" cy="182" r="15" fill="#F97316"/><text x="292" y="134" text-anchor="middle" font-size="13.7" font-weight="800" fill="#343895">Eventoo</text><text x="292" y="226" text-anchor="middle" font-size="11.4" fill="#5F6062">Limite cruzado</text>
  <circle cx="460" cy="182" r="15" fill="#8DC63F"/><text x="460" y="134" text-anchor="middle" font-size="13.7" font-weight="800" fill="#343895">Remoto</text><text x="460" y="226" text-anchor="middle" font-size="11.4" fill="#5F6062">Consulta de parceiro</text>
  <circle cx="628" cy="182" r="15" fill="#343895"/><text x="628" y="134" text-anchor="middle" font-size="13.7" font-weight="800" fill="#343895">Mapa</text><text x="628" y="226" text-anchor="middle" font-size="11.4" fill="#5F6062">Integridade da rede</text>
  <text x="384" y="306" text-anchor="middle" font-size="12.9" fill="#5F6062">As operações melhoram quando o estado atual e o histórico de eventos podem ser costurados.</text>

