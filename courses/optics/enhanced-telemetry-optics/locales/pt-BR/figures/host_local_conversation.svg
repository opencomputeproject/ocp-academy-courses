<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="host conversa local">
  <style>text { font-family: Arial, "Helvetica Neue", sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="18.2" font-weight="800" fill="#343895">software do host controla a conversa local</text>
  <rect x="58" y="112" width="160" height="112" rx="12" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="138" y="154" text-anchor="middle" font-size="14.4" font-weight="800" fill="#343895">Interruptor host</text>
  <text x="138" y="184" text-anchor="middle" font-size="12.2" fill="#5F6062">SDK e CLI</text>
  <line x1="224" y1="168" x2="303" y2="168" stroke="#8DC63F" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="264" y="148" text-anchor="middle" font-size="11.4" fill="#5F6062">I2C</text>
  <rect x="312" y="96" width="168" height="144" rx="12" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="396" y="140" text-anchor="middle" font-size="14.4" font-weight="800" fill="#343895">Óptica local</text>
  <text x="396" y="170" text-anchor="middle" font-size="12.2" fill="#5F6062">Respostas locais</text>
  <text x="396" y="196" text-anchor="middle" font-size="12.2" fill="#5F6062">Proxy remoto</text>
  <line x1="486" y1="168" x2="567" y2="168" stroke="#8DC63F" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="527" y="148" text-anchor="middle" font-size="11.4" fill="#5F6062">Banda interna</text>
  <rect x="576" y="112" width="134" height="112" rx="12" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="643" y="154" text-anchor="middle" font-size="14.4" font-weight="800" fill="#343895">Remoto</text>
  <text x="643" y="184" text-anchor="middle" font-size="12.2" fill="#5F6062">Parceiro</text>
  <text x="384" y="306" text-anchor="middle" font-size="12.9" fill="#5F6062">O host não precisa de um caminho direto separado para o módulo distante.</text>

</svg>