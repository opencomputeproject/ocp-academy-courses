<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="リモートアクセス CMIS">
  <style>text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Arial, sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="20.6" font-weight="800" fill="#343895">リモートアクセスは遠方エンドポイントに到達します</text>
  <rect x="74" y="104" width="276" height="142" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="212" y="142" text-anchor="middle" font-size="17.2" font-weight="800" fill="#343895">バイトアクセス</text>
  <text x="212" y="176" text-anchor="middle" font-size="13.8" fill="#5F6062">小規模なターゲット読み取り</text>
  <text x="212" y="204" text-anchor="middle" font-size="13.8" fill="#5F6062">ステータスまたはフィールドチェック</text>
  <rect x="418" y="104" width="276" height="142" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="556" y="142" text-anchor="middle" font-size="17.2" font-weight="800" fill="#343895">ページアクセス</text>
  <text x="556" y="176" text-anchor="middle" font-size="13.8" fill="#5F6062">全ページ検索</text>
  <text x="556" y="204" text-anchor="middle" font-size="13.8" fill="#5F6062">より大きなCMISのスナップショット</text>
  <text x="384" y="306" text-anchor="middle" font-size="14.6" fill="#5F6062">両者とも同じ動作理念を保持しています:ローカルホスト、ローカルモジュール、リモートパートナー。</text>

</svg>