<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="标志位汇总与评分掩码分别控制：本地或远端标志位，以及上电时默认不参与评分的 FEC 和链路断开计数器。">
  <style data-zh-font="true">@font-face{font-family:AcademyZhCN;src:url(data:font/woff2;base64,) format("woff2")}text,tspan{font-family:AcademyZhCN,sans-serif}</style><style>text { font-family: "Open Sans", Arial, Helvetica, sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#343895">标志位报告状态；掩码选择评分计数器</text>
  <rect x="72" y="92" width="250" height="172" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="197" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#343895">标志位汇总</text>
  <text x="197" y="172" text-anchor="middle" font-size="17" fill="#5F6062">本地或远端标志位</text>
  <text x="197" y="207" text-anchor="middle" font-size="17" fill="#5F6062">再读取回复中的详细标志位</text>
  <rect x="444" y="92" width="250" height="172" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="569" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#343895">掩码控制</text>
  <text x="569" y="166" text-anchor="middle" font-size="17" fill="#5F6062">FEC 与链路断开计数器</text>
  <text x="569" y="199" text-anchor="middle" font-size="17" fill="#5F6062">0：计入 / 1：排除</text>
  <text x="569" y="233" text-anchor="middle" font-size="17" fill="#5F6062">上电时两者均被排除</text>
  <text x="384" y="314" text-anchor="middle" font-size="17" fill="#5F6062">掩码改变评分参与情况，不改变已存证据。</text>

</svg>