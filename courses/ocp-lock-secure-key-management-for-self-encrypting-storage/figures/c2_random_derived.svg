<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Random and derived MEK paths</title><desc id="d">A split diagram compares double wrapping for random keys with CMAC KDF regeneration for derived keys.</desc><defs><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
  <rect width="960" height="540" rx="24" fill="#f4f8fa"/><g font-family="Arial"><text x="480" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#0B2441">TWO PATHS · ONE PROTECTED DESTINATION</text>
  <rect x="55" y="90" width="400" height="332" rx="24" fill="#fff" stroke="#d5e0e7" filter="url(#s)"/><rect x="505" y="90" width="400" height="332" rx="24" fill="#fff" stroke="#d5e0e7" filter="url(#s)"/>
  <text x="255" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#0B2441">RANDOM MEK</text><text x="705" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#0B2441">DERIVED MEK</text>
  <g font-size="18"><rect x="112" y="165" width="286" height="55" rx="12" fill="#eaf1f5"/><text x="255" y="198" text-anchor="middle" font-weight="700" fill="#0B2441">KMB generates random MEK</text><path d="M255 220v30" stroke="#8DC63F" stroke-width="7" stroke-linecap="round"/><rect x="112" y="250" width="286" height="55" rx="12" fill="#0B2441"/><text x="255" y="283" text-anchor="middle" font-weight="700" fill="#fff">inner wrap · MDK · AES-ECB</text><path d="M255 305v30" stroke="#8DC63F" stroke-width="7" stroke-linecap="round"/><rect x="112" y="335" width="286" height="55" rx="12" fill="#8DC63F"/><text x="255" y="368" text-anchor="middle" font-weight="700" fill="#0B2441">outer envelope · MEK secret</text>
  <rect x="562" y="165" width="286" height="55" rx="12" fill="#eaf1f5"/><text x="705" y="198" text-anchor="middle" font-weight="700" fill="#0B2441">seed + hierarchy context</text><path d="M705 220v30" stroke="#8DC63F" stroke-width="7" stroke-linecap="round"/><rect x="562" y="250" width="286" height="55" rx="12" fill="#0B2441"/><text x="705" y="283" text-anchor="middle" font-weight="700" fill="#fff">CMAC KDF + MDK path</text><path d="M705 305v30" stroke="#8DC63F" stroke-width="7" stroke-linecap="round"/><rect x="562" y="335" width="286" height="55" rx="12" fill="#8DC63F"/><text x="705" y="359" text-anchor="middle" font-weight="700" fill="#0B2441">regenerate MEK</text><text x="705" y="380" text-anchor="middle" font-size="15" fill="#0B2441">optional 128-bit checksum</text></g>
  <path d="M255 422v42h450v-42" fill="none" stroke="#0B2441" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="450" width="420" height="60" rx="30" fill="#0B2441"/><text x="480" y="488" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">KMB → protected SFRs → engine</text></g>
</svg>
