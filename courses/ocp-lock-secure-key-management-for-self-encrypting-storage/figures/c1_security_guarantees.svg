<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Three L.O.C.K. security guarantees</title><desc id="d">Three connected shield cards represent key secrecy, correct data binding, and irreversible retirement.</desc>
  <defs><filter id="s"><feDropShadow dy="8" stdDeviation="9" flood-opacity=".12"/></filter></defs><rect width="960" height="540" rx="24" fill="#f3f7f9"/>
  <text x="480" y="58" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0B2441" letter-spacing="2">ONE PROTECTED PATH · THREE GUARANTEES</text>
  <path d="M170 325h620" stroke="#b9c7d1" stroke-width="10" stroke-linecap="round"/><circle cx="170" cy="325" r="15" fill="#8DC63F"/><circle cx="480" cy="325" r="15" fill="#8DC63F"/><circle cx="790" cy="325" r="15" fill="#8DC63F"/>
  <g filter="url(#s)" font-family="Arial">
    <rect x="55" y="100" width="230" height="300" rx="24" fill="#fff"/><path d="M170 130 225 150v43c0 39-22 65-55 80-33-15-55-41-55-80v-43z" fill="#0B2441"/><rect x="145" y="180" width="50" height="42" rx="7" fill="#fff"/><path d="M155 180v-13a15 15 0 0 1 30 0v13" fill="none" stroke="#fff" stroke-width="8"/><text x="170" y="320" text-anchor="middle" font-size="27" font-weight="700" fill="#0B2441">KEY SECRECY</text><text x="170" y="352" text-anchor="middle" font-size="17" fill="#607284">MEKs never leave</text><text x="170" y="376" text-anchor="middle" font-size="17" fill="#607284">the protected path</text>
    <rect x="365" y="100" width="230" height="300" rx="24" fill="#fff"/><circle cx="480" cy="190" r="66" fill="#0B2441"/><path d="M440 190h80M480 150v80" stroke="#8DC63F" stroke-width="15" stroke-linecap="round"/><text x="480" y="320" text-anchor="middle" font-size="27" font-weight="700" fill="#0B2441">CORRECT USE</text><text x="480" y="352" text-anchor="middle" font-size="17" fill="#607284">data remains bound</text><text x="480" y="376" text-anchor="middle" font-size="17" fill="#607284">to key + epoch</text>
    <rect x="675" y="100" width="230" height="300" rx="24" fill="#fff"/><circle cx="790" cy="190" r="66" fill="#0B2441"/><path d="M755 165h70M765 165l8 70h34l8-70M775 147h30" fill="none" stroke="#8DC63F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="320" text-anchor="middle" font-size="27" font-weight="700" fill="#0B2441">FINAL ERASE</text><text x="790" y="352" text-anchor="middle" font-size="17" fill="#607284">retired parent state</text><text x="790" y="376" text-anchor="middle" font-size="17" fill="#607284">cannot be revived</text>
  </g>
  <rect x="180" y="444" width="600" height="58" rx="29" fill="#8DC63F"/><text x="480" y="481" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0B2441">Only the KMB can read MEKs and program the engine</text>
