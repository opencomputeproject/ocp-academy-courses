<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">L.O.C.K. threat model</title><desc id="d">Attacker capabilities surround a protected KMB and engine path, while availability is shown outside the confidentiality guarantee.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="48" y="62" font-family="Arial" font-size="26" font-weight="700" fill="#0B2441">ATTACKER MAY CONTROL</text>
  <g font-family="Arial" font-size="24" font-weight="700" fill="#0B2441" filter="url(#s)">
    <rect x="48" y="91" width="250" height="88" rx="16" fill="#fff" stroke="#d6e0e7"/><text x="173" y="130" text-anchor="middle">Drive firmware</text><text x="173" y="157" text-anchor="middle" font-size="17" font-weight="400" fill="#607284">commands + storage</text>
    <rect x="48" y="198" width="250" height="88" rx="16" fill="#fff" stroke="#d6e0e7"/><text x="173" y="237" text-anchor="middle">External traffic</text><text x="173" y="264" text-anchor="middle" font-size="17" font-weight="400" fill="#607284">observe + modify</text>
    <rect x="48" y="305" width="250" height="88" rx="16" fill="#fff" stroke="#d6e0e7"/><text x="173" y="344" text-anchor="middle">Unprotected media</text><text x="173" y="371" text-anchor="middle" font-size="17" font-weight="400" fill="#607284">physical access</text>
  </g>
  <rect x="352" y="90" width="560" height="303" rx="30" fill="#0B2441" filter="url(#s)"/>
  <text x="632" y="132" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#8DC63F" letter-spacing="2">PROTECTED BOUNDARY</text>
  <rect x="410" y="166" width="205" height="145" rx="22" fill="#fff"/><text x="512" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0B2441">Caliptra KMB</text><text x="512" y="258" text-anchor="middle" font-family="Arial" font-size="18" fill="#607284">keys stay unreadable</text><circle cx="512" cy="286" r="10" fill="#8DC63F"/>
  <path d="M615 238h70" stroke="#8DC63F" stroke-width="8" stroke-linecap="round"/><circle cx="650" cy="238" r="9" fill="#fff"/>
  <rect x="685" y="166" width="170" height="145" rx="22" fill="#fff"/><text x="770" y="213" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0B2441">Encryption</text><text x="770" y="245" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0B2441">engine</text><text x="770" y="281" text-anchor="middle" font-family="Arial" font-size="17" fill="#607284">slot-bound MEKs</text>
  <g font-family="Arial"><rect x="48" y="434" width="864" height="72" rx="16" fill="#fff" stroke="#e9a23b" stroke-width="2"/><text x="76" y="465" font-size="19" font-weight="700" fill="#A25B00">NOT AN AVAILABILITY GUARANTEE</text><text x="76" y="492" font-size="18" fill="#607284">Denial of service, media damage, or refusal to process I/O can still occur.</text></g>
</svg>
