<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">L.O.C.K. MEK register map</title><desc id="d">A register window shows MEK bytes, metadata, auxiliary data, and control with engine and slot identity.</desc>
  <rect width="960" height="540" rx="24" fill="#f4f8fa"/><g font-family="Arial"><text x="55" y="58" font-size="26" font-weight="700" fill="#0B2441">PROTECTED MEK SFR WINDOW</text><text x="905" y="58" text-anchor="end" font-size="18" fill="#607284">relative to BASE</text>
  <rect x="55" y="95" width="850" height="112" rx="20" fill="#0B2441"/><text x="85" y="132" font-size="17" font-weight="700" fill="#8DC63F">+0x00</text><text x="85" y="172" font-size="34" font-weight="700" fill="#fff">MEK DATA · 64 BYTES</text><g fill="#8DC63F"><rect x="565" y="125" width="45" height="52" rx="7"/><rect x="620" y="125" width="45" height="52" rx="7"/><rect x="675" y="125" width="45" height="52" rx="7"/><rect x="730" y="125" width="45" height="52" rx="7"/><rect x="785" y="125" width="45" height="52" rx="7"/><rect x="840" y="125" width="35" height="52" rx="7"/></g>
  <rect x="55" y="227" width="850" height="96" rx="18" fill="#fff" stroke="#cfdbe3"/><text x="85" y="262" font-size="17" font-weight="700" fill="#6F9F30">+0x40</text><text x="85" y="296" font-size="29" font-weight="700" fill="#0B2441">METADATA · 20 BYTES</text><g font-size="17" font-weight="700" fill="#0B2441"><rect x="440" y="252" width="115" height="46" rx="13" fill="#eaf1f5"/><text x="497" y="281" text-anchor="middle">ENGINE_ID</text><rect x="570" y="252" width="105" height="46" rx="13" fill="#eaf1f5"/><text x="622" y="281" text-anchor="middle">SLOT_ID</text><rect x="690" y="252" width="180" height="46" rx="13" fill="#eaf1f5"/><text x="780" y="281" text-anchor="middle">length + context</text></g>
  <rect x="55" y="343" width="560" height="102" rx="18" fill="#fff" stroke="#cfdbe3"/><text x="85" y="381" font-size="17" font-weight="700" fill="#6F9F30">+0x60</text><text x="85" y="418" font-size="29" font-weight="700" fill="#0B2441">AUX · 32 BYTES</text><text x="338" y="417" font-size="18" fill="#607284">command-specific data</text>
  <rect x="635" y="343" width="270" height="102" rx="18" fill="#8DC63F"/><text x="662" y="381" font-size="17" font-weight="700" fill="#0B2441">+0x80</text><text x="770" y="421" text-anchor="middle" font-size="29" font-weight="700" fill="#0B2441">CTRL</text>
  <g font-size="18" font-weight="700"><rect x="95" y="476" width="150" height="42" rx="21" fill="#eaf1f5"/><text x="170" y="503" text-anchor="middle" fill="#0B2441">1 · LOAD</text><rect x="270" y="476" width="150" height="42" rx="21" fill="#eaf1f5"/><text x="345" y="503" text-anchor="middle" fill="#0B2441">2 · UNLOAD</text><rect x="445" y="476" width="165" height="42" rx="21" fill="#eaf1f5"/><text x="527" y="503" text-anchor="middle" fill="#0B2441">3 · ZEROIZE</text><rect x="635" y="476" width="230" height="42" rx="21" fill="#fff" stroke="#8DC63F"/><text x="750" y="503" text-anchor="middle" fill="#0B2441">4 · KAT (optional)</text></g></g>
