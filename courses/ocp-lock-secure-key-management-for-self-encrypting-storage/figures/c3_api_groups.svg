<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">L.O.C.K. host API operation families</title>
  <desc id="d">Five clearly labeled operation families connect to a transport-specific product host API: discover, establish, operate, transition, and evidence.</desc>
  <defs><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
  <rect width="960" height="540" rx="24" fill="#f4f8fa"/>
  <g fill="none" stroke="#8DC63F" stroke-width="6" stroke-linecap="round">
    <path d="M335 105L374 190"/><path d="M625 105L586 190"/>
    <path d="M325 267H350"/><path d="M635 267H610"/><path d="M480 350V405"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="350" y="190" width="260" height="160" rx="30" fill="#0B2441" filter="url(#s)"/>
    <text x="480" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#8DC63F" letter-spacing="2">PRODUCT</text>
    <text x="480" y="277" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">HOST API</text>
    <text x="480" y="315" text-anchor="middle" font-size="17" fill="#c8d7e2">transport-specific</text>
    <g filter="url(#s)">
      <rect x="35" y="48" width="300" height="114" rx="22" fill="#fff" stroke="#d3dfe6"/>
      <circle cx="82" cy="105" r="24" fill="#8DC63F"/>
      <text x="82" y="113" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2441">1</text>
      <text x="122" y="91" font-size="22" font-weight="700" fill="#0B2441">DISCOVER</text>
      <text x="122" y="119" font-size="16" fill="#607284">capabilities · limits</text>
      <text x="122" y="142" font-size="16" fill="#607284">state · reports</text>
      <rect x="625" y="48" width="300" height="114" rx="22" fill="#fff" stroke="#d3dfe6"/>
      <circle cx="672" cy="105" r="24" fill="#8DC63F"/>
      <text x="672" y="113" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2441">2</text>
      <text x="712" y="91" font-size="22" font-weight="700" fill="#0B2441">ESTABLISH</text>
      <text x="712" y="119" font-size="16" fill="#607284">MPKs · authorization</text>
      <text x="712" y="142" font-size="16" fill="#607284">active key context</text>
      <rect x="35" y="210" width="290" height="114" rx="22" fill="#fff" stroke="#d3dfe6"/>
      <circle cx="82" cy="267" r="24" fill="#8DC63F"/>
      <text x="82" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2441">3</text>
      <text x="122" y="253" font-size="22" font-weight="700" fill="#0B2441">OPERATE</text>
      <text x="122" y="281" font-size="16" fill="#607284">generate · load · derive</text>
      <text x="122" y="304" font-size="16" fill="#607284">unload · zeroize</text>
      <rect x="635" y="210" width="290" height="114" rx="22" fill="#fff" stroke="#d3dfe6"/>
      <circle cx="682" cy="267" r="24" fill="#8DC63F"/>
      <text x="682" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#0B2441">4</text>
      <text x="722" y="253" font-size="22" font-weight="700" fill="#0B2441">TRANSITION</text>
      <text x="722" y="281" font-size="16" fill="#607284">epoch · reset</text>
      <text x="722" y="304" font-size="16" fill="#607284">ownership boundaries</text>
      <rect x="330" y="405" width="300" height="114" rx="22" fill="#8DC63F" stroke="#8DC63F"/>
      <circle cx="377" cy="462" r="24" fill="#0B2441"/>
      <text x="377" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
      <text x="417" y="448" font-size="22" font-weight="700" fill="#0B2441">EVIDENCE</text>
      <text x="417" y="476" font-size="16" fill="#0B2441">measurements · errors</text>
      <text x="417" y="499" font-size="16" fill="#0B2441">compliance evidence</text>
    </g>
  </g>
