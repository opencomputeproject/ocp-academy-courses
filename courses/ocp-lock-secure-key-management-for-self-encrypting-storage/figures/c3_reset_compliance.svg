<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Reset and compliance matrix</title><desc id="d">Cold reset, warm reset, and firmware update are compared for HEK, MDK, VEK, and HPKE state beside a 13-requirement compliance badge.</desc>
  <rect width="960" height="540" rx="24" fill="#f4f8fa"/><g font-family="Arial"><text x="45" y="55" font-size="25" font-weight="700" fill="#0B2441">RESET SEMANTICS ARE SECURITY SEMANTICS</text>
  <g font-size="17" font-weight="700"><text x="390" y="105" text-anchor="middle" fill="#607284">HEK / MDK</text><text x="520" y="105" text-anchor="middle" fill="#607284">VEK</text><text x="650" y="105" text-anchor="middle" fill="#607284">HPKE</text></g>
  <g><rect x="45" y="125" width="690" height="90" rx="18" fill="#0B2441"/><text x="75" y="162" font-size="26" font-weight="700" fill="#fff">COLD RESET</text><text x="75" y="191" font-size="16" fill="#c9d7e1">new boot boundary</text><text x="390" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#8DC63F">DERIVE</text><text x="520" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">LAZY NEW</text><text x="650" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">FRESH</text>
