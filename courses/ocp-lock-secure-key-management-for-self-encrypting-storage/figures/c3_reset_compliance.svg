  <rect x="45" y="345" width="690" height="90" rx="18" fill="#fff" stroke="#d2dfe6"/><text x="75" y="382" font-size="25" font-weight="700" fill="#0B2441">FIRMWARE UPDATE</text><text x="75" y="411" font-size="16" fill="#607284">measured code transition</text><text x="390" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#0B2441">PRESERVE</text><text x="520" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#0B2441">PRESERVE</text><text x="650" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#6F9F30">REGENERATE</text></g>
