<!doctype html>
<html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da oscilação do link à causa raiz</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #f7f9fc;
      font-family: Arial, Helvetica, sans-serif;
    }
    svg { display: block; width: 100vw; height: 100vh; }
    text { letter-spacing: 0; }
    .title { font-size: 34px; font-weight: 800; fill: #343895; }
    .subtitle { font-size: 20px; font-weight: 700; fill: #5f6062; }
    .flow-title { font-size: 18px; font-weight: 800; fill: #343895; }
    .flow-note { font-size: 13px; font-weight: 700; fill: #5f6062; }
    .bundle-title { font-size: 25px; font-weight: 800; fill: #343895; }
    .tile-title { font-size: 17px; font-weight: 800; fill: #343895; }
    .tile-note { font-size: 13px; font-weight: 700; fill: #5f6062; }
    .action-title { font-size: 23px; font-weight: 800; fill: #343895; }
    .action-note { font-size: 16px; font-weight: 700; fill: #5f6062; }
    .status { font-size: 25px; font-weight: 800; fill: #1f2937; }
    .icon { font-size: 30px; font-weight: 900; fill: #ffffff; }
  </style>
</head>
<body data-duration-ms="18000" data-poster-ms="14000">
<svg viewBox="0 0 1280 720" role="img" aria-label="Animação silenciosa da investigação de uma oscilação do link: pontuação de integridade, métricas, log de eventos, consulta remota e ação baseada em evidências.">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.14"></feDropShadow>
    </filter>
    <filter id="glow-green" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
      <feFlood flood-color="#8dc63f" flood-opacity="0.8"></feFlood>
      <feComposite in2="blur" operator="in"></feComposite>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="glow-amber" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feFlood flood-color="#d88911" flood-opacity="0.75"></feFlood>
      <feComposite in2="blur" operator="in"></feComposite>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#343895"></path>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f7f9fc"></rect>
  <rect x="34" y="28" width="1212" height="664" rx="24" fill="#ffffff" stroke="#d7dde8" stroke-width="2" filter="url(#shadow)"></rect>
  <text x="640" y="82" text-anchor="middle" class="title">Da oscilação do link à causa raiz</text>
  <text x="640" y="114" text-anchor="middle" class="subtitle">A telemetria avançada transforma incidentes em evidências organizadas.</text>

  <path id="flow-path" d="M130 260 H324 H518 H712 H906 H1018" fill="none" stroke="#343895" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.18"></path>

  <g id="pulse">
    <circle id="pulse-glow" r="20" fill="#8dc63f" opacity="0.24" filter="url(#glow-green)"></circle>
    <circle id="pulse-dot" r="10" fill="#8dc63f" filter="url(#glow-green)"></circle>
  </g>

  <g id="flow-card-0" transform="translate(58 180)">
    <rect id="flow-bg-0" width="144" height="150" rx="16" fill="#fff7e8" stroke="#d88911" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#d88911"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">!</text>
    <text x="72" y="84" text-anchor="middle" class="flow-title" style="font-size:16px"><tspan x="72">Alerta de </tspan><tspan x="72" dy="20">oscilação</tspan></text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">sintoma detectado</text>
  </g>
  <g id="flow-card-1" transform="translate(252 180)">
    <rect id="flow-bg-1" width="144" height="150" rx="16" fill="#eef0fb" stroke="#343895" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#343895"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">40</text>
    <text x="72" y="84" text-anchor="middle" class="flow-title" style="font-size:16px"><tspan x="72">Pontuação de </tspan><tspan x="72" dy="20">integridade</tspan></text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">categoria fraca</text>
  </g>
  <g id="flow-card-2" transform="translate(446 180)">
    <rect id="flow-bg-2" width="144" height="150" rx="16" fill="#f4faef" stroke="#8dc63f" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#8dc63f"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">M</text>
    <text x="72" y="87" text-anchor="middle" class="flow-title">Métricas</text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">campos atuais</text>
  </g>
  <g id="flow-card-3" transform="translate(640 180)">
    <rect id="flow-bg-3" width="144" height="150" rx="16" fill="#f8fafc" stroke="#a6b0bf" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#5f6062"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">L</text>
    <text x="72" y="87" text-anchor="middle" class="flow-title" font-size="17.09" style="font-size: 17.09px;">Log de eventos</text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">histórico ordenado</text>
  </g>
  <g id="flow-card-4" transform="translate(834 180)">
    <rect id="flow-bg-4" width="144" height="150" rx="16" fill="#eef7f9" stroke="#00a7c4" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#00a7c4"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">R</text>
    <text x="72" y="87" text-anchor="middle" class="flow-title" font-size="15.88" style="font-size: 15.88px;">Consulta remota</text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">outra extremidade</text>
  </g>
  <g id="flow-card-5" transform="translate(1028 180)">
    <rect id="flow-bg-5" width="144" height="150" rx="16" fill="#eef0fb" stroke="#343895" stroke-width="3"></rect>
    <circle cx="72" cy="42" r="22" fill="#343895"></circle>
    <text x="72" y="53" text-anchor="middle" class="icon">T</text>
    <text x="72" y="84" text-anchor="middle" class="flow-title" style="font-size:16px"><tspan x="72">Linha do tempo </tspan><tspan x="72" dy="20">do host</tspan></text>
    <text x="72" y="129" text-anchor="middle" class="flow-note">visão do sistema</text>
  </g>

  <g id="bundle" transform="translate(88 400)">
    <rect width="664" height="210" rx="22" fill="#f8fafc" stroke="#d6dce7" stroke-width="2" filter="url(#shadow)"></rect>
    <text x="332" y="42" text-anchor="middle" class="bundle-title">Conjunto de evidências</text>
    <g id="tile-0" transform="translate(34 70)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#fff7e8" stroke="#d88911" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title" font-size="12.33" style="font-size: 12.33px;">Pontuação de integridade</text>
      <text x="18" y="44" class="tile-note">categoria óptica fraca</text>
    </g>
    <g id="tile-1" transform="translate(244 70)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#f4faef" stroke="#8dc63f" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title">Métricas</text>
      <text x="18" y="44" class="tile-note" font-size="11.49" style="font-size: 11.49px;">variação de potência e BER</text>
    </g>
    <g id="tile-2" transform="translate(454 70)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#ffffff" stroke="#a6b0bf" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title" font-size="16.14" style="font-size: 16.14px;">Ordem dos eventos</text>
      <text x="18" y="44" class="tile-note" font-size="12.85" style="font-size: 12.85px;">aviso antes da oscilação</text>
    </g>
    <g id="tile-3" transform="translate(34 142)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#eef7f9" stroke="#00a7c4" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title">Endpoint remoto</text>
      <text x="18" y="44" class="tile-note">lado remoto confirma</text>
    </g>
    <g id="tile-4" transform="translate(244 142)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#eef0fb" stroke="#343895" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title" font-size="13.3" style="font-size: 13.3px;">Linha do tempo do host</text>
      <text x="18" y="44" class="tile-note" font-size="10.43" style="font-size: 10.43px;">eventos do servidor alinhados</text>
    </g>
    <g id="tile-5" transform="translate(454 142)" opacity="0">
      <rect width="178" height="56" rx="12" fill="#f4faef" stroke="#8dc63f" stroke-width="2"></rect>
      <text x="18" y="24" class="tile-title">Registro da ação</text>
      <text x="18" y="44" class="tile-note">decisão auditável</text>
    </g>
  </g>

  <g id="action" transform="translate(808 400)">
    <rect id="action-bg" width="384" height="210" rx="22" fill="#f4faef" stroke="#8dc63f" stroke-width="3" filter="url(#shadow)"></rect>
    <text x="192" y="42" text-anchor="middle" class="action-title">Ação baseada em evidências</text>
    <g id="action-choice-0" transform="translate(36 72)">
      <rect width="142" height="44" rx="12" fill="#ffffff" stroke="#d6dce7" stroke-width="2"></rect>
      <text x="71" y="29" text-anchor="middle" class="action-note" font-size="14.2" style="font-size: 14.2px;">Limpar / recolocar</text>
    </g>
    <g id="action-choice-1" transform="translate(206 72)">
      <rect width="142" height="44" rx="12" fill="#ffffff" stroke="#d6dce7" stroke-width="2"></rect>
      <text x="71" y="29" text-anchor="middle" class="action-note" font-size="12.06" style="font-size: 12.06px;">Trocar módulo óptico</text>
    </g>
    <g id="action-choice-2" transform="translate(36 132)">
      <rect width="142" height="44" rx="12" fill="#ffffff" stroke="#d6dce7" stroke-width="2"></rect>
      <text x="71" y="29" text-anchor="middle" class="action-note" font-size="14.23" style="font-size: 14.23px;">Atualizar firmware</text>
    </g>
    <g id="action-choice-3" transform="translate(206 132)">
      <rect id="selected-action" width="142" height="44" rx="12" fill="#ffffff" stroke="#d6dce7" stroke-width="2"></rect>
      <text x="71" y="29" text-anchor="middle" class="action-note" font-size="10.71" style="font-size: 10.71px;">Chamado ao fornecedor</text>
    </g>
  </g>

  <g>
    <rect x="180" y="632" width="920" height="46" rx="23" fill="#eef0fb" stroke="#d6dce7" stroke-width="2"></rect>
    <text id="status" x="640" y="663" text-anchor="middle" class="status">Parta da oscilação e colete evidências antes de escolher uma ação.</text>
  </g>
</svg>

<script>
  const duration = 18;
  const flowPath = document.getElementById('flow-path');
  const pulse = document.getElementById('pulse-dot');
  const pulseGlow = document.getElementById('pulse-glow');

  function clamp(v, min = 0, max = 1) { return Math.min(max, Math.max(min, v)); }
  function smooth(v) { const x = clamp(v); return x * x * (3 - 2 * x); }
  function windowValue(v, start, end, feather = 0.12) {
    return clamp(Math.min(smooth((v - start) / feather), 1 - smooth((v - (end - feather)) / feather)));
  }
  function setFlow(index, strength) {
    const bg = document.getElementById(`flow-bg-${index}`);
    const colors = ['#d88911', '#343895', '#8dc63f', '#5f6062', '#00a7c4', '#343895'];
    bg.setAttribute('stroke-width', String(3 + strength * 5));
    bg.setAttribute('stroke', colors[index]);
    bg.style.filter = strength > 0.2 ? (index === 0 ? 'url(#glow-amber)' : 'url(#shadow)') : '';
  }
  function setTile(index, strength) {
    const tile = document.getElementById(`tile-${index}`);
    tile.setAttribute('opacity', String(clamp(strength)));
    tile.setAttribute('transform', `translate(${index % 3 === 0 ? 34 : index % 3 === 1 ? 244 : 454} ${index < 3 ? 70 : 142 + (1 - smooth(strength)) * 18})`);
  }

  window.renderAt = function renderAt(rawTime) {
    const t = clamp(rawTime, 0, duration);
    const stage = clamp((t - 1.0) / 12.8);
    const p = flowPath.getPointAtLength(flowPath.getTotalLength() * stage);
    pulse.setAttribute('cx', p.x);
    pulse.setAttribute('cy', p.y);
    pulseGlow.setAttribute('cx', p.x);
    pulseGlow.setAttribute('cy', p.y);
    pulse.setAttribute('fill', t < 2.8 ? '#d88911' : '#8dc63f');
    pulseGlow.setAttribute('fill', t < 2.8 ? '#d88911' : '#8dc63f');

    const cardWindows = [
      windowValue(t, 0.7, 3.2, 0.55),
      windowValue(t, 2.5, 5.0, 0.55),
      windowValue(t, 4.3, 6.8, 0.55),
      windowValue(t, 6.1, 8.8, 0.55),
      windowValue(t, 8.2, 11.2, 0.55),
      windowValue(t, 10.5, 13.7, 0.55),
    ];
    cardWindows.forEach((value, index) => setFlow(index, value));
    [3.2, 5.0, 6.8, 8.8, 11.2, 13.5].forEach((start, index) => {
      setTile(index, smooth((t - start) / 0.8));
    });

    const actionStrength = smooth((t - 13.4) / 2.0);
    const selected = document.getElementById('selected-action');
    selected.setAttribute('fill', actionStrength > 0.15 ? '#f4faef' : '#ffffff');
    selected.setAttribute('stroke', actionStrength > 0.15 ? '#8dc63f' : '#d6dce7');
    selected.setAttribute('stroke-width', String(2 + actionStrength * 4));
    document.getElementById('action-bg').setAttribute('stroke-width', String(3 + actionStrength * 3));

    let status = "Parta da oscilação e colete evidências antes de escolher uma ação.";
    if (t >= 1.0 && t < 3.2) status = "Um alerta de oscilação é um sintoma, não a resposta.";
    else if (t >= 3.2 && t < 5.4) status = "A pontuação de integridade indica a categoria mais fraca.";
    else if (t >= 5.4 && t < 8.6) status = "Métricas atuais e ordem dos eventos mostram a evolução da falha.";
    else if (t >= 8.6 && t < 12.6) status = "Dados remotos e linhas do tempo do host restringem a investigação.";
    else if (t >= 12.6 && t < 16.4) status = "A ação agora é sustentada por evidências.";
    else if (t >= 16.4) status = "Registre a ação para dar contexto ao próximo incidente.";
    document.getElementById('status').textContent = status;
  };

  window.renderAt(0);
</script>




</body></html>
