<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="32 字节事件日志记录">
  <style data-zh-font="true">@font-face{font-family:AcademyZhCN;src:url(data:font/woff2;base64,) format("woff2")}text,tspan{font-family:AcademyZhCN,sans-serif}</style><rect width="960" height="560" fill="#fff"/>
  <g font-family="AcademyZhCN, PingFang SC, Microsoft YaHei, sans-serif" fill="#343895">
    <text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700">一条事件，32 字节上下文</text>
    <text x="480" y="80" text-anchor="middle" font-size="18" fill="#5f6062">字段采用小端字节序；按事件 ID 解码详情</text>
    <g font-size="20" font-weight="700">
      <rect x="42" y="110" width="876" height="65" rx="8" fill="#eef0fb" stroke="#343895"/>
      <text x="65" y="150">UID</text><text x="345" y="150">16 位序列标识</text><text x="890" y="150" text-anchor="end">2 字节</text>
      <rect x="42" y="185" width="876" height="65" rx="8" fill="#eff8e9" stroke="#6fa030"/>
      <text x="65" y="225">TIME_NSEC</text><text x="345" y="225">64 位时间戳</text><text x="890" y="225" text-anchor="end">8 字节</text>
      <rect x="42" y="260" width="876" height="65" rx="8" fill="#edf6f7" stroke="#477f87"/>
      <text x="65" y="300">EVENT_ID</text><text x="345" y="300">事件类型</text><text x="890" y="300" text-anchor="end">2 字节</text>
      <rect x="42" y="335" width="876" height="65" rx="8" fill="#eef0fb" stroke="#343895"/>
      <text x="65" y="375">DETAIL0-3</text><text x="345" y="375">四个 32 位详情字段</text><text x="890" y="375" text-anchor="end">16 字节</text>
      <rect x="42" y="410" width="876" height="65" rx="8" fill="#f3f4f5" stroke="#94969a"/>
      <text x="65" y="450">保留</text><text x="890" y="450" text-anchor="end">4 字节</text>
    </g>
    <text x="480" y="516" text-anchor="middle" font-size="20" fill="#5f6062">保留记录顺序、时间有效性与事件含义。</text>
  </g>
</svg>