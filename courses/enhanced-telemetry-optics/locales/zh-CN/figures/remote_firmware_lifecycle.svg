<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="远程固件生命周期：检查信息、开始、传输、完成、运行并验证、提交；下载失败时中止并清理。">
  <style data-zh-font="true">@font-face{font-family:AcademyZhCN;src:url(data:font/woff2;base64,) format("woff2")}text,tspan{font-family:AcademyZhCN,sans-serif}</style><rect width="1200" height="590" fill="#fff"/>
  <g font-family="AcademyZhCN, PingFang SC, Microsoft YaHei, sans-serif" fill="#343895" text-anchor="middle">
    <text x="600" y="48" font-size="30" font-weight="700">远程固件：先运行、验证，再提交</text>
    <text x="600" y="84" font-size="20" fill="#5f6062">使用所选链路对端，并检查每条命令的结果</text>
    <g font-size="23" font-weight="700">
      <rect x="40" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="205" y="169">检查信息</text><text x="205" y="207" font-size="19" fill="#5f6062">8030h：映像与状态</text>
      <rect x="435" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="600" y="169">开始下载</text><text x="600" y="207" font-size="19" fill="#5f6062">8031h：开始映像传输</text>
      <rect x="830" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="995" y="169">传输数据块</text><text x="995" y="207" font-size="19" fill="#5f6062">8033h：逐块检查</text>
      <rect x="830" y="290" width="330" height="125" rx="8" fill="#eff8e9" stroke="#6fa030" stroke-width="2"/>
      <text x="995" y="330">完成下载</text><text x="995" y="368" font-size="19" fill="#5f6062">8034h：验证完成</text>
      <rect x="435" y="290" width="330" height="125" rx="8" fill="#edf6f7" stroke="#477f87" stroke-width="2"/>
      <text x="600" y="330">运行并验证</text><text x="600" y="368" font-size="19" fill="#5f6062">8035h：激活映像</text>
      <rect x="40" y="290" width="330" height="125" rx="8" fill="#eff8e9" stroke="#6fa030" stroke-width="2"/>
      <text x="205" y="330">提交</text><text x="205" y="368" font-size="19" fill="#5f6062">8036h：后续复位默认映像</text>
    </g>
    <g stroke="#343895" stroke-width="3" fill="none">
      <path d="M370 192.5 H419"/><path d="M765 192.5 H814"/>
      <path d="M995 255 V274"/><path d="M830 352.5 H781"/><path d="M435 352.5 H386"/>
    </g>
    <g fill="#343895">
      <polygon class="arrowhead" points="419,185.5 419,199.5 435,192.5"/>
      <polygon class="arrowhead" points="814,185.5 814,199.5 830,192.5"/>
      <polygon class="arrowhead" points="988,274 1002,274 995,290"/>
      <polygon class="arrowhead" points="781,345.5 781,359.5 765,352.5"/>
      <polygon class="arrowhead" points="386,345.5 386,359.5 370,352.5"/>
    </g>
    <rect x="150" y="455" width="900" height="88" rx="8" fill="#fff0eb" stroke="#b45e45" stroke-width="2"/>
    <text x="600" y="490" font-size="22" font-weight="700" fill="#8d412d">下载失败：中止并清理</text>
    <text x="600" y="520" font-size="19" fill="#5f6062">8032h 中止已开始的下载。不要运行不完整映像。</text>
  </g>
</svg>