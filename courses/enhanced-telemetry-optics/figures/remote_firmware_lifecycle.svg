<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Remote firmware lifecycle">
  <rect width="1200" height="590" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#343895" text-anchor="middle">
    <text x="600" y="48" font-size="30" font-weight="700">Remote firmware: run, verify, then commit</text>
    <text x="600" y="84" font-size="20" fill="#5f6062">Use the selected partner and check every command result</text>
    <g font-size="23" font-weight="700">
      <rect x="40" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="205" y="169">Inspect information</text><text x="205" y="207" font-size="19" fill="#5f6062">8030h: images and status</text>
      <rect x="435" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="600" y="169">Start download</text><text x="600" y="207" font-size="19" fill="#5f6062">8031h: begin image transfer</text>
      <rect x="830" y="130" width="330" height="125" rx="8" fill="#eef0fb" stroke="#343895" stroke-width="2"/>
      <text x="995" y="169">Transfer blocks</text><text x="995" y="207" font-size="19" fill="#5f6062">8033h: check each block</text>
      <rect x="830" y="290" width="330" height="125" rx="8" fill="#eff8e9" stroke="#6fa030" stroke-width="2"/>
      <text x="995" y="330">Complete download</text><text x="995" y="368" font-size="19" fill="#5f6062">8034h: validate completion</text>
      <rect x="435" y="290" width="330" height="125" rx="8" fill="#edf6f7" stroke="#477f87" stroke-width="2"/>
      <text x="600" y="330">Run and verify</text><text x="600" y="368" font-size="19" fill="#5f6062">8035h: activate the image</text>
      <rect x="40" y="290" width="330" height="125" rx="8" fill="#eff8e9" stroke="#6fa030" stroke-width="2"/>
      <text x="205" y="330">Commit</text><text x="205" y="368" font-size="19" fill="#5f6062">8036h: future reset default</text>
    </g>
    <g stroke="#343895" stroke-width="3" fill="none">
      <path d="M370 192.5 H419"/><path d="M765 192.5 H814"/>
      <path d="M995 255 V274"/><path d="M830 352.5 H781"/><path d="M435 352.5 H386"/>
    </g>
    <g fill="#343895">
      <polygon class="arrowhead" points="419,185.5 419,199.5 435,192.5"/>
      <polygon class="arrowhead" points="814,185.5 814,199.5 830,192.5"/>
      <polygon class="arrowhead" points="988,274 1002,274 995,290"/>
      <polygon class="arrowhead" points="781,345.5 781,359.5 765,352.5"/>
      <polygon class="arrowhead" points="386,345.5 386,359.5 370,352.5"/>
    </g>
    <rect x="150" y="455" width="900" height="88" rx="8" fill="#fff0eb" stroke="#b45e45" stroke-width="2"/>
    <text x="600" y="490" font-size="22" font-weight="700" fill="#8d412d">Download failure: abort and clean up</text>
    <text x="600" y="520" font-size="19" fill="#5f6062">8032h aborts a started download. Do not run an incomplete image.</text>
  </g>
</svg>
