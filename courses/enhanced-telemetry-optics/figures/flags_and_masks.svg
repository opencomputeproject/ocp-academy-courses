<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" role="img" aria-label="Flags and masks">
  <style>text { font-family: "Open Sans", Arial, Helvetica, sans-serif; letter-spacing: 0; }</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#8DC63F"/></marker>
  </defs>
  <rect width="768" height="360" fill="#FFFFFF"/>

  <text x="384" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#343895">Flags report; masks select scoring counters</text>
  <rect x="72" y="92" width="250" height="172" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="197" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#343895">Flag summary</text>
  <text x="197" y="172" text-anchor="middle" font-size="17" fill="#5F6062">local or remote flags</text>
  <text x="197" y="207" text-anchor="middle" font-size="17" fill="#5F6062">then detailed reply flags</text>
  <rect x="444" y="92" width="250" height="172" rx="14" fill="#F8FAFC" stroke="#343895" stroke-width="3"/>
  <text x="569" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#343895">Mask controls</text>
  <text x="569" y="166" text-anchor="middle" font-size="17" fill="#5F6062">FEC and link-down counters</text>
  <text x="569" y="199" text-anchor="middle" font-size="17" fill="#5F6062">0: include / 1: exclude</text>
  <text x="569" y="233" text-anchor="middle" font-size="17" fill="#5F6062">both excluded at power-up</text>
  <text x="384" y="314" text-anchor="middle" font-size="17" fill="#5F6062">Masking changes score participation, not the stored evidence.</text>

</svg>
